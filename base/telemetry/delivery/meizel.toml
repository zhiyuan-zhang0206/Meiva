exports = ["loss.py", "mirror.py", "pipeline.py", "receipts.py", "reporting.py", "serialization.py", "state.py"]

[uses]
"loss.py" = ["mirror.py", "receipts.py", "state.py"]
"mirror.py" = ["receipts.py", "reporting.py", "serialization.py", "state.py"]
"pipeline.py" = ["loss.py", "receipts.py", "reporting.py"]

[purity]
"__init__.py" = "strict"
"receipts.py" = "strict"

[debt.ambient-read]
"loss.py#clock datetime.datetime.now" = 2
"mirror.py#clock datetime.datetime.now" = 2
"pipeline.py#clock datetime.datetime.now" = 1
"state.py#platform socket.gethostname" = 2

[debt.any-collaborator]
"reporting.py#any report_no_pipeline.extra" = 1
"serialization.py#any event_line.event" = 1
"serialization.py#any event_line_digest.event" = 1
"serialization.py#any event_payload.event" = 1
