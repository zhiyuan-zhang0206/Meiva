exports = ["defer_plan.py", "loss.py", "mirror.py", "pipeline.py", "receipts.py", "reporting.py", "serialization.py", "state.py"]

[uses]
"loss.py" = ["mirror.py", "receipts.py", "state.py"]
"mirror.py" = ["receipts.py", "reporting.py", "serialization.py", "state.py"]
"pipeline.py" = ["defer_plan.py", "loss.py", "receipts.py", "reporting.py"]

[purity]
"__init__.py" = "strict"
"defer_plan.py" = "strict"
"receipts.py" = "strict"
"reporting.py" = "strict"

[debt.ambient-read]
"loss.py#clock datetime.datetime.now" = { count = 1, owner = "#5816", until = "waits for nothing: a loss report carries the instant the loss happened, stamped where the loss is observed" }
"mirror.py#clock datetime.datetime.now" = { count = 1, owner = "#5816", until = "waits for nothing: the mirror's retention cutoff is the wall clock at prune time, the same fact as the trace mirror's" }
"state.py#platform socket.gethostname" = { count = 1, owner = "#5816", until = "waits for nothing a caller can improve: process_state names the mirror's owner by this host's kernel name, and the configured cluster name is a different fact that would mislabel two units on one host" }
