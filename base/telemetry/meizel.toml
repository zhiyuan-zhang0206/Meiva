exports = ["alerts", "audit_events.py", "converge_report.py", "delivery", "emitter.py", "event_store.py", "lgtm_local.py", "loki_index_labels.py", "metrics", "observability.py", "otlp", "pipeline_build.py", "process_logging.py", "station_endpoint.py", "tests", "trace_mirror.py", "tracing.py"]

[uses]
"__init__.py" = ["delivery", "emitter.py", "pipeline_build.py"]
"audit_events.py" = ["__init__.py"]
"converge_report.py" = ["emitter.py"]
"emitter.py" = ["delivery", "observability.py"]
"event_store.py" = ["delivery", "emitter.py"]
"metrics" = ["delivery", "loki_index_labels.py"]
"observability.py" = ["delivery"]
"otlp" = ["delivery", "emitter.py", "metrics", "observability.py"]
"pipeline_build.py" = ["delivery", "event_store.py", "metrics", "observability.py", "otlp"]
"process_logging.py" = ["delivery", "emitter.py"]
"tests" = ["__init__.py", "audit_events.py", "delivery", "emitter.py", "event_store.py", "metrics", "observability.py", "otlp", "process_logging.py", "station_endpoint.py", "trace_mirror.py", "tracing.py"]
"trace_mirror.py" = ["delivery"]
"tracing.py" = ["delivery", "observability.py", "otlp", "trace_mirror.py"]

[purity]
"loki_index_labels.py" = "strict"

[debt.ambient-read]
"emitter.py#clock datetime.datetime.now" = { count = 1, owner = "#5816", until = "waits for nothing: _as_utc() is the timestamp an event gets when its producer passed none, and that clock is the fact being recorded" }
"process_logging.py#pid os.getpid" = { count = 1, owner = "#5816", until = "waits for nothing: the announce record names the process that is announcing itself" }
"trace_mirror.py#clock datetime.datetime.now" = { count = 1, owner = "#5816", until = "waits for nothing: the retention cutoff is the wall clock at prune time, and a clock handed in would let a prune keep files by another process's calendar" }

# meiva:note
# The read is `build_pipeline`, and it is the composition root of the telemetry pipeline:
# every daemon builds its pipeline once, after its boot loaded the `.env` it will run with, and the
# value read there (`MEIVA_TELEMETRY_OTLP_ENDPOINT`'s explicit-override flag) decides which exporter
# the pipeline gets. The file reads the environment nowhere else; a second read here would be a
# second boot, so add a parameter and hand the value down instead.
[roots]
"pipeline_build.py" = { kinds = ["environ"], why = "composition root of the event pipeline: build_pipeline() reads the process environment once to decide whether the OTLP endpoint was set explicitly, then hands that answer to the exporter it builds" }
