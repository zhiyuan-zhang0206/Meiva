exports = ["copy.py", "native.py", "shadow.py"]

[uses]
"__init__.py" = ["copy.py"]
"native.py" = ["__init__.py"]
"shadow.py" = ["__init__.py", "native.py"]

[purity]
"copy.py" = "strict"

[debt.ambient-read]
"__init__.py#settings base.config.settings" = 1
"native.py#settings base.config.settings" = 1

[debt.type-cast]
"__init__.py#cast _group_head.<listcomp>" = 1
"__init__.py#cast _summary" = 1
