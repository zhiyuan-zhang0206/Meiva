exports = ["homes.py"]

[uses]
"conftest.py" = ["homes.py"]

[debt.env-patch]
"homes.py#monkeypatch.setenv os.environ.HOME" = { count = 1, owner = "#7302", until = "waits for debt lane A to convert the entry points these tests drive (CLI commands, ops handlers) to take their home as a value instead of resolving it from the process environment: point_home, unit_home and default_home are the shared front of 76 test modules, so converting this fixture before its consumers would move the read rather than remove it. HOME goes with MEIVA_HOME because the OS-job registrars resolve the default home from it." }
"homes.py#monkeypatch.setenv os.environ.MEIVA_HOME" = { count = 1, owner = "#7302", until = "the same conversion as the HOME entry: this fixture is the one place a test sets MEIVA_HOME, and it is legal only while the doors under test still read it. Falsified when no test module passes point_home to a reader that resolves the home from the environment." }
