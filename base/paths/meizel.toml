exports = ["expand.py", "home.py", "private_dir.py", "scratch.py", "tests"]

[uses]
"__init__.py" = ["home.py", "private_dir.py"]
"scratch.py" = []
"tests" = ["__init__.py", "expand.py", "home.py", "private_dir.py", "scratch.py"]

[purity]
"expand.py" = "strict"
"home.py" = "strict"

[roots]
"__init__.py" = { kinds = ["home"], why = "meiva_home() is the home resolution and creation door registered in [ambient-readers.home]; every caller is tracked at its call site" }
"home.py" = { kinds = ["environ", "filesystem", "home"], why = "resolve_meiva_home and default_home read MEIVA_HOME and Path.home(): the home is the input that locates the .env Settings is built from, so it is read before (and below) Settings; home_checkout_error checks whether `<home>/source` is a directory and resolves checkout paths for comparison" }
"private_dir.py" = { kinds = ["pid"], why = "is_foreign_owned() is the process euid comparison door registered in [ambient-readers.pid]; callers that omit euid are tracked at their call site" }
"scratch.py" = { kinds = ["environ", "random"], why = "the host boundary that owns the process's temporary space: it is the one place a scratch directory is minted, and every module above it takes the space it was handed; the directory's home is the environment's answer (`TMPDIR` and its siblings, read by `tempfile.gettempdir`) and its name is the OS's random draw, and both are read here so no caller repeats them — a call that names its own parent passes that directory down and reads neither" }
