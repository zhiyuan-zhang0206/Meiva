exports = ["index.py", "names.py", "scan.py", "tree.py"]

[uses]
"__init__.py" = ["project_roots.py", "tree_builder.py"]
"index.py" = ["names.py", "scan.py"]
"tests" = ["index.py", "names.py", "project_roots.py", "scan.py"]
"tree.py" = ["names.py"]
"tree_builder.py" = ["index.py", "names.py", "tree.py"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"names.py" = "strict"
"tree.py" = "strict"

[debt.impure-call]
"index.py#Path.is_dir" = 1
"index.py#Path.read_text" = 1
"index.py#Path.stat" = 1
"project_roots.py#Path.exists" = 1
"project_roots.py#Path.is_dir" = 1
"project_roots.py#Path.is_file" = 1
"scan.py#Path.is_file" = 1
"scan.py#Path.read_bytes" = 1
"scan.py#Path.stat" = 1
