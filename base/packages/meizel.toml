exports = ["composer_commands.py", "dashboard_supply.py", "docs", "extensions", "mcp_config.py", "note_files.py", "okf_bundle.py", "plugin_config_admin.py", "plugin_config_contracts.py", "plugin_config_images.py", "plugin_providers.py", "plugins", "skills", "tests", "text_budget.py"]

[uses]
"composer_commands.py" = ["docs", "extensions", "plugins", "skills"]
"dashboard_supply.py" = ["extensions", "plugins"]
"extensions" = ["plugins", "skills"]
"mcp_config.py" = ["extensions", "plugins"]
"note_files.py" = ["docs"]
"okf_bundle.py" = ["docs"]
"plugin_config_admin.py" = ["plugin_config_images.py", "plugins"]
"plugin_config_images.py" = ["plugin_config_contracts.py"]
"plugin_providers.py" = ["plugins"]
"plugins" = ["plugin_config_contracts.py", "plugin_config_images.py", "skills"]
"skills" = ["docs"]
"tests" = ["composer_commands.py", "docs", "extensions", "note_files.py", "okf_bundle.py", "plugin_config_admin.py", "plugin_config_images.py", "plugin_providers.py", "plugins", "skills", "text_budget.py"]

[external]
"dashboard_supply.py" = "loads discovered plugins, built-in or user-installed; core does not depend on them"
"plugin_providers.py" = "loads discovered plugins, built-in or user-installed; core does not depend on them"

[purity]
"__init__.py" = "strict"
"text_budget.py" = "strict"
"plugin_config_contracts.py" = "strict"

[debt.ambient-read]
"composer_commands.py#settings base.packages.plugins.flags.read_declared_flag" = { count = 1, owner = "#5816", until = "waits for read_declared_flag() to take the config view: composer_commands only calls the flag reader, which reads settings itself, so this entry disappears when the reader gains a required config argument" }
"dashboard_supply.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `_unpacked_plugin` unpacks one installed plugin's blob into a scratch tree only so `metrics.py` can be imported from a real directory and the tree can be removed afterwards; nothing moves out of it, and its callers (`load_installed_plugin_specs`, `collect_plugin_specs`) hold a connection and a checkout, neither of which is scratch space" }
"dashboard_supply.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: the tree's name is minted by the OS so two plugins unpacked in one process cannot collide, and the `meiva-plugin-<name>-` prefix keeps a leftover recognisable to whoever inspects it; no caller reads the name — the context manager yields the tree root, never where it sits" }
