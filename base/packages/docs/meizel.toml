exports = ["frontmatter.py", "notes.py", "okf_graph.py", "pages_copy.py"]

[uses]
"notes.py" = ["frontmatter.py"]
"okf_graph.py" = ["frontmatter.py", "notes.py"]
"tests" = ["frontmatter.py", "notes.py", "okf_graph.py"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"frontmatter.py" = "strict"
"pages_copy.py" = "strict"

[debt.impure-call]
"notes.py#Path.read_text" = 1
"okf_graph.py#Path.open" = 1

[debt.impure-edge]
"notes.py#base/log/__init__.py" = 1

[debt.type-cast]
"frontmatter.py#cast parse_frontmatter" = 1
"frontmatter.py#cast parse_frontmatter_typed" = 1
"notes.py#cast normalize_tags" = 1
