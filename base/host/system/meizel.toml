"pr_flow_content.py" = "strict"
"walg_content.py" = "strict"
"__init__.py" = "strict"

[roots]
"hostport.py" = { kinds = ["pid"], why = "Host.system() is the door that builds the one Host this process has, and a Host must describe the process that built it: the user id it carries is the id a lock, a private directory and a socket path are later judged against, so one handed in from outside would let a component claim another process's identity — the single thing this value must not be able to say" }

[debt.ambient-read]
"boot_unit.py#environ tempfile.mkstemp()" = { count = 1, owner = "#8237", until = "waits for `install` to take the parent of its scratch directory from its caller: it creates it where TMPDIR points" }
"boot_unit.py#pid grp.getgrgid" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: `unit_context` writes the unit's Group= from the primary gid of the account running this host process, and a group name is only ever the account database's answer for that gid — a caller would have to perform the same lookup to hand it in, and would be answering about the same account" }
"boot_unit.py#pid pwd.getpwuid" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: `unit_context` turns the uid the `Host` port already holds into the account the unit runs as — its name, home and gid — and no caller of that port knows the account database better than the process reading it here" }
"boot_unit.py#random tempfile.mkstemp()" = { count = 1, owner = "#8237", until = "waits for `install` to take the parent of its scratch directory from its caller: it creates it under a random name wherever TMPDIR points" }
"hostport.py#platform base.native_process.os_platform.Platform.current" = { count = 1, owner = "#5816", until = "permanently: Host.system() builds the host of the process that calls it, platform included; a platform handed in would describe a machine the code is not running on" }
