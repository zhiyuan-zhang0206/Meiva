exports = ["autostart.py", "backend.py", "boot_policy.py", "boot_unit.py", "cron.py", "hostport.py", "logs_job.py", "macos_firewall.py", "packages_job.py", "pr_flow_job.py", "probes.py", "tests", "walg_job.py"]

[uses]
"autostart.py" = ["boot_policy.py", "boot_unit.py", "cron.py", "hostport.py"]
"boot_unit.py" = ["boot_policy.py", "hostport.py"]
"cron.py" = ["hostport.py"]
"logs_job.py" = ["__init__.py", "cron.py", "hostport.py"]
"macos_firewall.py" = ["hostport.py"]
"packages_job.py" = ["__init__.py", "cron.py", "hostport.py"]
"pr_flow_job.py" = ["__init__.py", "cron.py", "hostport.py"]
"probes.py" = ["hostport.py"]
"tests" = ["autostart.py", "backend.py", "boot_policy.py", "boot_unit.py", "cron.py", "hostport.py", "logs_job.py", "macos_firewall.py", "packages_job.py", "pr_flow_job.py", "probes.py", "walg_job.py"]
"walg_job.py" = ["__init__.py", "cron.py", "hostport.py"]

[purity]
"__init__.py" = "strict"

[roots]
"probes.py" = { kinds = ["environ"], why = "display_available reads DISPLAY/WAYLAND_DISPLAY to detect X11/Wayland; these are OS display-server vars, not meiva runtime config; no Settings field models them. Single source of truth shared by the browser daemon / MCP loader / host-config validators" }

[debt.ambient-read]
"autostart.py#home pathlib.Path.home" = 1
"boot_unit.py#pid os.getpid" = 2
"cron.py#home pathlib.Path.home" = 2
"hostport.py#pid os.getuid" = 1
"logs_job.py#home pathlib.Path.home" = 1
"macos_firewall.py#platform socket.gethostname" = 1
"packages_job.py#home pathlib.Path.home" = 1
"pr_flow_job.py#home pathlib.Path.home" = 2
"probes.py#home pathlib.Path.home" = 2
"walg_job.py#home pathlib.Path.home" = 1
