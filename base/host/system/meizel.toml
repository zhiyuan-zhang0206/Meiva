[roots]
"hostport.py" = { kinds = ["pid", "platform"], why = "Host.system() is the door that builds the one Host this process has, and a Host must describe the process that built it: the user id it carries is the id a lock, a private directory and a socket path are later judged against, so one handed in from outside would let a component claim another process's identity — the single thing this value must not be able to say; `Platform.current()` is the other fact the same constructor reads — the machine this Host describes — and the comment on `Host.system` already counts two acquisitions here" }
