exports = ["auth.py", "browser_origins.py", "http_dial.py", "ports.py", "predicates.py", "resilience.py", "tests", "transport_errors.py", "url_secret.py"]

[uses]
"auth.py" = ["__init__.py"]
"http_dial.py" = ["predicates.py"]
"tests" = ["__init__.py", "auth.py", "browser_origins.py", "http_dial.py", "ports.py", "predicates.py", "resilience.py", "url_text.py"]
"url_secret.py" = ["url_text.py"]
"url_text.py" = ["predicates.py"]

[purity]
"__init__.py" = "strict"
"browser_origins.py" = "strict"
"predicates.py" = "strict"
"url_secret.py" = "strict"
"url_text.py" = "strict"

[roots]
"resilience.py" = { kinds = ["pid"], why = "agent_phase() staggers generic transport retries by the pid of the process doing the retrying (`os.getpid()`); a caller-supplied pid would stagger by a process that is not running" }
