exports = ["auth.py", "http_dial.py", "ports.py", "predicates.py", "resilience.py", "tests", "url_secret.py"]

[uses]
"auth.py" = ["__init__.py"]
"http_dial.py" = ["predicates.py"]
"tests" = ["__init__.py", "auth.py", "http_dial.py", "ports.py", "predicates.py", "resilience.py", "url_secret.py"]
"url_secret.py" = ["predicates.py"]

[purity]
"__init__.py" = "strict"
"predicates.py" = "strict"

[debt.ambient-read]
"auth.py#random secrets.token_bytes" = 1
"resilience.py#pid os.getpid" = 1
"resilience.py#random random.uniform" = 1
