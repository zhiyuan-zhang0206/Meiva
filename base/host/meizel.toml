exports = ["atomic_io.py", "boundary", "config_validators.py", "converge", "db_authority", "env", "exit_codes.py", "git", "net", "permissions_helper", "private_storage.py", "proc.py", "resource", "runtime_interpreter.py", "system", "tests", "tool_pins.py"]

[uses]
"config_validators.py" = ["system"]
"converge" = ["boundary", "system"]
"db_authority" = ["net", "private_storage.py"]
"env" = ["atomic_io.py", "boundary", "db_authority", "net", "private_storage.py", "proc.py"]
"git" = ["boundary", "proc.py"]
"net" = ["__init__.py", "boundary"]
"permissions_helper" = ["boundary", "converge", "net"]
"system" = ["atomic_io.py", "boundary", "env", "proc.py", "runtime_interpreter.py", "tool_pins.py"]
"tests" = ["atomic_io.py", "config_validators.py", "env", "private_storage.py", "proc.py", "resource", "system"]

[roots]
"proc.py" = { kinds = ["monotonic"], why = "wait_owned() bounds a wait on real processes and times nothing it reports: `clock = time.monotonic` builds a deadline the loop then compares against (`deadline - clock()`, `time.sleep`), and the readings are never recorded, so no caller holds a better duration. The kind is the narrow one; `time.time()` or `datetime.now()` in this file still fails" }
"runtime_interpreter.py" = { kinds = ["argv", "pid"], why = "loaded_runtime() and admit_loaded_source() inspect the running interpreter's own binary (sys.executable), environment prefix (sys.prefix) and launch flags (sys.flags) to verify that the imported modules belong to one canonical installation of the checkout; a caller handing those facts in would decide that verification by assertion instead of reading the running interpreter" }

[purity]
"__init__.py" = "strict"
"exit_codes.py" = "strict"
