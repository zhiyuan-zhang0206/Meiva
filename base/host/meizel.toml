exports = ["atomic_io.py", "boundary", "brew_pin.py", "config_validators.py", "converge", "db_authority", "env", "exit_codes.py", "git", "net", "permissions_helper", "private_storage.py", "proc.py", "resource", "runtime_interpreter.py", "system", "tests", "verified_file"]

[uses]
"brew_pin.py" = ["proc.py"]
"config_validators.py" = ["system"]
"converge" = ["boundary", "system"]
"db_authority" = ["boundary", "net", "private_storage.py", "verified_file"]
"env" = ["atomic_io.py", "boundary", "db_authority", "net", "private_storage.py", "proc.py"]
"git" = ["boundary", "proc.py"]
"net" = ["__init__.py", "boundary"]
"permissions_helper" = ["boundary", "converge", "net"]
"runtime_interpreter.py" = ["verified_file"]
"system" = ["atomic_io.py", "boundary", "brew_pin.py", "env", "proc.py", "runtime_interpreter.py"]
"tests" = ["atomic_io.py", "config_validators.py", "env", "private_storage.py", "proc.py", "resource", "system", "verified_file"]

[roots]
"proc.py" = { kinds = ["monotonic"], why = "wait_owned() bounds a wait on real processes and times nothing it reports: `clock = time.monotonic` builds a deadline the loop then compares against (`deadline - clock()`, `time.sleep`), and the readings are never recorded, so no caller holds a better duration. The kind is the narrow one; `time.time()` or `datetime.now()` in this file still fails" }

[purity]
"__init__.py" = "strict"
"exit_codes.py" = "strict"

[debt.ambient-read]
"runtime_interpreter.py#argv sys.flags" = { count = 1, owner = "#5816", until = "permanently: `loaded_runtime` reports the launch this interpreter is already running under (`sys.flags.isolated` and `dont_write_bytecode`), and the only way a caller could name those flags is to read the same startup flags of the same interpreter back to it" }
"runtime_interpreter.py#pid sys.executable" = { count = 1, owner = "#5816", until = "permanently: `loaded_runtime` has to name the binary executing this file, and it is also where `LoadedRuntimeError` is raised when the imported modules belong to another installation; a caller could only hand back the path it read from this same interpreter, and a wrong one would describe a runtime the process never ran on" }
"runtime_interpreter.py#pid sys.prefix" = { count = 1, owner = "#5816", until = "permanently: `loaded_runtime` reports the environment prefix this interpreter resolves its imports from, which `verify_loaded_source` compares against the package root to refuse a checkout that lives inside the environment; a prefix passed in from outside would decide that comparison by assertion instead of by reading" }
