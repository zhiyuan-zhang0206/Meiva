exports = ["catalog.py", "checklist.py", "gate.py", "probe.py", "triggers.py"]

[uses]
"checklist.py" = ["catalog.py", "gate.py"]
"gate.py" = ["catalog.py", "probe.py"]
"probe.py" = ["catalog.py", "children"]
"triggers.py" = ["catalog.py", "children", "probe.py"]
"tests" = ["catalog.py", "checklist.py", "gate.py", "probe.py"]

[purity]
"__init__.py" = "strict"
"catalog.py" = "strict"

[debt.ambient-read]
"probe.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"triggers.py#pid sys.executable" = { count = 2, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
