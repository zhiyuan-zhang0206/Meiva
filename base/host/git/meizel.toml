exports = ["gitenv.py", "host_version.py"]

[uses]
"host_version.py" = ["gitenv.py"]
"tests" = ["gitenv.py", "host_version.py"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"gitenv.py" = "strict-to-be"

[roots]
"gitenv.py" = { kinds = ["environ"], why = "git_env copies the live env for a git subprocess (which needs PATH/HOME/SSH_AUTH_SOCK) and layers GIT_TERMINAL_PROMPT/GIT_SSH_COMMAND on top; git plumbing + a whole-environment child handoff, not Meiva runtime config" }

[debt.ambient-read]
"host_version.py#environ base.host.git.gitenv.git_env" = 1

[debt.impure-call]
"gitenv.py#os.environ" = 1
"host_version.py#Path.read_text" = 1

[debt.impure-edge]
"host_version.py#base/host/proc.py" = 1
