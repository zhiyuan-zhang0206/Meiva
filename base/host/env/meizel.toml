exports = ["agent_env.py", "agent_slices.py", "boot_actions.py", "boot_policy.py", "bootstrap.py", "config_lite_table.py", "dotenv_boot.py", "dotenv_content.py", "dotenv_file.py", "harness", "harness_binaries.py", "health_ports.py", "port_lease.py", "port_table.py", "process_profile.py", "registry.py", "tests"]

[uses]
"agent_env.py" = ["config_lite_table.py"]
"agent_slices.py" = ["agent_env.py", "config_lite_table.py"]
"boot_actions.py" = ["bootstrap.py"]
"bootstrap.py" = ["boot_policy.py", "process_profile.py", "registry.py"]
"dotenv_boot.py" = ["boot_policy.py", "bootstrap.py", "dotenv_file.py", "registry.py"]
"dotenv_file.py" = ["dotenv_content.py"]
"harness" = ["harness_binaries.py"]
"health_ports.py" = ["port_table.py", "registry.py"]
"registry.py" = ["agent_env.py", "config_lite_table.py", "process_profile.py"]
"tests" = ["agent_env.py", "boot_actions.py", "boot_policy.py", "bootstrap.py", "dotenv_content.py", "dotenv_file.py", "harness", "harness_binaries.py", "port_lease.py", "port_table.py", "registry.py"]

[roots]
"dotenv_file.py" = { kinds = ["clock"], why = "the .env backup name carries the HOST clock by decision (docs/decisions/data/backup/2026-09-28-env-backup-names-use-the-host-clock.md): the writer runs before first-start identity, so asking a cluster Clock would mean loading runtime Settings to name a file, and the name must stay this machine's local time" }
"boot_actions.py" = { kinds = ["environ", "random"], why = "The program-level operations that write this process's own TZ, MEIVA_HOME and config-fetch marker before the first application import, and that name the scratch home they create at random under the temporary directory; nothing else in base.host.env writes the process environment" }
"registry.py" = { kinds = ["environ"], why = "child_env builds the parent->child forwarding dict from the LIVE env (the registry's allowlist keys + passthrough rows); Settings cannot enumerate non-modeled keys and the dict must reflect the parent env, not its own snapshot — same child-env handoff as base.sessions.env_forwarding" }

[purity]
"__init__.py" = "strict"
"agent_env.py" = "strict"
"agent_slices.py" = "strict"
"boot_policy.py" = "strict"
"config_lite_table.py" = "strict-to-be"
"dotenv_content.py" = "strict"
"port_table.py" = "strict"
"process_profile.py" = "strict"

[debt.ambient-read]
"dotenv_file.py#home base.paths.home.resolve_meiva_home" = { count = 1, owner = "#5816", until = "waits for a caller that holds the home: every caller of process_env_file() is a module with no home to pass (base.config, base.lm, the plugin config view), so handing one in would move the same resolve_meiva_home() into each of them instead of removing it" }
"harness_binaries.py#home base.paths.home.user_home" = { count = 1, owner = "#5816", until = "waits for every call site to hold the user home: the antigravity transcript mapper has none in hand, so the fallback stays until it passes one" }
"port_lease.py#environ tempfile.gettempdir" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: `_root` names the one host-wide meeting point every port-leasing process on this machine shares — /dev/shm where the platform has it, else the OS temp directory — because the port space belongs to the kernel and not to a home; a root handed in would let two processes keep two registries and each believe it owns the band, which is the failure this module exists to end, and `tests/test_port_lease.py` asserts the opposite by leasing from a child process and reading the same `registry_dir()` here" }
"port_lease.py#pid os.getpid" = { count = 1, owner = "#5816", until = "waits for nothing (the 2026-10-31 ruling): the holder of a lease is the process holding the flock, and a caller-supplied pid would let one process answer for another's lease" }
"port_lease.py#pid os.getuid" = { count = 1, owner = "#5816", until = "waits for nothing (the 2026-10-31 ruling): each user owns one lease namespace and the uid is the owner of the shared directory, so a caller-supplied uid would write into somebody else's namespace" }
"port_lease.py#random secrets.randbelow" = { count = 1, owner = "#5816", until = "waits for nothing (the 2026-10-31 ruling): the starting port must not be predictable, or concurrent processes pick the same band; a caller's shared rng is exactly what makes them collide" }

[debt.impure-call]
"config_lite_table.py#pkgutil.get_data" = { count = 1, owner = "#7240", until = "waits for a boot-order change that makes the single import-time derivation lazy: the table stays JSON, and one line — base/packages/plugins/flags.py:40 `frozenset(FIELD_DOMAINS.values())` — is the door; the other 17 import sites read the tables inside functions" }
