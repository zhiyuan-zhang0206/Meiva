exports = ["agent_env.py", "agent_slices.py", "boot_policy.py", "bootstrap.py", "config_lite_table.py", "dotenv_boot.py", "dotenv_content.py", "dotenv_file.py", "harness_binaries.py", "health_ports.py", "port_lease.py", "port_table.py", "process_profile.py", "registry.py", "tests"]

[uses]
"agent_env.py" = ["config_lite_table.py"]
"agent_slices.py" = ["agent_env.py", "config_lite_table.py"]
"bootstrap.py" = ["boot_policy.py", "process_profile.py", "registry.py"]
"dotenv_boot.py" = ["boot_policy.py", "bootstrap.py", "dotenv_file.py", "harness_binaries.py", "registry.py"]
"dotenv_file.py" = ["dotenv_content.py"]
"health_ports.py" = ["port_table.py", "registry.py"]
"registry.py" = ["agent_env.py", "config_lite_table.py", "process_profile.py"]
"tests" = ["agent_env.py", "boot_policy.py", "bootstrap.py", "dotenv_boot.py", "dotenv_content.py", "dotenv_file.py", "harness_binaries.py", "port_lease.py", "port_table.py", "registry.py"]

[purity]
"dotenv_content.py" = "strict"
"__init__.py" = "strict"
"agent_env.py" = "strict"
"agent_slices.py" = "strict"
"boot_policy.py" = "strict"
"config_lite_table.py" = "strict"
"port_table.py" = "strict"
"process_profile.py" = "strict"

[roots]
"dotenv_boot.py" = { kinds = ["environ"], why = "load_dotenv ~/.meiva/.env, must run before Settings import" }
"registry.py" = { kinds = ["environ"], why = "child_env builds the parent->child forwarding dict from the LIVE env (the registry's allowlist keys + passthrough rows); Settings cannot enumerate non-modeled keys and the dict must reflect the parent env, not its own snapshot — same child-env handoff as base.sessions.env_forwarding" }

[debt.ambient-read]
"dotenv_boot.py#home base.paths.home.resolve_meiva_home" = 1
"dotenv_file.py#clock datetime.datetime.now" = 1
"dotenv_file.py#home base.paths.home.resolve_meiva_home" = 1
"harness_binaries.py#home base.paths.home.user_home" = 1
"port_lease.py#pid os.getpid" = 1
"port_lease.py#pid os.getuid" = 1
"port_lease.py#random secrets.randbelow" = 1
