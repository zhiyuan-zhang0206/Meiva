exports = ["announce.py", "bus.py", "coalescer.py", "projection.py", "publisher.py", "redis_client.py", "redis_listener.py", "tests"]

[uses]
"announce.py" = ["bus.py", "projection.py"]
"bus.py" = ["redis_client.py", "redis_resilience.py"]
"coalescer.py" = ["projection.py"]
"publisher.py" = ["redis_client.py", "redis_resilience.py"]
"redis_client.py" = ["redis_resilience.py"]
"redis_listener.py" = ["redis_client.py", "redis_resilience.py"]
"tests" = ["bus.py", "coalescer.py", "projection.py", "publisher.py", "redis_client.py", "redis_listener.py", "redis_resilience.py"]

[purity]
"__init__.py" = "strict"

[state]
"__init__.py" = ["bus"]
"bus.py" = ["bus"]

[debt.ambient-read]
"bus.py#settings base.config.settings" = 1
"redis_client.py#random random.uniform" = 1
"redis_listener.py#settings base.config.settings" = 1

[debt.any-collaborator]
"redis_client.py#any AuthRetryAsyncRedis.execute_command.return" = 1
"redis_client.py#any AuthRetrySyncRedis.execute_command.return" = 1
