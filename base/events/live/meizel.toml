exports = ["announce.py", "bus.py", "coalescer.py", "projection.py", "publisher.py", "redis_client.py", "redis_listener.py", "tests"]

[uses]
"announce.py" = ["bus.py", "projection.py"]
"bus.py" = ["redis_client.py"]
"coalescer.py" = ["projection.py"]
"publisher.py" = ["redis_client.py"]
"redis_client.py" = ["redis_resilience.py"]
"redis_listener.py" = ["redis_client.py", "redis_resilience.py"]
"tests" = ["bus.py", "coalescer.py", "projection.py", "publisher.py", "redis_client.py", "redis_listener.py"]

[purity]
"__init__.py" = "strict"

[state]
"__init__.py" = ["bus"]
"bus.py" = ["bus"]

[debt.ambient-read]
"bus.py#settings base.config.settings" = 1
"redis_client.py#random random.uniform" = 1
"redis_listener.py#settings base.config.settings" = 1

[debt.any-collaborator]
"bus.py#any _from_view.view" = 1
"redis_client.py#any AuthRetryAsyncRedis.execute_command._execute.return" = 1
"redis_client.py#any AuthRetryAsyncRedis.execute_command.args" = 1
"redis_client.py#any AuthRetryAsyncRedis.execute_command.options" = 1
"redis_client.py#any AuthRetryAsyncRedis.execute_command.return" = 1
"redis_client.py#any AuthRetrySyncRedis.execute_command._execute.return" = 1
"redis_client.py#any AuthRetrySyncRedis.execute_command.args" = 1
"redis_client.py#any AuthRetrySyncRedis.execute_command.options" = 1
"redis_client.py#any AuthRetrySyncRedis.execute_command.return" = 1

[debt.type-cast]
"redis_client.py#cast AuthRetryAsyncRedis.execute_command._execute" = 1
"redis_client.py#cast AuthRetrySyncRedis.execute_command._execute" = 1
"redis_client.py#cast PinnedIPv4Connection._connect" = 1
"redis_client.py#cast open_async_redis" = 1
"redis_client.py#cast open_sync_redis" = 1
"redis_listener.py#cast RedisInboundListener._consume_one" = 1
"redis_listener.py#cast RedisInboundListener._open_and_subscribe" = 1
