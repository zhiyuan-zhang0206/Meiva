exports = ["audit.py", "catalog.py", "notices.py", "outbox.py", "policy.py", "publish.py", "store.py"]

[uses]
"audit.py" = ["catalog.py", "notices.py", "policy.py", "store.py"]
"__init__.py" = ["catalog.py", "policy.py", "publish.py"]
"notices.py" = ["publish.py"]
"outbox.py" = ["publish.py", "store.py"]
"policy.py" = ["catalog.py"]
"publish.py" = ["catalog.py", "policy.py", "store.py"]
"tests" = ["audit.py", "catalog.py", "notices.py", "outbox.py", "policy.py", "publish.py"]

[purity]
"catalog.py" = "strict"
"policy.py" = "strict"

[debt.ambient-read]
"audit.py#clock datetime.datetime.now" = 1
"publish.py#clock datetime.datetime.now" = 1

[debt.type-cast]
"catalog.py#cast category_from_manifest" = 1
"store.py#cast parse_overrides" = 1
