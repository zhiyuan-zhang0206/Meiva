[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"start_inputs.py" = "strict"

[debt.ambient-read]
"collector_artifact.py#platform platform.machine" = 1
"collector_artifact.py#platform platform.system" = 2

[debt.impure-call]
"collector_artifact.py#Path.open" = 1
"collector_artifact.py#Path.read_bytes" = 1
"collector_artifact.py#Path.write_text" = 1
"collector_artifact.py#import shutil" = 1
"collector_artifact.py#import tempfile" = 1
"editable_install.py#Path.exists" = 3
"editable_install.py#Path.read_text" = 2
"python_lock.py#Path.open" = 1

[debt.impure-edge]
"collector_artifact.py#base/host/net/ports.py" = 1
"collector_artifact.py#base/host/net/resilience.py" = 1

[debt.type-cast]
"editable_install.py#cast _direct_url_is_allowed" = 2

[debt.wide-params]
"collector_artifact.py#def stream_download" = 1
