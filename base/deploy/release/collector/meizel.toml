exports = ["artifact.py", "plan.py"]

[uses]
"artifact.py" = ["plan.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"artifact.py" = { mode = "none", why = "the shell of the pinned collector acquisition: it streams the release archive over the URL opener the caller hands in, hashes it as it arrives, retries under the budget, extracts the binary and writes the version marker, and reports on stdout and stderr; which asset a platform needs, its digest, the archive member, what a spent budget or a failed attempt says and how long to wait are decided in plan.py" }
"plan.py" = "strict"

[debt.ambient-read]
"artifact.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "permanently: `download_and_verify` stages the release tarball it is about to download in a directory of its own and has `install_binary` read it back; the tarball is never renamed into `dest_dir`, and the same file's `install_binary` already stages inside `dest_dir` precisely because its result is moved there — `dest_dir` is the destination of the installed binary, not a workspace for a download" }
"artifact.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "permanently: the name of that one-shot directory is minted by the OS so two installs in one process cannot share a tarball path; no caller reads the name — `otel_collector`'s upgrade path hands in the tag and `dest_dir`, and `install_binary` receives the file, never its directory" }
