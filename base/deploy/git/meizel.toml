exports = ["check_git_hooks.py", "cluster_drift.py", "github_pr.py", "memory_repo.py", "repo_change.py", "running_sha.py", "source_tree_guard.py", "tests", "worktree_guard.py"]

[uses]
"tests" = ["cluster_drift.py", "github_pr.py", "memory_repo.py", "repo_change.py", "source_tree_guard.py", "worktree_guard.py"]

[roots]
"check_git_hooks.py" = { kinds = ["argv", "cwd", "home"], why = "the __main__ guard reads argv[1:] once and hands it to main; the script also judges the checkout it was started in (`Path.cwd()`) and scans the invoking user's home for this machine's checkouts (`Path.home()`): both are the operands the operator chose" }

[purity]
"__init__.py" = "strict"
"repo_change.py" = "strict"
