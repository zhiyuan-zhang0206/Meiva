exports = ["retry.py", "retry_io.py"]

[uses]
"retry_io.py" = ["retry.py"]

[purity]
"." = "strict"
"retry_io.py" = { mode = "none", why = "the database-driver adapter behind the retry policy: it turns the exception a caller already holds into the facts `retry.transient_database_failure` reads, so what makes a failure connection availability is decided in retry.py and a caller that needs only the policy never loads psycopg" }
