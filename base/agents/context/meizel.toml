exports = ["clients.py", "external_attachment", "gateway_client", "identity.py"]

[uses]
"__init__.py" = ["clients.py", "identity.py"]
"external_attachment" = []
"gateway_client" = ["__init__.py", "clients.py", "identity.py"]
"tests" = ["__init__.py", "clients.py", "identity.py"]

[dynamic-attrs]
"clients.py" = "a lazy connection proxy that forwards every attribute to the connection it builds on first use; the names are whatever the driver exposes"

[purity]
"identity.py" = "strict"

[debt.restricted-python]
"__init__.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
