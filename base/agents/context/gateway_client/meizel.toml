exports = ["launch_retry.py", "memory_search.py", "transport.py"]

[uses]
"launch_retry.py" = ["transport.py"]
"memory_search.py" = ["transport.py"]
"tests" = ["launch_retry.py", "memory_search.py", "transport.py"]

[purity]
"__init__.py" = "strict"

[debt.ambient-read]
"transport.py#random uuid.uuid4" = { count = 1, owner = "#5816", until = "waits for nothing: the idempotency key exists precisely when the caller passed none (the parameter is optional by contract), and a shared rng would let two retries of one call share a key" }
