exports = ["creation_identity.py", "harness.py", "spawn.py", "transaction.py"]

[uses]
"spawn.py" = ["transaction.py"]
"transaction.py" = ["creation_identity.py", "harness.py"]

[purity]
"__init__.py" = "strict"

[debt.ambient-read]
"harness.py#clock datetime.datetime.now" = 1
"harness.py#home pathlib.Path.home" = 1
"transaction.py#random uuid.uuid4" = 1

[debt.type-cast]
"harness.py#cast _answered_claude" = 1
"harness.py#cast _codex_login" = 1
"harness.py#cast _has_value" = 1
"harness.py#cast _kimi_config_login" = 2
"harness.py#cast _kimi_credentials_file_login" = 1
"harness.py#cast _nested" = 2
