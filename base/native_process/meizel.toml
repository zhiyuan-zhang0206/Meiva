exports = ["child_env.py", "code_version.py", "evidence.py", "exec_domain.py", "exec_kill_notice.py", "kernel_identity.py", "loaded_commit.py", "os_platform.py", "ownership.py", "process_control.py", "reparent", "root_control", "runtime_incarnation.py", "stop_timing.py", "tests", "turn_identity.py"]

[uses]
"code_version.py" = ["loaded_commit.py"]
"exec_domain.py" = ["os_platform.py", "process_control.py"]
"exec_kill_notice.py" = ["untyped.py"]
"kernel_identity.py" = ["os_platform.py"]
"loaded_commit.py" = ["untyped.py"]
"os_platform.py" = ["untyped.py"]
"ownership.py" = ["kernel_identity.py", "os_platform.py", "pidfd.py"]
"pidfd.py" = ["os_platform.py", "untyped.py"]
"root_control" = ["os_platform.py", "ownership.py", "untyped.py"]
"tests" = ["child_env.py", "code_version.py", "evidence.py", "kernel_identity.py", "loaded_commit.py", "os_platform.py", "ownership.py", "pidfd.py", "process_control.py", "runtime_incarnation.py", "turn_identity.py"]
"turn_identity.py" = ["stop_timing.py"]

[roots]
"child_env.py" = { kinds = ["environ"], why = "centralized process-protocol seam: copies the complete live env, consumes one-shot markers, and adopts a child's committed handoff; Settings cannot model dynamic per-process state" }
"os_platform.py" = { kinds = ["monotonic"], why = "_monotonic() reports a duration, not an instant: `_bounded_file_lock` polls a non-blocking take and compares `now >= deadline` against a deadline it wrote itself, and never records the value. The kind is the narrow one, so `time.time()` or `datetime.now()` here still fails; the lock call sites keep taking no clock, because a duration compared with a deadline this process chose has no better provider above it" }

[purity]
"evidence.py" = "strict"
"runtime_incarnation.py" = "strict"
"stop_timing.py" = "strict"
"untyped.py" = "strict"

[debt.ambient-read]
"kernel_identity.py#environ ctypes.util.find_library" = { count = 1, owner = "#5816", until = "waits for `_darwin_boot_session_uuid` to take the loaded libc from its caller: it asks the library search path (LD_LIBRARY_PATH, PATH) for libc itself" }
"os_platform.py#pid os.getpid" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: the pid this module reports is the one the platform assigned to the running process, and a caller handing in its own pid restates the same syscall while being unable to answer for another process" }
"os_platform.py#pid resource.getrlimit" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `raise_fd_limit` compares the `desired` ceiling against the soft and hard limits this process inherited, and the soft limit is the one number a launcher cannot supply — it is whatever the parent left behind, which only the kernel can answer for this process" }
"os_platform.py#pid sys.executable" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `Platform.current` records the interpreter binary this process runs on beside the platform it runs on, and a caller can only supply the path it was itself started with, which is the path this read returns" }
"os_platform.py#platform platform.machine" = { count = 1, owner = "#5816", until = "waits for the hardware: the machine this process runs on is not a value any caller inside it holds better, so carrying it in would repeat the same uname at every call site" }
"os_platform.py#platform sys.platform" = { count = 1, owner = "#5816", until = "waits for the interpreter: the platform this process was started on is fixed before any caller runs, and a caller passing it would be naming a value it can only have read the same way" }

[debt.fake-entropy]
"os_platform.py#interval-wrapper _monotonic" = { count = 1, owner = "#6018", until = "waits for the checker to have a duration class: the wrapper only answers now >= deadline inside the file-lock poll loop and the same call is already booked as ambient-read; inlining time.monotonic() would re-record that read under a new key, which is a rename rather than a repayment" }
