exports = ["client.py", "instance_lock.py", "ipc.py", "tests"]

[uses]
"client.py" = ["ipc.py"]
"tests" = ["client.py", "instance_lock.py", "ipc.py"]

[purity]
"__init__.py" = "strict"
"ipc.py" = "strict"

[roots]
"client.py" = { kinds = ["pid"], why = "current_uid() and caller_identity() are the boundary's own syscalls: across the root-control socket the far side must report the user it actually runs as and the parent that actually started it, because that is what the root decides a request's authority on. Handing either value in would let a privileged caller describe itself instead of the process the connection really belongs to" }
[debt.ambient-read]
"client.py#argv sys.argv" = { count = 1, owner = "#5816", until = "waits for a ruling on whether the caller block may state its command line itself: argv is this process's own testimony across the root-control socket, like its pid, uid and working directory (compare the cwd entry above)" }
"client.py#cwd pathlib.Path.cwd" = { count = 1, owner = "#5816", until = "waits for nothing a caller may assert: the caller block is this process's own testimony across the root-control socket - pid, parent, uid and working directory - and a cwd handed in would let a verb claim a directory it is not running in" }
"client.py#platform socket.gethostname" = { count = 1, owner = "#5816", until = "waits for a caller that could name the host without costs the boundary cannot pay: the kernel hostname is this host's own fact, and the configured cluster name cannot be read here without closing an import cycle through base.config" }
"instance_lock.py#pid os.getpid" = { count = 1, owner = "#5816", until = "permanently: the lock records the pid of the process that holds the flock, and a caller-supplied pid would let a process claim a lock it does not hold" }
