exports = ["direct_url.py", "pg_admin.py", "pg_foreground.py", "pg_runtime.py", "pg_stall_watchdog.py", "pg_throwaway_base.py", "pg_tools.py", "pooler.py", "provision_plan.py", "redis_bridge.py", "runtime_binaries.py", "walg_binary.py"]

[uses]
"pg_foreground.py" = ["pg_plan.py"]
"pg_runtime.py" = ["pg_tools.py", "runtime_binaries.py"]
"pg_throwaway_base.py" = ["pg_plan.py"]
"pg_tools.py" = ["pg_foreground.py", "pg_plan.py", "pg_stall_watchdog.py", "pg_throwaway_base.py", "runtime_binaries.py"]
"pooler.py" = ["pg_tools.py"]
"tests" = ["direct_url.py", "pg_foreground.py", "pg_plan.py", "pg_runtime.py", "pg_stall_watchdog.py", "pg_throwaway_base.py", "pg_tools.py", "pooler.py", "redis_bridge.py", "runtime_binaries.py", "walg_binary.py"]
"walg_binary.py" = ["runtime_binaries.py"]

[purity]
"__init__.py" = "strict"
"pg_plan.py" = "strict"
"provision_plan.py" = "strict"

[debt.ambient-read]
"pg_admin.py#environ getpass.getuser" = { count = 1, owner = "#5816", until = "waits for `pg_admin_url` to take the operator's user name from its caller: it asks getpass for it" }
"pg_admin.py#pid getpass.getuser" = { count = 1, owner = "#5816", until = "waits for `pg_admin_url` to take the operator's user name from its caller: it asks getpass for it" }
"pg_runtime.py#environ shutil.which()" = { count = 1, owner = "#5816", until = "waits for `installed_server` to take the program path, or the search path, from its caller: it asks PATH for the program itself" }
"pg_throwaway_base.py#environ tempfile.gettempdir" = { count = 2, owner = "#5816", until = "waits for nothing that can arrive: `default_base` and `disk_fallback_base` name the platform default that throwaway cluster data goes under, as a fixed probe of /dev/shm then /var/tmp then the OS temp directory; this home's `MEIVA_PG_THROWAWAY_BASE` is the documented channel for a caller that knows its data volume, `default_root` replaces both probes for a caller that must not consult the platform at all (every test does), so the temp directory is only reached when neither standard directory exists — which filesystems this host has is not something a caller can state better" }
"pg_tools.py#environ shutil.which()" = { count = 1, owner = "#5816", until = "waits for `pg_tool` to take the program path, or the search path, from its caller: it asks PATH for the program itself" }
"pooler.py#environ shutil.which()" = { count = 1, owner = "#5816", until = "waits for `pgbouncer_bin` to take the program path, or the search path, from its caller: it asks PATH for the program itself" }
