exports = ["authority", "checkpoint_schema.py", "dataplane", "derive.py", "frontend_build.py", "machine", "machines.py", "ownership.py", "port_preflight.py", "ports.py", "postgres.py", "provision.py", "rate_limit.py", "record.py", "transport_encryption.py"]

[uses]
"__init__.py" = ["derive.py", "ports.py", "provision.py", "record.py", "redis_acl.py"]
"checkpoint_schema.py" = ["dataplane"]
"dataplane" = ["derive.py", "listener_plan.py", "machine", "ownership.py", "port_preflight.py", "ports.py", "record.py"]
"derive.py" = ["machine", "record.py", "transport_encryption.py"]
"machines.py" = ["machine"]
"ownership.py" = ["port_preflight.py", "postgres.py"]
"port_preflight.py" = ["listener_plan.py", "machine"]
"postgres.py" = ["port_preflight.py"]
"provision.py" = ["checkpoint_schema.py", "dataplane", "derive.py"]
"record.py" = ["ports.py"]
"redis_acl.py" = ["ownership.py", "port_preflight.py"]
"tests" = ["__init__.py", "checkpoint_schema.py", "dataplane", "derive.py", "frontend_build.py", "listener_plan.py", "machine", "machines.py", "ownership.py", "port_preflight.py", "ports.py", "postgres.py", "provision.py", "rate_limit.py", "transport_encryption.py"]

[purity]
"listener_plan.py" = "strict"
"rate_limit.py" = "strict"
"transport_encryption.py" = "strict"

[debt.ambient-read]
"port_preflight.py#environ shutil.which()" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"postgres.py#pid os.getuid" = { count = 1, owner = "#5816", until = "permanently: require_closed() asks whether the postgres process belongs to the user running the check, and a caller-supplied uid would answer for a different user than the one whose process is inspected" }
"postgres.py#platform base.native_process.os_platform.Platform.current" = { count = 1, owner = "#5816", until = "permanently: read_receipt() compares a receipt against the system this process runs on; a platform handed in would let a receipt from another OS validate here" }
