exports = ["boot.py", "configured.py", "tests"]

[uses]
"__init__.py" = ["gateway_access.py", "identity.py"]
"boot.py" = ["__init__.py"]
"configured.py" = ["identity.py"]
"tests" = ["__init__.py", "configured.py"]

[purity]
"." = "strict-to-be"
"configured.py" = { mode = "none", why = "the stateful owner of the machine identity: it reads each field from the root's ConfigBoot on first use, caches it and lets a root set or reset it, around the settings-free value module identity.py that holds the decisions" }
"gateway_access.py" = "strict"
"identity.py" = "strict"

[debt.impure-edge]
"boot.py#base/config/__init__.py" = { count = 1, owner = "#7240", until = "waits for ConfigBoot to sit at a light owner: boot.py names it only as gateway_access_from_boot's parameter type, `if TYPE_CHECKING` is banned (a type the running process never imported is not a type), so the file loads the settings singleton to name a type — the class or a Protocol has to move to a strict module first" }
