exports = ["ambient.py", "boot.py", "configured.py", "tests"]

[uses]
"__init__.py" = ["gateway_access.py", "identity.py"]
"ambient.py" = ["__init__.py"]
"boot.py" = ["__init__.py"]
"configured.py" = ["identity.py"]
"tests" = ["__init__.py", "configured.py"]

[purity]
"." = "strict-to-be"
"configured.py" = { mode = "none", why = "the stateful owner of the machine identity: it reads each field from the root's ConfigBoot on first use, caches it and lets a root set or reset it, around the settings-free value module identity.py that holds the decisions" }
"gateway_access.py" = "strict"
"identity.py" = "strict"

[debt.ambient-read]
"ambient.py#settings base.config.settings" = 1

[debt.impure-edge]
"__init__.py#base/host/db_authority/api.py" = 1
"__init__.py#base/host/db_authority/unit.py" = 1
"ambient.py#base/config/__init__.py" = 1
"boot.py#base/config/__init__.py" = 1
