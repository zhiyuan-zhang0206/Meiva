exports = ["admin", "agent_pins.py", "base.py", "config_registry.py", "domains", "env_changed.py", "profiles.py", "runtime_config.py", "service_read.py", "tests"]

[purity]
"agent_pins.py" = "strict"
"base.py" = "strict-to-be"
"config_registry.py" = "strict"
"env_changed.py" = "strict"
"lite_parse.py" = "strict"
"profiles.py" = "strict"
"wiring.py" = "strict"

[uses]
"__init__.py" = ["_full.py", "_lite.py", "admin", "config_registry.py", "profiles.py", "service_read.py"]
"_full.py" = ["admin", "agent_pins.py", "config_registry.py", "domains", "profiles.py", "service_read.py"]
"_lite.py" = ["_full.py", "config_registry.py", "lite_parse.py", "profiles.py"]
"admin" = ["config_registry.py"]
"agent_pins.py" = ["config_registry.py"]
"config_registry.py" = ["domains", "profiles.py"]
"domains" = ["base.py"]
"runtime_config.py" = ["config_registry.py", "env_changed.py"]
"service_read.py" = ["config_registry.py", "domains", "runtime_config.py"]
"tests" = ["__init__.py", "_full.py", "_lite.py", "admin", "base.py", "config_registry.py", "lite_parse.py", "runtime_config.py", "service_read.py"]

[state]
"__init__.py" = ["settings"]

[roots]
"_full.py" = { kinds = ["environ"], why = "the eager builder reads MEIVA_PROCESS_PROFILE at construction time, before the singleton exists — the same bootstrap-ordering class as base/config/domains/storage/data_plane.py" }
"_lite.py" = { kinds = ["environ"], why = "the boot-lite resolution layer IS the Settings bootstrap: it reads raw env aliases and plants the placeholder data-plane URLs before any sub-model exists — the same \"cannot depend on Settings by construction\" class as base/config/__init__.py" }

[debt.ambient-read]
"_full.py#home base.paths.home.resolve_meiva_home" = 1
"_lite.py#clock time.time" = 1
"_lite.py#home base.paths.home.resolve_meiva_home" = 2
"base.py#home base.paths.home.resolve_meiva_home" = 1

[debt.any-collaborator]
"__init__.py#any __getattr__.return" = 1
"_lite.py#any ConfigBoot.get_field.return" = 1
"_lite.py#any _SettingsView.__getattr__.return" = 1
"_lite.py#any get_field.return" = 1

[debt.impure-edge]
"base.py#base/paths/home.py" = 1
