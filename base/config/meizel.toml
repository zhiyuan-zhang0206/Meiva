exports = ["admin", "agent_pins.py", "base.py", "config_registry.py", "domains", "env_changed.py", "profiles.py", "runtime_config.py", "service_read.py", "tests"]

[dynamic-attrs]
"__init__.py" = "module __getattr__ forwards the eager-only names (Settings, the metadata and service-read re-exports) through the boot-lite gate; which names exist is decided by the build that installs them at run time"
"_full.py" = "the Settings aggregate omits the domains its process profile does not construct; __getattr__ turns a read of an absent domain into a named error, so the attribute set depends on the profile chosen at run time"
"_lite.py" = "the boot-lite configuration views forward any domain or field read to whichever backend (lite snapshot or full Settings) is live; the backend is chosen at run time"
"service_read.py" = "_DeferredReadModel forwards every attribute read to the model it builds on first use, and the reader helpers read domain fields by registry name from whichever model is live"

[purity]
"agent_pins.py" = "strict"
"base.py" = "strict-to-be"
"config_registry.py" = "strict"
"env_changed.py" = "strict"
"lite_parse.py" = "strict"
"profiles.py" = "strict"
"wiring.py" = "strict"

[uses]
"__init__.py" = ["_full.py", "_lite.py", "admin", "agent_pins.py", "config_registry.py", "profiles.py", "service_read.py"]
"_full.py" = ["admin", "agent_pins.py", "base.py", "config_registry.py", "domains", "profiles.py", "service_read.py"]
"_lite.py" = ["_full.py", "config_registry.py", "domain_shape.py", "lite_access.py", "lite_parse.py", "profiles.py"]
"admin" = ["config_registry.py"]
"agent_pins.py" = ["config_registry.py"]
"config_registry.py" = ["domains", "profiles.py"]
"domain_shape.py" = ["_full.py"]
"domains" = ["base.py"]
"runtime_config.py" = ["config_registry.py", "env_changed.py"]
"service_read.py" = ["config_registry.py", "domains", "runtime_config.py"]
"tests" = ["__init__.py", "_full.py", "_lite.py", "admin", "base.py", "config_registry.py", "domain_shape.py", "lite_parse.py", "runtime_config.py", "service_read.py"]

[state]
"__init__.py" = ["settings"]

[roots]
"_full.py" = { kinds = ["environ"], why = "the eager builder reads MEIVA_PROCESS_PROFILE at construction time, before the singleton exists — the same bootstrap-ordering class as base/config/domains/storage/data_plane.py" }
"_lite.py" = { kinds = ["environ", "clock"], why = "the boot-lite resolution layer IS the Settings bootstrap, and it reads the wall clock once for a bootstrap fetch TTL: `base.clock` builds a `Clock` from Settings, so asking it here would be a cycle.  it reads raw env aliases and plants the placeholder data-plane URLs before any sub-model exists — the same \"cannot depend on Settings by construction\" class as base/config/__init__.py" }

[debt.ambient-read]
"_full.py#home base.paths.home.resolve_meiva_home" = { count = 1, owner = "#5816", until = "permanently: the .env load at the root of the eager build takes the process's own home, which is what the build is derived from" }
"_lite.py#home base.paths.home.resolve_meiva_home" = { count = 2, owner = "#5816", until = "permanently: read_process_environment() loads the unit .env from the process's own home and prepare() resolves that home before any caller holds it" }
"_lite.py#pid threading.get_ident" = { count = 3, owner = "#5816", until = "permanently: the build gate compares the calling thread with the thread that owns the in-flight eager build, and a thread id handed in would let a caller claim to be the builder" }
"base.py#home base.paths.home.resolve_meiva_home" = { count = 1, owner = "#5816", until = "permanently: unit_home() is this module's statement of which home its sub-models default under, and it is the place that answers the question" }

[debt.impure-edge]
"base.py#base/paths/home.py" = { count = 1, owner = "#7240", until = "permanently: unit_home() is a pydantic default_factory that runs while a sub-model is constructed, before any settings object exists to carry the home — the home is the input that locates the .env the settings are built from, which is the same boundary base/paths declares with [roots] kinds=[environ, home]" }

[debt.restricted-python]
"config_registry.py#module __getattr__" = { count = 1, owner = "#6082", until = "waits for the lazy re-export to import its fixed names explicitly: the module serves a few names written in the source, so none of them is known only at run time" }
