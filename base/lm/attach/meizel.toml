exports = ["constants.py", "files.py", "packing.py"]

[uses]
"files.py" = ["constants.py", "packing.py"]
"packing.py" = ["constants.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"constants.py" = "strict"
"files.py" = { mode = "none", why = "the shell that runs the attachment plan against the filesystem: it resolves, stats, reads and measures what the pure plan in packing.py asks for and hands the answer back" }
"packing.py" = "strict"
