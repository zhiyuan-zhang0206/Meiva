exports = ["permission.py", "tests", "transport.py"]

[uses]
"__init__.py" = ["errors.py", "inbound.py", "permission.py"]
"frames.py" = []
"inbound.py" = ["errors.py", "frames.py", "permission.py"]
"permission.py" = ["frames.py"]
"transport.py" = ["errors.py", "frames.py", "inbound.py", "permission.py"]
"tests" = ["__init__.py", "errors.py", "frames.py", "inbound.py", "permission.py", "transport.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"errors.py" = "strict"
"frames.py" = "strict"
"inbound.py" = "strict"
"permission.py" = "strict"
"transport.py" = { mode = "none", why = "the live ACP connection: it starts the child on its stdio pipes, writes each frame the pure encoders in frames.py produce, reads and classifies every inbound line, settles the pending reply and reaps the process tree on close; which frame shape a line is and what an inbound request is answered with are decided in frames.py and inbound.py, and the answer a permission request gets in permission.py" }
