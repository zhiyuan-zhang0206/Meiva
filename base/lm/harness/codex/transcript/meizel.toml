"__init__.py" = "strict"
"clock.py" = "strict"
"errors.py" = "strict"
"items.py" = "strict"
"parse.py" = "strict"
"rollout.py" = "strict"
"scalars.py" = "strict"
"shapes.py" = "strict"
"window.py" = { mode = "none", why = "the file shell of a read-time timeline of a Codex thread: it finds the rollout file and names where its rows are inputs; the strict rollout parser decides what a row means" }
