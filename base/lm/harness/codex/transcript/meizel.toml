exports = ["window.py"]

[uses]
"__init__.py" = []
"clock.py" = ["errors.py"]
"errors.py" = []
"items.py" = ["clock.py", "errors.py", "scalars.py", "shapes.py"]
"parse.py" = ["clock.py", "errors.py", "items.py", "rollout.py", "scalars.py", "shapes.py"]
"rollout.py" = ["clock.py", "errors.py", "items.py", "scalars.py", "shapes.py"]
"scalars.py" = ["errors.py", "shapes.py"]
