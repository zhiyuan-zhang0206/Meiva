exports = ["session.py", "tests"]

[uses]
"__init__.py" = ["auth.py", "config.py"]
"config.py" = ["auth.py"]
"delivery.py" = []
"inbound.py" = []
"mapping.py" = []
"options.py" = ["auth.py", "config.py"]
"session.py" = ["config.py", "delivery.py", "inbound.py", "mapping.py", "options.py", "reconciliation", "settle.py"]
"reconciliation" = ["delivery.py"]
"settle.py" = ["mapping.py"]
"transcript" = ["delivery.py", "reconciliation"]
"tests" = ["auth.py", "config.py", "delivery.py", "inbound.py", "mapping.py", "options.py", "session.py", "settle.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"auth.py" = "strict"
"config.py" = "strict"
"delivery.py" = "strict"
"inbound.py" = "strict"
"mapping.py" = "strict"
"options.py" = "strict"
"session.py" = { mode = "none", why = "the effect shell of one Claude session: it opens and closes the SDK client, reads the CLI's message stream, awaits a query, an interrupt and a disconnect, and holds the state those calls change; what each message is, which result may claim the running turn, what a step and a turn's text are, which task report goes to the sink, what the SDK options carry and how a result settles a turn are decided in inbound.py, options.py and settle.py" }
"settle.py" = "strict"
