exports = ["reader.py", "tests", "wake.py"]

[uses]
"__init__.py" = []
"parse.py" = []
"position.py" = []
"store_filter.py" = []
"reader.py" = ["parse.py", "position.py", "store_filter.py"]
"wake.py" = []
"tests" = ["parse.py", "position.py", "reader.py", "store_filter.py", "wake.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"parse.py" = "strict"
"position.py" = "strict"
"store_filter.py" = "strict"
"wake.py" = { mode = "none", why = "the async callbacks the Claude SDK awaits on its session store: append signals the writer that a record grew and load answers that nothing was stored; neither reads the rows nor decides anything" }
"reader.py" = { mode = "none", why = "the file shell of the Claude transcript reader: it finds the session's JSONL under the injected Claude home, seeks to the stored byte offset, reads the bytes past it and hands them to the strict position and parse modules, which decide what a complete row is, whether the position still holds and what each row means" }
