exports = ["window.py", "file.py", "input_store.py"]

[uses]
"__init__.py" = []
"file.py" = ["input_store.py", "text.py"]
"text.py" = []
"input_store.py" = ["text.py"]
"window.py" = ["input_store.py", "text.py"]
"tests" = ["file.py", "input_store.py", "text.py", "window.py"]

[purity]
"." = "strict"
"__init__.py" = "strict"
"text.py" = "strict"

"window.py" = { mode = "off", why = "the Antigravity record boundary locates the file and reports unknown shapes; its entries follow file offsets and tool adjacency" }

"file.py" = { mode = "off", why = "bounded native record rows enriched from independently validated atomic timing facts" }

"input_store.py" = { mode = "off", why = "the ledger of inputs sent to the CLI, appended under a lock before each prompt is written and read back to name the row of the record each one became; what a row shows is decided in window.py" }
