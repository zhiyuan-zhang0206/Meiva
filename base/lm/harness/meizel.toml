"antigravity" = ["base_session.py", "cancel.py", "delivery", "events.py", "handoff.py", "process.py", "registry.py", "session"]
"base_session.py" = ["delivery", "events.py", "process.py", "registry.py", "session"]
"bridge.py" = ["base_session.py", "delivery", "engine.py", "events.py", "faults.py", "handoff.py", "pump.py", "registration.py", "session"]
"claude" = ["__init__.py", "base_session.py", "cancel.py", "delivery", "events.py", "process.py", "registry.py", "session"]
"codex" = ["base_session.py", "cancel.py", "delivery", "events.py", "process.py", "registry.py", "session"]
"cancel.py" = []
"delivery" = ["events.py"]
"engine.py" = ["delivery", "events.py"]
"pump.py" = ["events.py"]
"events.py" = []
"faults.py" = ["engine.py"]
"handoff.py" = []
"process.py" = []
"registration.py" = []
"registry.py" = ["session"]
"session" = ["events.py"]
"wiring.py" = ["antigravity", "base_session.py", "bridge.py", "claude", "codex", "events.py", "handoff.py", "registration.py", "registry.py"]
"tests" = ["__init__.py", "pump.py", "antigravity", "base_session.py", "cancel.py", "claude", "codex", "delivery", "engine.py", "events.py", "faults.py", "handoff.py", "registration.py", "registry.py", "session", "wiring.py"]

[purity]
"cancel.py" = "strict"
"engine.py" = "strict"
"events.py" = "strict"
"faults.py" = "strict"
"handoff.py" = "strict"

[roots]
"wiring.py" = { kinds = ["clock", "environ", "pid"], why = "builds one harness session (a bridge, a handoff, a session object) from the values the caller hands down; a Claude session's child environment is every key of the live environment blanked and then the explicit slice on top, which needs the live key list the way base/host/git/gitenv.py does for a git child; it also names its own interpreter (sys.executable) for the command it builds, and the zone the Claude CLI child will read a cron expression in (its TZ, else the host process's local zone)" }
