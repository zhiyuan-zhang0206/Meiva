exports = ["attach", "call.py", "catalog", "compat", "content.py", "context_budget.py", "decision", "effort.py", "errors.py", "factory.py", "harness", "pricing", "provider_api.py", "reasoning.py", "registry.py", "system_note.py", "tests", "usage"]

[dynamic-attrs]
"factory.py" = "resolves the 'module:factory_name' reference in MEIVA_LLM_OVERRIDE; the attribute name is operator input"

[purity]
"__init__.py" = "strict"
"content.py" = "strict"
"context_budget.py" = "strict"
"effort.py" = "strict"
"reasoning.py" = "strict"
"registry.py" = "strict"
"system_note.py" = "strict"

[uses]
"attach" = ["catalog", "registry.py", "system_note.py"]
"call.py" = ["catalog", "effort.py", "errors.py", "usage"]
"catalog" = ["compat", "pricing", "registry.py"]
"compat" = ["content.py"]
"context_budget.py" = ["catalog", "registry.py"]
"decision" = ["catalog", "pricing", "provider_api.py", "usage"]
"errors.py" = ["catalog", "factory.py"]
"factory.py" = ["catalog", "effort.py", "provider_api.py", "registry.py", "usage"]
"harness" = ["pricing"]
"provider_api.py" = ["catalog", "registry.py"]
"reasoning.py" = ["content.py"]
"registry.py" = ["pricing"]
"tests" = ["catalog", "effort.py", "factory.py", "pricing", "reasoning.py", "usage"]
"usage" = ["catalog", "content.py", "pricing", "reasoning.py"]

[external]
"factory.py" = "imports the module named by MEIVA_LLM_OVERRIDE"

[debt.ambient-read]
"call.py#random base.host.net.resilience.jittered" = { count = 1, owner = "#5816", until = "permanently: the retry delay is jittered so parallel callers do not retry in lockstep, and a shared source is what makes them queue" }
"factory.py#environ base.host.env.registry.process_environment" = { count = 1, owner = "#5816", until = "waits for its four callers to hand the environment: process_provider_keys(catalog) resolves API keys from the declared env registry, and its callers (meiva/boot.py, the labeler daemon, agent_host configuration, the verify scripts) all hold a boot or a config view to take the mapping from" }
