exports = ["configuration.py", "ids.py", "tests"]

[dynamic-attrs]
"configuration.py" = "_DynamicView is the structural type of the configuration view, which answers any domain name by forwarding to the live settings (base/config/_lite.py); a declaration with no body"

[purity]
"__init__.py" = "strict-to-be"
"configuration.py" = "strict"
"ids.py" = "strict"

[uses]
"configuration.py" = ["__init__.py"]
"ids.py" = []
"tests" = ["__init__.py", "configuration.py", "ids.py"]

[roots]
"__init__.py" = { kinds = ["clock"], why = "the wall clock's owner: every component that needs the time asks this module (Clock, Timers, SYSTEM_TIMERS), so the one read of the host clock happens here and nowhere below it. A caller can still hand in its own `Clock` — the constructor takes the `now` callable — but the default that other modules must not re-derive lives at this door" }

[debt.ambient-read]
"__init__.py#settings base.config.settings" = { count = 1, owner = "#5816", until = "permanently: clock_config_from_settings() is the door Clock.from_settings() uses for code that was handed no clock, and it is the fallback construction the clock lattice names (clock_lattice_cli.py); the read is the door itself, not a shortcut around it" }

[debt.impure-call]
"__init__.py#time.sleep" = { count = 1, owner = "#7240", until = "permanently: the wait belongs to the same SYSTEM_TIMERS value, and sleeping is an effect rather than a read of the clock (meizel/graph/ambient_process_table.py, the `time` table), so no [roots] kind covers it and this record is the clock door's own; a module that sleeps takes a Timers it was handed" }

[debt.impure-edge]
"__init__.py#base/config/__init__.py" = { count = 1, owner = "#7240", until = "waits for `ClockConfig` and its settings-derived construction to move to an owner `base/clock` may import directly: `base/config` may not import `base/clock` — its boot-lite layer resolves a clock before Settings exists and reads the host clock itself — so the one direction left is this edge, deferred into the function body so `base/clock` imports without Settings; the 102 `Clock.from_settings()` call sites (25 outside tests) are what the move costs, not a reason it cannot happen" }
