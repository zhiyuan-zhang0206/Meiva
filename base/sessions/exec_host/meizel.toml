exports = ["child_environment.py", "paths.py", "protocol.py", "tests"]

[uses]
"tests" = ["child_environment.py", "paths.py", "protocol.py"]

[purity]
"__init__.py" = "strict"
"child_environment.py" = "strict"

[roots]
"paths.py" = { kinds = ["pid"], why = "the fallback directory is `/tmp/meiva-exec-<uid>` (`os.getuid()`) and every process of the user must compute the same path; a caller-supplied uid would let two processes of one user disagree" }
