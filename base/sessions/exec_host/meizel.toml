exports = ["child_environment.py", "paths.py", "protocol.py", "tests"]

[uses]
"tests" = ["child_environment.py", "paths.py", "protocol.py"]

[purity]
"__init__.py" = "strict"
"child_environment.py" = "strict"

[debt.ambient-read]
"paths.py#pid os.getuid" = { count = 1, owner = "#5816", until = "permanently: the fallback directory is /tmp/meiva-exec-<uid> and every process of the user must compute the same path; a caller-supplied uid would let two processes of one user disagree" }
