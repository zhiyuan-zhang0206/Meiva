exports = ["allocation_freeze.py", "client.py", "closure.py", "keys.py", "paths.py", "process_groups.py", "protocol.py", "screen.py", "survivor_role.py", "tests"]

[uses]
"client.py" = ["closure.py", "paths.py", "protocol.py"]
"closure.py" = ["process_groups.py", "survivor_role.py"]
"screen.py" = ["paths.py"]
"tests" = ["allocation_freeze.py", "client.py", "closure.py", "keys.py", "paths.py", "process_groups.py", "protocol.py", "screen.py", "survivor_role.py"]

[purity]
"__init__.py" = "strict"
"keys.py" = "strict"
"survivor_role.py" = "strict"

[debt.ambient-read]
"paths.py#pid os.getuid" = { count = 1, owner = "#5816", until = "waits for nothing: the fallback directory is /tmp/meiva-pty-<uid> and every process of the user must compute the same path; a caller-supplied uid would let two processes of one user disagree" }
