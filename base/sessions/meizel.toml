exports = ["backend.py", "coding_session_owner.py", "coding_session_owner_record.py", "env_forwarding.py", "exec_host", "helper_chain_guard.py", "helperproc.py", "hosting.py", "log_writer.py", "page_session.py", "posixproc.py", "protocol.py", "provenance.py", "pty", "record.py", "tests", "tool_capabilities.py"]

[uses]
"backend.py" = ["env_forwarding.py", "helperproc.py", "posixproc.py", "protocol.py", "pty", "record.py"]
"coding_session_owner.py" = ["coding_session_owner_record.py"]
"helperproc.py" = ["env_forwarding.py", "protocol.py", "record.py"]
"hosting.py" = ["pty", "record.py"]
"log_writer.py" = ["log_prefix.py"]
"posixproc.py" = ["record.py"]
"protocol.py" = ["record.py"]
"pty" = ["posixproc.py", "record.py"]
"tests" = ["backend.py", "coding_session_owner.py", "coding_session_owner_record.py", "env_forwarding.py", "helper_chain_guard.py", "helperproc.py", "hosting.py", "log_prefix.py", "log_writer.py", "posixproc.py", "protocol.py", "pty", "record.py"]

[purity]
"__init__.py" = "strict"
"log_prefix.py" = "strict"
"log_writer.py" = { mode = "none", why = "writes a transcript's identity into the file that starts it: it opens the path exclusively (append when the file already exists), stamps the created file's own mtime, writes the bytes log_prefix.session_log_header renders, and hands the descriptor back; the line itself is decided in log_prefix.py" }
"provenance.py" = "strict"

[debt.ambient-read]
"coding_session_owner.py#pid os.getuid" = { count = 1, owner = "#5816", until = "waits for nothing: the socket directory is keyed by the uid that owns it so every session of the user computes the same path, and a caller-supplied uid would let one user's session address another's directory" }
"helperproc.py#settings base.config.settings" = { count = 1, owner = "#5816", until = "waits for a caller that holds the services config: _services_config() is read only inside helperproc (spawn_enabled, port) and the helper process builds no ConfigBoot of its own, so passing one in means giving the helper entry the boot it deliberately does not take" }
"hosting.py#pid psutil.Process()" = { count = 1, owner = "#5816", until = "waits for nothing: the lineage is this process's own (psutil.Process() plus its parents), and a caller handing in a pid list would describe a tree it is not in" }
