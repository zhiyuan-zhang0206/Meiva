exports = ["tests"]

[purity]
"." = "strict-to-be"
"allowlist.py" = "strict"
"owner_method.py" = "strict"
"scan.py" = "strict"
"task_owner.py" = "strict"
"task_owner_span.py" = "strict"
"thread_owner.py" = "strict"

[uses]
"__init__.py" = ["allowlist.py", "bundle.py", "scan.py"]
"bundle.py" = ["scan.py"]
"owner_method.py" = ["module.py"]
"scan.py" = ["allowlist.py", "module.py", "task_owner.py", "thread_owner.py"]
"task_owner.py" = ["module.py", "owner_method.py", "task_owner_span.py"]
"task_owner_span.py" = ["module.py", "owner_method.py"]
"tests" = ["__init__.py", "allowlist.py", "bundle.py", "owner_method.py"]
"thread_owner.py" = ["module.py", "owner_method.py"]

[debt.impure-call]
"__init__.py#Path.is_file" = 2
"__init__.py#Path.read_text" = 1
"bundle.py#Path.is_file" = 1
"bundle.py#Path.read_text" = 1
"module.py#Path.is_dir" = 1
"module.py#Path.is_file" = 1
"module.py#Path.read_text" = 1
"module.py#Path.stat" = 1
