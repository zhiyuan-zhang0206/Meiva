exports = ["fixtures.py", "no_script_sibling_imports.py", "path_imports.py", "scan.py"]

[uses]
"__init__.py" = ["purity.py", "scan_cache.py"]
"ambient.py" = ["fake_entropy.py", "patching.py"]
"no_script_sibling_imports.py" = ["script_siblings.py"]
"patching.py" = ["bindings.py", "fixtures.py", "purity.py", "python_commands.py", "restricted.py"]
"purity.py" = ["purity_structure.py"]
"python_commands.py" = ["restricted.py"]
"scan.py" = ["ambient.py", "bindings.py", "fixtures.py", "input_mutations.py", "mounts.py", "purity.py", "restricted.py", "typescript.py"]
"scan_cache.py" = ["fixtures.py", "input_mutations.py", "scan.py", "typescript.py"]
"tests" = ["fixtures.py", "input_mutations.py", "no_script_sibling_imports.py", "path_imports.py", "scan.py", "scan_cache.py", "script_siblings.py", "typescript.py"]
"typescript.py" = ["typescript_compiler"]
"typescript_compiler" = ["fixtures.py"]

[purity]
"." = "strict"
"bindings.py" = "strict"
"no_script_sibling_imports.py" = { mode = "none", why = "the command-line entry of the PYTHONSAFEPATH sibling-import guard: it enumerates the files a run judges, reads them, states which modules sit beside each one, and prints what the rule found; meizel/language/script_siblings.py decides script mode, guard order, sibling resolution and the repair" }
"path_imports.py" = "strict"
"purity.py" = "strict"
"scan.py" = "strict"
"script_siblings.py" = "strict"

[debt.ambient-read]
"no_script_sibling_imports.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
