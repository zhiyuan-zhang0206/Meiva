exports = ["clock_lattice.py", "clock_lattice_cli.py", "decisions.py"]

[uses]
"clock_lattice_cli.py" = ["clock_lattice.py"]
"tests" = ["clock_lattice.py", "decisions.py"]

[purity]
"." = "strict"
"clock_lattice.py" = "strict-to-be"
"clock_lattice_cli.py" = { mode = "none", why = "the command-line entry of the clock-lattice rule: it reads the roles this repository declares and hands the scan directories to the rule, which decides everything else" }
"decisions.py" = "strict-to-be"

[debt.impure-call]
"clock_lattice.py#Path.is_file" = 1
"clock_lattice.py#Path.resolve" = 1
"decisions.py#Path.is_file" = 1
"decisions.py#Path.resolve" = 1
