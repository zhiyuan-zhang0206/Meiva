exports = ["clock_lattice.py", "clock_lattice_cli.py", "decisions.py", "timing_judgement_cli.py"]

[uses]
"clock_lattice_cli.py" = ["clock_lattice.py"]
"timing_judgement_cli.py" = ["timing_judgement.py"]
"tests" = ["clock_lattice.py", "clock_lattice_cli.py", "decisions.py", "timing_judgement.py", "timing_judgement_cli.py"]

[purity]
"." = "strict"
"clock_lattice.py" = "strict"
"clock_lattice_cli.py" = { mode = "none", why = "the command-line entry of the clock-lattice rule: it reads the roles this repository declares, the policy, the family modules, the exempted files and the checkout's file set, and hands them to meizel/owners/clock_lattice.py, which decides everything else" }
"timing_judgement_cli.py" = { mode = "none", why = "the command-line entry of the timing-judgement rule: it finds the test files and reads the baseline, and meizel/owners/timing_judgement.py decides everything else" }
"decisions.py" = "strict"

[debt.ambient-read]
"clock_lattice_cli.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"timing_judgement_cli.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
