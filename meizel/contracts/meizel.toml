exports = ["analysis.py", "cli.py", "enumerations.py", "sync.py"]

[roots]
"cli.py" = { kinds = ["cwd"], why = "CLI composition root captures the working directory once for repository and relative-path inputs" }

[uses]
"ambient_read.py" = ["debt", "manifest.py", "policy.py"]
"analysis.py" = ["ambient_read.py", "debt", "enumerations.py", "ledger.py", "manifest.py", "policy.py", "rule.py"]
"bootstrap.py" = ["analysis.py", "debt", "manifest.py", "rule.py"]
"cli.py" = ["analysis.py", "bootstrap.py", "debt_carry.py", "debt_sites.py", "enumerations.py", "explain.py", "policy.py", "sync.py"]
"debt_carry.py" = ["debt", "debt_edit.py", "debt_report.py", "debt_rules.py", "debt_sites.py", "debt_symbol.py", "manifest.py", "rule.py"]
"debt_rules.py" = ["analysis.py", "debt", "debt_edit.py", "debt_report.py", "debt_symbol.py", "declare.py", "policy.py", "sync.py"]
"debt_symbol.py" = ["ambient_read.py", "analysis.py", "manifest.py", "policy.py"]
"debt_edit.py" = ["analysis.py", "debt", "ledger.py", "manifest.py"]
"debt_report.py" = ["debt", "debt_edit.py", "debt_sites.py", "manifest.py"]
"debt_sites.py" = ["ambient_read.py", "analysis.py", "debt", "manifest.py"]
"declare.py" = ["analysis.py", "manifest.py", "manifest_text.py", "rule.py"]
"explain.py" = ["analysis.py", "manifest.py"]
"ledger.py" = ["debt", "manifest.py"]
"manifest.py" = ["debt"]
"policy.py" = ["manifest.py"]
"rule.py" = ["debt", "manifest.py", "policy.py"]
"sync.py" = ["analysis.py", "debt_edit.py", "declare.py", "manifest.py", "manifest_text.py"]

[purity]
"." = "strict"
"ambient_read.py" = "strict"
"analysis.py" = "strict"
"cli.py" = "strict-to-be"
"debt_carry.py" = "strict"
"debt_edit.py" = "strict"
"debt_report.py" = "strict"
"debt_rules.py" = "strict"
"declare.py" = "strict"
"enumerations.py" = "strict"
"policy.py" = "strict"
"sync.py" = "strict"

[debt.impure-call]
"cli.py#Path.resolve" = 3
"cli.py#meizel.checkout.GitRepo" = 1

[debt.impure-edge]
"cli.py#meizel/checkout.py" = 1
