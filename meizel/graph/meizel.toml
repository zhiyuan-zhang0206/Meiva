exports = ["graphs.py", "imports.py", "model.py", "universe.py"]

[purity]
"." = "strict"
"ambient_judgments.py" = "strict"
"ambient_process_table.py" = "strict"
"ambient_surface.py" = "strict"
"graphs.py" = "strict"
"impacted.py" = "strict"
"imports.py" = "strict"
"model.py" = "strict"
"reachability.py" = "strict"
"scopes.py" = "strict"
"python_layout.py" = "strict"

[uses]
"ambient_judgments.py" = ["model.py"]
"ambient_process_table.py" = ["ambient_judgments.py"]
"ambient_surface.py" = ["ambient_judgments.py", "ambient_process_table.py", "model.py"]
"impacted.py" = ["scopes.py", "universe.py"]
"imports.py" = ["model.py", "scopes.py", "universe.py"]
"__init__.py" = ["ambient_surface.py", "impacted.py", "python_layout.py", "reachability.py"]
"tests" = ["ambient_judgments.py", "ambient_surface.py", "model.py"]
"reachability.py" = ["model.py", "universe.py"]
"universe.py" = ["python_layout.py"]
"python_layout.py" = ["model.py"]

[debt.restricted-python]
"scopes.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
