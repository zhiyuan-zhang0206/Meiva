exports = ["allowances.py", "budgets", "contracts", "graph", "language", "lint_common.py", "owners", "roles.py", "state", "tests"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"__main__.py" = "strict"

[uses]
"__main__.py" = ["contracts"]
"contracts" = ["allowances.py", "graph", "language", "roles.py"]
"language" = ["allowances.py", "graph", "lint_common.py"]
"lint_common.py" = ["__init__.py", "roles.py"]
"owners" = ["allowances.py", "lint_common.py", "roles.py"]
"roles.py" = ["graph"]
"state" = ["allowances.py", "lint_common.py", "roles.py"]
"tests" = ["allowances.py", "contracts", "graph", "language", "lint_common.py", "owners", "roles.py", "state"]

[debt.impure-call]
"allowances.py#Path.is_file" = 1
"allowances.py#Path.read_text" = 1
"lint_common.py#Path.exists" = 2
"lint_common.py#Path.is_dir" = 2
"lint_common.py#Path.is_file" = 2
"lint_common.py#Path.read_bytes" = 1
"lint_common.py#import subprocess" = 1
"roles.py#Path.read_text" = 1
