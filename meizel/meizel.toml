exports = ["__main__.py", "allowances.py", "budgets", "checkout.py", "contracts", "entry.py", "graph", "language", "lint_common.py", "owners", "roles.py", "source_text.py", "state", "test_graph", "tests"]

[uses]
"__init__.py" = ["graph"]
"__main__.py" = ["entry.py"]
"entry.py" = ["checkout.py", "contracts", "graph"]
"allowances.py" = ["checkout.py", "graph"]
"budgets" = ["checkout.py", "lint_common.py"]
"checkout.py" = ["graph", "roles.py", "test_graph"]
"contracts" = ["allowances.py", "graph", "language", "lint_common.py", "roles.py", "source_evidence", "test_graph"]
"language" = ["allowances.py", "checkout.py", "graph", "lint_common.py"]
"lint_common.py" = ["__init__.py", "checkout.py", "graph", "roles.py", "source_text.py"]
"owners" = ["allowances.py", "checkout.py", "lint_common.py", "roles.py"]
"roles.py" = ["graph"]
"source_evidence" = ["graph", "lint_common.py"]
"source_text.py" = []
"state" = ["allowances.py", "checkout.py", "lint_common.py", "roles.py"]
"test_graph" = ["roles.py"]
"tests" = ["allowances.py", "contracts", "entry.py", "graph", "language", "lint_common.py", "roles.py"]

[roots]
"__main__.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"entry.py" = { kinds = ["cwd", "clock", "platform"], why = "the process entry: when argv names no --repo it reads the working directory once and hands the resolved repository root down to the commands, it reads the day once for the placeholder `debt record` writes into an entry nobody has reviewed, and when argv names no --jobs it reads the processor count once and hands the worker count down, so that no command below decides how parallel it is" }

[purity]
"." = "strict-to-be"
"checkout.py" = { mode = "none", why = "the shell of the checkout: it runs git for a universe (ls-files, grep, merge-base, show), reads and writes the files a plan names, stages them, and removes the temporary checkout a comparison runs in; what a checkout contains, whether a name is a module, and which writes a command decided on are decided by graph/universe.py and the contracts modules that build an EditPlan" }
"__init__.py" = "strict"
"__main__.py" = { mode = "none", why = "the module entry: it runs the CLI and turns its return value into the process exit status, which is the whole of what it does" }
"allowances.py" = "strict-to-be"
"entry.py" = { mode = "none", why = "the process entry: it parses argv, asks where this installation and this checkout are, and builds the one GitRepo every command is handed; the commands below it take those values, so no decision module reads them again" }
"roles.py" = "strict"

[debt.impure-call]
"allowances.py#meizel.checkout.GitRepo" = { count = 1, owner = "#5921", until = "waits for the policy text or a reader as a value: allowances.load(root) has 17 call sites and none of them holds a GitRepo, so building one here repeats the same git call wherever it moved to" }
"lint_common.py#Path.is_dir" = { count = 1, owner = "#5921", until = "waits for a caller that already holds which targets exist: a lint's scan dirs and its explicit targets reach the tooling as strings — the SourceTree port that would carry them is tracked in #6026" }
"lint_common.py#Path.is_file" = { count = 1, owner = "#5921", until = "waits for a caller that already holds which of its targets are files: the admitted set is a list of names, not a stat per name — the SourceTree port that would carry it is tracked in #6026" }
"lint_common.py#Path.read_bytes" = { count = 1, owner = "#5921", until = "waits for the judged text as a value: rule modules hand the tooling a path, never the content they want judged — the SourceTree port that would carry it is tracked in #6026" }
"lint_common.py#Path.resolve" = { count = 1, owner = "#5921", until = "waits for resolved targets at the entry: argv arrives as it was typed, and the shell is where a target becomes a real path — the SourceTree port that would carry them is tracked in #6026" }
"lint_common.py#Path.rglob" = { count = 1, owner = "#5921", until = "waits for the listing as a value: a directory target outside the checkout has no admitted set, so it is walked here — the SourceTree port that would carry it is tracked in #6026" }
"lint_common.py#import subprocess" = { count = 1, owner = "#5921", until = "permanently: launching the TypeScript analyzer is what `run_node_analyzer()` is for — it owns the `node` command line, the 180s timeout and the 'install Node' error, and its one production caller (meizel/language/typescript_compiler/runtime.py) holds no better copy of any of them. Reopens if the analysis stops being an out-of-process program: an in-process analyzer, or a caller that arrives holding a runner (the shape `host.run` has), lets this function take the runner instead of spawning" }
"lint_common.py#os.path.lexists" = { count = 1, owner = "#5921", until = "waits for the caller to hold what pre-commit named: --only paths arrive as strings and a tracked symlink whose target is gone is still one of them — the SourceTree port that would carry the set is tracked in #6026" }

[debt.impure-edge]
"allowances.py#meizel/checkout.py" = { count = 1, owner = "#5921", until = "waits for the policy text as a value: the same reader as the GitRepo entry above, so the edge goes when the caller hands the policy in" }
"lint_common.py#meizel/checkout.py" = { count = 1, owner = "#5921", until = "waits for the tracked-file set as a value: the shell asks git once per run and hands the names down; every caller is a non-root module — tracked with the SourceTree port in #6026" }
