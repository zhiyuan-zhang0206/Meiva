[uses]
".agents" = ["base"]
"agent" = ["meiva", "base"]
"meiva" = ["base"]
"meiva_builtins" = ["agent", "meiva", "base", "services"]
"cli" = ["agent", "meiva", "base", "ops", "services"]
"conftest.py" = ["tests"]
"demos" = ["agent", "base"]
"gateway" = ["agent", "meiva", "meiva_builtins", "base", "ops", "services"]
"ops" = ["base"]
"schedules" = ["meiva", "base", "scripts"]
"scripts" = ["agent", "meiva", "base", "cli", "gateway", "meizel", "ops", "services"]
"services" = ["meiva", "base", "ops"]
"services/agent_runner/agent_host" = ["agent/db/__init__.py", "agent/graph/__init__.py", "agent/graph/claim/node.py", "agent/graph/claim/tests", "agent/graph/exec/_child_boundary.py", "agent/graph/exec/_result.py", "agent/graph/exec/_subprocess.py", "agent/graph/hooks/compact.py", "agent/graph/llm/node.py", "agent/graph/llm_errors.py", "agent/graph/node_log/__init__.py", "agent/graph/tests/cancel_fixture.py", "agent/graph/tests/test_llm_helpers.py", "agent/impersonation.py", "agent/impersonation_handoff.py", "agent/llm/__init__.py", "agent/messages/__init__.py", "agent/messages/guard.py", "agent/ownership/corpse_reap.py", "agent/ownership/hosted.py", "agent/ownership/inbound.py", "agent/ownership/tests/ownership_support.py", "agent/process_boot.py", "agent/startup/__init__.py", "agent/state.py", "agent/tests/agent_tests.py", "agent/tests/claim/test_inbound_ownership.py", "agent/turn/runloop.py", "agent/turn/trace_checkpoint.py", "base/lm/harness/bridge.py"]
"tests" = [".agents", "agent", "meiva", "meiva_builtins", "base", "cli", "gateway", "meizel", "ops", "schedules", "scripts", "services", "ui"]
[roles]
# The shipped packages: the wheel, the framework scans.
application = ["agent", "meiva", "meiva_builtins", "base", "cli", "gateway", "ops", "services"]
# Version-controlled runnable templates: Python that ships as files, not as packages.
templates = ["schedules"]
# Illustrative sources that are tracked but not shipped and not governed like the application.
examples = ["demos"]
# The repository's own tooling.
tooling = ["meizel", "scripts"]
tests = ["tests"]
# The user interface; its Python is a build helper.
frontend = ["ui"]

