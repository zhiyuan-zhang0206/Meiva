[uses]
".agents" = ["base"]
"agent" = ["meiva", "base"]
"meiva" = ["base"]
"meiva_builtins" = ["agent", "meiva", "base", "services"]
"cli" = ["agent", "meiva", "base", "ops", "services"]
"conftest.py" = ["tests"]
"demos" = ["agent", "base"]
"gateway" = ["agent", "meiva", "meiva_builtins", "base", "ops", "services"]
"ops" = ["base"]
"schedules" = ["meiva", "base", "scripts"]
"scripts" = ["agent", "meiva", "base", "cli", "gateway", "meizel", "ops", "services"]
"services" = ["meiva", "base", "ops"]
"services/agent_runner/exec_host/tests/test_startup_preserves_exec.py" = ["agent/execution/protocol.py", "agent/graph/exec/process.py", "agent/graph/exec/tests/process_inputs.py"]
"services/agent_runner/agent_host" = ["agent/db/__init__.py", "agent/graph/__init__.py", "agent/graph/claim/node.py", "agent/graph/claim/tests", "agent/graph/exec/process.py", "agent/graph/exec/tests/process_inputs.py", "agent/graph/hooks/compact.py", "agent/graph/llm/node.py", "agent/graph/llm_errors.py", "agent/graph/node_log/__init__.py", "agent/graph/tests/cancel_fixture.py", "agent/graph/tests/test_llm_helpers.py", "agent/impersonation.py", "agent/impersonation_handoff.py", "agent/llm/__init__.py", "agent/messages/__init__.py", "agent/messages/guard.py", "agent/ownership/corpse_reap.py", "agent/ownership/hosted.py", "agent/ownership/inbound.py", "agent/ownership/tests/ownership_support.py", "agent/process_boot.py", "agent/startup/__init__.py", "agent/state.py", "agent/tests/agent_tests.py", "agent/tests/claim/test_inbound_ownership.py", "agent/turn/runloop.py", "agent/turn/trace_checkpoint.py", "base/lm/harness/bridge.py"]
"tests" = [".agents", "agent", "meiva", "meiva_builtins", "base", "cli", "gateway", "meizel", "ops", "scripts", "services", "ui"]
[roles]
# The shipped packages: the wheel, the framework scans.
application = ["agent", "meiva", "meiva_builtins", "base", "cli", "gateway", "ops", "services"]
# Version-controlled runnable templates: Python that ships as files, not as packages.
templates = ["schedules"]
# Illustrative sources that are tracked but not shipped and not governed like the application.
examples = ["demos"]
# The repository's own tooling.
tooling = ["meizel", "scripts"]
tests = ["tests"]
# The user interface; its Python is a build helper.
frontend = ["ui"]

# meiva:note
# `base/sessions/pty/tests/pty_service.py` starts the pty daemon as a subprocess
# (`python -m services.agent_runner.pty_sessions.daemon`), so the edge is invisible to the import
# graph. Declaring it is not available: the only `[uses]` key that can name another package's file is
# this root table, and `base -> services` closes `base <-> services` (services already uses base) as
# `manifest-cycle`; a directory manifest may only name its own children, and the pty package's
# (base/sessions/pty) attempt is `manifest-unknown-child` for the same reason. The fixture's consumers
# are base's own pty tests, which must run the real service the `services` package owns, so repaying
# this needs a package move (the client's integration tests above both packages, or the daemon below
# base), not a declaration. Kept as recorded debt.

[debt.undeclared-edge]
"base/sessions/pty/tests/pty_service.py -> services/agent_runner/pty_sessions/daemon.py" = 1
