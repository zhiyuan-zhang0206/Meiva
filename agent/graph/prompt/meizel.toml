exports = ["capabilities.py", "compaction.py", "context_notes.py", "conversation.py", "live.py", "note_text.py", "sdk_scope.py", "skill_selection.py", "system_prompt.py"]

[uses]
"capabilities.py" = ["sdk_scope.py", "skill_selection.py"]
"_codeact.py" = ["live.py"]
"context_notes.py" = ["live.py", "note_text.py", "skill_selection.py"]
"conversation.py" = ["live.py"]
"live.py" = ["capabilities.py", "sdk_scope.py", "skill_selection.py"]
"skill_selection.py" = ["sdk_scope.py"]
"system_prompt.py" = ["_base_prompt.py", "_codeact.py", "capabilities.py", "conversation.py", "live.py", "sdk_scope.py"]

[purity]
"__init__.py" = "strict"
"capabilities.py" = "strict"
"compaction.py" = "strict"
"note_text.py" = "strict"
"sdk_scope.py" = "strict"
"skill_selection.py" = "strict"

[roots]
"context_notes.py" = { kinds = ["home"], why = "agent_id_note creates the agent workspace through base.paths.workspace_dir, whose home argument still defaults to the ambient Meiva home until the base lane makes it required" }
