"tests" = ["__init__.py", "_attach_drain.py", "_attach_merge.py", "_callbacks.py", "_init_context.py", "_shared.py", "agent_traceback.py", "claim", "exec", "hooks", "interrupt.py", "llm", "llm_errors.py", "node_log.py", "prompt", "recall"]
