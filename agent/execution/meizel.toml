exports = ["agent_traceback.py", "child.py", "protocol.py"]

[uses]
"child.py" = ["agent_traceback.py", "delivery_plan.py", "protocol.py"]
"delivery_plan.py" = ["result_kind.py"]
"protocol.py" = ["result_kind.py"]
"tests" = ["child.py", "delivery_plan.py", "protocol.py", "result_kind.py"]

[external]
"child.py" = "executes the agent-authored code of one execute_code call"

[purity]
"__init__.py" = "strict"
"agent_traceback.py" = "strict"
"delivery_plan.py" = "strict"
"result_kind.py" = "strict"

[roots]
"child.py" = { kinds = ["environ", "pid", "settings"], why = "the exec child reads its per-launch protocol env (MEIVA_EXEC_REQUEST_FILE / MEIVA_EXEC_RESULT_FILE, one-shot spawn handoff), records its own PID for the watchdog, and pops the re-emitted per-agent overlay maps before child spawn — the same child-env handoff class as agent/loop.py's pop; Isolated agent execution process boots configuration before constructing its context" }

[debt.ambient-read]
"protocol.py#clock time.time" = 1
"protocol.py#random uuid.uuid4" = 2
