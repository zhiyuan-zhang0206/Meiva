exports = ["bootstrap.py", "harness_probe.py", "harness_rows.py", "machine_pause.py", "monitor", "ops_dispatch.py", "process_boot.py", "roster", "router.py", "server.py", "status.py"]

[uses]
"harness_probe.py" = ["ops_dispatch.py", "schemas.py"]
"harness_rows.py" = ["schemas.py"]
"machine_pause.py" = ["schemas.py"]
"monitor" = ["schemas.py"]
"roster" = ["schemas.py"]
"router.py" = ["admin_events_plan.py", "harness_probe.py", "harness_rows.py", "ops_dispatch.py", "roster", "schemas.py", "status.py"]
"server.py" = ["process_boot.py", "serve_plan.py"]
"status.py" = ["_health.py", "monitor", "roster", "schemas.py"]
"tests" = ["admin_events_plan.py", "bootstrap.py", "harness_rows.py", "monitor", "roster", "serve_plan.py", "status.py"]

[purity]
"__init__.py" = "strict"
"admin_events_plan.py" = "strict"
"harness_rows.py" = "strict"
"schemas.py" = "strict"
"serve_plan.py" = "strict"

[roots]
"server.py" = { kinds = ["pid"], why = "gateway process root writes its own OS PID to the gateway pidfile for supervisor healthchecks" }

[debt.ambient-read]
"status.py#environ base.host.env.registry.process_environment" = 1
