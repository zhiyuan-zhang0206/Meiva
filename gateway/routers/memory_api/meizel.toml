exports = ["memory.py", "memory_plan.py"]

[uses]
"memory.py" = ["memory_plan.py"]

[purity]
"memory_plan.py" = "strict"

[debt.ambient-read]
"memory.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `_build_pool_bundle` to take the parent of its scratch directory from its caller: it creates it where TMPDIR points" }
"memory.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `_build_pool_bundle` to take the parent of its scratch directory from its caller: it creates it under a random name wherever TMPDIR points" }
