exports = ["memory.py", "memory_plan.py"]

[uses]
"memory.py" = ["memory_plan.py"]

[purity]
"memory_plan.py" = "strict"

[debt.ambient-read]
"memory.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: `_build_pool_bundle` writes the git bundle into a scratch file and reads it straight back as bytes; the one path its caller holds is `memory_root`, the checkout the bundle is taken from, and a bundle written inside that working tree would dirty the repository it packages — the route streams the bytes and never needs the file" }
"memory.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: the bundle file's name is minted by the OS inside that one-shot directory so two concurrent downloads cannot overwrite each other; `get_memory_pool` returns the bytes with the pool's HEAD sha, and never the name" }
