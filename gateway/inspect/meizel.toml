"_metrics.py" = ["_metrics_health.py", "schemas.py"]
"_metrics_health.py" = ["_coverage.py", "schemas.py"]
"_plugin_metrics.py" = ["_event_metrics.py", "_plugin_faces.py", "schemas.py"]
