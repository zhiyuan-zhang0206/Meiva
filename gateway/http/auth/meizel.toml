exports = ["rejection_log.py", "request_principal.py", "router.py", "session_store.py", "webhook.py"]

[uses]
"rejection_log.py" = ["rejection_policy.py"]
"request_principal.py" = ["session_store.py"]
"router.py" = ["request_principal.py", "session_store.py"]
"tests" = ["rejection_policy.py", "request_principal.py", "session_store.py"]
"webhook.py" = ["request_principal.py"]

[purity]
"__init__.py" = "strict"
"rejection_policy.py" = "strict"

[roots]
"request_principal.py" = { kinds = ["random"], why = "SessionKeys.key generates the cluster session HMAC secret on first login" }
