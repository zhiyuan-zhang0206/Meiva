exports = ["agents", "alerts", "app.py", "cluster", "events", "http", "mcp_server", "record_activity.py", "schedules", "tests"]

[uses]
"__main__.py" = ["app.py"]
"agents" = ["http", "inspect", "message_admission", "record_activity.py", "schemas"]
"alerts" = ["http", "routers", "schemas"]
"app.py" = ["agents", "alerts", "cluster", "events", "extensions", "http", "inspect", "mcp_server", "routers", "schedules", "schemas", "upload_delivery"]
"cluster" = ["agents", "alerts", "events", "http", "lgtm", "routers", "schemas"]
"events" = ["agents", "http", "lgtm"]
"extensions" = ["agents", "cluster", "http"]
"http" = ["schemas"]
"inspect" = ["http", "schemas"]
"mcp_server" = ["http"]
"message_admission" = ["http", "record_activity.py"]
"record_activity.py" = ["http"]
"routers" = ["agents", "http", "schemas"]
"schedules" = ["agents", "http", "routers"]
"tests" = ["agents", "alerts", "app.py", "cluster", "events", "extensions", "http", "lgtm", "routers", "schedules", "schemas", "upload_delivery"]
"upload_delivery" = ["agents", "http", "message_admission"]

[purity]
"__init__.py" = "strict"

[roots]
"app.py" = { kinds = ["clock", "home", "pid", "platform", "random", "settings"], why = "Gateway process and cold schema entry compose their configuration, request clock, account home, this process and entropy here; builds the host of this process with Host.system() and hands the runtime monitor the psutil process it samples" }
