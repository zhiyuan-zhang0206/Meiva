exports = ["agents", "alerts", "app.py", "cluster", "events", "http", "mcp_server", "schedules", "tests"]

[uses]
"__main__.py" = ["app.py"]
"agents" = ["http", "inspect", "schemas"]
"alerts" = ["events", "http"]
"app.py" = ["agents", "alerts", "cluster", "events", "extensions", "http", "inspect", "lgtm", "mcp_server", "routers", "schedules", "upload_delivery"]
"cluster" = ["agents", "events", "http", "schemas"]
"events" = ["agents", "http"]
"extensions" = ["agents", "cluster", "http"]
"http" = ["schemas"]
"inspect" = ["http", "lgtm", "schemas"]
"mcp_server" = ["http"]
"routers" = ["agents", "extensions", "http", "lgtm", "schemas"]
"schedules" = ["agents", "http", "routers"]
"tests" = ["agents", "app.py", "cluster", "events", "extensions", "http", "lgtm", "routers", "schedules", "schemas", "upload_delivery"]
"upload_delivery" = ["agents", "http", "routers"]

[purity]
"__init__.py" = "strict"

[roots]
"app.py" = { kinds = ["clock", "home", "platform", "random", "settings"], why = "Gateway process and cold schema entry compose their configuration, request clock, account home and entropy here; builds the host of this process with Host.system()" }
