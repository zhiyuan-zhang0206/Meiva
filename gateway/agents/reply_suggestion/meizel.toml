exports = ["configuration.py", "router.py"]

[uses]
"configuration.py" = ["service.py"]
"router.py" = ["schemas.py", "service.py"]
"service.py" = ["excerpt.py", "schemas.py"]
"tests" = ["configuration.py", "excerpt.py", "router.py", "schemas.py", "service.py"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"excerpt.py" = "strict"
"schemas.py" = "strict"

[debt.impure-call]
"router.py#async def post_reply_suggestion" = 1
"router.py#import fastapi" = 2
"service.py#async def _draft" = 1
"service.py#async def _gate_and_draft" = 1
"service.py#async def _useful_reply_probability" = 1
"service.py#async def suggest" = 1

[debt.impure-edge]
"configuration.py#base/config/__init__.py" = 1
"configuration.py#base/db/__init__.py" = 1
"configuration.py#base/host/env/agent_slices.py" = 1
"configuration.py#base/lm/decision/call.py" = 1
"configuration.py#gateway/agents/history/timeline.py" = 1
"configuration.py#ops/agents/__init__.py" = 1
"router.py#gateway/agents/eval_guard.py" = 1
"router.py#gateway/http/disconnect.py" = 1
"router.py#gateway/http/middleware/error_envelope.py" = 1
"service.py#base/lm/call.py" = 1
"service.py#base/lm/errors.py" = 1
"service.py#base/log/__init__.py" = 1
