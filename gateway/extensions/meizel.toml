exports = ["inventory.py", "notification_categories.py", "packages.py", "plugin_ui.py", "registry.py", "skills.py", "ui_contributions.py"]

[uses]
"inventory.py" = ["inventory_matrix.py", "schemas.py"]
"inventory_matrix.py" = ["schemas.py"]
"skills.py" = ["schemas.py"]
"tests" = ["inventory_matrix.py", "schemas.py", "skills.py"]
"ui_contributions.py" = ["schemas.py"]

[purity]
"__init__.py" = "strict"
"inventory_matrix.py" = "strict"
"schemas.py" = "strict"

[debt.ambient-read]
"registry.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
