exports = ["inventory.py", "notification_categories.py", "packages.py", "plugin_ui.py", "registry.py", "skills.py", "ui_contributions.py"]

[uses]
"inventory.py" = ["inventory_matrix.py", "schemas.py"]
"inventory_matrix.py" = ["schemas.py"]
"skills.py" = ["schemas.py"]
"tests" = ["inventory_matrix.py", "schemas.py", "skills.py"]
"ui_contributions.py" = ["schemas.py"]

[purity]
"__init__.py" = "strict"
"inventory_matrix.py" = "strict"
"schemas.py" = "strict"

[debt.ambient-read]
"registry.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `put_extension` to take the parent of its scratch directory from its caller: it creates it where TMPDIR points" }
"registry.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `put_extension` to take the parent of its scratch directory from its caller: it creates it under a random name wherever TMPDIR points" }
