exports = ["inventory.py", "notification_categories.py", "packages.py", "plugin_ui.py", "registry.py", "skills.py", "ui_contributions.py"]

[uses]
"inventory.py" = ["inventory_matrix.py", "schemas.py"]
"inventory_matrix.py" = ["schemas.py"]
"skills.py" = ["schemas.py"]
"tests" = ["inventory_matrix.py", "schemas.py", "skills.py"]
"ui_contributions.py" = ["schemas.py"]

[purity]
"__init__.py" = "strict"
"inventory_matrix.py" = "strict"
"schemas.py" = "strict"

[debt.ambient-read]
"registry.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `put_extension` unpacks a request's archive into a scratch tree only so `register_tree` can walk it into a content-addressed blob before the tree is removed; nothing moves out of it, and the gateway's composition root (`app.py`) hands a route a pool and the frozen `GatewayConfig` the app was built with — a per-request scratch root would be a second temp policy no configuration field carries" }
"registry.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: the tree's name is minted by the OS so two uploads in flight cannot collide; the response carries the content hash and the tree is deleted on the way out, so no caller ever reads the name" }
