[roots]
"aggregate.py" = { kinds = ["clock"], why = "CLI entry passes current UTC timestamp into main()" }
"collect.py" = { kinds = ["clock", "db", "environ", "home", "settings"], why = "CLI entry snapshots its environment for the ConfigBoot it builds the gateway access from, constructs cluster DB handle, resolves the Meiva home once and passes current UTC timestamp into CollectFacts" }
"daily_scan.py" = { kinds = ["settings"], why = "CLI entry reads self_evolution_coverage_alert_floor from settings in process_env()" }
"evaluate.py" = { kinds = ["clock", "home", "random"], why = "Skill evaluation driver stamps evaluation runs with UTC time, generates spawn idempotency keys, and resolves the Meiva home for the evaluation dataset root it prepares and reads" }
"mine.py" = { kinds = ["clock", "home"], why = "CLI entry passes current UTC timestamp and the Meiva home it resolves into main() for default dataset resolution" }

[purity]
"audit.py" = "strict"
"events_window.py" = "strict"
"label.py" = "strict"
"record.py" = "strict"
"record_inputs.py" = "strict"
"scan_report.py" = "strict"
"window_records.py" = "strict"
