exports = ["feed.py"]

[uses]
"feed.py" = ["transcribe.py"]
"yt_run.py" = []

[purity]
"transcribe_plan.py" = "strict"
"yt_plan.py" = "strict"
"yt_post.py" = "strict"
"yt_wire.py" = "strict"

[roots]
"transcribe.py" = { kinds = ["settings", "argv", "environ", "random"], why = "Transcription subprocess reads configuration and argv at entry and creates a uniquely named scratch directory" }
"feed.py" = { kinds = ["home", "pid", "clock"], why = "the entry an agent imports (`import feed`, then `sync`/`fetch`/`resolve_source`): no in-repo caller hands it a home, and it is the only place that knows where this machine keeps a channel's mirror ($MEIVA_HOME/state/mirrors/youtube), which no caller of an agent's code cell can supply; it names its own interpreter (sys.executable) for the command it builds, and it stamps a fetched post with this host's clock, which that same caller has no way to hand down -- a test pins the stamp by building its own `YoutubeConfig`" }
