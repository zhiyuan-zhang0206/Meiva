exports = ["feed.py"]

[purity]
"yt_plan.py" = "strict"
"yt_post.py" = "strict"
"yt_wire.py" = "strict"

[roots]
"feed.py" = { kinds = ["home", "pid"], why = "the entry an agent imports (`import feed`, then `sync`/`fetch`/`resolve_source`): no in-repo caller hands it a home, and it is the only place that knows where this machine keeps a channel's mirror ($MEIVA_HOME/state/mirrors/youtube), which no caller of an agent's code cell can supply; it also names its own interpreter (sys.executable) for the command it builds" }
"yt_run.py" = { kinds = ["clock", "environ"], why = "YouTube sync runner stamps fetched items with current UTC time and creates scratch space under the temporary directory (TMPDIR)" }

[debt.ambient-read]
"yt_run.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for nothing that can arrive: `fetch_transcript` names the scratch directory it hands `yt-dlp` for one caption track and reads the `.vtt` back out of it; the name is minted by the OS so two fetches in one process cannot write over each other, and the skill's entry (`feed.py`) hands `yt_run` a `YoutubeConfig` — the `yt-dlp` name, the audio-transcribe command and the mirror root, never a directory to write in" }
