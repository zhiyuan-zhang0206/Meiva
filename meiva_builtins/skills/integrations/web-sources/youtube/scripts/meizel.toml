exports = ["feed.py"]

[uses]
"feed.py" = ["transcribe.py"]

[purity]
"transcribe_plan.py" = "strict"
"yt_plan.py" = "strict"
"yt_post.py" = "strict"
"yt_wire.py" = "strict"

[roots]
"transcribe.py" = { kinds = ["settings", "argv", "environ", "random"], why = "Transcription subprocess reads configuration and argv at entry and creates a uniquely named scratch directory" }
"feed.py" = { kinds = ["home", "pid"], why = "the entry an agent imports (`import feed`, then `sync`/`fetch`/`resolve_source`): no in-repo caller hands it a home, and it is the only place that knows where this machine keeps a channel's mirror ($MEIVA_HOME/state/mirrors/youtube), which no caller of an agent's code cell can supply; it also names its own interpreter (sys.executable) for the command it builds" }

[debt.ambient-read]
"yt_run.py#clock datetime.datetime.now" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: a fetched post is stamped with the instant the fetch happened, and the skill's entry (`feed.py`) builds `YoutubeConfig` — the `yt-dlp` name, the transcription command and the mirror root — before that instant exists, so a clock field on the config would be a parameter whose only legal value is this process's own wall clock, read at the moment the post is saved" }
"yt_run.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `fetch_transcript` hands `yt-dlp` a scratch directory for one caption track and reads the `.vtt` back out of it, so the directory is this process's own temporary space — `feed.py` passes a `YoutubeConfig`, never a directory, and the same file already records the random name it is created under for the same reason" }
"yt_run.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `fetch_transcript` names the scratch directory it hands `yt-dlp` for one caption track and reads the `.vtt` back out of it; the name is minted by the OS so two fetches in one process cannot write over each other, and the skill's entry (`feed.py`) hands `yt_run` a `YoutubeConfig` — the `yt-dlp` name, the transcription command and the mirror root, never a directory to write in" }
