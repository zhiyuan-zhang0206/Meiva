exports = ["webscrape.py"]

[purity]
"scrape_ladder.py" = "strict"
"scrape_post.py" = "strict"
"scrape_wire.py" = "strict"

[roots]
"webscrape.py" = { kinds = ["clock", "environ"], why = "Web-scrape CLI entry reads ScrapeConfig from process environment and stamps fetched posts with UTC time" }

[debt.ambient-read]
"webscrape.py#home base.paths.home.resolve_meiva_home" = 1
"webscrape.py#home pathlib.Path.expanduser" = 1
