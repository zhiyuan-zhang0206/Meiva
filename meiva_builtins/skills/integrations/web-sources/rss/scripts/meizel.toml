exports = ["feed.py"]

[purity]
"rss_plan.py" = "strict"
"rss_post.py" = "strict"

[roots]
"feed.py" = { kinds = ["clock", "environ", "home"], why = "The command entry builds its scrape configuration from the process environment, resolves the Meiva home for the default mirror directory and stamps fetched posts with UTC time" }
