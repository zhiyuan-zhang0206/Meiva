exports = ["feed.py"]

[purity]
"rss_plan.py" = "strict"
"rss_post.py" = "strict"

[roots]
"feed.py" = { kinds = ["environ"], why = "The command entry builds its scrape configuration from the process environment before invoking run" }

[debt.ambient-read]
"feed.py#clock datetime.datetime.now" = 1
"feed.py#clock time.time" = 1

[debt.type-cast]
"feed.py#cast _read_post" = 1
"rss_post.py#cast parse_feed" = 1
