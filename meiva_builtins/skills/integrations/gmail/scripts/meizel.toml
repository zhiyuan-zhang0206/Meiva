exports = ["feed.py"]

[purity]
"gmail_auth.py" = "strict"
"gmail_compose.py" = "strict"
"gmail_headers.py" = "strict"
"gmail_queries.py" = "strict"
"gmail_wire.py" = "strict"

[roots]
"feed.py" = { kinds = ["environ"], why = "The script entry assembles Process and AuthSources from the process environment before invoking the command" }

[debt.ambient-read]
"feed.py#clock time.time" = 1
"feed.py#home pathlib.Path.home" = 1
"imap.py#clock datetime.datetime.now" = 1
"smtp.py#clock time.time" = 1

[debt.any-collaborator]
"feed.py#any _run.return" = 1
