exports = ["default_config.py", "inspector.py", "metrics.py", "plugin.py", "task_registry.py", "tests"]

[uses]
"agent_runtime.py" = ["default_config.py"]
"plugin.py" = ["task_registry.py"]
"services.py" = ["default_config.py"]
"task_maintenance" = ["default_config.py"]
"task_registry.py" = ["_task_assignment.py", "_task_creation_receipts.py", "_task_receipts.py", "_task_publication.py", "_task_requests.py", "_task_update.py", "default_config.py"]
"tests" = ["_task_creation_receipts.py", "_task_requests.py", "_task_update.py", "agent_runtime.py", "default_config.py", "plugin.py", "services.py", "task_maintenance", "task_registry.py"]

[purity]
"_task_publication.py" = "strict"
"__init__.py" = "strict"
"_task_requests.py" = "strict"

[roots]
"_task_update.py" = { kinds = ["clock"], why = "Task update helper stamps appended task log entries with current UTC time" }
"plugin.py" = { kinds = ["clock", "random"], why = "SDK notice entry points compute expiration deadlines against current UTC time and generate idempotency keys" }
"task_registry.py" = { kinds = ["bus"], why = "Task registry SDK entry points publish live board refresh events after committing task changes" }
