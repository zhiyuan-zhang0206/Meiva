exports = ["daemon.py", "routing.py", "tests"]

[uses]
"daemon.py" = ["escalation.py", "routing.py"]
"escalation.py" = ["routing.py"]
"tests" = ["daemon.py", "escalation.py", "routing.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "bus", "home", "pid", "random", "settings"], why = "Service or operator process entry boots configuration, resolves the Meiva home once, builds the random generator its event bus draws retry jitter from, and hands the bus the process timers its ACL-transition retry measures its window on" }
