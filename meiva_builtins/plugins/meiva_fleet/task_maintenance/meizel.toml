exports = ["daemon.py", "routing.py", "tests"]

[uses]
"daemon.py" = ["escalation.py", "routing.py"]
"escalation.py" = ["routing.py"]
"tests" = ["daemon.py", "escalation.py", "routing.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["endpoints", "bus", "home", "pid", "random", "settings"], why = "Service or operator process entry boots configuration, resolves the Meiva home once, and builds the random generator its event bus draws retry jitter from" }

[debt.ambient-read]
"routing.py#settings base.packages.plugins.flags.read_declared_flag" = 1
