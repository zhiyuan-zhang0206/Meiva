exports = ["runner.py"]

[purity]
"__init__.py" = "strict"
"credentials.py" = "strict"
"default_config.py" = "strict"
"formatters.py" = "strict"
"parsers.py" = "strict"
"plugin.py" = "strict"
"schedules.py" = "strict"
"types.py" = "strict"
"ui_stats.py" = "strict"

[uses]
"credentials.py" = ["types.py"]
"formatters.py" = ["types.py"]
"parsers.py" = ["types.py"]
"probes" = ["credentials.py", "default_config.py", "formatters.py", "parsers.py", "types.py"]
"runner.py" = ["default_config.py", "probes", "types.py"]
"schedules.py" = ["default_config.py"]
"tests" = ["credentials.py", "default_config.py", "formatters.py", "parsers.py", "plugin.py", "probes", "runner.py", "schedules.py", "types.py", "ui_stats.py"]
"ui_stats.py" = ["default_config.py"]

[roots]
"runner.py" = { kinds = ["clock", "environ", "home", "platform"], why = "Schedule runner entrypoint for meiva_usage collectors: reads local clock, platform, home and process environment to execute usage probes" }

[debt.restricted-python]
"default_config.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
