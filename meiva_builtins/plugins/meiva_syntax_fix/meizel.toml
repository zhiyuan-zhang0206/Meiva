exports = ["metrics.py"]

[uses]
"_escapes.py" = ["_punct.py"]
"_imports.py" = ["_ruff.py", "_ruff_plan.py"]
"_llm_repair.py" = ["_repair_text.py"]
"_ruff.py" = ["_ruff_plan.py", "_ruff_run.py"]
"_ruff_run.py" = ["_ruff_plan.py"]
"agent_runtime.py" = ["_deterministic_fixes.py", "_escapes.py", "_imports.py", "_llm_repair.py", "_punct.py", "_repair_text.py", "_ruff.py", "_ruff_plan.py", "_ruff_run.py"]
"tests" = ["_deterministic_fixes.py", "_escapes.py", "_imports.py", "_llm_repair.py", "_punct.py", "_repair_text.py", "_ruff.py", "_ruff_plan.py", "_ruff_run.py", "agent_runtime.py"]

[external]
"_deterministic_fixes.py" = "the syntax repairer's oracle: compiles agent-authored code"
"_llm_repair.py" = "the syntax repairer's oracle: compiles agent-authored code"
"agent_runtime.py" = "the syntax repairer's oracle: compiles agent-authored code"

[purity]
"__init__.py" = "strict"
"_escapes.py" = "strict"
"_punct.py" = "strict"
"_repair_text.py" = "strict"
"_ruff_plan.py" = "strict"
"plugin.py" = "strict"

[debt.ambient-read]
"_ruff_run.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
