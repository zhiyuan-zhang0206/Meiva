exports = ["metrics.py"]

[uses]
"agent_runtime.py" = ["_state.py", "inherit.py", "notes.py", "write_checks.py"]
"inherit.py" = ["inherited_blocks.py"]
"plugin.py" = ["sdk.py", "written_notes.py"]
"services.py" = ["default_config.py"]
"skills" = ["pool_ops.py"]
"tests" = ["agent_runtime.py", "default_config.py", "inherit.py", "inherited_blocks.py", "notes.py", "plugin.py", "pool_ops.py", "sdk.py", "services.py", "setup.py", "skills", "template", "written_notes.py"]
"write_checks.py" = ["template"]
"written_notes.py" = ["agent_runtime.py", "sdk.py"]

[purity]
"__init__.py" = "strict"
"_state.py" = "strict"
"inherited_blocks.py" = "strict"

[roots]
"pool_ops.py" = { kinds = ["environ"], why = "Memory pool helper resolves MEIVA_MACHINE_NAME from process environment before falling back to home .env" }

[debt.ambient-read]
"agent_runtime.py#home base.paths.memory_dir" = 2
"agent_runtime.py#home base.paths.workspace_dir" = 1
"inherit.py#home base.paths.workspace_dir_readonly" = 1
"notes.py#home base.paths.memory_dir" = 1
"notes.py#home base.paths.workspace_dir" = 1
"sdk.py#home base.paths.workspace_dir" = 1
"setup.py#home base.paths.gateway_memory_dir" = 1
"setup.py#home base.paths.memory_dir" = 1
"written_notes.py#home base.paths.workspace_dir" = 1
