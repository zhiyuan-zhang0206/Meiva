exports = ["metrics.py"]

[uses]
"agent_runtime.py" = ["_state.py", "inheritance", "notes.py", "write_checks.py"]
"plugin.py" = ["sdk.py", "written_notes.py"]
"service_declaration" = ["default_config.py"]
"services.py" = ["service_declaration"]
"skills" = ["pool_ops.py"]
"tests" = ["agent_runtime.py", "default_config.py", "inheritance", "notes.py", "plugin.py", "pool_ops.py", "sdk.py", "services.py", "setup.py", "skills", "template", "written_notes.py"]
"write_checks.py" = ["template"]
"written_notes.py" = ["agent_runtime.py", "sdk.py"]

[purity]
"__init__.py" = "strict"
"_state.py" = "strict"

[debt.restricted-python]
"sdk.py#module __getattr__" = { count = 1, owner = "#6082", until = "waits for the lazy re-export to import its fixed names explicitly: the module serves a few names written in the source, so none of them is known only at run time" }
