# OTel Collector sidecar — one per machine, the ONLY OTLP entry Meiva agents see.
#
# Generated at converge from this template (cli/commands/observability/otel_collector.py):
# the dollar placeholders below are baked from this unit's settings, so the file
# is static at runtime — no env substitution dependency on the session env.
#
# Architecture: every agent process sends OTLP/HTTP to its local
# 127.0.0.1:4318 receiver. On a gateway/single-box collector the pipelines fan
# out to Tempo/Loki/Prometheus — loopback by default, or the remote observatory
# station's endpoints when MEIVA_OBSERVABILITY_URL is set (two-state render,
# task #1791). A pure runner keeps the same exporter
# component IDs and queues but points them at the gateway collector's separate,
# authenticated remote receiver; the gateway then fans those batches into its
# loopback backends. Backend ports never need an off-box bind.
# Every exporter uses a bounded in-memory sending queue (a collector
# restart drops what was queued) and rejects the newest batch immediately when
# its queue is full, bounds each send attempt to 5s, and retries for at
# most 15m before dropping with collector failure metrics. Cumulative metrics
# repair on a later successful sample. Traces are telemetry: they are lossy by
# design and have no local copy or replay path; Tempo is their only store.
#
# The sidecar also scrapes the traditional SRE layer (issue #46) into the same
# metrics fan-out: `host_metrics` on every machine, plus `postgresql` + `redis`
# against this cluster's OWN data plane on a gateway-capable unit (a pure
# agent-runner dials the gateway's pg/redis remotely, so scraping from there
# would only duplicate the gateway's series — those two receivers are omitted
# from a runner's rendered config entirely).
receivers:
  otlp:
    # OTLP/HTTP only — every Meiva producer speaks OTLP/HTTP
    # (base/telemetry/otlp/telemetry_otlp.py rejects non-http schemes);
    # no dead gRPC receiver.
    # The receiver endpoint is baked from MEIVA_TELEMETRY_OTLP_PORT at converge
    # (default 127.0.0.1:4318 — the standard OTLP port; single source in
    # base/config/domains/observability/settings.py, task #1945).
    protocols:
      http:
        endpoint: $OTLP_RECEIVER_ENDPOINT
$REMOTE_OTLP_RECEIVER
$HARNESS_OTLP_RECEIVER

  # ── The traditional SRE layer (issue #46) ────────────────────────────────
  # Host metrics come from the collector's own receiver, not a node_exporter
  # sidecar: the contrib distribution is already pinned and supervised here, so
  # this is zero additional binaries. Prometheus is then the ONE time-series
  # store for host data — there is no second retained history anywhere (the
  # status surfaces keep a live one-shot psutil reading and nothing more).
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          # system.cpu.time is a per-core cumulative counter in 8 states; the
          # utilization ratio is what an operator reads and what the alert
          # rules evaluate, so only that one is enabled.
          system.cpu.time:
            enabled: false
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      # Swap/pageout gauges. macOS keeps swap as a self-growing pool of files on
      # the data volume, so swap used (and the page-out rate) is the memory
      # signal the Grafana host rules read; this replaces the ssh-sampling swap
      # watchers on the Macs. Per-fault counters are left off: they are high
      # rate and nothing reads them.
      paging:
        metrics:
          system.paging.usage:
            enabled: true
          system.paging.operations:
            enabled: true
          system.paging.faults:
            enabled: false
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        # Synthetic mounts carry no operator signal and dominate the series
        # count on macOS (a dozen /System/Volumes/* entries). What survives is
        # the real root volume plus, on macOS, the data volume that actually
        # holds $MEIVA_HOME — the two the disk watermark alert is about.
        exclude_fs_types:
          fs_types: [autofs, devfs, nullfs, overlay, squashfs, tmpfs]
          match_type: strict
        exclude_mount_points:
          mount_points:
            - /dev
            - /private/var/vm
            - /System/Volumes/Hardware
            - /System/Volumes/iSCPreboot
            - /System/Volumes/Preboot
            - /System/Volumes/Update
            - /System/Volumes/VM
            - /System/Volumes/xarts
          match_type: strict
      network:
        # macOS carries ~30 virtual interfaces (awdl/llw/utun/bridge/anpi/…)
        # and each one multiplies four per-direction counters: unfiltered, the
        # network scraper alone was 248 of this machine's ~350 series and none
        # of them describes a link an operator can act on. Physical + tunnel
        # interfaces survive; on Linux the exclusion list simply matches
        # nothing.
        # (the doubled dollar is the string.Template escape for a literal
        # end-anchor — this file goes through Template.substitute at converge.)
        exclude:
          interfaces:
            ["^(awdl|llw|utun|bridge|gif|stf|ap|anpi|p2p|vmenet|XHC)[0-9]*$$"]
          match_type: regexp

  # Collector queue depth/capacity and enqueue/send failure counters are part
  # of the delivery contract, not debug-only internals. Scrape the pinned
  # collector's loopback Prometheus endpoint and relay the cumulative evidence
  # with the rest of this host's infra metrics. When the relay is down the next
  # successful scrape still carries monotone enqueue-failure counters.
  prometheus/otelcol:
    config:
      scrape_configs:
        - job_name: meiva-otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: [${SELF_METRICS_HOST}:$SELF_METRICS_PORT]

  # ── Session-log tailing ───────────────────────────────────────────────────
  # Agent shell transcripts and service stdout use separate, disjoint
  # receivers. Agent main logs are banner-only here and are deliberately
  # absent: their identical prefixes collide under filelog's content
  # fingerprinting, while their structured records already arrive over OTLP.
  # start_at: end = no backfill; offsets persist in file_storage/logoffsets so
  # a restart does not re-read.
  #
  # The 30s poll interval cuts discovery churn 150x versus the filelog
  # default of 200ms (raised from 10s on 2026-09-14, task #3290: enumeration
  # CPU scales with poll frequency over this large logs directory). A positive
  # archive count lets EOF files reuse their metadata instead of creating a
  # reader every poll, while the concurrent-file cap bounds the discovery set.
  # At 30s the 50-poll archive window is ~25 min (was ~8.3 min at the 10s
  # cadence): the longer reuse window is kept deliberately - fewer
  # rediscoveries.
  filelog/sessions:
    include:
      - $MEIVA_HOME/logs/meiva-agent-*-shell-*.out.log
    start_at: end
    include_file_name: true
    include_file_path: false
    storage: file_storage/logoffsets
    poll_interval: 30s
    polls_to_archive: 50
    max_concurrent_files: 200
  filelog/services:
    include:
      - $MEIVA_HOME/logs/*.out.log
    # Exclude all agent output so this receiver cannot overlap the shell-only
    # receiver. The collector's own stdout is excluded to prevent exported log
    # diagnostics feeding back into the collector.
    exclude:
      - $MEIVA_HOME/logs/meiva-agent-*.out.log
      - $MEIVA_HOME/logs/meiva-otel-collector.out.log
    start_at: end
    include_file_name: true
    include_file_path: false
    storage: file_storage/logoffsets
    poll_interval: 30s
    polls_to_archive: 50
    max_concurrent_files: 200
$DATA_PLANE_RECEIVERS
$CONNECTORS

processors:
  # The native exporters do not gate every diagnostic field (e.g. raw API
  # errors). Apply an allowlist before any writes to disk or upstream relays.
  redaction/harness:
    summary: silent
    allowed_keys:
      - service.name
      - service.version
      - service.instance.id
      - deployment.environment
      - cluster
      - host.name
      - meiva.machine
      - meiva.agent_id
      - harness
      - event.kind
      - event.sequence
      - duration_ms
      - duration.ms
      - latency_ms
      - status_code
      - http.response.status_code
      - error.type
      - error_class
      - error_name
      - error_category
      - success
      - model
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.operation.name
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - input_tokens
      - output_tokens
      - cache_read_tokens
      - cache_creation_tokens
      - cached_tokens
      - reasoning_tokens
      - type
      - tool_use_id
      - gen_ai.tool.call.id
      - interaction.sequence
      - parent.source
      - span.type
      - thread.id
      - turn.id
      - session.id
  # The redaction allowlist covers attributes. OTLP also has independent
  # fields for free text, span links and metric exemplars.
  transform/harness_payload:
    error_mode: propagate
    log_statements:
      - set(scope.name, "harness")
      - set(scope.version, "")
      - set(log.event_name, "harness event")
      - >-
        set(log.event_name, Concat(["claude_code.", log.attributes["event.name"]], ""))
        where resource.attributes["service.name"] == "claude-code" and
        IsMatch(log.attributes["event.name"], "^(user_prompt|assistant_response|api_request|api_error|tool_result|tool_decision|internal_error|session_start|managed_settings_resolved|plugin_loaded|mcp_server_connection)$$")
      - set(log.body, log.event_name)
      - set(log.severity_text, "")
    trace_statements:
      - context: span
        statements:
          - set(scope.name, "harness")
          - set(scope.version, "")
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - set(span.links, nil)
          - set(span.name, "harness.operation") where not IsMatch(span.name, "^(claude_code[.](interaction|llm_request|llm_request[.]attempt|tool|tool[.]execution|tool[.]blocked_on_user)|turn/start|turn/steer|thread/start|thread/resume|run_turn|agent_turn|app_server[.]request)$$")
      - context: spanevent
        statements:
          - set(spanevent.name, "harness event")
    metric_statements:
      - context: metric
        statements:
          - set(scope.name, "harness")
          - set(scope.version, "")
          - set(metric.description, "")
      - context: datapoint
        statements:
          - set(datapoint.exemplars, nil) where metric.type != METRIC_DATA_TYPE_SUMMARY
  # memory_limiter runs FIRST in every pipeline: under memory pressure it
  # returns retryable backpressure and bounds shedding instead of letting the
  # collector balloon on a 16GB shared box.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # The LGTM host accepts legacy records without a cluster dimension, but a
  # co-located home that reaches its local receiver must never pollute this
  # cluster's backends. Keep memory_limiter first; reject mismatches second.
  filter/cluster_allow:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
    metrics:
      metric:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
    logs:
      log_record:
        - 'resource.attributes["cluster"] != nil and resource.attributes["cluster"] != "$CLUSTER_LABEL"'
  # Stamp origin identity on data collected locally. Remote pipelines preserve
  # the resource identity the sending collector already attached.
  resource/meiva_machine:
    attributes:
      - key: meiva.machine
        value: $MACHINE_NAME
        action: upsert
  # Loki keeps resource labels under their normalized names. Copy the roster
  # identity here to expose the same `machine` selector as Prometheus.
  resource/loki_machine:
    attributes:
      - key: machine
        from_attribute: meiva.machine
        action: upsert
  transform/metric_machine:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["machine"], resource.attributes["meiva.machine"])
  # Session-log labeling (filelog receivers; per-file
  # service label): service.name <- the file's session name (strip .out.log),
  # guarded so event logs (no log.file.name) pass through untouched.
  transform/filelog_service:
    log_statements:
      - context: log
        conditions:
          - attributes["log.file.name"] != nil
        statements:
          - set(attributes["tmp_svc"], attributes["log.file.name"])
          - replace_pattern(attributes["tmp_svc"], "\\.out\\.log$$", "")
          - set(resource.attributes["service.name"], attributes["tmp_svc"])
          - delete_key(attributes, "tmp_svc")
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

  # The infra pipeline detects the physical host and exposes it separately
  # from the roster identity. Prometheus needs these names on datapoints,
  # because unpromoted resource attributes are only available in target_info.
  resource_detection/host:
    detectors: [system]
    system:
      hostname_sources: [os]
  # Prometheus's OTLP receiver derives `job` from service.name; without one the
  # infra series would land under a synthesized unknown_service job. Pinning it
  # makes `{job="meiva-infra"}` the one selector for everything on this layer.
  resource/infra:
    attributes:
      - key: service.name
        value: meiva-infra
        action: upsert
  transform/host_label:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["host.name"], resource.attributes["host.name"])
          # Interim fix (2026-08-28, #1818): postgresqlreceiver keys its rows by
          # resource attributes; Prometheus 3.x's OTLP receiver keeps resource
          # attrs out of series labels (they land in target_info), so all index
          # rows collapse into one series -> "duplicate sample" 400 -> whole
          # infra batch dropped. Copy the distinguishing dims to datapoints.
          - set(attributes["postgresql.database.name"], resource.attributes["postgresql.database.name"]) where resource.attributes["postgresql.database.name"] != nil
          - set(attributes["postgresql.table.name"], resource.attributes["postgresql.table.name"]) where resource.attributes["postgresql.table.name"] != nil
          - set(attributes["postgresql.index.name"], resource.attributes["postgresql.index.name"]) where resource.attributes["postgresql.index.name"] != nil
  # Loki can promote OTLP resource attributes, not log attributes. Copy the
  # bounded event dimensions before the logs exporter; service rows keep no
  # agent_id label instead of minting an empty stream dimension.
  transform/promote_event_labels:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["agent_id"], attributes["agent_id"]) where attributes["agent_id"] != nil
          - set(resource.attributes["event_name"], attributes["event_name"]) where attributes["event_name"] != nil

extensions:
  file_storage/logoffsets:
    directory: $MEIVA_HOME/otel-collector/log-offsets
    create_directory: true
$CLUSTER_AUTH_EXTENSION

exporters:
$OTLP_EXPORTERS

service:
  telemetry:
    # Task #1978: keep exporter retry notices out of service stdout.
    logs: { level: warn }
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: $SELF_METRICS_HOST
                port: $SELF_METRICS_PORT
  extensions: [file_storage/logoffsets$CLUSTER_AUTH_SERVICE_EXTENSION]
  pipelines:
$HARNESS_OTLP_PIPELINES
$DATA_PLANE_PIPELINES
    traces:
      receivers: [otlp$HARNESS_OTLP_FORWARD]
      processors: [memory_limiter, filter/cluster_allow, resource/meiva_machine, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp$HARNESS_OTLP_FORWARD, filelog/sessions, filelog/services]
      processors:
        - memory_limiter
        - filter/cluster_allow
        - resource/meiva_machine
        - resource/loki_machine
        - transform/promote_event_labels
        - transform/filelog_service
        - batch
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp$HARNESS_OTLP_FORWARD]
      processors: [memory_limiter, filter/cluster_allow, resource/meiva_machine, transform/metric_machine, batch]
      exporters: [otlphttp/prometheus]
    # Infra receivers also need OS detection and data-plane dimensions.
    metrics/infra:
      receivers: [host_metrics, prometheus/otelcol$DATA_PLANE_PIPELINE_RECEIVERS]
      processors:
        [
          memory_limiter,
          resource_detection/host,
          resource/infra,
          resource/meiva_machine,
          transform/metric_machine,
          transform/host_label,
          batch,
        ]
      exporters: [otlphttp/prometheus]
$REMOTE_OTLP_PIPELINES
