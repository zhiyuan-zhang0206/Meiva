# Native alerts use the authenticated gateway webhook. Retired direct receivers are tombstoned.
apiVersion: 1
contactPoints:
- orgId: 1
  name: meiva-alerts-webhook
  receivers:
  - uid: meiva-alerts-webhook
    type: webhook
    disableResolveMessage: false
    settings:
      url: $__env{MEIVA_ALERTS_WEBHOOK_URL}
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $__env{MEIVA_ALERTS_WEBHOOK_TOKEN}
policies:
- orgId: 1
  receiver: meiva-alerts-webhook
  group_by:
  - alertname
  matchers: []
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - attributes_check
      - '='
      - gateway_liveness
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - health_probe_silent
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - root_unit_restart_attempts_exhausted
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 4h
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - alert_pipeline_watchdog
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 5m
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - alert_pipeline_silent
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 1h
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - severity
      - '='
      - critical
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 1m
    repeat_interval: 1h
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - alertname
      - =~
      - .+
    group_by:
    - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
deleteContactPoints:
- orgId: 1
  uid: meiva-alerts-telegram
