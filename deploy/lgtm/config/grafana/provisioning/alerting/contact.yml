# Alert state lives in Grafana. The one receiver here is the gateway webhook, which keeps nothing:
# a firing watchdog alert refreshes the heartbeat the alert-pipeline dead-man rule reads, and every
# other alert is acknowledged and dropped. To notify an agent, add the agent receiver of
# `contact.agent.example.yml` as a site policy. Retired direct receivers are tombstoned.
apiVersion: 1
contactPoints:
- orgId: 1
  name: meiva-alerts-webhook
  receivers:
  - uid: meiva-alerts-webhook
    type: webhook
    disableResolveMessage: false
    settings:
      url: $__env{MEIVA_ALERTS_WEBHOOK_URL}
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $__env{MEIVA_ALERTS_WEBHOOK_TOKEN}
policies:
- orgId: 1
  receiver: meiva-alerts-webhook
  group_by:
  - alertname
  matchers: []
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - alert_pipeline_watchdog
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    # Alertmanager only re-sends on a group_interval tick once repeat_interval has elapsed; with the
    # two equal, a tick landing just short of 5m skips a beat (measured 600 s in production). A 1m
    # tick keeps the heartbeat at five to six minutes.
    group_interval: 1m
    repeat_interval: 5m
deleteContactPoints:
- orgId: 1
  uid: meiva-alerts-telegram
