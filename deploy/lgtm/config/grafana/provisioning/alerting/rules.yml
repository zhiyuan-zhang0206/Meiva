      # ── meiva-ops-delivery-stalled: replaces services/wake/delivery_watchdog/daemon.py _DeployWindowGate (deploy-window hold + settle window, MEIVA_DELIVERY_WATCHDOG_ALERT_GRACE_SECONDS). The per-row event itself is unchanged; this rule is its Grafana notification path (the event had no per-event rule, only the >50/10m backlog rule). ──
      - uid: meiva-ops-delivery-stalled
        title: "Chat delivery stalled (delivery_stalled event)"
        condition: D
        for: 1m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-delivery-stalled
          metric: delivery_stalled
          team: meiva-ops
        annotations:
          summary: "Chat delivery to agent {{ $labels.agent_id }} is stalled ({{ $values.C }} stalled inbound(s) in 3m, oldest {{ $values.F }}s)"
          description: >-
            The delivery watchdog emits one delivery_stalled event per chat inbound that stayed pending past
            MEIVA_DELIVERY_WATCHDOG_THRESHOLD_SECONDS (120s) while its owner is idling or terminated (lost
            pub/sub wake or a claim loop that is not running). System notifications are excluded for every
            owner: measured 2026-10-22, 229 of 229 notices that sat 1-24h were enqueued inside a runtime
            restart window - the host was gone, so nothing could claim them - and notices were 85% of the
            whole long tail. This rule changed in SCOPE, not sensitivity: the 600s+ tail caused by a real
            lost wake is still reported per agent, and meiva-ops-delivery-stalled-backlog stays as the
            fleet-wide volume rule. Deploy windows are silenced upstream by the fleet-update silence, so a
            resume's claim tail does not page.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (agent_id) (count_over_time({service_name="unknown_service",
                event_name="delivery_stalled"} | json | cluster=".meiva" | category="telemetry" [3m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 180
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: E
            datasourceUid: loki
            queryType: ""
            model:
              refId: E
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (agent_id) (max_over_time({service_name="unknown_service",
                event_name="delivery_stalled"} | json | cluster=".meiva" | category="telemetry"
                | unwrap attributes_age_s [3m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 180
              to: 0
          - refId: F
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: F
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: E
              reducer: max
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
