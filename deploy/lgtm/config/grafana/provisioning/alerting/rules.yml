      # ── R22: scheduled recovery proof failure (Prometheus state gauge) ──
      # One failed isolated restore means the recovery path cannot presently
      # be trusted. The backup scheduler persists the latest outcome on disk and
      # publishes `meiva_recovery_drill_status_last_run_ok_ratio` (1=ok, 0=failed)
      # per drill so recovery resolves on the next evaluation instead of lingering.
      - uid: meiva-ops-recovery-drill-failed
        title: "Scheduled recovery drill failed"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
