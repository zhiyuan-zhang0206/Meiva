        annotations:
          summary: "machine {{ $labels.attributes_machine }} stopped 20+ minutes with no maintenance window"
          description: >-
            {{ $labels.attributes_machine }} announced an intentional `meiva stop` more than 20 minutes ago
            ({{ $values.C }} reports in the last 2m) and declared no `--maintenance-for` window, so either
            it was forgotten or the window expired. The cluster is alive and this rule runs inside it;
            `meiva cluster status` shows the roster, and `meiva start` on that host clears the stop.
            A whole-stack stop (gateway, database and this rule all down) is the external probe's job,
            not this rule's.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_machine) (count_over_time({service_name="unknown_service",
                event_name="machine_stopped_too_long"} | json | cluster=".meiva" | category="telemetry"
                [2m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 120
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
