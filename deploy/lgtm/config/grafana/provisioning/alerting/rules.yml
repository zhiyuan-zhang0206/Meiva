      # meiva:note
      # `llm_turn_aborted` is the end state after retries; `llm_provider_error` only matches 429 and
      # billing rejections, so every PERMANENT rejection (400/401/403/404/422) ended a turn with
      # nothing watching. A separate rule rather than widening that one: its two rules carry the
      # vendor grouping and the 429/billing split this one must not disturb. Grouped by agent so each
      # alert names the agent whose turn was lost; an event without an agent id (emitted before the
      # call site passed one) renders as "unknown". An abort the host attributes to an operator's
      # stop or restart (`cause="planned_restart"`, a release wave cutting the turn's CLI) is left
      # out: the user ruled release interruptions not a problem. An abort without a cause still alerts.
      - uid: meiva-ops-llm-turn-aborted
        title: "LLM turn aborted after retries"
        condition: D
