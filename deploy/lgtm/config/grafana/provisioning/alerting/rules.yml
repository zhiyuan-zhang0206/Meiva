          description: >-
            The gateway's liveness pass (every ~60s) failed its status_probe of agent-runner {{
            $labels.attributes_machine }} on every pass for at least 3 minutes (machine_probe_failed events,
            payload consecutive_failures). Normal recovery (restart, brief network blip) stays under the 3
            minute grace window. Escalates to the error rule at 10 minutes. A paused machine (`meiva cluster
            pause`) is not probed and cannot fire this. Graded by what the host was carrying when it went
            quiet (task #5520): a host that reports agent_count 0 and carries no service role is a laptop
            that left the room, not an outage; a missing agent_count counts as carrying, never as zero.
