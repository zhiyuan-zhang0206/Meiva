          team: meiva-ops
        annotations:
          summary: 'Tempo trace backend unreachable - up{job="tempo"}=0 for 1h (trace store down)'
          description: 'The Tempo trace store scrape has failed for over an hour. On the observability station, run meiva observability status and inspect the Tempo unit log at $MEIVA_HOME/run/meiva-root/logs/tempo/output.log. Check for listener conflicts or unavailable storage. Verify recovery with up{job="tempo"}=1 and a trace query through the Grafana Tempo datasource.'
        data:
