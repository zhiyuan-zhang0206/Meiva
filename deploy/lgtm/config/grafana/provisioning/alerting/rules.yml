                    params: [C]

      # ── meiva-ops-delivery-stranded-wake: the delivery watchdog's stranded-wake fallback (services/wake/delivery_watchdog/stranded_wake.py) woke a terminated owner for work its dying incarnation never claimed. Each event is one recovered loss, so a single occurrence fires (for: 0m): this is the only notification path for an automatic wake, including one that revives an owner a user had just killed. ──
      - uid: meiva-ops-delivery-stranded-wake
        title: "Stranded wake revived a terminated owner (delivery_stranded_wake)"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-delivery-stranded-wake
          metric: delivery_stranded_wake
          team: meiva-ops
        annotations:
          summary: "Agent {{ $labels.agent_id }} woken for stranded inbound {{ $values.F }} (delivery_stranded_wake)"
          description: >-
            A message reached agent {{ $labels.agent_id }} while it was still alive but dying, so the
            delivery-time auto-resurrect skipped it and no live consumer ever claimed it. The delivery
            watchdog's fallback loop woke the owner for it (inbound {{ $values.F }}), throttled to one
            attempt per owner per MEIVA_DELIVERY_WATCHDOG_STRANDED_WAKE_COOLDOWN_SECONDS and bounded by
            the 24h dead-letter clock. One occurrence is already a delivery defect worth looking at: the
            paired delivery_stalled alert reports the stall, and this one reports that the system had to
            revive a corpse for it. A burst across many agents means a delivery-path regression, not a
            one-off race.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (agent_id) (count_over_time({service_name="unknown_service",
                event_name="delivery_stranded_wake"} | json | cluster=".meiva" | category="telemetry" [10m]))
