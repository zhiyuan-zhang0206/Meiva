          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R27: alert-pipeline watchdog (synthetic, always firing) ──
      # meiva:note
      # The heartbeat half of the alert path's dead-man switch. It fires on every evaluation
      # with no condition on real traffic, so its webhook POST keeps refreshing the
      # `alerts_last_ingest_timestamp_seconds` gauge (the gateway counts each one it accepts)
      # whether or not anything is wrong. R28 reads the age of that gauge: a broken webhook
      # path (a rotated token the gateway rejects, a stopped gateway) stops the refresh, and
      # absence becomes an event instead of looking like a quiet night.
      - uid: meiva-ops-alert-pipeline-watchdog
        title: "Alert pipeline watchdog (synthetic heartbeat)"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-alert-pipeline-watchdog
          metric: alert_pipeline_watchdog
          notify_im: "false"
          team: meiva-ops
        annotations:
          summary: "Alert pipeline watchdog heartbeat"
          description: >-
            Synthetic heartbeat. Its only job is to walk the whole delivery path
            (Grafana -> webhook -> gateway -> heartbeat gauge) every evaluation so R28 can
            tell "the pipeline is silent" from "nothing happened". Never act on this
            alert itself.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: vector(1)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R28: alert pipeline silent (the watchdog stopped arriving) ──
      # meiva:note
      # The dead-man half. It reads the gauge R27 refreshes on every accepted webhook, so the
      # judgment is on a metric derived from the delivery itself (`time() - gauge`), not on how
      # many alerts happened to fire: a quiet night cannot trip it, and a rotated webhook token
      # or a misrouted contact point does. 900s = three watchdog periods (R27's route repeats at
      # 5m); the `for: 5m` keeps one dropped POST from firing it.
      #
      # `noDataState: OK` is deliberate. The gauge rides the gateway's own OTLP push, so a
      # stopped gateway takes its gauge with it and this query returns nothing; absence then says
      # nothing about the webhook path (a dead gateway is `meiva-ops-gateway-metrics-silent`'s
      # job), and reading it as an alert here would page on every collector restart and during
      # the first minutes of a fresh install, before any heartbeat has been accepted. The price
      # is a series lost for longer than the 5m lookback staying silent until the next accepted
      # POST re-establishes it; a gauge that never appears at all is the host sentinel's job
      # (task #6220).
      - uid: meiva-ops-alert-pipeline-silent
        title: "Alert pipeline silent (webhook ingest stopped)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-alert-pipeline-silent
          metric: alert_pipeline_silent
          team: meiva-ops
        annotations:
          summary: "No watchdog heartbeat has reached the gateway for 15 minutes"
          description: >-
            The synthetic watchdog's last accepted webhook is older than 900s. The
            delivery path is broken somewhere between Grafana and the gateway —
            a rotated webhook token the gateway rejects, or a contact point routed
            somewhere the gateway does not answer. Every other rule is silent for the
            same reason, which is why the external host sentinel remains a separate observer. A gateway
            that stopped entirely is `meiva-ops-gateway-metrics-silent`'s report, not
            this one's.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: time() - max(meiva_alerts_last_ingest_timestamp_seconds)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [900]
                  operator:
                    type: and
                  query:
                    params: [C]
