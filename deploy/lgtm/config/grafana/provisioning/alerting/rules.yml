            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_machine) (count_over_time({service_name="unknown_service",
                event_name="machine_agent_host_down"} | json | cluster=".meiva" | category="telemetry" |
                (attributes_carries_service = "true" or attributes_agent_count > 0 or
