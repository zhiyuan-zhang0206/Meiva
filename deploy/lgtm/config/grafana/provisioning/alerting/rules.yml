                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── meiva-ops-agent-host-down: a machine whose ops server answers while its agent host is dead ──
      # The liveness pass emits `machine_agent_host_down` every pass in which the status_probe
      # succeeded but the machine reported its agent host as not running. The probe rules above
      # cannot see it (the probe succeeded) and an announced stop is out of the target set, so
      # a half-up machine, where no agent can run, was silent. The event repeats every pass;
      # the debounce is the pair `for: 3m` with a [2m] window (the same as the offline-warning rule):
      # one pass leaves the window non-empty for only two evaluations, so it takes three
      # consecutive passes to fire and a rollout restart of the host (shorter) never does. The
      # window must stay shorter than `for`, or a single event would fire it. The same load grading
      # as the offline rules leaves out a machine that carries nothing. It resolves when the
      # host process is back and the stream goes idle.
      - uid: meiva-ops-agent-host-down
