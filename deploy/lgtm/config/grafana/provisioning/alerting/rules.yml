      # ── meiva-ops-machine-stopped-too-long: a host announced `meiva stop` and nobody started it again (task #5464) ──
      # The heartbeat's liveness pass emits `machine_stopped_too_long` per host once its
      # announced stop is older than 20 minutes (MACHINE_STOPPED_TOO_LONG_S in
      # base/agents/observation/evidence.py: a four-host sequential restart measured 14
      # minutes) and no `--maintenance-for` window is still ahead. The 2026-10-14 stack sat
      # stopped for 53 minutes with nothing reporting it: the probe rules cannot see it
      # (an intentionally stopped host is out of the probe target set), so this rule closes
      # that gap. A paused or staging host is excluded at the source. The event repeats every
      # pass while the host stays down, so a 2m window and no pending period is the whole
      # debounce; the alert resolves when the host comes back and the stream goes idle.
      - uid: meiva-ops-machine-stopped-too-long
        title: "Machine stopped 20+ minutes (not started again)"
        condition: D
        for: 0m
