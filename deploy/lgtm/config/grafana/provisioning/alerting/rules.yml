                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
