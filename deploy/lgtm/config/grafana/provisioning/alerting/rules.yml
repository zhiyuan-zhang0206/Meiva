          summary: "agent {{ with $labels.agent_id }}{{ . }}{{ else }}unknown{{ end }}: an exec child survived the grace period and was SIGKILLed ({{ $values.C }} in 15m)"
          description: >-
            A child process outlived the signal grace period and was SIGKILLed
            (exec_subprocess_killed): it may have left partial output behind. `attributes_pid` and
            `attributes_grace` name the process and the grace it was given. Repeated hits on one
            workload point at a shutdown path that ignores SIGTERM.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (agent_id) (count_over_time({event_name="exec_subprocess_killed"}
                | json | cluster=".meiva" | category="telemetry" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── meiva-ops-root-diagnostic-browser-reach: replaces MEIVA_BROWSER_REACH_FAILURE_THRESHOLD (default 3) gating the root_diagnostic episode log ──
      # Evaluated in the 1m fast group so 3 samples at 300s cadence inside a 15m window always have
      # multiple evaluation ticks while all 3 samples are simultaneously in range.
      - uid: meiva-ops-root-diagnostic-browser-reach
        title: "Root browser-reach diagnostic failing"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-root-diagnostic-browser-reach
          metric: root_diagnostic_browser_reach
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }}: Root browser-reach diagnostic failing on 3+ consecutive probes ({{ $values.C }} in 15m)"
          description: >-
            The browser canary (CDP page fetch of the gateway URL) failed while the host baseline succeeded,
            or its prerequisite was unavailable, on at least three samples in fifteen minutes. The sample
            cadence is browser_reach_probe_interval_s (default 300s), so three samples span ~10 minutes
            within the 15m window. Inspect the root_diagnostic event detail (canary vs host-path result).
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (machine) (count_over_time({service_name="unknown_service", event_name="root_diagnostic"} | json |
                cluster=".meiva" | category="telemetry" | attributes_diagnostic="browser-reach" |
                attributes_verdict=~"down|unavailable|port-taken" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [C]

      # Aggregate terminal evaluation failures into one alert per station.
      # Five minutes keeps each increment visible across evaluations and scrapes.
      - uid: meiva-ops-grafana-rule-evaluation-failed
        title: "Grafana alert rule evaluation failed"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: Error
        labels:
          severity: error
          ruleUID: meiva-ops-grafana-rule-evaluation-failed
          metric: grafana_alerting_rule_evaluation_failures_total
          team: meiva-ops
        annotations:
          summary: "Grafana recorded alert rule evaluation failures"
          description: >-
            At least one rule evaluation failed after Grafana's retries. Inspect rule
            health and the Grafana alerting logs to find the rules and data sources
            affected.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(grafana_alerting_rule_evaluation_failures_total{job="grafana"}[5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Platform watchers → rules (R9 watch-plane migration) ──
      # Free bytes on the volume that holds $MEIVA_HOME ("/" on Linux, "/System/Volumes/Data"
      # on macOS, where "/" reports the same container and is folded in by `min by (machine)`).
      # The utilization watermarks above judge a fraction; on a 228 GiB Mac 90% is 23 GiB left,
      # on a 2 TB disk it is 200 GiB, so the fraction cannot say "the machine is about to run
      # out". The macmini and company-mini ssh watchers (#112 #115 #116 #118 #119 #156 #159 and
      # the launchd disk watchers) all reduced to this one number; 20 GiB is the highest line
      # they carried (company-mini d20, macmini disk-rapid 20 GiB); the 8-day replay crosses it
      # only on the real incidents (company-mini 11-18, min 11.6 GiB; macmini 11-20, min 16.7 GiB). On macOS the swap pool lives
      # on this volume, so a growing pool already shows up here as lost free space.
      - uid: meiva-ops-host-disk-free-low
        title: "Data volume free space below 20 GiB"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-disk-free-low
          metric: host_disk_free
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} has {{ $values.C }} GiB free on its data volume (threshold 20)"
          description: >-
            The data volume on {{ $labels.machine }} has {{ $values.C }} GiB free for 5
            minutes. Find the consumer first (Grafana /grafana/d/meiva-ops-main, "Host &
            data plane"; on macOS also the swap pool: `sysctl vm.swapusage`), then prune
            or move it. The critical tier fires below 10 GiB.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"}) / 2^30, 0.1)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [20]
                  operator:
                    type: and
                  query:
                    params: [C]

      # The brake line: macmini's disk17 guard braked at 10 GiB and reclaimed at 5 GiB, and
      # below 10 GiB a build or a swap-pool growth step can finish the volume within minutes.
      # The reclaim action itself stays with its owner; only the trigger moved here.
      - uid: meiva-ops-host-disk-free-critical
        title: "Data volume free space below 10 GiB"
        condition: D
        for: 2m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: meiva-ops-host-disk-free-critical
          metric: host_disk_free
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} has {{ $values.C }} GiB free on its data volume (critical threshold 10)"
          description: >-
            The data volume on {{ $labels.machine }} is down to {{ $values.C }} GiB
            free. Writes fail below zero, and on macOS a growing swap pool takes space
            from the same volume. Free space now: stop the heaviest writer or remove
            rebuildable caches.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"}) / 2^30, 0.1)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: [C]

      # One concept: hours until the volume is empty at the last hour's drain. It only exists
      # while the volume lost more than 8 GiB in the last hour (company-mini's tier-1 trigger,
      # #156), so a large idle disk and ordinary churn stay silent. Replayed on 8 days of
      # Prometheus history (2026-11-17 to 11-24): it fires on the company-mini 15 GiB/h drop of
      # 11-18 20:02 and on macbook-air's 17 GiB/h drop of 11-19 07:24, and on ubuntu's nightly
      # ~03:20 dip while ubuntu had only ~50 GiB free (it has 160 GiB+ now, which keeps the
      # projected time above 6 h).
      - uid: meiva-ops-host-disk-draining
        title: "Data volume will be full within 6 hours at the current drain"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-disk-draining
          metric: host_disk_draining
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} data volume is full in {{ $values.C }} h at the current drain"
          description: >-
            The data volume on {{ $labels.machine }} lost more than 8 GiB in the last
            hour and, at that rate, is empty in {{ $values.C }} hours. Find what is
            writing before the static free-space tiers (20 GiB, 10 GiB) fire.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(
                  min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"})
                  / (min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"} offset 1h) - min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"}))
                  and on (machine) (min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"} offset 1h) - min by (machine) (system_filesystem_usage_bytes{machine!="", state="free", mountpoint=~"/|/System/Volumes/Data"})) > 8 * 2^30,
                  0.1
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 3900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [6]
                  operator:
                    type: and
                  query:
                    params: [C]

      # Swap actually in use, from `system_paging_usage_bytes` (state used/free). The agent host
      # of each machine reports it from `psutil.swap_memory()`; the collector's host_metrics
      # paging scraper is left disabled because on macOS it reads 0 (gopsutil's
      # VirtualMemory never fills the swap fields there), so there is one source on every OS.
      # The series is the scraper's own metric name, so a later upstream fix changes the source
      # and no rule. Two tiers on the absolute figure, because swap size, unlike a ratio, does
      # not depend on the machine's RAM class: both 16 GiB Macs (macmini, company-mini) are
      # visibly slow by 8 GiB in use (#6111), and 15 GiB is the critical line the macmini swap
      # guard and the company-mini pool watcher carried (USED_LINE_MB = 15360). The rule has no
      # history behind it, so the thresholds are the owners', not a recalibration.
      # noData stays OK on purpose: the source is the agent host, and a machine whose agent host
      # or whole self has gone is already reported by `agent-host-down` and `machine-offline-*`;
      # a second alert for the same loss would be a duplicate. `max by (machine)` because the
      # old and the restarted agent host both answer for a few minutes after a restart, and the
      # figure is machine-wide, so summing them would double it.
      # Kernel vm-pressure level and jetsam kills are not swap-pool signals and are not covered.
      - uid: meiva-ops-host-swap-used-high
        title: "Host swap in use above 8 GiB"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-swap-used-high
          metric: host_swap
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} is using {{ $values.C }} GiB of swap (threshold 8)"
          description: >-
            {{ $labels.machine }} has held {{ $values.C }} GiB of swap in use for 10
            minutes. A memory-bound workload is paging; see which agent hosts or
            harness CLIs hold the most resident memory and stop or restart the
            heaviest. On macOS the swap pool also eats the data volume, so watch the
            free-space rules too.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine) (system_paging_usage_bytes{machine!="", state="used"}) / 2^30, 0.1)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # The pool-size line: at 15 GiB in use the machine is thrashing, not just paging.
      - uid: meiva-ops-host-swap-used-critical
        title: "Host swap in use above 15 GiB (critical)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: meiva-ops-host-swap-used-critical
          metric: host_swap
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} is using {{ $values.C }} GiB of swap (threshold 15)"
          description: >-
            {{ $labels.machine }} has had {{ $values.C }} GiB of swap in use for
            5 minutes: on a 16 GiB Mac that is a thrashing machine, not a paging
            one. Stop or restart the heaviest resident agent hosts or harness
            CLIs now; on macOS the swap pool also eats the data volume.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine) (system_paging_usage_bytes{machine!="", state="used"}) / 2^30, 0.1)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [15]
                  operator:
                    type: and
                  query:
                    params: [C]
      # The database write-stall sentinel (#39, schedule db-write-stall-watch), moved from a
      # per-minute schedule that tailed pgbouncer.log and paged agents to a rule over the same
      # numbers: the collector parses PgBouncer's per-minute stats line into two gauges. The
      # judgement is unchanged: under 20 transactions/s while the average query takes over
      # 300 ms, three minutes running. Over 29 days (40,375 minutes) that judgement marked only
      # the two real incidents and no quiet night. It is the root-cause signal
      # that an agent-host crash wave follows, which neither `db-pool-acquire-slow` nor
      # `pg-connection-saturation` catches (0 firings in 30 days). noData stays OK: a cluster
      # that turned PgBouncer off (MEIVA_PGBOUNCER_ENABLED=false) has no series.
      - uid: meiva-ops-pgbouncer-write-stall
        title: "PgBouncer write path stalled"
        condition: D
        for: 3m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: meiva-ops-pgbouncer-write-stall
          metric: pgbouncer_write_stall
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} PgBouncer stalled: under 20 xacts/s at {{ $values.C }} us average query"
          description: >-
            PgBouncer on {{ $labels.machine }} has completed fewer than 20
            transactions per second at an average query time of {{ $values.C }}
            microseconds (threshold 300000) for three minutes. This is the database
            write path stalling; agent-host crashes follow it. Check host memory and
            the largest cgroup units (~/.meiva/logs/host-memory.jsonl) and Postgres
            itself.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine) (
                  (pgbouncer_query_time_microseconds{machine!=""} > 300000)
                  and on (machine)
                  (pgbouncer_transactions_per_second{machine!=""} < 20)
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # The collector's own receiver refused data: its memory_limiter returns retryable
      # backpressure and each SDK drops what it cannot resend. The enqueue-failure rule above
      # watches the exporter side; this is the intake side that the company-mini 4318 probe
      # (#149) scraped by hand. Refused counters are monotonic: `increase` is load-bearing.
      # The memory limiter refuses logs, metrics and traces at the same moment (one process
      # memory reading), so the log counter stands for all three. One selector over the three
      # names cannot work: `increase` drops __name__ and the OTLP receiver's series would
      # then collide on (machine, receiver, transport).
      - uid: meiva-ops-otelcol-receiver-refused
        title: "OTel Collector receiver refusing telemetry"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-otelcol-receiver-refused
          metric: otelcol_receiver_refused
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} collector refused {{ $values.C }} log records in 10m"
          description: >-
            The OTel Collector on {{ $labels.machine }} refused {{ $values.C }} log
            records in the last 10 minutes (its memory limiter refuses metrics
            and traces at the same moment) and has refused data for 10 minutes
            running, so agent processes on that machine are losing telemetry. The usual cause is its memory limiter (512 MiB): check
            the collector's RSS and the exporter queues.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (machine) (increase(otelcol_receiver_refused_log_records_total{machine!=""}[10m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

  - orgId: 1
    name: meiva-ops-slow
    folder: Meiva
    interval: 5m
    rules:
      - uid: meiva-ops-inbound-consumed-unknown
        title: "claimed inbound consumed without execution evidence (15m)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: &slow-missing-evals 2
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-inbound-consumed-unknown
          metric: inbound_consumed_unknown
          team: meiva-ops
        annotations:
          summary: "{{ $values.C }} claimed inbound(s) consumed without running in 15m across {{ $values.N }} agent(s) (threshold 2)"
          description: >-
            A host crash or aborted turn left claimed inbound rows that the next
            cold admission consumed without executing: the message is gone and
            will not be redelivered. Each occurrence is one `inbound_consumed_unknown`
            event carrying the inbound id, kind, age and a content preview (the
            row's payload carries consumed_without_execution). One is an
            acceptable crash cost; more than two in 15 minutes means hosts are
            dying often enough to deserve a look before users report silence.
            The threshold stays fleet-wide (one host crash drops several agents'
            inbounds at once); {{ $values.N }} is how many distinct agents lost one.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service", event_name="inbound_consumed_unknown"} | json | cluster=".meiva" |
                category="telemetry" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                count(sum by (agent_id) (count_over_time({service_name="unknown_service", event_name="inbound_consumed_unknown", agent_id=~".+"} | json | cluster=".meiva" |
                category="telemetry" [15m]))) or vector(0)
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: N
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: N
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Provider-specific 429 rate-limit burst (> 5 in 5m) ──
      # A single 429 is recoverable by the retry policy. Six in the trailing
      # five minutes means retries are sustaining a provider-level pressure
      # incident. Group by vendor so the notification names the account that
      # needs concurrency reduction or a quota check, without paging once per
      # affected model.
      - uid: meiva-ops-llm-rate-limit
        title: "LLM provider rate-limit burst"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-llm-rate-limit
          metric: llm_rate_limit_burst
          team: meiva-ops
        annotations:
          summary: "LLM {{ $labels.attributes_vendor }} rate-limit burst ({{ $values.C }} HTTP 429s in 5m)"
          description: >-
            The {{ $labels.attributes_vendor }} provider emitted {{ $values.C }}
            HTTP 429 responses in the last five minutes. The client limiter and
            retry policy are absorbing them, but sustained pressure can delay or
            exhaust turns. Triage: reduce outbound concurrency, then inspect the
            provider's account concurrency and rate limits.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_vendor)
                (count_over_time({service_name="unknown_service", event_name="llm_provider_error"} | json | cluster=".meiva" |
                category="telemetry" |
                attributes_status="429" [5m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [C]

      # R13 evaluates at 5m without semantic loss: any rejection in its
      # trailing 15m window still fires; detection grows from <=1m to <=5m.
      # ── R13: LLM provider billing / quota failure (any occurrence in 15m) ──
      # The one alert in this file that is deliberately NOT threshold-gated: an
      # out-of-credit key fails EVERY turn on it, the operator action (top up /
      # raise the quota) is the same whether it happened once or a thousand
      # times, and nothing else in the fleet can proceed meanwhile — so the
      # first occurrence is already the whole incident. Before this rule the
      # only signal was R1's WARNING+ERROR spike, which needs 30 events in 5m
      # before it says anything, and says "event spike", not "the key is dry".
      #
      # `for: 0m` (every sibling waits 5-15m) follows from the same reasoning:
      # there is no flap to damp — the condition is a count over a 15m window,
      # so it stays true for 15m after the last failure and then resolves. One
      # episode = one firing IM + one resolved IM, the same dedup semantics the
      # siblings get from their `for` window (Alertmanager groups an episode by
      # its label set, not by `for`).
      #
      # `billing` is emitted by base/lm/errors.py from its cross-provider
      # predicate (HTTP 402, plus a
      # per-vendor vocabulary matched against the response body's error.type AND
      # error.code — DashScope reports the specific reason only in the latter) —
      # the rule never enumerates statuses itself, so a provider added there is
      # covered here for free. Grouping by vendor+model makes one dead key one
      # alert instance that names itself; both labels come off the
      # json-flattened event body.
      #
      # critical, not error: this is the only rule whose condition means the
      # agents cannot run at all until a human spends money.
      - uid: meiva-ops-llm-billing-quota
        title: "LLM provider billing/quota failure"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: meiva-ops-llm-billing-quota
          metric: llm_billing_failure
          team: meiva-ops
        annotations:
          summary: "LLM API billing/quota failure — the {{ $labels.attributes_vendor }} key for {{ $labels.attributes_model }} is out of credit or quota-throttled ({{ $values.C }} rejections in 15m)"
          description: >-
            Events with event_name=llm_provider_error and attributes.billing=true
            reached {{ $values.C }} in the last 15 minutes for model
            {{ $labels.attributes_model }} (vendor
            {{ $labels.attributes_vendor }}). The provider refused with HTTP 402
            or its own insufficient-balance / quota code — no retry can
            clear it, so every turn on this key fails until the account is
            topped up or the quota raised. Fires on the FIRST occurrence by
            design (no spike threshold): one rejection already means the fleet
            is stalled on this model. Triage: top up the vendor account, or
            point MEIVA_LLM_MODEL at a model whose key still has credit; the rule
            resolves 15m after the last rejection.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_vendor, attributes_model)
                (count_over_time({service_name="unknown_service", event_name="llm_provider_error"} | json | cluster=".meiva" |
                category="telemetry" |
                attributes_billing="true" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R17: Gateway latency by route — fast routes only. The exclusion
      #        source is gateway/http/middleware/latency.py. p95 bucket > 3s for 5m =
      #        warning; > 10s for 5m = error. Calibrated 2026-08-23 on 7d
      #        data: fast-route max p95 sits under ~5.5s with typical
      #        sub-second values; 3s/10s two-tier follows the PM slow-request
      #        spec. Warning-first: no IM push (Insights-visible only) — the
      #        user's alarm-fatigue ruling (2026-08-22). ──
      - uid: meiva-ops-gateway-latency-route-warning
        title: "Gateway latency: fast route p95 above 3s"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-gateway-latency-route-warning
          metric: gateway_latency_route_p95
          team: meiva-ops
          notify_im: "false"
        annotations:
          summary: "Fast route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 3000 ms)"
          description: >-
            The route's gateway_latency bucket p95 stayed above 3s for 5
            minutes. LLM-bound and Loki-backed slow-by-design routes are
            excluded; this fires only on UI-facing quick reads.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".meiva" | category=~"telemetry|log"
                | attributes_route_class="fast"
                | attributes_count >= 10
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [3000]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: meiva-ops-gateway-latency-route-error
        title: "Gateway latency: fast route p95 above 10s"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-gateway-latency-route-error
          metric: gateway_latency_route_p95
          team: meiva-ops
          notify_im: "false"
        annotations:
          summary: "Fast route {{ $labels.attributes_route }} p95 at {{ $values.C }} ms (threshold 10000 ms)"
          description: >-
            The route's gateway_latency bucket p95 stayed above 10s for 5
            minutes — a UI-facing quick read has degraded severely.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                max by (attributes_route) (max_over_time({service_name="unknown_service", event_name="gateway_latency"}
                | json | cluster=".meiva" | category=~"telemetry|log"
                | attributes_route_class="fast"
                | attributes_count >= 10
                | unwrap attributes_p95_ms [5m]))
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: max
              mode: byLabels
              includeLabels:
                - attributes_route
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [10000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R18: Turn duration p95 (agent-wide slowdown signal). Threshold =
      #        2x the 24h baseline p95 (37.6s on 2026-08-23) → 75s, sustained
      #        10m. Warning-first, no IM push. ──
      - uid: meiva-ops-turn-duration-p95
        title: "Turn duration p95 above 75s"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *slow-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-turn-duration-p95
          metric: turn_duration_p95
          team: meiva-ops
          notify_im: "false"
        annotations:
          summary: "Turn duration p95 at {{ $values.C }} s (threshold 75 s, 2x 24h baseline)"
          description: >-
            The agent-wide turn duration p95 (meiva_turn_end_duration_seconds
            histogram, 10m rate) stayed above 75s — 2x the 2026-08-23 24h
            baseline of 37.6s — for 10 minutes. The alerting runbook has a
            per-agent Turn p95 query for investigating the slowdown in Loki.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(meiva_turn_end_duration_seconds_bucket[10m])))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [75]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R19: Gateway latency by route — slow routes only. Slow routes are
