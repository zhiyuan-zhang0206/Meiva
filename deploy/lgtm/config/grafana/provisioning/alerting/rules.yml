          team: meiva-ops
        annotations:
          summary: "Recovery drill {{ $labels.drill }} failed (last_run_ok={{ $values.C }})"
          description: >-
            The latest scheduled {{ $labels.drill }} recovery proof failed
            (meiva_recovery_drill_status_last_run_ok_ratio < 1). The failed proof
            does not mark a successful drill and does not change the backup
            schedule. Inspect the matching recovery_drill_failed event, repair
            the isolated restore path, and confirm a later proof succeeds (which
            sets the gauge back to 1 and auto-resolves this alert).
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                min by (drill) (meiva_recovery_drill_status_last_run_ok_ratio)
