      # meiva:note
      # A completed call the catalog could not price: the ledger row keeps its tokens with no cost, so
      # spend is undercounted until the catalog declares the rate (the maintenance pass then reprices
      # the row at its own time). Per model, so one model's stream of calls is one alert instance. The
      # price-completeness test blocks a registered model from reaching this at merge time; what
      # reaches it is a model or a cache-write class no registration knew about.
      - uid: meiva-ops-llm-usage-unpriced
        title: "LLM call could not be priced"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-llm-usage-unpriced
          metric: llm_usage_unpriced
          team: meiva-ops
        annotations:
          summary: "unpriced LLM calls for model {{ $labels.attributes_model }} ({{ $labels.attributes_cause }}: {{ $labels.attributes_missing_classes }})"
          description: >-
            Completed calls for this model were recorded without a cost (llm_usage_unpriced), so the
            spend is undercounted. `attributes_cause` is `no_price` (the catalog has no price for the
            model at the call's time) or `no_cache_write_rate` (it has one, but no rate for the
            cache-write classes in `attributes_missing_classes`). Fix one of two things. Either add
            the price: declare the rate (`0` for a class the vendor reports but does not bill) in
            base/lm/pricing/pricing_catalog_archive.json and in the provider plugin's prices, and add
            the vendor's reported write classes to VENDOR_CACHE_WRITES in
            base/lm/pricing/cache_writes.py when the vendor is new. Or fix the usage mapping, when the
            call reported a class its vendor cannot report (the 2026-10-29 case: OpenAI counts filed
            as 5-minute writes). Once the release carries the fix, the events-maintenance pass
            reprices the historical ledger rows at their own time, with no manual backfill.
            Check: `meiva stats --hours 720 --json` reports `usage_unpriced_calls` 0.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum by (attributes_model, attributes_cause, attributes_missing_classes)
                (count_over_time({event_name="llm_usage_unpriced"}
                | json | cluster=".meiva" | category="telemetry" [15m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

