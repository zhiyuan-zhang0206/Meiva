        annotations:
          summary: "agent {{ with $labels.agent_id }}{{ . }}{{ else }}unknown{{ end }}: turn aborted after retries ({{ $values.C }} in 15m)"
          description: >-
            A turn failed every retry and was aborted (llm_turn_aborted). The `llm_provider_error`
            rules only match rate limits and billing rejections, so a permanent rejection
            (400/401/403/404/422) reached nobody. Read both when triaging: those rules carry
            `attributes_status` and `attributes_vendor`, this one says the turn is lost.
        data:
