# Meiva ops alert rules — Grafana Alerting, provisioned as code.
#
# Source of truth: this file. Converge renders the provisioning tree into the
# home (`$MEIVA_HOME/lgtm/native/config/provisioning/`, copied verbatim by
# `cli/commands/observability/lgtm_native.py`); native Grafana (port 3003 by
# default, 53003 on the station via `MEIVA_LGTM_GRAFANA_PORT`) reads that
# rendered copy. Alert-rule file changes do NOT hot-reload: they apply on the
# next alerting reload or restart (see the README, "Retired rules").
#
# Evaluation engine: Grafana Unified Alerting over the LGTM read side
# (Task #1224): rules R1-R2, R5-R6 and R13 query Loki (the events stream — every
# event is one OTLP log line under {service_name="unknown_service"} with
# event_name/agent_id promoted to stream labels since 2026-08-23; body =
# the full event JSON, so `| json` flattens it to labels), and R4 plus the
# infrastructure/delivery rules R8-R12 and R14-R16, plus R24, query Prometheus. Datasources are provisioned
# beside this file in datasources.yml (uids `loki` / `prometheus`). The
# retired Postgres events read path (#1197) is gone — nothing queries `ops`
# from these rules.
#
# Prometheus inputs use `machine` for the roster identity:
# - APPLICATION metrics (R4 and the gateway-heartbeat silence rule) come from
#   the event emitter's OTLP mirror and carry `machine` / `agent_id` datapoint
#   attributes.
# - INFRASTRUCTURE metrics (R8-R12, R14-R16, issue #46) come from each
#   machine's OTel Collector sidecar (host/data-plane receivers plus its own
#   queue/drop/uptime scrape) and live under `job="meiva-infra"` with both
#   `host_name` = the OS hostname (physical identity) and `machine` = the Meiva
#   roster identity baked from the unit at converge. Per the 2026-08-24 user
#   ruling, rules group by `machine`, so units on one host remain separate
#   series. During a rolling upgrade, use `machine_name` when the same alert
#   grouping has no samples under `machine`. Apply range functions before
#   choosing a source so a new series without a usable window cannot hide
#   older samples. Each branch excludes series without a roster identity.
# - RECEIVER metrics (R24) come from Prometheus's own scrape target and report
#   too-old sample loss across the whole OTLP intake, without machine labels.
#
# R8-R11 wrap their ratio in PromQL `round(..., 0.001)`: the value is
# interpolated into the summary line that reaches IM, and "0.927" is a number a
# human reads where "0.927223987411" is not. It cannot change a verdict — the
# thresholds are two decimals wide.
#
# The infrastructure thresholds are DEPLOYMENT FACTS, not framework constants: what
# counts as "too much CPU" depends on box specs and co-tenancy (a PyTorch job
# legitimately saturates a machine). They live here, as rule config an
# operator edits, and the response to a firing instance is the
# cluster-operator agent's judgment — see docs/conventions/runbook.md, "The
# operator's SRE loop".
#
# Index-label selectors (task #1467): since the 2026-08-23 cutover
# the collector promotes event_name/agent_id to stream labels, so
# event-scoped rules match them
# inside the stream selector (`{service_name="unknown_service", event_name=...}`)
# and keep `| json` only for the level/category/attributes filters (those
# fields are NOT stream labels). Legacy chunks without the index labels
# expired after the cutover's retention grace (2026-08-26); promoting the
# filters before that expiry would have silently dropped the still-retained
# history.
# Selector matchers are full-string regexes, unlike pipeline label filters
# (substring), so multi-alternative event_name regexes match exact names.
# - Prod events carry cluster=".meiva"; co-located cluster events must not
#   participate in prod alert evaluation.
# - Read side is strict: legacy records without a cluster dimension are excluded for up to the Loki event-stream retention window, so aggregate counts may read low during rollout.
#   This is deliberate: allowing absent-cluster rows would keep the co-located preview leak visible in prod reads for the full retention window.
# - `| json` flattens nested objects with underscore joins:
#   attributes.n -> attributes_n, attributes.age_s -> attributes_age_s,
#   attributes.action -> attributes_action. Numbers parse as numbers, so
#   `| attributes_age_s < 600` is a numeric comparison.
# - Every count wraps in sum(...) — the unknown_service family has >500
#   streams over a day, and an unaggregated count_over_time hits Loki's
#   per-query series cap.
#
# Threshold calibration (unchanged from the Postgres rules — the data is the
# same stream):
#   WARNING+ERROR+CRITICAL      ~5-19 / 5m normally, one 54/5m spike in 2h
#   sse_drop+event_log_drop     SUM(payload.n) — real dropped events, not
#                               report rows (2026-08-08: the rules + rollup
#                               counted report rows, understating the backlog
#                               by the 5s aggregation factor). 7d live data:
#                               p95 ~13 / 10m chronic drip; real degradations
#                               160-342 / 10m. Threshold 100 sits in the gap.
#   llm_usage.latency_ms p95    ~13s / 10m typical, worst bucket 158s
#   gateway_latency heartbeat   60s cadence; 5m = 5x headroom. It requires
#                               request traffic: health probes + UI polling make
#                               it continuous here, while zero-traffic
#                               deployments may false-fire.
#   delivery_stalled fresh      (age_s < 600) 0 / 10m in the last 24h — any
#                               sustained fresh-stall burst means the delivery
#                               pipeline is newly stuck (the old-age backlog is
#                               chronic and not alert-worthy)
#   llm billing/quota           any occurrence of llm_provider_error with
#                               attributes.billing=true in 15m — not calibrated
#                               against a baseline because there is no healthy
#                               rate: one rejection means the key is dry.
#
# The `for` field keeps short evaluation windows from flapping: the condition
# must hold for the whole `for` duration before the alert fires. R13 sets it to
# 0m on purpose — see its own comment.
#
# Severity follows the alert-system vocabulary (Task #1224): critical /
# warning / error — all three push to IM, no gate. R4's Prometheus query
# returns no data during quiet periods (no llm_usage samples), so
# noDataState/execErrState stay pinned to OK — a datasource outage during
# maintenance must not fire every rule at once.
#
# The ruleUID label pins parse_rule_uid to the stable rule uid so synthetic
# DatasourceNoData/DatasourceError instances never collide on the
# alertname-derived dedup key.
# Grafana owns episode recovery. A condition must remain healthy for 5m before
# resolving; a refire during recovery stays in the same episode. Missing series
# retain their identity for the corresponding evaluation budget (1m / 5m groups).
# Native YAML aliases share these settings without a second policy registry.
apiVersion: 1
groups:
  - orgId: 1
    name: meiva-ops
    folder: Meiva
    interval: 1m
    rules:
      # ── R1: WARNING+ERROR spike (current 5m count > 3x the prior-15m rate, and ≥ 30) ──
      - uid: meiva-ops-warning-error-spike
        title: "Event health: WARNING+ERROR+CRITICAL spike"
        condition: F
        for: 5m
        keepFiringFor: &recovery-window 5m
        missing_series_evals_to_resolve: &fast-missing-evals 6
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-warning-error-spike
          metric: warn_error_rate
          team: meiva-ops
        annotations:
          summary: "WARNING+ERROR+CRITICAL event spike (current 5m count {{ $values.C }}, prior-15m expectation ≤ {{ $values.D }})"
          description: >-
            Events with level ∈ warning/error/critical reached {{ $values.C }} in
            the last 5 minutes, over 3x the prior-15m average rate ({{ $values.D }}
            per 5m). Likely a service failure or error loop. See the Grafana panel
            /grafana/d/meiva-ops-main to locate the source.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".meiva" |
                category=~"telemetry|log" | level=~"warning|error|critical" [5m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".meiva" |
                category=~"telemetry|log" | level=~"warning|error|critical" [15m] offset 5m))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 1200
              to: 300
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: E
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: E
              datasource:
                type: __expr__
                uid: __expr__
              type: math
              expression: "$C > $D && $C >= 30"
          - refId: F
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: F
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: E
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [E]

      # ── R2: SSE / event-log drop backlog (real drops in 10m > 100; p95≈13, degraded 160-342) ──
      - uid: meiva-ops-sse-drop-backlog
        title: "Event-pipeline drop backlog (sse_drop / event_log_drop)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-sse-drop-backlog
          metric: event_drop_rate
          team: meiva-ops
        annotations:
          summary: "{{ $values.C }} real SSE/event-log drops in 10 minutes across {{ $values.N }} agent(s) (threshold 100)"
          description: >-
            Events with event_name ∈ sse_drop / event_log_drop summed payload.n to
            {{ $values.C }} in the last 10 minutes (real drops; each report row
            carries the real drop count n since the previous report). SSE drops =
            degraded live view; event_log_drop = lost log-sink queue rows. Check
            the affected agent's event publisher / log-sink queue. {{ $values.N }}
            counts the distinct agent ids among the drop rows; a drop from a shared
            process carries none, so it adds to the total but not to the count.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(sum_over_time({service_name="unknown_service", event_name=~"sse_drop|event_log_drop"} | json | cluster=".meiva" |
                category="telemetry" |
                unwrap attributes_n [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                count(sum by (agent_id) (count_over_time({service_name="unknown_service", event_name=~"sse_drop|event_log_drop", agent_id=~".+"} | json | cluster=".meiva" |
                category="telemetry" [10m]))) or vector(0)
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: N
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: N
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R4: LLM latency p95 above threshold (10m window p95 > 60s; typical observed 13s, worst bucket 158s) ──
      # The p95 now comes from the OTLP metric mirror (Prometheus histogram),
      # not a SQL percentile — histogram_quantile over the latency buckets is
      # the same read the Insights Ops panel uses. The histogram only exists
      # while processes export OTLP metrics; absent data means NoData -> OK.
      - uid: meiva-ops-llm-latency-p95
        title: "LLM latency p95 above threshold"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-llm-latency-p95
          metric: llm_latency_p95
          team: meiva-ops
        annotations:
          summary: "LLM call latency p95 at {{ $values.C }} ms — value at last evaluation (threshold 60000 ms)"
          description: >-
            The latest p95 of llm_usage latency over the last 10 minutes is
            {{ $values.C }} ms. The alert fires after this value remains above
            60s for 10 minutes (histogram_quantile over the
            meiva_llm_usage_latency histogram — an approximation of the exact
            SQL percentile, same as the Ops panel). Usually a provider-side
            failure or slow request pile-up. No alert fires when the metric is
            absent.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                histogram_quantile(0.95, sum by (le)
                (rate(meiva_llm_usage_latency_milliseconds_bucket[10m])))
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [60000]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R5: delivery_stalled fresh backlog (>50 fresh stalls in 10m; current baseline 0) ──
      - uid: meiva-ops-delivery-stalled-backlog
        title: "Delivery fresh backlog (delivery_stalled fresh)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-delivery-stalled-backlog
          metric: delivery_stall_rate
          team: meiva-ops
        annotations:
          summary: "{{ $values.C }} fresh delivery stalls in 10 minutes across {{ $values.N }} agent(s) (age_s < 600, threshold 50)"
          description: >-
            Events with event_name=delivery_stalled and age_s < 600 (fresh, not
            historical) reached {{ $values.C }} in the last 10 minutes. Old stalls
            (age_s in days) do not indicate a new failure; fresh stalls mean the
            delivery pipeline just got blocked. The stalls belong to {{ $values.N }}
            distinct agents; meiva-ops-delivery-stalled names each one.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service", event_name="delivery_stalled"} | json | cluster=".meiva" |
                category="telemetry" |
                attributes_age_s < 600 [10m]))
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: B
            datasourceUid: loki
            queryType: ""
            model:
              refId: B
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                count(sum by (agent_id) (count_over_time({service_name="unknown_service", event_name="delivery_stalled", agent_id=~".+"} | json | cluster=".meiva" |
                category="telemetry" |
                attributes_age_s < 600 [10m]))) or vector(0)
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
          - refId: N
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: N
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: B
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R6: event stream stalled (no events at all in 5m; meta-observability) ──
      # Semantics change with the LGTM cutover (Task #1224): the Postgres rule
      # measured the events TABLE's write freshness; that table is retired
      # (#1197), so the rule now probes the live stream in Loki with
      # absent_over_time — fires when NO event of any kind reached Loki in 5m.
      # That covers the emitter stall AND a broken OTLP export path (the
      # 2026-08-12 incident class), at the cost of no longer distinguishing
      # them. When the stream flows, the query returns no data (NoData -> OK).
      - uid: meiva-ops-events-freshness
        title: "Event stream stalled (no events in Loki)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-events-freshness
          metric: events_freshness
          team: meiva-ops
        annotations:
          summary: "No events reached Loki in the last 5 minutes"
          description: >-
            absent_over_time reports the events stream
            ({service_name="unknown_service"}) produced no log lines in the
            last 5 minutes. The largest measured silent gap over 7d was 60s
            (the events_maintenance fast loop + agent activity are structural
            periodic writers), so 5m has 5x headroom. A stalled stream means
            the emitter/export path is down — the exact outage that made Loki
            go dark on 2026-08-12 (OTLP preflight bug). When the stream flows
            the query returns no data (NoData -> OK). If Loki itself is down,
            the rule errors (execErrState OK is silent) and the health-probe
            chain covers it.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                absent_over_time({service_name="unknown_service"} | json | cluster=".meiva" [5m])
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R6b: event stream below its measured low-water mark ──
      # Complements R6: absent_over_time catches a total stop (zero flow),
      # while this rule catches partial write loss when a few batches still
      # reach Loki. The rules intentionally run in parallel and may overlap.
      # Calibration at 2026-09-06 03:11 Beijing over the preceding 24h,
      # measured with this exact expression (same stream selector and
      # pipeline): 5m counts min=295 (~59/min, two windows), p05=349,
      # median=1071, max=3167. The 150/5m threshold (~30/min) is about half
      # the measured trough; it must remain breached for 10m before firing.
      - uid: meiva-ops-events-low-water
        title: "Event stream below low-water mark"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-events-low-water
          metric: events_freshness
          team: meiva-ops
        annotations:
          summary: "Only {{ $values.C }} events reached Loki in 5 minutes (low-water 150)"
          description: >-
            Whole-cluster event volume stayed below 150 lines per 5 minutes
            for 10 minutes. This catches partial Loki write loss that the
            parallel absent-over-time freshness rule cannot see while even
            one batch still arrives. The calibrated floor is about half the
            lowest measured 5-minute volume, leaving substantial night-time
            headroom while detecting a degraded write path.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                sum(count_over_time({service_name="unknown_service"} | json | cluster=".meiva" [5m])) or vector(0)
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [150]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R8: host CPU saturated (issue #46) ──
      # 1 - idle, averaged over the machine's cores. 0.90 sustained for 15m is
      # the shipped default: short bursts are normal work (a build, an eval
      # sweep), a quarter-hour pinned is the box having no headroom left for
      # anything else. Tune per deployment — this is a machine-spec fact.
      - uid: meiva-ops-host-cpu-saturated
        title: "Host CPU saturated"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-cpu-saturated
          metric: host_cpu
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} CPU at {{ $values.C }} (threshold 0.90) for 15m"
          description: >-
            Non-idle CPU on {{ $labels.machine }} has averaged
            {{ $values.C }} (fraction of all cores) for 15 minutes. This is
            not a limit the kernel enforces — a training or eval job may
            legitimately own the box. The operator decides: identify the
            consumer (Grafana /grafana/d/meiva-ops-main, "Host & data plane" section), then
            investigate, terminate idle agents, or leave it alone.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(1 - avg by (machine) (
                  system_cpu_utilization_ratio{machine!="", state="idle"}
                  or on (machine)
                  label_join(system_cpu_utilization_ratio{machine="", machine_name!="", state="idle"}, "machine", "", "machine_name")
                ), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R9: host memory pressure (issue #46) ──
      # state="used" is the OTel host_metrics equivalent of the status page's
      # pressure figure (total - available): reclaimable cache is NOT counted
      # as used, so 0.90 here means real pressure, not a warm page cache.
      - uid: meiva-ops-host-memory-pressure
        title: "Host memory pressure"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-memory-pressure
          metric: host_memory
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} memory at {{ $values.C }} used (threshold 0.90) for 15m"
          description: >-
            Used memory on {{ $labels.machine }} has held at {{ $values.C }} of
            RAM for 15 minutes (reclaimable cache excluded). Sustained
            pressure precedes swapping and the OOM killer, whose visible form
            is an agent crash loop. Check the per-agent footprint and
            consider terminating idle agents.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(avg by (machine) (
                  system_memory_utilization_ratio{machine!="", state="used"}
                  or on (machine)
                  label_join(system_memory_utilization_ratio{machine="", machine_name!="", state="used"}, "machine", "", "machine_name")
                ), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R10: per-volume disk watermark (issue #46) ──
      # The realistic killer: the trace-v2 incident wrote 31 GB/h of local
      # trace files before content stripping landed. This rule fires on the
      # cause, per mountpoint, so the pg data dir and the LGTM host's Loki
      # volumes are all covered by whichever filesystem carries them. One instance per
      # (machine, mountpoint):
      # on macOS the volumes of one APFS container all report the container's
      # fullness, so a single full disk legitimately fires twice.
      # Excluded: non-asset mounts whose reported fullness is foreign or
      # transient, never the Meiva data plane. macOS /Volumes/* (removable, external and
      # network volumes plus mounted DMG installers — internal volumes live
      # under /System/Volumes/*); /private/tmp/* and /private/var/folders/*
      # (scratch mounts, not persistent assets). These recur with every
      # desktop-app update: on 2026-09-18, /Volumes/Monsora* on company-air
      # and macbook-air and /private/tmp/monsora154 on company-mini alerted
      # at 0.99 — DMG images read ~100% full by construction (task #3958).
      # Read-only mounts and optical-image filesystem types are excluded regardless
      # of path: installation ISOs also mount beneath /Users (2026-10-13).
      # The Meiva data plane (writable root volume, /System/Volumes/Data,
      # /Users/*/OrbStack on macOS; / on Linux) keeps its watermark.
      - uid: meiva-ops-host-disk-watermark
        title: "Filesystem over watermark"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-disk-watermark
          metric: host_disk
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.mountpoint }} at {{ $values.C }} full (threshold 0.90)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine }} is
            {{ $values.C }} full. Triage: find the growth —
            the Postgres data dir, the logs, or
            the LGTM host's Loki/Prometheus volumes — then prune or raise the
            volume.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: &writable-disk >-
                round(max by (machine, mountpoint) (
                  system_filesystem_utilization_ratio{machine!="", mode!="ro", type!~"iso9660|udf|cd9660", mountpoint!~"/Volumes/.*|/private/tmp/.*|/private/var/folders/.*"}
                  or on (machine, mountpoint)
                  label_join(system_filesystem_utilization_ratio{machine="", machine_name!="", mode!="ro", type!~"iso9660|udf|cd9660", mountpoint!~"/Volumes/.*|/private/tmp/.*|/private/var/folders/.*"}, "machine", "", "machine_name")
                ), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R10b: disk escalation before Loki's WAL hard stop ──
      # 0.93 is the escalation warning between the retained 0.90 watermark
      # and Loki's 0.95 WAL disk_full_threshold. The shorter critical hold at
      # 0.95 reflects the 2026-09-05 incident: WAL write throttling killed the
      # event stream while /ready continued to answer 200.
      - uid: meiva-ops-host-disk-watermark-93
        title: "Filesystem approaching Loki WAL hard stop"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-host-disk-watermark-93
          metric: host_disk
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.mountpoint }} at {{ $values.C }} full (threshold 0.93)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine }} is
            {{ $values.C }} full. This escalation warning sits between the
            0.90 capacity watermark and Loki's 0.95 WAL disk-full hard stop.
            Free space before write throttling can interrupt the event stream.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: *writable-disk
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.93]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: meiva-ops-host-disk-watermark-95
        title: "Filesystem at Loki WAL hard stop"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
          ruleUID: meiva-ops-host-disk-watermark-95
          metric: host_disk
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.mountpoint }} at {{ $values.C }} full (critical threshold 0.95)"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.machine }} is
            {{ $values.C }} full. 0.95 is Loki WAL's disk_full_threshold: the
            2026-09-05 incident crossed this line, throttled WAL writes, and
            killed the event stream while Loki /ready stayed green. Free disk
            immediately and verify the write path recovers.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: *writable-disk
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.95]
                  operator:
                    type: and
                  query:
                    params: [C]

      # T6352: the runner emit fix is verified in production Loki before restoring silence.
      - uid: meiva-ops-plugin-collector-silent
        title: "Interval collector loop silent (no cycle event in 35m)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-plugin-collector-silent
          metric: plugin_collector_cycle_freshness
          team: meiva-ops
        annotations:
          summary: "No plugin collector finished a cycle in the last 35 minutes"
          description: >-
            `plugin_collector_cycle` is emitted once per refresh cycle by every interval
            collector (meiva_usage runners), in the success and the failure branch.
            A 35-minute window covers the slowest current 30-minute collector.
            No event in that window means all loops stopped — or all collectors were disabled — not
            that a cycle failed: failures still emit, with outcome=failed. Triage the schedule's
            runner (`meiva schedules logs <id>`), `~/.meiva/logs/agent-*.log`, and whether the
            collectors are still enabled in the meiva_usage config.
        data:
          - refId: A
            datasourceUid: loki
            queryType: ""
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: >-
                absent_over_time({event_name="plugin_collector_cycle"} | json | cluster=".meiva" | category="telemetry" [35m])
              instant: true
              queryType: instant
            relativeTimeRange:
              from: 2100
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    and
                  query:
                    params: [C]

      # ── checkpoint table footprint (T5280, 2026-10-17) ──
      # Full retention is the standing ruling for all three checkpoint tables
      # (checkpoints / checkpoint_writes / checkpoint_blobs): they only grow,
      # so an absolute byte tier encodes a past steady state and fires
      # forever. The two absolute tiers (2.5/4 GiB on checkpoint_blobs) were
      # retired here; capacity is guarded by the host disk-watermark rules.
      # What follows is the anomaly signal (a step the retention policy does
      # not explain — maintenance windows can rewrite rows and add ~10 GiB in
      # an hour with row counts unchanged) and the telemetry-silence guard.
      - uid: meiva-ops-checkpoint-blobs-freshness
        title: "checkpoint table size telemetry silent (2h)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-checkpoint-blobs-freshness
          metric: checkpoint_blobs_freshness
          team: meiva-ops
        annotations:
          summary: "checkpoint table size metric stopped reaching Prometheus"
          description: >-
            None of the three checkpoint_table_sizes series (checkpoints,
            writes, blobs) reached Prometheus for two hours. The series is
            re-emitted every export cycle while the events-maintenance daemon
            runs; its normal restarts leave gaps under two hours, so a longer
            silence means the checkpoint telemetry or its export path stopped
            — and while it is silent the checkpoint footprint growth rule is
            blind. Triage the events_maintenance daemon's health and its
            [otlp-exporter] log lines. With
            MEIVA_TELEMETRY_OTLP_ENABLED=off the gateway-metrics-silent rule
            fires too.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: absent_over_time(meiva_checkpoint_table_sizes_checkpoints_bytes_ratio[2h]) or absent_over_time(meiva_checkpoint_table_sizes_writes_bytes_ratio[2h]) or absent_over_time(meiva_checkpoint_table_sizes_blobs_bytes_ratio[2h])
              instant: true
              range: false
            relativeTimeRange:
              from: 7200
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      - uid: meiva-ops-checkpoint-blobs-growth
        title: "checkpoint tables grew more than 1 GiB in 6 hours"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-checkpoint-blobs-growth
          metric: checkpoint_blobs_growth
          team: meiva-ops
        annotations:
          summary: "checkpoint tables grew by {{ $values.C }} B in the trailing 6h (threshold 1 GiB)"
          description: >-
            The three checkpoint tables together added more than 1 GiB of
            physical storage within the trailing six hours. Under full
            retention this is the anomaly signal, not a capacity tier: organic
            growth over 2026-10 sat under 0.5 GiB per six hours, while
            maintenance windows that rewrite checkpoint rows added 4.4 GiB in
            2h (2026-10-16) and 10.6 GiB in 1h (2026-10-17) with row counts
            unchanged. A firing here means either real write pressure or a
            bulk rewrite; the ratio of growth to row growth tells which (the
            events-maintenance checkpoint_table_sizes event carries *_live
            counts). Disk exhaustion is guarded separately by the host
            disk-watermark rules.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (max(meiva_checkpoint_table_sizes_checkpoints_bytes_ratio) + max(meiva_checkpoint_table_sizes_writes_bytes_ratio) + max(meiva_checkpoint_table_sizes_blobs_bytes_ratio)) - (max(meiva_checkpoint_table_sizes_checkpoints_bytes_ratio offset 6h) + max(meiva_checkpoint_table_sizes_writes_bytes_ratio offset 6h) + max(meiva_checkpoint_table_sizes_blobs_bytes_ratio offset 6h))
              instant: true
              range: false
            relativeTimeRange:
              from: 21600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [1073741824]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R11: Postgres connection saturation (issue #46) ──
      # Backends against the server's own max_connections, both read from the
      # postgresql receiver. This is where pool saturation surfaces: PgBouncer
      # itself has no OTel contrib receiver (its SHOW STATS admin protocol is
      # not the Postgres wire protocol), and adding a postgres_exporter /
      # pgbouncer_exporter binary per machine is the footprint the sidecar
      # architecture exists to avoid. Backends piling up means either the
      # pooler is passing through more than it should or the pooler is gone
      # and every process is dialing Postgres directly.
      - uid: meiva-ops-pg-connection-saturation
        title: "Postgres connection saturation"
        condition: D
        for: 10m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-pg-connection-saturation
          metric: pg_connections
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} Postgres backends at {{ $values.C }} of max_connections (threshold 0.80)"
          description: >-
            Open Postgres backends on {{ $labels.machine }} are at
            {{ $values.C }} of the server's max_connections. Past 1.0 new
            connections are refused and every process that needs the database
            fails at once. Check the PgBouncer pooler is up and pooling
            (MEIVA_PGBOUNCER_ENABLED), and look for a process leaking sessions.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine) (
                  postgresql_backends{machine!=""}
                  or on (machine)
                  label_join(postgresql_backends{machine="", machine_name!=""}, "machine", "", "machine_name")
                )
                / max by (machine) (
                  postgresql_connection_max{machine!=""}
                  or on (machine)
                  label_join(postgresql_connection_max{machine="", machine_name!=""}, "machine", "", "machine_name")
                ), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R12: Redis memory (issue #46) ──
      # The redis receiver reports used memory but not maxmemory, so this is
      # an absolute byte threshold — 2 GiB, a deployment fact about the box's
      # RAM, tuned here. Meiva's Redis carries the events pub/sub channel and
      # short-lived caches; a steadily climbing footprint is a leak, and once
      # maxmemory is reached the eviction of live keys (redis_keys_evicted_total,
      # on the dashboard) starts dropping cluster state.
      - uid: meiva-ops-redis-memory
        title: "Redis memory above threshold"
        condition: D
        for: 15m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-redis-memory
          metric: redis_memory
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} Redis using {{ $values.C }} bytes (threshold 2 GiB)"
          description: >-
            Redis on {{ $labels.machine }} is holding {{ $values.C }} bytes for
            15 minutes, above the 2 GiB deployment threshold. Inspect the
            keyspace for an unbounded producer; the events channel is a
            stream, not a store, so a growing resident set is normally a
            cache that never expires.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine) (
                  redis_memory_used_bytes{machine!=""}
                  or on (machine)
                  label_join(redis_memory_used_bytes{machine="", machine_name!=""}, "machine", "", "machine_name")
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2147483648]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R14: collector exporter queue pressure (current ratio > 0.80) ──
      # The queue gauges are current state. This deliberately does NOT use the
      # process-lifetime enqueue-failure counter: one old outage must resolve
      # after the route recovers. One instance per
      # machine/exporter/data_type says which machine and signal path is
      # blocked.
      - uid: meiva-ops-otelcol-queue-pressure
        title: "OTel Collector exporter queue pressure"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-otelcol-queue-pressure
          metric: otelcol_queue
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} collector {{ $labels.exporter }} {{ $labels.data_type }} queue at {{ $values.C }} (threshold 0.80)"
          description: >-
            The OTel Collector exporter queue on {{ $labels.machine }} for
            {{ $labels.exporter }} ({{ $labels.data_type }}) has stayed above
            80% capacity for 5 minutes. The destination or runner-to-gateway
            relay is not keeping up. Check gateway reachability, the collector
            receiver, and the LGTM backend before the queue fills and rejects
            new telemetry.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                round(max by (machine, exporter, data_type) (
                  otelcol_exporter_queue_size{machine!=""}
                  or on (machine, exporter, data_type)
                  label_join(otelcol_exporter_queue_size{machine="", machine_name!=""}, "machine", "", "machine_name")
                )
                / clamp_min(max by (machine, exporter, data_type) (
                  otelcol_exporter_queue_capacity{machine!=""}
                  or on (machine, exporter, data_type)
                  label_join(otelcol_exporter_queue_capacity{machine="", machine_name!=""}, "machine", "", "machine_name")
                ), 1), 0.001)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [C]

      # Actual queue loss is an immediate error, independent of log export.
      - uid: meiva-ops-telemetry-queue-loss
        title: "Telemetry events lost"
        condition: D
        for: 0s
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-telemetry-queue-loss
          metric: telemetry_queue_loss
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.process }} telemetry queue lost events"
          description: >-
            This process dropped events within the last five minutes. Event history
            is incomplete. Check emitter and OTLP queues and the collector. This
            signal uses the metrics lane, independent of the saturated log queues.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                time() - max by (machine, process, queue)
                (meiva_event_log_drop_last_dropped_at_ratio)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: lt
                    params: [300]
                  operator:
                    type: and
                  query:
                    params: [C]


      # ── R15: newly rejected telemetry (enqueue-failure delta > 0 in 5m) ──
      # These are monotonic counters. `increase` is load-bearing: comparing an
      # absolute value would create a permanent alert after the first failure
      # until the collector restarted. One `increase` per signal: a single
      # `__name__=~` selector makes `increase` drop the name and collide on
      # labelset ("vector cannot contain metrics with the same labelset"),
      # which `execErrState: OK` would turn into an alert that never fires.
      # The collector creates a counter on its first failure, so a series
      # that is new in the window (`unless ... offset 5m`) counts as its value.
      - uid: meiva-ops-otelcol-enqueue-failures
        title: "OTel Collector rejected telemetry"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-otelcol-enqueue-failures
          metric: otelcol_enqueue_failed
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} collector {{ $labels.exporter }} rejected {{ $values.C }} telemetry items in 5m"
          description: >-
            The OTel Collector on {{ $labels.machine }} could not enqueue
            {{ $values.C }} log records, metric points, or spans for exporter
            {{ $labels.exporter }} in the last 5 minutes. This is active data
            loss, not historical backlog. Restore the runner-to-gateway relay
            or the gateway-local backend and verify the queue drains.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (machine, exporter) (
                  label_replace(increase(otelcol_exporter_enqueue_failed_log_records_total{machine!=""}[5m]), "signal", "log_records", "", "")
                  or on (machine, exporter, signal) label_replace(label_join(increase(otelcol_exporter_enqueue_failed_log_records_total{machine="", machine_name!=""}[5m]), "machine", "", "machine_name"), "signal", "log_records", "", "")
                  or (otelcol_exporter_enqueue_failed_log_records_total{machine!=""} unless otelcol_exporter_enqueue_failed_log_records_total{machine!=""} offset 5m)
                  or
                  label_replace(increase(otelcol_exporter_enqueue_failed_metric_points_total{machine!=""}[5m]), "signal", "metric_points", "", "")
                  or on (machine, exporter, signal) label_replace(label_join(increase(otelcol_exporter_enqueue_failed_metric_points_total{machine="", machine_name!=""}[5m]), "machine", "", "machine_name"), "signal", "metric_points", "", "")
                  or (otelcol_exporter_enqueue_failed_metric_points_total{machine!=""} unless otelcol_exporter_enqueue_failed_metric_points_total{machine!=""} offset 5m)
                  or
                  label_replace(increase(otelcol_exporter_enqueue_failed_spans_total{machine!=""}[5m]), "signal", "spans", "", "")
                  or on (machine, exporter, signal) label_replace(label_join(increase(otelcol_exporter_enqueue_failed_spans_total{machine="", machine_name!=""}[5m]), "machine", "", "machine_name"), "signal", "spans", "", "")
                  or (otelcol_exporter_enqueue_failed_spans_total{machine!=""} unless otelcol_exporter_enqueue_failed_spans_total{machine!=""} offset 5m)
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R15b: records the collector's cluster filter dropped (delta > 0 in 5m) ──
      # `filter/cluster_allow` admits a record only when its `meiva.cluster`
      # routing identity (a digest of the cluster's telemetry token) and its
      # `cluster` display label match the collector's own. A drop means a
      # foreign cluster reached this collector, or the token was re-minted and a
      # producer or collector still holds the old identity: data is being lost
      # silently without this rule. `increase` is load-bearing (monotonic
      # counter; an absolute comparison would alert until the collector
      # restarts).
      - uid: meiva-ops-otelcol-cluster-allow-drops
        title: "OTel Collector cluster filter dropped telemetry"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-otelcol-cluster-allow-drops
          metric: otelcol_cluster_allow_drops
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} collector cluster filter dropped {{ $values.C }} telemetry items in 5m"
          description: >-
            The OTel Collector on {{ $labels.machine }} dropped
            {{ $values.C }} log records, metric points, or spans in the last 5
            minutes because their cluster identity (`meiva.cluster`) or label
            (`cluster`) differs from this collector's own. Either another
            cluster is exporting into this collector, or the cluster's
            telemetry token was re-minted and this collector's rendered config
            (or a producer process) still carries the previous identity:
            converge the collector (`meiva converge`) and restart the
            producers on the machine.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                sum by (machine) (
                  label_replace(increase(otelcol_processor_filter_logs_filtered_total{machine!="", filter="filter/cluster_allow"}[5m]), "signal", "logs", "", "")
                  or label_replace(increase(otelcol_processor_filter_spans_filtered_total{machine!="", filter="filter/cluster_allow"}[5m]), "signal", "spans", "", "")
                  or label_replace(increase(otelcol_processor_filter_datapoints_filtered_total{machine!="", filter="filter/cluster_allow"}[5m]), "signal", "datapoints", "", "")
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R16: recently-seen collector stopped reporting ──
      # noDataState=OK cannot name one missing machine. This set subtraction
      # keeps the per-machine identity: machines observed in 24h but absent for
      # 5m. The instance naturally retires after 24h; machine-heartbeat
      # alerting owns permanent fleet membership, while this rule owns the
      # collector path.
      - uid: meiva-ops-otelcol-host-silent
        title: "OTel Collector stopped reporting"
        condition: D
        # The query's 5m absence window is already the debounce. A second 5m
        # `for` would turn the documented 5m detection into ~10m.
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-otelcol-host-silent
          metric: otelcol_silence
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} collector has not reported for 5 minutes"
          description: >-
            Machine {{ $labels.machine }} reported OTel Collector uptime within the
            last 24 hours but no sample arrived in the last 5 minutes. The
            collector may be down or its runner-to-gateway metrics relay may
            be broken. Check the local meiva-otel-collector session and the
            authenticated gateway OTLP receiver.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                max by (machine) (
                  max_over_time(otelcol_process_uptime_total{machine!=""}[24h])
                  or on (machine)
                  label_join(max_over_time(otelcol_process_uptime_total{machine="", machine_name!=""}[24h]), "machine", "", "machine_name")
                )
                unless on(machine)
                max by (machine) (
                  max_over_time(otelcol_process_uptime_total{machine!=""}[5m])
                  or on (machine)
                  label_join(max_over_time(otelcol_process_uptime_total{machine="", machine_name!=""}[5m]), "machine", "", "machine_name")
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R24: too-old OTLP samples dropped (any increase in 10m) ──
      # The OTLP write path rejects samples older than the receiver's
      # out-of-order window as "too old sample" and, on that permanent error,
      # drops the whole batch, rolling back fresh samples batched with it
      # (task #4650; the LGTM Prometheus configs set that window to 6h). The
      # counter also moves on the silent partial-error path where no 400 and
      # no collector log line exist, so it captures both variants. `increase`
      # is load-bearing: an absolute comparison would alert forever after the
      # first drop. Post-deploy expectation: silent once 6h covers the known
      # replay pattern; a firing instance reports a new, longer-latency episode.
      - uid: meiva-ops-prom-too-old-samples
        title: "Prometheus dropped too-old OTLP samples"
        condition: D
        for: 0m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-prom-too-old-samples
          metric: prom_tsdb_too_old_samples
          team: meiva-ops
        annotations:
          summary: "Prometheus rejected too-old OTLP samples in the last 10m"
          description: >-
            Samples older than the out-of-order window were dropped by the
            receiving Prometheus. Replays of a collector queue frozen during a
            long sleep or outage are the known source; check which machine
            stopped reporting around the drop and whether its wake-up delay
            exceeded the window. Late data was lost — the collector log only
            shows the batch-400 variant, not the silent partial one.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                increase(prometheus_tsdb_too_old_samples_total[10m])
              instant: true
              range: false
            relativeTimeRange:
              from: 600
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Watchdog tick stale (per capability, current or recently seen) ──
      # Completed observations are independent from health. The expectation
      # timestamp also covers root boot without a first completed round. Keep
      # machine/home/process dimensions so a healthy peer cannot hide a silent root.
      - uid: meiva-ops-root-health-stale
        title: "Root stopped completing health rounds"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-root-health-stale
          metric: root_health_stale
          team: meiva-ops
        annotations:
          summary: "{{ $labels.machine }} {{ $labels.home_id }} {{ $labels.process }} has no completed root health round for 3 minutes"
          description: >-
            This root announced expected health rounds within the previous 24
            hours, but the last completed round is stale or no round completed
            after startup. Failed and unavailable observations still complete a
            round; they remain visible in root status and root_diagnostic events.
            Inspect root status and logs. If metrics pipeline alerts also fire,
            inspect the OTLP and Prometheus path before concluding root is stuck.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                (
                  max by (machine, home_id, process) (
                    time() - max_over_time(meiva_root_health_tick_last_tick_timestamp_seconds[3m])
                  ) > 180
                  or
                  (
                    max by (machine, home_id, process) (
                      last_over_time(meiva_root_health_expected_expected_since_timestamp_seconds[24h])
                    ) > 0
                    unless on(machine, home_id, process)
                    max by (machine, home_id, process) (
                      max_over_time(meiva_root_health_tick_last_tick_timestamp_seconds[3m])
                    )
                  )
                )
                and on(machine, home_id, process)
                (
                  max by (machine, home_id, process) (
                    last_over_time(meiva_root_health_expected_expected_since_timestamp_seconds[24h])
                  ) > 0
                )
                and on(machine, home_id, process)
                (
                  time() - max by (machine, home_id, process) (
                    last_over_time(meiva_root_health_expected_expected_since_timestamp_seconds[24h])
                  ) > 180
                )
              instant: true
              range: false
            relativeTimeRange:
              from: 86400
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Gateway application metrics silent (gateway_latency heartbeat absent 5m) ──
      # This Prometheus-native watchdog does not depend on the gateway's events
      # reaching Loki: that exporter is the component whose blindness it detects.
      - uid: meiva-ops-gateway-metrics-silent
        title: "Gateway metrics stream silent (gateway_latency heartbeat)"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-gateway-metrics-silent
          metric: gateway_metrics_silence
          team: meiva-ops
        annotations:
          summary: "The gateway's 60s latency heartbeat stopped reaching Prometheus"
          description: >-
            The gateway's own 60-second gateway_latency heartbeat has stopped
            reaching Prometheus. Either MEIVA_TELEMETRY_OTLP_ENABLED=off disabled
            the whole OTLP surface (the R6 events rule also fires), the gateway's
            OTLP exporter is blind after an init-time collector blip (the
            five-minute retry and otlp_backend_recovered event close that
            episode), or the collector/Prometheus path broke. Triage the
            gateway's [otlp-exporter] log lines and
            meiva_gateway_latency_count_total in Prometheus.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                absent_over_time(meiva_gateway_latency_count_total[5m])
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── Main-red watch silent (main_red_watch_round counter absent 1h) ──
      # The watch runs every 30 minutes and adds 1 to meiva_main_red_watch_round_rounds_total as its
      # last act of a round, so an hour without a sample is two missed slots: the watch stopped, and
      # a red on `main` opens no card while that lasts. One slow round is tolerated, two missed
      # slots are not: tests/scripts/test_alert_rules.py pins the window to twice the cron interval
      # in schedules/manifest.json, so the two cannot drift apart.
      # Every round is a new short-lived process, hence a new series, so the rule asks whether any
      # series has a sample, not for one series' age. The `and` guard keeps the old "no round on
      # record opens nothing" behaviour: a cluster that never ran the watch (or has not yet run its
      # first round on this release) has no series in the last 6 days (Prometheus retains 7), and
      # absence there is not a stopped watch.
      - uid: meiva-ops-main-red-watch-silent
        title: "Main-red watch stopped reporting"
        condition: D
        for: 5m
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: error
          ruleUID: meiva-ops-main-red-watch-silent
          metric: main_red_watch_silence
          team: meiva-ops
        annotations:
          summary: "The main-red watch has recorded no round for an hour"
          description: >-
            No main_red_watch_round has reached Prometheus for an hour (meiva_main_red_watch_round_rounds_total
            has no sample), two missed half-hour slots. This reports the watch, not `main`: while it is
            down, a red on `main` opens no card. Check, in this order, `meiva schedules runs <id>` for the
            main-red-watch schedule (is the entry running, did its last session end interrupted?),
            `meiva schedules logs <id>` (does a round print its fingerprints=... line, or raise before
            printing?), and whether GitHub itself is unreachable or the release-gate workflow was disabled
            (the watch then says so in its own round). A round that completes but whose metrics never
            leave the process looks the same: check the schedule's log for [otlp-exporter] lines and the
            gateway metrics silence rule. Resolves when a round lands again.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                absent_over_time(meiva_main_red_watch_round_rounds_total[1h])
                and on() (count(last_over_time(meiva_main_red_watch_round_rounds_total[6d])) > 0)
              instant: true
              range: false
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: mean
          - refId: D
            datasourceUid: __expr__
            queryType: ""
            model:
              refId: D
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]

      # ── R20: Memory search rows soft warning (task #2088/#2090) ──
      # The memory-search store's absolute row count, sampled every 60s into
      # the meiva_memory_search_stats_rows_ratio gauge (OTLP mirror, job
      # meiva/meiva-memory_search, contract metric name — task #1107). The count
      # only grows between npz rebuilds, so a 2h hold means real growth:
      # 30k soft warning, 50k backend-switch evaluation, 100k hard cap.
      - uid: meiva-ops-memory-search-rows-warning
        title: "Memory search rows above soft threshold"
        condition: D
        for: 2h
        keepFiringFor: *recovery-window
        missing_series_evals_to_resolve: *fast-missing-evals
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
          ruleUID: meiva-ops-memory-search-rows-warning
          metric: memory_search_rows
          team: meiva-ops
        annotations:
          summary: "Memory search store at {{ $values.C }} rows (soft threshold 30000)"
          description: >-
            The memory-search store holds {{ $values.C }} chunk rows for 2 hours,
            above the 30k soft threshold. Baseline growth is ~1160 rows/month;
            50k is the backend-switch evaluation point and 100k the hard cap (R21).
            Triage the npz rebuild and the task #2089 upsert plan before the count
            compounds.
        data:
          - refId: A
            datasourceUid: prometheus
            queryType: ""
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(meiva_memory_search_stats_rows_ratio) > 30000
              instant: true
              range: false
            relativeTimeRange:
              from: 900
              to: 0
          - refId: C
            datasourceUid: __expr__
