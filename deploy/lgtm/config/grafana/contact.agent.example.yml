# Optional site policy. Copy to $MEIVA_HOME/lgtm/alerting/contact.yml and
# replace 1234 with the on-duty agent's ID before converging.
# Keep the agent route first and continuing, so the watchdog heartbeat route below still
# runs. The gateway webhook receiver keeps no alert state: it only counts the watchdog heartbeat.
# Retired direct receivers are tombstoned.
apiVersion: 1
contactPoints:
- orgId: 1
  name: meiva-alerts-webhook
  receivers:
  - uid: meiva-alerts-webhook
    type: webhook
    disableResolveMessage: false
    settings:
      url: $__env{MEIVA_ALERTS_WEBHOOK_URL}
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $__env{MEIVA_ALERTS_WEBHOOK_TOKEN}
- orgId: 1
  name: meiva-agent-webhook
  receivers:
  - uid: meiva-agent-webhook
    type: webhook
    disableResolveMessage: false
    settings:
      url: $__env{MEIVA_ALERTS_WEBHOOK_URL}/agents/1234
      httpMethod: POST
      authorization_scheme: Bearer
      authorization_credentials: $__env{MEIVA_ALERTS_WEBHOOK_TOKEN}
policies:
- orgId: 1
  receiver: meiva-alerts-webhook
  group_by:
  - alertname
  matchers: []
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - receiver: meiva-agent-webhook
    object_matchers:
    - - severity
      - =~
      - critical|error
    continue: true
  - receiver: meiva-alerts-webhook
    object_matchers:
    - - metric
      - '='
      - alert_pipeline_watchdog
    continue: false
    group_by:
    - alertname
    group_wait: 0s
    group_interval: 5m
    repeat_interval: 5m
deleteContactPoints:
- orgId: 1
  uid: meiva-alerts-telegram
