exports = ["delivery.py", "events.py", "launch.py", "launch_reconcile.py", "termination.py"]

[uses]
"__init__.py" = ["events.py", "hosted_turn.py", "launch.py", "resurrect_gates.py", "resurrect_plan.py", "termination.py"]
"delivery.py" = ["__init__.py"]
"launch.py" = ["launch_row.py"]
"termination.py" = ["events.py"]
"tests" = ["__init__.py", "hosted_turn.py", "launch.py", "launch_row.py", "resurrect_plan.py", "termination.py"]

[purity]
"launch_row.py" = "strict"
"resurrect_plan.py" = "strict"

[roots]
"__init__.py" = { kinds = ["settings"], why = "Lifecycle op dispatch root reads the default model from settings; the local agent-host port it hands the stop gate arrives as a required number" }
