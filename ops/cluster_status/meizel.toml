exports = ["schema_mismatch.py"]

[uses]
"__init__.py" = ["model.py", "report.py", "schema_mismatch.py", "sessions.py"]
"report.py" = ["model.py"]
"schema_mismatch.py" = ["model.py"]
"sessions.py" = ["listing.py", "model.py", "shell_plans.py"]
"shell_plans.py" = ["model.py"]
"tests" = ["__init__.py", "listing.py", "model.py", "report.py", "sessions.py", "shell_plans.py"]

[purity]
"listing.py" = "strict"
"model.py" = "strict"
"report.py" = "strict"
"shell_plans.py" = "strict"

[roots]
"__init__.py" = { kinds = ["clock", "settings"], why = "Cluster status snapshot composition root stamps the cluster wall-clock instant, builds the process clock from the settings and hands the session backend the system timers its stop waits run on; the agent-host pidfile it probes arrives as a required path" }

[debt.ambient-read]
"__init__.py#environ base.host.env.registry.process_environment" = 1
