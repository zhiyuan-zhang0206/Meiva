[uses]
"__init__.py" = ["model.py", "report.py", "verdicts.py"]
"__main__.py" = ["__init__.py"]
"report.py" = ["model.py"]
"tests" = ["__init__.py", "__main__.py", "model.py", "report.py", "verdicts.py"]

[purity]
"model.py" = "strict"
"report.py" = "strict"
"verdicts.py" = "strict"

[roots]
"__main__.py" = { kinds = ["home", "argv"], why = "Operator entry of the private-files check resolves the home it verifies when no --root is given; the __main__ guard reads argv[1:] once and hands it to main" }
