[project]
name = "meiva"
version = "1.0.0"
description = "minimal code-as-action agent"
readme = "docs/introduction.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Meiva contributors" }]
keywords = ["agent", "llm", "code-as-action", "langgraph", "anthropic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "psutil>=7.1.0",
    "langchain-anthropic>=0.3",
    "langgraph>=0.3",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "pydantic-settings>=2.13.1",
    # 3.1.3 ships langgraph#8556 (the delta walk cursor starts at the target),
    # so Meiva reads pagination from upstream instead of overriding it.
    # Capped at the minor this adapter was written against: the message-reset
    # reader builds `_DeltaStage2Row`, sorts by `writes_sort_key` and drives
    # three BasePostgresSaver methods, and a minor release is where langgraph
    # reshapes them (3.1.3 itself changed the stage-2 row). The saver refuses a
    # changed surface when it is built; the cap keeps an untested minor out of
    # the lock before anyone finds out.
    "langgraph-checkpoint-postgres>=3.1.3,<3.2",
    # Imported directly: base/agents/history/checkpoint_postgres_walks.py reads
    # `writes_sort_key` (added in 4.3.0) from `langgraph.checkpoint.base`. The
    # postgres pin above supplies it transitively today; the direct import is
    # declared so a future postgres pin cannot silently resolve an older one.
    "langgraph-checkpoint>=4.3",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "loguru>=0.7.3",
    "mcp>=2.0.0,<3",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=0.3",
    "langchain-moonshot>=0.1.0",
    "croniter>=6.2.2",
    "google-genai>=2.0",
    "numpy>=2.4.4",
    "pyte>=0.8.0",  # terminal emulation screen model for PTY sessions (S6 step 2)
    "traceloop-sdk>=0.61",
    # Imported directly: base/telemetry/tracing.py (span exporter, OTLP protobuf encode)
    # and base/telemetry/otlp/telemetry_otlp.py (OTLP/HTTP logs + metrics exporters).
    # Transitively pulled by traceloop-sdk already; declared here because we
    # import them by name.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pyyaml>=6.0.3",
    "httpx[socks]>=0.28",
    # Imported directly by meiva/mcps/_oauth.py (OAuth token exchange and
    # discovery); Starlette 1.2+ TestClient also prefers httpx2 over httpx.
    "httpx2>=2.3.0",
    # Claude Code harness adapter (base/lm/harness/claude). The minor bound is
    # deliberate: the adapter dispatches on the SDK's message class names, so a
    # 0.x minor bump is a mapping change to review, not something to pick up
    # silently.
    "claude-agent-sdk>=0.2.168,<0.3",
    # DeepSeek harness per-turn usage log decompression
    # (base/lm/harness/deepseek/usage_files.py).
    "zstandard>=0.23",
    # --- Common runtime libraries ---
    # Imported directly by first-party code (Pillow, requests, mdit,
    # cryptography, lark, websockets, oss2, trafilatura, feedparser) and
    # invoked by built-in skills (yt-dlp).
    # Heavy ML/numerical libraries are excluded outright: torch / tensorflow / jax /
    # transformers / opencv / numba / dask.
    "Pillow>=10.4.0",  # image processing (PIL)
    "requests>=2.32.0",  # sync HTTP client
    "mdit-py-plugins>=0.6",  # GFM footnote references in shared documents
    "markdown-it-py>=4.0",  # Markdown document reference parsing
    "cryptography>=42.0.0",  # crypto primitives
    "lark-oapi>=1.7.1",
    "websockets>=15.0.1",
    "oss2>=2.19.1",
    "trafilatura>=2.1.0",  # main-content extraction (web-sources skill)
    "feedparser>=6.0.12",  # RSS/Atom parsing (web-sources/rss skill)
    "yt-dlp>=2026.3.17",  # YouTube/media metadata, captions, and audio extraction
]

[project.scripts]
# `uv sync` installs `.venv/bin/meiva` — cluster ops CLI (start/stop/status/update/...).
# Implementation in `cli/main.py` (argparse entry), settings-free domain builders
# and adapters, and `cli/commands/` (cmd_* implementations). Decoupled from the `meiva/`
# SDK — the agent is unaware of docker / cron.
meiva = "cli.main:entry"

[project.urls]
Homepage = "https://github.com/zhiyuan-zhang0206/Meiva"
Repository = "https://github.com/zhiyuan-zhang0206/Meiva"
Issues = "https://github.com/zhiyuan-zhang0206/Meiva/issues"

[build-system]
# hatchling is the default minimal builder for the uv / PEP 621 stack. `[tool.uv] package
# = true` makes `[project.scripts]` take effect and install the `meiva` CLI entry point.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include the application kernel, not only its SDK and CLI. A non-editable
# installation must resolve exec children and service modules without a checkout.
# This packaging step does not activate wheel-based production deployments.
packages = [
    # meizel:roles BEGIN names application
    "agent",
    "meiva",
    "meiva_builtins",
    "base",
    "cli",
    "gateway",
    "ops",
    "services",
    # meizel:roles END
]
# Tests live beside the code they prove (`<pkg>/**/tests/`); a runtime image ships none of them.
exclude = ["**/tests/**"]

[tool.hatch.build.targets.wheel.force-include]
# Existing consumers resolve these siblings of base/. Keep their relative
# layout in the installed application; no Git checkout is needed to read them.
"db/schema.sql" = "db/schema.sql"
"migrations" = "migrations"
"schedules" = "schedules"
"deploy/otel-collector/otel-collector.yaml" = "deploy/otel-collector/otel-collector.yaml"
"deploy/lgtm/config" = "deploy/lgtm/config"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "radon==6.0.1",
    "pre-commit>=4.5.1",
    "basedpyright>=1.40.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.7.0",
    "pytest-xdist>=3.8",
    # ruff 0.16 (migration, task #3162): PLR0917 joins its PLR0913 sibling in
    # the ignore list; RUF036 fixed in-tree; markdown code-block formatting
    # stays out of the format scope for now — see [tool.ruff.format].exclude.
    "ruff>=0.16.7,<0.17",
    "pytest-cov>=7.0",
    "mutmut>=3.5.0",
    "pytest-split",
    "beautifulsoup4>=4.12.3",  # HTML parsing for scripts/model_registry/update_model_pricing.py
]

[tool.ruff]
line-length = 100
# Tool caches unify under `.cache/<tool>/` (docs/conventions/dev-setup.md "Tool caches").
cache-dir = ".cache/ruff"
# No vendored third-party Python ships in-tree today. When some does, exclude it
# here: vendored payload is kept byte-identical to upstream so a future sync can
# diff it directly, and reformatting or relinting it would turn every upstream
# comparison into pure noise. Meiva-authored prose beside it is still reviewed
# normally; only the untouched upstream payload is exempt. Inventory and the
# license bar a pack must clear: meiva_builtins/skills/VENDORED.md.

[tool.ruff.lint]
external = ["S112"]  # checked by a separate pre-commit Ruff invocation; keep its noqa reasons valid
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "ARG",          # unused arguments
    "C4",           # comprehensions
    "PTH",          # pathlib over os.path
    "PIE",          # misc
    "RET",          # return statements
    "Q",            # quotes
    "RSE",          # raise statements
    "DTZ",          # datetime timezone
    "S",            # bandit security
    "TID251", "TID253",  # banned imports; package-relative style has a separate owner
    "LOG",          # logging
    "PL",           # pylint
    "TRY",          # tryceratops (try/except best practices)
    "FBT",          # boolean trap
    "ANN",          # type annotations
    "T20",          # flake8-print: framework code logs via base.log.logger, not print()
]
ignore = [
    "E501",         # line too long — formatter handles
    "S102",         # exec() is core to this design
    "S112",         # checked separately with typed exceptions off; the shared
                    # flake8-bandit switch needed for S110 would flag 138
                    # existing typed `except: continue` paths outside this task
    "PLR0911",      # too many return statements — dispatch-style match/case naturally has many returns
    "PLR0912",      # too many branches — top-level orchestration functions (cmd_start etc.) naturally have many branches
    "PLR0913",      # too many arguments
    "PLR0917",      # too many positional arguments — same policy as PLR0913
    "PLR2004",      # magic value comparisons
    "PLC0415",      # import inside function
    "TRY003",       # long exception messages
    "TRY300",       # consider moving to else block
    "S607",         # partial executable path — we resolve git / npx / uvx all via PATH,
                    # don't pin absolute paths (varying across dev / docker environments is a feature, not a bug)
    "ANN401",       # allow Any — LangGraph state dict / SDK reflection / MCP dynamic
                    # tool dispatch etc. naturally can't be precisely typed
    "PLC0414",      # `from X import Y as Y` is PEP 484 explicit re-export, required under pyright
                    # strict; ruff by default treats alias-equal-to-original as a noop, conflicting
                    # with typed Python convention. Allowed across the codebase.
]

[tool.ruff.lint.flake8-bandit]
# Match the former fail-fast lint: typed handlers with lone `pass` count too.
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Graph-run dependencies belong to the existing Runtime[MeivaContext], not a
# second implicit ContextVar context. Outside a graph run, pass the caller's
# context explicitly; get_runtime() is not a process-wide service locator.
# contextvars allowlist lock (user ruling 2026-08-27, audit #3607): contextvar
# usage is a mechanism-layer concern — LangGraph's runtime itself propagates
# contextvars (pregel copy_context / get_runtime), and the SDK / log /
# telemetry / retry-policy readers sit outside node signatures, so a blanket
# ban is not possible. New uses need a written justification in the PR
# description before joining the per-file-ignores allowlist below.
"contextvars" = { msg = "Use LangGraph Runtime[MeivaContext] for graph-run dependencies and explicit parameters outside a graph run. Do not create a second implicit context. contextvars is restricted to existing mechanism owners; see docs/conventions/python-conventions.md." }

[tool.ruff.lint.per-file-ignores]
# `tests/*` is the top-level tests directory; `**/tests/*` every package's own
# `<pkg>/**/tests/` (tests live beside the code they prove).
"tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "ANN", "FBT", "RUF001", "RUF002", "RUF003"]
"**/tests/*" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "ANN", "FBT", "RUF001", "RUF002", "RUF003"]
"demos/*" = ["RUF001", "RUF002", "RUF003", "ARG001", "S108"]
# This demo's deliverable is its terminal report; a log sink would bury it.
"demos/claude-sdk-bridge/bridge_demo.py" = ["T201"]
# The fake SDK must expose the SDK's own constructor name, which is a class name
# used as a method.
"base/lm/harness/claude/tests/fake_sdk.py" = ["N802"]
# schedules/* are version-controlled deployment templates (runnable scripts
# referenced by the ops docs), not runtime source: exempt them from source-level
# rules (typing, ambiguous unicode, security heuristics) so they stay readable.
# DTZ is deliberately NOT exempt: these scripts decide when things fire, so a
# naive datetime here is a scheduling bug, not a style nit.
"schedules/*" = ["ANN", "RUF003", "S", "PTH", "TID", "I", "UP", "Q", "RET", "ARG", "PLR2004", "T201"]
# FBT: a boolean positional in a test is the value-under-test (e.g.
# `validate("browser_enabled", True)`), not a real boolean-trap call site.
# .agents/skills (the kernel-contributor project skills) carry the same kind of
# runnable reference CLIs (e.g. meiva-self-development's changelog generator).
".agents/skills/*/reference/*.py" = ["T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806"]
# Skill scripts are runnable CLIs the agent invokes via bash: print() is their
# stdout contract (T20); they drive the OS through hardcoded subprocess commands
# (open / screencapture / osascript / pbcopy) writing to a /tmp scratch dir, so
# the subprocess/temp-file security lints are noise (S603, S108); boolean flags
# and best-effort subprocess.run are fine here (FBT, PLW1510, PTH, ANN).
"meiva_builtins/skills/*/scripts/*.py" = ["T20", "S603", "S108", "FBT", "PLW1510", "PTH", "ANN"]
# These three skills' scripts/ moved out of a former reference/*.py or
# skill_support/** path (path_imports fix, Rule 6) unchanged: same relaxation
# their content had there, so the move itself does not force an unrelated
# style/complexity cleanup onto code nobody otherwise touched. Additive to the
# base scripts/*.py entry above, not a replacement.
"meiva_builtins/skills/coordination/meiva-dynamic-workflow/scripts/*.py" = ["DTZ005", "N806"]
"meiva_builtins/skills/platform/meiva-self-evolution/scripts/*.py" = ["S112", "RUF059", "PLR0915", "PLW0603"]
"meiva_builtins/skills/platform/meiva-guide/external-agents/scripts/*.py" = ["PLR0915"]
# A skill's references/ holds genuine reference material — mostly prose, but
# occasionally a Python snippet the agent reads and adapts rather than runs in
# place (e.g. meiva-dynamic-workflow's orchestrator templates, string-patched
# and launched through an API, not executed as a file). Not the maintained
# live path, so the same broad relaxation as .agents/skills/*/reference/*.py
# above applies.
"meiva_builtins/skills/*/references/*.py" = ["T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806", "ANN201", "DTZ005", "PTH123"]
# Project skills under .agents/skills/ ship the same kind of runnable CLI
# scripts — same exemptions apply.
".agents/skills/*/scripts/*.py" = ["T20", "S603", "S108", "S310", "FBT", "PLW1510", "PTH", "ANN"]
# Same intent for skill reference files bundled inside a plugin's skill package
# (a plugin can ship its own skill tree under meiva_builtins/plugins/<name>/skills/...).
"meiva_builtins/plugins/*/skills/**/reference/*.py" = ["T20", "B904", "F841", "RUF059", "PLW1510", "S110", "S112", "S603", "C401", "PLR0915", "N806"]
"meiva_builtins/plugins/*/skills/**/scripts/*.py" = ["T20", "S603", "S108", "FBT", "PLW1510", "PTH", "ANN"]
"scripts/**" = ["ANN", "T20"]
# This operator tool inserts the repository root on sys.path before importing
# first-party modules, so it can run from any working directory with the
# checkout venv. The bootstrap is a code statement ahead of those imports by
# design; E402 records that ordering, not a stray import.
"scripts/host_ops/tcc/onboard-helper-grants.py" = ["E402"]
# Same ordering as the tool above: the repository root has to be on sys.path
# before the base.* imports, so E402 records that, not a stray import.
"scripts/host_ops/tcc/request_grants_evidence.py" = ["E402"]
# These are the helper-spawned child programs: each one performs a single fixed
# OS action (list a folder, send one AppleEvent, query tccd) and reports the
# outcome verbatim. S603 records the fixed argv built here; BLE001 is the point
# of the file -- any failure must reach the parent as a verdict, not a crash.
"base/host/permissions_helper/grants/children/*.py" = ["S603", "BLE001"]
# The weekly dependency audit calls fixed https upstream URLs and fixed audit-tool
# argv (uvx / npm / gh) — every site is a literal with static arguments, so the
# bandit heuristics would only restate those two lines.
"scripts/ci/dependency_audit.py" = ["S310", "S603"]
# The policy-removal gate reads a queued batch's pull request bodies through fixed
# `gh pr view <n> --json title,body` argv. The number is the only variable in it, it is
# an integer parsed out of the batch's own pull request body, and no shell is involved,
# so S603 (untrusted subprocess input) has nothing to flag.
"scripts/lint/policy_removal.py" = ["S603"]
# The change-scoped check runner drives the repository's own tools — git, basedpyright,
# ruff, pytest and the test selector — through argv lists with no shell anywhere. Two sites
# take the changed paths as arguments, which are the diff's own file names, so S603 has
# nothing to flag here.
"scripts/hooks/diff_checks.py" = ["S603"]
"meizel/**" = ["ANN", "T20"]
# The typed S110 findings in scripts/tests were outside the retired lint's
# production scan; preserve that boundary.
"scripts/codegen/gen_config_lite_table.py" = ["S110"]
"agent/graph/claim/tests/test_core.py" = ["S110"]
"base/deploy/schema/tests/test_migration_reset.py" = ["S110"]
"tests/integration/test_grafana_native_runtime.py" = ["S110"]
# T20 exemptions — print() is legitimate here: cli/ writes to the user's
# terminal; meiva/ and plugins/ print() is agent-facing dump (help() / context
# injection), the SDK's documented output channel.
"cli/*" = ["T20"]
"meiva/*" = ["T20"]
"meiva_builtins/plugins/*" = ["T20"]
# ops CLI runs cron / curl — all hardcoded commands + static args;
# S603 (subprocess untrusted input) is meaningless.
"cli/commands/*.py" = ["S603"]
"services/desktop/permissions_helper/tests/test_helper_retirement.py" = ["S603"]
"services/supervision/healthchecks/*.py" = ["S603"]
# The fleet-update halves drive fixed git/ssh/script argv — repo-owned or
# operator-supplied arguments, never a shell — and their tests do the same, so
# S603 (untrusted input) is inapplicable. cli/fleet_update.py also redacts a
# secret-name regex (S105), probes a fresh remote 0700 /tmp path (S108), and
# re-wraps a failed stop with the retry hint from inside its try (TRY301).
"cli/fleet_update/*.py" = ["S603", "S105", "S108", "TRY301"]
"cli/tests/fleet_update/*.py" = ["S603"]
"base/deploy/lifecycle/tests/*.py" = ["S603", "T201"]
"tests/ci/prepush/test_prepush_branch_diff.py" = ["S603"]
# Pre-push selectors run only fixed repo-local commands — git queries and
# scripts/hooks/prepush-*.sh — with repo-owned path arguments, never a shell;
# S603 (untrusted input) is inapplicable. The contract lives in
# scripts/provision/docs/prepush-selection.meiva.okf.md.
"scripts/provision/prepush_branch_diff.py" = ["S603"]
"scripts/provision/prepush_frontend.py" = ["S603"]
# The inspector-widget surface's exception names read as their refusal events
# (DuplicateInspectWidget, the sibling of the metric face's DuplicateMetric);
# the structured-comment gate leaves no inline-suppression slot for that
# rationale, so the Error-suffix rule is silenced here. Contract:
# base/packages/plugins/docs/inspector-widgets.meiva.okf.md.
"base/packages/plugins/surface/inspector.py" = ["N818"]
# brew_prefix resolves the Homebrew prefix through a fixed argv; the optional
# formula name is a local literal, not external input.
"base/host/brew_pin.py" = ["S603"]
# meiva_syntax_fix uses fullwidth chars in docstrings as examples of what the fixer targets,
# and carries Chinese notes from data analysis of real error corpora.
"meiva_builtins/plugins/meiva_syntax_fix/*" = ["RUF001", "RUF002", "RUF003"]
# CJK regex explanation comment — legitimate.
"scripts/lint/agent_docstrings.py" = ["RUF003"]

# contextvar mechanism owners — the only files allowed to import contextvars
# (allowlist lock, user ruling 2026-08-27, audit #3607). New use points must be
# justified in the PR description before joining this list.
"base/native_process/turn_identity.py" = ["TID251"]
# SDK async tasks must not share active call frames or borrowed identity.
"base/agents/sdk/telemetry.py" = ["TID251"]
"base/packages/plugins/context.py" = ["TID251"]
"meiva/sdk_surface/help.py" = ["TID251"]
"meiva/sdk_surface/discovery.py" = ["TID251"]
"services/agent_runner/agent_host/runtime.py" = ["TID251"]
# An operator CLI: its report on stdout is the contract.
"services/derived/memory_indexer/memory_search_reconcile.py" = ["T201"]
# tests may import contextvars to exercise the propagation contracts
"meiva/tests/test_turn_identity_meiva.py" = ["TID251"]
"agent/graph/tests/test_turn_scoped_retry.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["meiva", "cli", "base", "runtime"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
# Markdown code-block formatting (stable in 0.16) stays out of scope until
# adopted deliberately — 55 tracked docs would reflow otherwise (task #3162).
exclude = ["*.md"]

[tool.pytest.ini_options]
# Bare `pytest` (and CI's shards, which pass no positional path) collects the
# top-level `tests/` and every package's own `<pkg>/**/tests/`. pytest expands
# these as recursive globs from the rootdir; `tests/ci/test_collection_roots.py`
# keeps them complete (a tests directory outside every glob is never collected,
# and pytest does not warn about it).
testpaths = [
    # meizel:roles BEGIN testpaths tests application tooling templates
    "tests",
    "agent/**/tests",
    "meiva/**/tests",
    "meiva_builtins/**/tests",
    "base/**/tests",
    "cli/**/tests",
    "gateway/**/tests",
    "ops/**/tests",
    "services/**/tests",
    "meizel/**/tests",
    "scripts/**/tests",
    "schedules/**/tests",
    # meizel:roles END
]
# A test module is a `test_*.py` file inside a `tests/` directory. Location, not
# just the file name, makes it a test: `base/db/test_db_guard.py` and
# `scripts/ci/test_selector.py` are production modules that a whole-repo
# collection would otherwise import as test modules. (pytest matches a pattern
# containing `/` against the whole path, where `*` also spans `/`.)
python_files = ["*/tests/test_*.py", "*/tests/*/test_*.py"]
pythonpath = ["."]
# Tool caches unify under `.cache/<tool>/` (docs/conventions/dev-setup.md "Tool caches").
cache_dir = ".cache/pytest"
# importlib mode lets tests/ not require __init__.py; same-named test_X.py in different subdirs
# also doesn't collide (pytest uses full module path tests.foo.test_X rather than bare test_X). The default
# prepend mode requires __init__.py for every dir containing tests, inconsistent and prone to basename collisions.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "native_permissions_helper: explicit isolated native helper proof; owns artifact, signing and exact-home job cleanup",
    "real_service_readiness_gate: let this test call the real root readiness wait (root_readiness.wait_for_service_tree)",
    "real_health_port_gate: let this test call the real _occupied_health_ports",
    # Tests that are timing-sensitive, race-prone, or use real DB LISTEN/NOTIFY —
    # run serial (-n 1) while stable tests run parallel (-n auto).
    "flaky: timing-sensitive or race-prone test that must run serially",
    "registry: asserts that a whole-repository table equals what the tracked files hold (the callers of a function, the emit sites); the PR selector always runs it, since a call site in any file can change its verdict",
    # e2e fake-LLM scenario selector; registered globally (not only in
    # tests/e2e/conftest.py): tests outside tests/e2e import e2e modules, and
    # --ignore=tests/e2e runs never load that conftest.
    "scenario(module_factory): specify fake LLM scenario module:factory string",
    # A test whose subject is one operating system (launchd, TCC, codesign, swiftc)
    # names it here; the root conftest plugin turns the marker into a skip on every
    # other platform, and a CI lane must run it on the named one. Everything else
    # injects a fake `Host` (base/host/system/tests/fake_commands.py) instead. See
    # docs/conventions/testing.md "Platform-dependent tests".
    "requires_host(system): the test proves one host OS's own behavior; skipped on the others",
]
# The kernel goes fully async (psycopg AsyncConnection / AsyncPostgresSaver / aioredis
# / asyncio.create_subprocess_exec) — tests written as `async def test_...` auto-run,
# no need to hang `@pytest.mark.asyncio` on each. Pure synchronous tests (UI / SDK / pure
# helpers) are unaffected.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Actionable warnings are fixed at the source, not filtered: psycopg
# ConnectionPool `open=` at each call site; the langgraph `allowed_objects`
# PendingDeprecationWarning by upgrading langgraph-checkpoint to 4.1.1 (it now
# passes `Reviver(allowed_objects="core")`). The one filter here is a
# test-harness artifact: starlette's TestClient warns when code under test
# passes `timeout=` to its httpx-shaped client (bootstrap.fetch_bootstrap_config
# does, correctly, for real httpx in prod) — not a prod issue.
filterwarnings = [
    "ignore:You should not use the .timeout. argument with the TestClient:DeprecationWarning",
    # traceloop's own models still use pydantic v1 class-based `config`. Scoped to
    # traceloop's module so our own class-based-config deprecations stay visible.
    "ignore::pydantic.PydanticDeprecatedSince20:traceloop.sdk.prompts.model",
]

[tool.coverage.run]
relative_files = true
# Must match the CI shards' --cov= flags (ci.yml backend-shard / backend-serial).
# agent/meiva/gateway/base/ui is the historical set; cli joined 2026-08-25
# (tech audit P1 — measured 82% standalone with tests/cli).
# ops/services/meiva_builtins joined 2026-08-29 (tech audit 2026-08-24 finding
# #10 follow-up, Task #1570): measured into the same coverage data, but gated
# separately by scripts/ci/coverage_gates.py's per-risk-domain minimum line
# floors instead of the 85% combined gate — their standalone coverage (ops 48%
# via tests/ops; services and meiva_builtins lower) would take the combined
# line-rate below threshold even though their test suites DO run in every CI
# shard. They stay high-incident domains (deploy/backup/watchdog/ops), so the
# floors are the gate, not the exclusion.
# Skill reference/scripts dirs are omitted from measurement: they are
# standalone scripts the test suite mostly never imports (installed skill
# copies), so measuring them would drag the meiva_builtins floor toward dead
# lines instead of executable ones.
source = [
    # meizel:roles BEGIN names application frontend
    "agent",
    "meiva",
    "meiva_builtins",
    "base",
    "cli",
    "gateway",
    "ops",
    "services",
    "ui",
    # meizel:roles END
]
# Package `__init__.py` files are measured: a module that becomes a package
# keeps its code in the package door (`x.py` -> `x/__init__.py`), and omitting
# doors would drop that code from its domain's floor. An empty or re-export-only
# door costs nothing — its lines run on import.
omit = [
    "*/__main__.py",
    "*/tests/*",
    "meiva_builtins/skills/*/*/scripts/*",
    "meiva_builtins/skills/*/*/references/*",
]

[tool.coverage.paths]
source = [
    ".",
    "/__w/Meiva/Meiva",
    "/home/runner/work/Meiva/Meiva",
]

[tool.coverage.report]
# fail_under is intentionally NOT set here: the hard gate lives in ci.yml's
# coverage-gate steps (BACKEND_COVERAGE_THRESHOLD=85 / FRONTEND_COVERAGE_THRESHOLD=81),
# whose env fallbacks equal the env values. Local runs use this file's
# measurement set ([tool.coverage.run].source) without a blocking floor
# (audit round-2 tests-ci P2 — the old comment described a pre-gate era).
# fail_under = 60
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"


[tool.pyright]
# "strict" mode: catches real bugs (un-unwrapped Optional, parameter type mismatch, missing
# attribute, wrong call signature) + enforces type annotation completeness in this repo.
# Every strict rule that produces actionable signal here stays at error level and blocks merge.
# The seven reportUnknown*/reportMissing* rules are global errors: the whole repository, tests
# included, is at 0 (measured with basedpyright on 2026-11-03, whole repo, via the CI run of #8303
# at 857e6f3ae). The remaining basedpyright-only rules are a ladder of their own:
#   reportAny                      25702 (8553 outside tests dirs; base 1957, scripts 1474,
#                                   services 1298, cli 1173, meiva_builtins 1130, gateway 772,
#                                   meiva 278, agent 207, meizel 185, ops 79)
#   reportExplicitAny               6589 (2329 outside tests dirs; base 877, services 457,
#                                   scripts 248, meiva_builtins 234, meiva 138, agent 136,
#                                   cli 132, gateway 83, ops 13, meizel 11)
#   reportUnusedCallResult         18291 (3212 outside tests dirs; base 726, scripts 595,
#                                   services 573, cli 474, meiva_builtins 299, gateway 171)
# They stay at "warning" globally and are raised to "error" directory by directory through the
# executionEnvironments below, as each directory's count reaches 0.
#   reportUnreachable, reportUnsafeMultipleInheritance, reportIgnoreCommentWithoutRule:
#   fixed, 0 and at "error".
# reportUnnecessaryIsInstance stays fully OFF (see its own note below).
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Point pyright at the in-checkout venv so it resolves third-party imports when
# invoked directly (`.venv/bin/pyright`) — without this it only finds the venv
# when `uv run` has exported VIRTUAL_ENV, so a bare/pre-commit invocation would
# report every third-party import as unresolved.
venvPath = "."
venv = ".venv"
stubPath = "typings"
include = [
    # meizel:roles BEGIN names application tooling tests
    "agent",
    "meiva",
    "meiva_builtins",
    "base",
    "cli",
    "gateway",
    "ops",
    "services",
    "meizel",
    "scripts",
    "tests",
    # meizel:roles END
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    # `.claude/worktrees` is the actual location of the current worktree.
    ".claude/worktrees",
    # A skill's references/ holds agent-facing examples the agent reads and
    # adapts, not importable code — they cite plugin-provided `meiva.*` surface
    # (e.g. `meiva.self.log`) absent from a bare `import meiva`. Mirrors the ruff
    # per-file-ignores for the same paths. scripts/ is NOT excluded: it holds
    # the skill's real, maintained CLI entry points, and those are checked.
    "meiva_builtins/skills/*/*/references",
    "meiva_builtins/plugins/*/skills/**/reference",
]
# Libraries with incomplete third-party stubs — temporarily lenient.
reportMissingTypeStubs = false
# Type stubs in typings/ may stand in for optional provider SDKs absent from basic venv.
reportMissingModuleSource = false
# tests deliberately import internal helpers prefixed with underscore (_handle_compact_if_any
# etc.) for unit tests, not as implementation users.
reportPrivateUsage = "none"
reportUnusedFunction = "none"
# The unknown/missing-annotation family: any finding is an error everywhere, so a new untyped
# function or an unparameterized generic cannot land.
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingTypeArgument = "error"
# defensive isinstance/issubclass at dispatch entry points (e.g. plugin author passed a non-
# BaseModel / env-loaded factory return / plugin-tampered meiva.state_update) is a
# fail-fast guard, pulling "caller error" forward to an entrypoint TypeError, not dead code.
# pyright statically over-narrows the guarded value (it can't see the runtime-dynamic source) and
# flags every such guard as "unnecessary" — all 18 current findings are false positives of exactly
# this kind, so the rule is off rather than left as ignored warnings.
reportUnnecessaryIsInstance = "none"
# basedpyright-only rules. The first three are at 0 and gate merge. The other three stay at
# "warning" (visible in CI logs, not blocking) until their counts, listed in the header, are paid
# down: reportAny and reportExplicitAny come from boundary data (json, DB rows, argparse
# namespaces, starlette app.state) and our own `Any` annotations; reportUnusedCallResult is
# dominated by call statements in tests.
reportUnsafeMultipleInheritance = "error"
reportUnreachable = "error"
reportIgnoreCommentWithoutRule = "error"
reportAny = "warning"
reportExplicitAny = "warning"
reportUnusedCallResult = "warning"

# The seven reportUnknown*/reportMissing* rules are global errors, so every file is held to them
# wherever it sits. A directory entry below that also holds reportAny / reportExplicitAny would
# hold the tests under it to them too; while some tests still owe their Any debt, their path prefix
# is listed in TESTS_OWING_ANY (scripts/codegen/gen_pyright_test_environments.py) and each tests
# directory under it whose covering entry holds the Any rules gets a generated entry of its own that
# carries no Any rule. pyright takes the FIRST entry whose root contains a file and a root is a
# plain directory (no globs), so that is the only way to exempt a tests directory from its covering
# entry. The entries are GENERATED, one per tests directory, sorted by root: run
# `.venv/bin/python scripts/codegen/gen_pyright_test_environments.py` after adding, moving or
# removing a tests directory under a listed prefix (the pre-commit hook
# `lint-pyright-test-environments` and tests/ci/test_pyright_test_environments.py fail until you
# do). Do not edit between the markers. The generator and this region go when the last prefix
# leaves TESTS_OWING_ANY, that is when reportAny is a global error.
# BEGIN GENERATED pyright tests environments (scripts/codegen/gen_pyright_test_environments.py; edit nothing between the markers)
