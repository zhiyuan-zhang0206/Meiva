# runtime `__file__`-derived sys.path guard (Structure Rule 6) — pyright does
# not execute that guard, so it needs the same directory named explicitly to
# resolve the sibling import statically. Each skill's own scripts/ resolves
# its OWN same-directory siblings without help (a file's containing directory
# is always on pyright's implicit search path); only the parent-reaching case
# needs extraPaths.
