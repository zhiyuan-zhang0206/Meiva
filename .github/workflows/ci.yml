          echo "MEIVA_HOME=$RUNNER_TEMP/meiva-home" >> "$GITHUB_ENV"

      - name: Real build + ad-hoc sign + DR readback + launchd ping
        run: uv run python -m scripts.ci.helper_smoke.signing_smoke run

      - name: Two-section chain smoke (keeper semantics)
        run: |
          uv run python -m scripts.ci.helper_smoke --skip-attribution

      - name: Tear down helper launchd job
        if: ${{ always() }}
        run: |
          export MEIVA_HOME="${MEIVA_HOME:-$RUNNER_TEMP/meiva-home}"
          label="$(uv run python -m scripts.ci.helper_smoke.signing_smoke label 2>/dev/null || true)"
          if [[ -n "$label" ]]; then
            launchctl bootout "gui/$(id -u)/$label" || true
          fi
          launchctl bootout "gui/$(id -u)/com.meiva.test.two-section-chain-smoke" || true

  host-marks:
    name: host marks (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && needs.classify.outputs.run_host_marks == 'true' }}
    env:
      MEIVA_DB_URL: ""
      MEIVA_REDIS_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Create isolated Meiva home
        run: |
          mkdir -p "$RUNNER_TEMP/meiva-home"
          echo "MEIVA_HOME=$RUNNER_TEMP/meiva-home" >> "$GITHUB_ENV"

      - name: Census the selection
        run: uv run python -m scripts.ci.host_marks_census

      - name: Run the host declarations
        run: uv run pytest -m requires_host -q --junit-xml=tmp/junit-host-marks.xml

      - name: Upload census and report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-marks-census
          if-no-files-found: warn
          path: |
            tmp/host-marks-census.json
            tmp/junit-host-marks.xml

  backend:
    name: backend (pytest + pyright)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [classify, backend-static, backend-static-tests, backend-structure, backend-shard, backend-selected, backend-serial, backend-pgvector-smoke, helper-signing-smoke, host-marks]
    if: ${{ !cancelled() && (needs.classify.result == 'failure' || (needs.classify.result == 'success' && (needs.classify.outputs.backend == 'true' || needs.backend-structure.result != 'success'))) }}
    env:
      COVERAGE_DATA_GROUPS: "1 2 3 4 5 6 7 8 serial static-1 static-2 static-3 static-4"
    steps:
      - name: Verify backend job results
        env:
          DECISION: ${{ needs.classify.outputs.decision }}
        run: |
          ok=true
          fail() { echo "::error::$1"; ok=false; }
          check() { if [ "$2" != "success" ]; then fail "$1: $2"; fi; }
          check_lane() {
            if [ "$3" = "true" ]; then
              check "$1" "$2"
            else
              case "$2" in
                skipped|success) ;;
                *) fail "$1: $2 (expected skipped)";;
              esac
            fi
          }
          check classify "${{ needs.classify.result }}"
          check backend-structure "${{ needs.backend-structure.result }}"
          if [ "${{ needs.classify.outputs.backend }}" != "true" ]; then
            if [ "$ok" = "false" ]; then exit 1; fi
            echo "structure verified; no backend suite requested"
            exit 0
          fi
          case "${{ needs.classify.outputs.selector }}" in
            failure|cancelled) fail "test selector: ${{ needs.classify.outputs.selector }}";;
          esac
          check backend-static "${{ needs.backend-static.result }}"
          check backend-static-tests "${{ needs.backend-static-tests.result }}"
          check_lane backend-serial "${{ needs.backend-serial.result }}" "${{ needs.classify.outputs.run_serial }}"
          check_lane backend-pgvector-smoke "${{ needs.backend-pgvector-smoke.result }}" "${{ needs.classify.outputs.run_pgvector_smoke }}"
          check_lane helper-signing-smoke "${{ needs.helper-signing-smoke.result }}" "${{ needs.classify.outputs.run_helper_smoke }}"
          check_lane host-marks "${{ needs.host-marks.result }}" "${{ needs.classify.outputs.run_host_marks }}"
          if [ "$TEST_SELECTION_MODE" = "enforce" ] && [ "$DECISION" = "SELECTED" ]; then
            check backend-selected "${{ needs.backend-selected.result }}"
            case "${{ needs.backend-shard.result }}" in
              failure|cancelled) fail "backend-shard: ${{ needs.backend-shard.result }} (enforce+SELECTED)";;
            esac
          else
            check backend-shard "${{ needs.backend-shard.result }}"
          fi
          if [ "$ok" = "false" ]; then
            echo "a backend job did not succeed: static=${{ needs.backend-static.result }} static-tests=${{ needs.backend-static-tests.result }} structure=${{ needs.backend-structure.result }} shards=${{ needs.backend-shard.result }} selected=${{ needs.backend-selected.result }} serial=${{ needs.backend-serial.result }} pgvector-smoke=${{ needs.backend-pgvector-smoke.result }} helper-signing-smoke=${{ needs.helper-signing-smoke.result }} host-marks=${{ needs.host-marks.result }} mode=$TEST_SELECTION_MODE decision=$DECISION"
            exit 1
          fi
          echo "backend jobs verified (mode=$TEST_SELECTION_MODE decision=$DECISION)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Download shard coverage
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine coverage + gate
        if: ${{ !(env.TEST_SELECTION_MODE == 'enforce' && needs.classify.outputs.decision == 'SELECTED') }}
        env:
          BACKEND_COVERAGE_THRESHOLD: "85"
        run: |
          coverage_files=(coverage-data-*)
          if [ ! -e "${coverage_files[0]}" ]; then
            coverage_files=()
          fi
          echo "coverage data files arrived: ${#coverage_files[@]}"
          missing_groups=()
          for group in $COVERAGE_DATA_GROUPS; do
            if [ ! -f "coverage-data-$group" ]; then
              missing_groups+=("$group")
            fi
          done
          if [ "${#missing_groups[@]}" -gt 0 ]; then
            missing_coverage_data=()
            for group in "${missing_groups[@]}"; do
              missing_coverage_data+=("coverage-data-$group")
            done
            missing_coverage_data="${missing_coverage_data[*]}"
            echo "::warning title=coverage data incomplete::missing $missing_coverage_data — a shard's coverage upload failed after a retry (artifact-service failure, not a test failure); the gate below scores the data that arrived"
            {
              echo "### Coverage data incomplete"
              echo "Missing $missing_coverage_data: a shard's coverage upload failed after a retry (artifact-service failure, not a test failure)."
              echo "A gate failure while coverage data is incomplete may be caused by missing data, not a coverage regression."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          uv run coverage combine coverage-data-*
          uv run coverage json -o coverage.json
          uv run python scripts/ci/coverage_gates.py coverage.json

  backend-test-counts:
    name: backend test counts (all shards)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    needs: [classify, backend-static-tests, backend-shard, backend-serial]
    if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && (needs.classify.outputs.mode != 'enforce' || needs.classify.outputs.decision != 'SELECTED') }}
    permissions:
      contents: read
      actions: read
    env:
      COUNT_GROUPS: "1 2 3 4 5 6 7 8 serial static-1 static-2 static-3 static-4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download executed test counts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-counts-*
          path: shard-counts
          merge-multiple: true

      - name: Fetch the previous baseline total
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          candidates="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_dispatch --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId')"
          for run_id in $candidates; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name test-count-baseline --dir baseline; then
              echo "baseline: main full run $run_id"
              break
            fi
          done

      - name: Sum the executed test counts
        continue-on-error: true
        run: >
          python3 scripts/ci/shard_counts.py total --dir shard-counts
          --expected "$COUNT_GROUPS" --baseline baseline/test-count-baseline.json
          --out test-count-baseline.json --summary "$GITHUB_STEP_SUMMARY"
          --leak-report test-leak-report.json
          --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

      - name: Upload the leak report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-leak-report
          path: test-leak-report.json
          if-no-files-found: ignore

      - name: Record the total as the next baseline
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-count-baseline
          path: test-count-baseline.json
          if-no-files-found: ignore

  test-selection-shadow-report:
    name: test selection shadow report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    needs: [classify, backend, backend-shard, backend-selected]
    if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && needs.classify.outputs.mode != 'enforce' }}
    steps:
      - name: Compare full and selected subset outcomes
        continue-on-error: false
        shell: bash
        env:
          FULL_BACKEND_RESULT: ${{ needs.backend.result }}
          FULL_PYTEST_RESULT: ${{ needs.backend-shard.result }}
          SUBSET_RESULT: ${{ needs.backend-selected.result }}
          DECISION: ${{ needs.classify.outputs.decision }}
          REASON: ${{ needs.classify.outputs.reason }}
          EST_SECONDS: ${{ needs.classify.outputs.est_seconds }}
          FULL_EST_SECONDS: ${{ needs.classify.outputs.full_est_seconds }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          mkdir -p tmp
          case "$SUBSET_RESULT" in
            success) SUBSET_STATUS=0 ;;
            failure) SUBSET_STATUS=1 ;;
            *) SUBSET_STATUS="" ;;
          esac
          export SUBSET_STATUS
          false_green=0
          if [ "$DECISION" != "SELECTED" ]; then
            echo "no comparison this run (decision=$DECISION)"
          elif [ -z "$SUBSET_STATUS" ] || [ "$SUBSET_STATUS" = "5" ]; then
            echo "no comparison this run (selected subset did not complete)"
          elif [ "$FULL_PYTEST_RESULT" != "success" ] && [ "$FULL_PYTEST_RESULT" != "failure" ]; then
            echo "no comparison this run (full non-flaky pytest=$FULL_PYTEST_RESULT)"
          elif [ "$SUBSET_STATUS" = "0" ] && [ "$FULL_PYTEST_RESULT" = "success" ]; then
            echo "consistent (green/green)"
          elif [ "$SUBSET_STATUS" = "0" ] && [ "$FULL_PYTEST_RESULT" = "failure" ]; then
            echo "::error::FALSE GREEN: selected subset passed but full non-flaky pytest failed."
            false_green=1
          elif [ "$FULL_PYTEST_RESULT" = "success" ]; then
            echo "subset false-negative"
          else
            echo "both red (subset != full is indicative)"
          fi
          export FALSE_GREEN="$false_green"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def optional_float(name: str) -> float | None:
              value = os.environ[name]
              return float(value) if value else None

          def optional_int(name: str) -> int | None:
              value = os.environ[name]
              return int(value) if value else None

          report = {
              "pr_number": optional_int("PR_NUMBER"),
              "head_sha": os.environ["HEAD_SHA"],
              "decision": os.environ["DECISION"],
              "reason": os.environ["REASON"],
              "est_seconds": optional_float("EST_SECONDS"),
              "full_est_seconds": optional_float("FULL_EST_SECONDS"),
              "subset_status": optional_int("SUBSET_STATUS"),
              "full_backend_result": os.environ["FULL_BACKEND_RESULT"],
              "full_pytest_result": os.environ["FULL_PYTEST_RESULT"],
              "false_green": os.environ["FALSE_GREEN"] == "1",
              "subset_log": "test-selection-subset-log-*",
          }
          Path("tmp/test-selection-shadow-report.json").write_text(
              json.dumps(report, sort_keys=True) + "\n"
          )
          PY
          echo "test-selection shadow: decision=$DECISION backend=$FULL_BACKEND_RESULT pytest=$FULL_PYTEST_RESULT subset=$SUBSET_STATUS false_green=$false_green"
          exit 0

      - name: Upload shadow comparison report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-selection-shadow-report
          path: tmp/test-selection-shadow-report.json
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint + tsc + vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [classify]
    if: ${{ needs.classify.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PR base for incremental frontend checks
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=2 origin "$(git rev-parse HEAD)"
          base=""
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            base="$(git rev-parse --verify --quiet 'HEAD^1^{commit}' || true)"
          fi
          if [ -z "$base" ]; then
            base="$EVENT_BASE_SHA"
          fi
          git fetch --depth=1 origin "$base"
          echo "FRONTEND_BASE=$(git rev-parse FETCH_HEAD^{commit})" >> "$GITHUB_ENV"

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"
          cache: true
          cache_dependency_path: ui/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types (typedRoutes)
        working-directory: ui/web
        run: pnpm exec next typegen

      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: ui/web
        run: pnpm exec tsc --noEmit

      - name: Incremental frontend lint, conditional build, and targeted vitest
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/provision/prepush_frontend.py --base "$FRONTEND_BASE"

      - name: Production build
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ui/web
        run: pnpm run build

      - name: Production bundle integrity (minifier side-effect tripwires)
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ui/web
        run: pnpm run check:bundle-integrity

      - name: ESLint
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ui/web
        run: pnpm run lint

      - name: Unit tests (vitest run)
        id: vitest
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ui/web
        run: pnpm exec vitest run --config tests/vitest.config.mts --coverage

      - name: Frontend coverage gate
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ui/web
        env:
          FRONTEND_COVERAGE_THRESHOLD: "81"
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("coverage/coverage-summary.json").read_text())
          coverage = float(summary["total"]["lines"]["pct"])
          threshold = float(os.environ.get("FRONTEND_COVERAGE_THRESHOLD", "81"))
          print(f"Frontend line coverage: {coverage}% (threshold: {threshold}%)")
          if coverage < threshold:
              raise SystemExit(
                  f"Frontend coverage {coverage}% is below threshold {threshold}%"
              )
          EOF

      - name: Flaky unit tests (vitest run, serial)
        id: vitest-flaky
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        working-directory: ui/web
        run: pnpm exec vitest run --config tests/vitest.flaky.config.mts

      - name: Validate native test results
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.vitest.outcome }}
          junit-patterns: '["ui/web/junit.xml"]'

      - name: Validate flaky frontend results
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.vitest-flaky.outcome }}
          junit-patterns: '["ui/web/junit-flaky.xml"]'
          min-tests: '0'

      - name: Upload native test reports
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-frontend
          path: |
            ui/web/junit.xml
            ui/web/junit-flaky.xml
          if-no-files-found: warn

  e2e-shard:
    name: e2e shard (${{ matrix.group }}/4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    needs: [classify]
    if: ${{ (needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true') && needs.classify.outputs.skip_e2e != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.classify.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium

      - name: Save Playwright chromium cache
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run e2e tests
        id: pytest-e2e
        shell: bash
        run: |
          uv run pytest tests/e2e/ -v -n 2 \
            --splits 4 --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --junit-xml=tmp/junit-e2e-shard-${{ matrix.group }}.xml -o junit_family=xunit1

      - name: Validate native test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-e2e.outcome }}
          junit-patterns: '["tmp/junit-e2e-shard-*.xml"]'

      - name: Upload native test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-shard-${{ matrix.group }}
          path: |
            tmp/junit-e2e-shard-*.xml
          if-no-files-found: warn

      - name: Upload e2e logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-shard-${{ matrix.group }}
          path: tmp/e2e-logs/

  e2e-hosted:
    name: e2e hosted (agent-runner-as-server happy path)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    needs: [classify]
    if: ${{ (needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true') && needs.classify.outputs.skip_e2e != 'true' }}
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium

      - name: Save Playwright chromium cache
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run hosted e2e tests
        id: pytest-hosted
        run: >
          uv run pytest
          tests/e2e/flow/test_message_flow.py
          tests/e2e/lifecycle/test_self_restart.py
          tests/e2e/lifecycle/test_self_terminate.py
          tests/e2e/flow/test_compact_flow.py
          tests/e2e/lifecycle/test_self_resurrect.py
          -v -n 1
          --junit-xml=tmp/junit-e2e-hosted.xml -o junit_family=xunit1

      - name: Validate native test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-hosted.outcome }}
          junit-patterns: '["tmp/junit-e2e-hosted.xml"]'

      - name: Upload native test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-hosted
          path: |
            tmp/junit-e2e-hosted.xml
          if-no-files-found: warn

      - name: Upload e2e logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-hosted
          path: tmp/e2e-logs/

  e2e-env-guard:
    name: e2e env guard (serial)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    needs: [classify]
    if: ${{ (needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true') && needs.classify.outputs.skip_e2e != 'true' }}
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium

      - name: Save Playwright chromium cache
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run env-guard warmup + home-isolation in one serial process
        id: pytest-env-guard
        run: >
          uv run pytest
          tests/e2e/visual/test_alerts_no_horizontal_overflow.py::test_alerts_table_no_horizontal_scroll_desktop
          tests/harness/test_env_guard_canary.py
          tests/harness/test_home_isolation.py -v -n 1
          --junit-xml=tmp/junit-e2e-env-guard.xml -o junit_family=xunit1

      - name: Validate native test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-env-guard.outcome }}
          junit-patterns: '["tmp/junit-e2e-env-guard.xml"]'

      - name: Upload native test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-env-guard
          path: |
            tmp/junit-e2e-env-guard.xml
          if-no-files-found: warn

      - name: Upload e2e logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-env-guard
          if-no-files-found: ignore
          path: tmp/e2e-logs/

  e2e:
    name: e2e (Playwright happy path)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [classify, e2e-shard, e2e-hosted, e2e-env-guard]
    if: ${{ !cancelled() && needs.classify.result == 'success' && (needs.classify.outputs.frontend == 'true' || needs.classify.outputs.backend == 'true') && needs.classify.outputs.skip_e2e != 'true' }}
    steps:
      - name: Verify shard results
        run: |
          result="${{ needs.e2e-shard.result }}"
          hosted="${{ needs.e2e-hosted.result }}"
          guard="${{ needs.e2e-env-guard.result }}"
          echo "e2e shards: $result; hosted: $hosted; env guard: $guard"
          [ "$result" = "success" ] || exit 1
          [ "$hosted" = "success" ] || exit 1
          [ "$guard" = "success" ] || exit 1
