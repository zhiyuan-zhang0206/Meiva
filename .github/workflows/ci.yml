# CI — dual-mode gate on GitHub-hosted runners.
#
# Pull requests run fast incremental checks:
# - `classify` determines whether `frontend`, `backend`, `e2e`, and optional full-only
#   backend lanes (`backend-serial`, `backend-pgvector-smoke`, `helper-signing-smoke`,
#   `host-marks`) apply to the PR diff.
# - `backend-static` runs incremental `ruff`, `clock_lattice_cli --only`, and `basedpyright`
#   over `meizel impacted` closure (skipping native Postgres/Redis bootstrap unless
#   `migrations/` or `db/schema.sql` changed, and reserving Grafana native smoke for full
#   runs).
# - `backend-structure` runs incremental `pre-commit` structural gates and `meizel check
#   --changed` (widening to full `meizel check` and debt diff when manifests, policy, or
#   deletions appear).
# - `backend-selected` runs the runtime-impact pytest subset inside the pre-baked GHCR
#   runner container (`ghcr.io/zhiyuan-zhang0206/meiva-ci-runner`).
# - `frontend` runs `next typegen`, `tsc --noEmit`, and `prepush_frontend.py --base`
#   (incremental ESLint, conditional Next.js production build, and targeted Vitest).
#
# Manual `workflow_dispatch` runs (and `release-gate.yml` before channel certification)
# execute the full repository-wide suite across all shards and smoke lanes.
#
# MEIVA_DB_URL / MEIVA_REDIS_URL are pointed at unreachable sentinel ports on
# purpose. The suite must provision its own throwaway cluster; a sentinel turns
# "a test quietly reached a real data plane" into a connection error rather than
# a silent pass.
#
# `uses:` is pinned to a commit SHA with the version in a trailing comment.
# Every `upload-artifact` step continues on error so transient artifact-service
# faults cannot fail a job whose tests passed.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Test-selection mode for PR CI — the single revert switch for the
  # enforcement decision (2026-09-11). enforce (default): a PR whose selector
  # decision is SELECTED runs its selected backend subset as the backend pytest
  # gate, and the 8-shard fan-out is skipped; every other decision keeps the
  # full suite. shadow: no PR gates on the subset — the full fan-out gates and
  # the subset plus its comparison report run informational beside it.
  # See docs/conventions/engineering/test-selection.md.
  TEST_SELECTION_MODE: "enforce"
  # uv reads UV_FROZEN=1 as --frozen: CI never rewrites uv.lock; a stale lock fails the run.
  UV_FROZEN: "1"

concurrency:
  # PRs group by ref only, so a new push cancels the superseded run. Every
  # other event (manual dispatch) keeps the SHA in the group and never cancels:
  # a group holds one pending run and a newer one replaces it, so dispatches of
  # different commits must not share one.
  # Residual race (a stale ci-rerun admitted just after a push cancels the new
  # head): the cancelled run is retried by ci-rerun.yml. See
  # docs/conventions/engineering/ci-rerun-safety.md.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      backend: ${{ steps.decide.outputs.backend }}
      durations_key: ${{ steps.durations.outputs.key }}
      skip_e2e: ${{ steps.e2e.outputs.skip }}
      selector: ${{ steps.selector.outcome }}
      mode: ${{ steps.selector.outputs.mode }}
      decision: ${{ steps.selector.outputs.decision }}
      shards: ${{ steps.selector.outputs.shards }}
      groups: ${{ steps.selector.outputs.groups }}
      static_groups: ${{ steps.lanes.outputs.static_groups }}
      count: ${{ steps.selector.outputs.count }}
      est_seconds: ${{ steps.selector.outputs.est_seconds }}
      full_est_seconds: ${{ steps.selector.outputs.full_est_seconds }}
      reason: ${{ steps.selector.outputs.reason }}
      run_serial: ${{ steps.lanes.outputs.run_serial }}
      run_pgvector_smoke: ${{ steps.lanes.outputs.run_pgvector_smoke }}
      run_helper_smoke: ${{ steps.lanes.outputs.run_helper_smoke }}
      run_host_marks: ${{ steps.lanes.outputs.run_host_marks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the test durations
        id: durations
        uses: ./.github/actions/resolve-test-durations

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ steps.durations.outputs.key }}

      - name: Classify changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CLASSIFY_TMP="$(mktemp -d "${TMPDIR:-/tmp}/meiva-classify.XXXXXX")"
          export CLASSIFY_TMP
          trap 'rm -rf "$CLASSIFY_TMP"' EXIT
          git merge-base "$BASE_SHA" HEAD > "$CLASSIFY_TMP/base.txt"
          git diff --name-only "$(cat "$CLASSIFY_TMP/base.txt")"...HEAD > "$CLASSIFY_TMP/changed.txt"
          python3 -m scripts.ci.pull_requests.classify_paths "$CLASSIFY_TMP" "$HEAD_REF" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Select runtime-impact test subset
        id: selector
        if: ${{ github.event_name == 'pull_request' && steps.decide.outputs.backend == 'true' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "test-selection mode=$TEST_SELECTION_MODE"
          # Publish routing metadata first; a failure retains the full-suite net
          # and is separately required by the backend aggregator.
          echo "mode=$TEST_SELECTION_MODE" >> "$GITHUB_OUTPUT"
          SELECTION_TMP="$(mktemp -d "${TMPDIR:-/tmp}/meiva-selection.XXXXXX")"
          trap 'rm -rf "$SELECTION_TMP"' EXIT
          git merge-base "$BASE_SHA" HEAD > "$SELECTION_TMP/base.txt"
          git diff --name-only "$(cat "$SELECTION_TMP/base.txt")"...HEAD > "$SELECTION_TMP/changed.txt"
          python3 scripts/ci/test_selector.py \
            --changed-files "$SELECTION_TMP/changed.txt" \
            --base-ref "$(cat "$SELECTION_TMP/base.txt")" \
            --head-ref "$HEAD_REF" \
            --event "$EVENT" \
            --batch-body "$GITHUB_EVENT_PATH" \
            --json | tee "$SELECTION_TMP/selector-output.json"
          SELECTION_JSON="$SELECTION_TMP/selector-output.json" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          selection = json.loads(Path(os.environ["SELECTION_JSON"]).read_text())
          # meiva:note
          # One visible line per run: a subset job that times out cannot be diagnosed
          # without knowing what was selected and how large it was, and these values only
          # travelled in step outputs (2026-10-21, #5500).
          # meiva:link scripts/ci/docs/duration-refresh.md
          digest = hashlib.sha256(" ".join(selection["tests"]).encode()).hexdigest()[:12]
          print(
              f"test-selection: decision={selection['decision']} reason={selection['reason']} "
              f"count={selection['count']} est={selection['est_seconds']:.1f} "
              f"full={selection['full_est_seconds']:.1f} tests_sha256={digest}"
          )
          lines = [
              f"decision={selection['decision']}",
              f"count={selection['count']}",
              f"est_seconds={selection['est_seconds']}",
              f"full_est_seconds={selection['full_est_seconds']}",
              f"reason={selection['reason']}",
          ]
          if selection["decision"] == "SELECTED":
              # The list travels as an artifact: a job output or an env value that holds
              # the whole suite sits at Linux's 128 KB limit for one environment string.
              shards = selection["shards"]
              lines.append(f"shards={shards}")
              lines.append(f"groups={json.dumps(list(range(1, shards + 1)))}")
              listing = Path(os.environ["RUNNER_TEMP"]) / "selected-tests" / "tests.txt"
              listing.parent.mkdir(parents=True, exist_ok=True)
              listing.write_text("".join(f"{test}\n" for test in selection["tests"]))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("\n".join(lines) + "\n")
          PY

      - name: Publish the selected test list
        id: selected-list
        if: ${{ steps.selector.outputs.decision == 'SELECTED' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-tests
          path: ${{ runner.temp }}/selected-tests/tests.txt
          if-no-files-found: error
          overwrite: true

      - name: Retry the selected test list upload
        if: ${{ steps.selected-list.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-tests
          path: ${{ runner.temp }}/selected-tests/tests.txt
          if-no-files-found: error
          overwrite: true

      - name: Select optional backend lanes
        id: lanes
        env:
          EVENT: ${{ github.event_name }}
          BACKEND: ${{ steps.decide.outputs.backend }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.selector.outputs.mode }}
          DECISION: ${{ steps.selector.outputs.decision }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "static_groups=[1, 2, 3, 4]"
              echo "run_serial=true"
              echo "run_pgvector_smoke=true"
              echo "run_helper_smoke=true"
              echo "run_host_marks=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BACKEND" != "true" ]; then
            {
              echo "static_groups=[1]"
              echo "run_serial=false"
              echo "run_pgvector_smoke=false"
              echo "run_helper_smoke=false"
              echo "run_host_marks=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          out = Path(os.environ["GITHUB_OUTPUT"])
          try:
              base_merge = subprocess.check_output(
                  ["git", "merge-base", os.environ["BASE_SHA"], "HEAD"], text=True
              ).strip()
              changed = [
                  line
                  for line in subprocess.check_output(
                      ["git", "diff", "--name-only", f"{base_merge}...HEAD"], text=True
                  ).splitlines()
                  if line
              ]
              mode = os.environ.get("MODE", "")
              decision = os.environ.get("DECISION", "")

              def file_mentions(paths: list[str], needle: str) -> bool:
                  for rel in paths:
                      if not rel.endswith(".py"):
                          continue
                      candidate = Path(rel)
                      if candidate.is_file() and needle in candidate.read_text(encoding="utf-8", errors="ignore"):
                          return True
                  return False

              full_fanout = mode != "enforce" or decision != "SELECTED"
              static_groups = "[1]" if decision == "SELECTED" else "[1, 2, 3, 4]"
              run_serial = (
                  full_fanout
                  or any(
                      p in {"pyproject.toml", "conftest.py", ".github/workflows/ci.yml"}
                      or p.startswith(".github/ci-image/")
                      for p in changed
                  )
                  or file_mentions(changed, "flaky")
              )
              run_pgvector_smoke = any(
                  p.startswith(("base/cluster/dataplane/", "db/", "migrations/", ".github/ci-image/"))
                  or p in {"scripts/ci/pgvector_runtime_smoke.py", ".github/workflows/ci.yml"}
                  for p in changed
              )
              run_helper_smoke = any(
                  p.startswith(
                      (
                          "services/desktop/permissions_helper/",
                          "base/helper_chain_guard",
                          "scripts/ci/helper_smoke/",
                      )
                  )
                  or p == ".github/workflows/ci.yml"
                  for p in changed
              )
              run_host_marks = (
                  any(
                      p.startswith("scripts/structure/platform_lane")
                      or p
                      in {
                          "tests/fixtures/host_platform.py",
                          "scripts/ci/host_marks_census.py",
                          "scripts/lint/host_platform_marks.py",
                          ".github/workflows/ci.yml",
                      }
                      for p in changed
                  )
                  or file_mentions(changed, "requires_host")
              )
          except Exception as exc:
              print(f"::warning::Optional backend lane selector failed ({type(exc).__name__}); running all lanes")
              static_groups = "[1, 2, 3, 4]"
              run_serial = True
              run_pgvector_smoke = True
              run_helper_smoke = True
              run_host_marks = True

          lines = [
              f"static_groups={static_groups}",
              f"run_serial={'true' if run_serial else 'false'}",
              f"run_pgvector_smoke={'true' if run_pgvector_smoke else 'false'}",
              f"run_helper_smoke={'true' if run_helper_smoke else 'false'}",
              f"run_host_marks={'true' if run_host_marks else 'false'}",
          ]
          for line in lines:
              print(f"optional-lane: {line}")
          with out.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Decide whether e2e can be skipped
        id: e2e
        if: ${{ github.event_name == 'pull_request' && (steps.decide.outputs.frontend == 'true' || steps.decide.outputs.backend == 'true') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BACKEND: ${{ steps.decide.outputs.backend }}
          MODE: ${{ steps.selector.outputs.mode }}
          DECISION: ${{ steps.selector.outputs.decision }}
        run: |
          SCOPE_TMP="$(mktemp -d "${TMPDIR:-/tmp}/meiva-e2e-scope.XXXXXX")"
          trap 'rm -rf "$SCOPE_TMP"' EXIT
          BASE_MERGE="$(git merge-base "$BASE_SHA" HEAD)"
          git diff --name-only "$BASE_MERGE"...HEAD > "$SCOPE_TMP/changed.txt"
          effective_mode="$MODE"
          effective_decision="$DECISION"
          if [ "$BACKEND" != "true" ]; then
            effective_mode="$TEST_SELECTION_MODE"
            effective_decision="FRONTEND_ONLY"
          fi
          python3 scripts/ci/e2e_scope.py \
            --changed-files "$SCOPE_TMP/changed.txt" \
            --base-ref "$BASE_MERGE" \
            --event pull_request \
            --head-ref "$HEAD_REF" \
            --mode "$effective_mode" \
            --decision "$effective_decision" | tee -a "$GITHUB_OUTPUT"

  repo-language:
    name: repo language (no raw CJK)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for raw CJK (i18n locale files exempt)
        run: python3 scripts/content_lint/lint_no_cjk.py

      - name: Scan for tailnet IP literals (CIDR range notation exempt)
        run: python3 scripts/content_lint/lint_no_tailnet.py

      - name: Scan the root supervisor for permission-domain symbols
        run: python3 scripts/lint/meiva_root_scope.py

      - name: Check canonical Python lock sources (stdlib only)
        run: python3 scripts/lint/locks/python_lock.py

      - name: Check canonical pnpm lock sources (stdlib only)
        run: python3 scripts/lint/locks/package_lock.py

  diff-hints:
    name: diff hints
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that every hint on the branch is fixed or answered
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/lint/diagnostics/diff_hints/hints.py branch \
            --base "$BASE_SHA" --head "$HEAD_SHA" --summary "$GITHUB_STEP_SUMMARY"

  core-content-manifests:
    name: core-content manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Lint core-content manifests
        run: uv run python scripts/content_lint/lint_core_content_manifests.py

  doc-lints:
    name: doc lints (pre-commit family)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Run the doc-lint family (--all-files)
        run: |
          status=0
          for hook in check-doc-references check-narrative-facts lint-doc-symbols lint-doc-anchors lint-doc-roster lint-agents-md-size lint-skill-descriptions lint-skill-md-size lint-meiva-okf; do
            uv run pre-commit run --all-files "$hook" || status=1
          done
          exit $status

  secret-scan:
    name: secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          export GOBIN="$RUNNER_TEMP/gitleaks-bin"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Scan the commits this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              base="$(git rev-parse --verify HEAD^1)"
            else
              base="$(git merge-base "$BASE_SHA" HEAD)"
            fi
            : "${base:?unable to resolve base commit for pull request}"
            echo "scanning ${base}..HEAD"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${base}..HEAD" .
            exit 0
          fi

          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --unshallow origin +refs/heads/main:refs/remotes/origin/main
          else
            git fetch origin +refs/heads/main:refs/remotes/origin/main
          fi

          head_sha="$(git rev-parse --verify HEAD)"
          merge_base="$(git merge-base -- HEAD refs/remotes/origin/main)"
          : "${merge_base:?unable to resolve merge-base with origin/main}"

          if [ "$merge_base" != "$head_sha" ]; then
            echo "scanning ${merge_base}..HEAD"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${merge_base}..HEAD" .
          else
            echo "merge-base equals HEAD; scanning bounded recent window (-n 50)"
            gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="-n 50" .
          fi

  dependency-audit:
    name: dependency audit (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: false

      - name: Audit locked Python dependencies
        run: uv audit --frozen
        continue-on-error: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"

      - name: Audit locked frontend dependencies
        working-directory: ui/web
        run: pnpm audit
        continue-on-error: true

  backend-static:
    name: backend static (ruff + pyright + migration smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve PR base and static scope
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=2 origin "$(git rev-parse HEAD)"
          base=""
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            base="$(git rev-parse --verify --quiet 'HEAD^1^{commit}' || true)"
          fi
          if [ -z "$base" ]; then
            base="$EVENT_BASE_SHA"
          fi
          git fetch --depth=1 origin "$base"
          resolved_base="$(git rev-parse FETCH_HEAD^{commit})"
          echo "STATIC_BASE_SHA=$resolved_base" >> "$GITHUB_ENV"
          changed_file="$RUNNER_TEMP/backend-static-changed.txt"
          git diff --name-only --no-renames "$resolved_base" HEAD > "$changed_file"
          echo "STATIC_CHANGED_FILE=$changed_file" >> "$GITHUB_ENV"
          run_mig="false"
          while IFS= read -r path; do
            case "$path" in
              migrations/*|db/schema.sql|scripts/ci/migration_smoke.py|scripts/ci/test_migrations_apply.sh)
                run_mig="true"
                break
                ;;
            esac
          done < "$changed_file"
          echo "RUN_MIGRATION_SMOKE=$run_mig" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        if: ${{ github.event_name != 'pull_request' || env.RUN_MIGRATION_SMOKE == 'true' }}
        uses: ./.github/actions/install-pg-redis

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Verify uv.lock is fresh
        run: uv lock --check

      - name: Vendored Postgres runtime (production's server build)
        if: ${{ github.event_name != 'pull_request' || env.RUN_MIGRATION_SMOKE == 'true' }}
        uses: ./.github/actions/vendor-pg-runtime

      - name: Cache native Grafana 13.2.3
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grafana_13.2.3_36482603486_linux_amd64.tar.gz
          key: grafana-native-13.2.3-36482603486-linux-amd64

      - name: Validate native Grafana alert provisioning and Trace navigation (no Docker)
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          archive="$RUNNER_TEMP/grafana_13.2.3_36482603486_linux_amd64.tar.gz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$archive" \
              https://dl.grafana.com/grafana/release/13.2.3/grafana_13.2.3_36482603486_linux_amd64.tar.gz
          fi
          echo "6107ad27016296aac38e0d7ffa8753ab540b5541ad27e94790f771289d733235  $archive" \
            | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/grafana-native-13.2.3"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          MEIVA_TEST_GRAFANA_BIN="$install_dir/bin/grafana" \
          MEIVA_TEST_GRAFANA_HOME="$install_dir" \
            uv run pytest tests/integration/test_grafana_native_runtime.py -q

      - name: Run ruff check
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run ruff check

      - name: Run ruff check (incremental PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          full=false
          files=()
          while IFS= read -r path; do
            case "$path" in
              pyproject.toml|ruff.toml|.ruff.toml) full=true ;;
              *.py|*.pyi) [[ -f "$path" ]] && files+=("$path") ;;
            esac
          done < "$STATIC_CHANGED_FILE"
          if [[ "$full" == true ]]; then
            uv run ruff check
          elif [[ "${#files[@]}" -gt 0 ]]; then
            uv run ruff check "${files[@]}"
          else
            echo "No changed Python files; skipping ruff check."
          fi

      - name: Run ruff format check
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run ruff format --check

      - name: Run ruff format check (incremental PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          full=false
          files=()
          while IFS= read -r path; do
            case "$path" in
              pyproject.toml|ruff.toml|.ruff.toml) full=true ;;
              *.py|*.pyi) [[ -f "$path" ]] && files+=("$path") ;;
            esac
          done < "$STATIC_CHANGED_FILE"
          if [[ "$full" == true ]]; then
            uv run ruff format --check
          elif [[ "${#files[@]}" -gt 0 ]]; then
            uv run ruff format --check "${files[@]}"
          else
            echo "No changed Python files; skipping ruff format --check."
          fi

      - name: Lint migrations
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ "$EVENT" = "pull_request" ]; then
            if [ -n "${STATIC_BASE_SHA:-}" ]; then
              args=(--base "$STATIC_BASE_SHA")
            else
              git fetch --depth=1 origin "$BASE_SHA"
              args=(--base "$(git rev-parse FETCH_HEAD^{commit})")
            fi
          fi
          uv run python scripts/content_lint/lint_migrations.py "${args[@]}"

      - name: Lint clock lattice
        if: ${{ github.event_name != 'pull_request' }}
        run: uv run python -m meizel.owners.clock_lattice_cli

      - name: Lint clock lattice (incremental PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          full=false
          files=()
          while IFS= read -r path; do
            case "$path" in
              meizel.policy.toml|meizel/owners/*) full=true ;;
              *.py) [[ -f "$path" ]] && files+=("$path") ;;
            esac
          done < "$STATIC_CHANGED_FILE"
          if [[ "$full" == true ]]; then
            uv run python -m meizel.owners.clock_lattice_cli
          elif [[ "${#files[@]}" -gt 0 ]]; then
            uv run python -m meizel.owners.clock_lattice_cli --only "${files[@]}"
          else
            echo "No changed Python files; skipping clock lattice check."
          fi

      - name: ensure-plugins-loaded context census (UNBOUND=0)
        # #8062 made the host-version gate take the environment its `git` runs under from the
        # caller. A load site that names no context (or one built without `environ=`) then raises
        # on the first name listing, and `install.mark_load_failed()` keeps the whole process
        # failing. The census counts those sites across the repository and fails while any is
        # unbound; a new inheriting site has to be listed with its reason in the script.
        run: uv run python scripts/audit/ensure_plugins_loaded_context_census.py

      - name: Apply migrations to fresh DB + trigger smoke
        if: ${{ github.event_name != 'pull_request' || env.RUN_MIGRATION_SMOKE == 'true' }}
        run: |
          if [ -n "${CI_VENDORED_RUNTIME_ROOT:-}" ] && [ -d "$CI_VENDORED_RUNTIME_ROOT" ]; then
            mkdir -p "$HOME/.meiva"
            ln -sfn "$CI_VENDORED_RUNTIME_ROOT" "$HOME/.meiva/runtime"
          fi
          uv run python scripts/ci/migration_smoke.py

      - name: Run pyright
        if: ${{ github.event_name != 'pull_request' }}
        # Pyright rejects --stats with --threads; time retains elapsed/CPU cost.
        run: time uv run basedpyright --threads 2

      - name: Run pyright (impacted closure)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -o pipefail
          full=false
          changed=()
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            changed+=("$path")
            case "$path" in
              pyproject.toml|pyrightconfig.json|uv.lock|.python-version|typings/*)
                full=true
                ;;
              *.py|*.pyi)
                if [[ ! -f "$path" ]]; then
                  full=true
                fi
                ;;
            esac
          done < "$STATIC_CHANGED_FILE"

          if [[ "$full" == true ]]; then
            echo "Global typecheck input or deleted Python module detected; running full basedpyright."
            time uv run basedpyright --threads 2
            exit 0
          fi
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "No changed paths; skipping basedpyright."
            exit 0
          fi

          impacted_file="$RUNNER_TEMP/pyright-impacted.txt"
          set +e
          uv run python -m meizel impacted "${changed[@]}" > "$impacted_file"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::meizel impacted exited $status; widening to full basedpyright"
            time uv run basedpyright --threads 2
            exit 0
          fi

          targets=()
          while IFS= read -r mod; do
            [[ -n "$mod" && -f "$mod" ]] && targets+=("$mod")
          done < "$impacted_file"

          if [[ "${#targets[@]}" -eq 0 ]]; then
            echo "No Python modules in meizel impacted closure; skipping basedpyright."
            exit 0
          fi
          echo "Running basedpyright on ${#targets[@]} impacted module(s)."
          time uv run basedpyright --threads 2 "${targets[@]}"

  backend-static-tests:
    name: backend static tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    needs: [classify]
    if: ${{ needs.classify.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.classify.outputs.static_groups || '[1, 2, 3, 4]') }}
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
      COVERAGE_FILE: coverage-data-static-${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.classify.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps (TypeScript source parser)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Download the selected test list
        if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selected-tests
          path: tmp/selected

      - name: Run static pytest contracts
        id: pytest-static
        if: needs.classify.outputs.backend == 'true'
        env:
          IS_PR_SELECTED: ${{ github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED' }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          junit_out="tmp/junit-backend-static-${{ matrix.group }}.xml"
          base_args=(
            --test-environment=static
            -q -n 4 --dist=loadfile
            -W error::pytest.PytestUnhandledThreadExceptionWarning
            --junit-xml=tmp/junit-backend-static-${{ matrix.group }}.xml
            -o junit_family=xunit1
          )
          if [[ "$IS_PR_SELECTED" == "true" ]]; then
            mkdir -p tmp/selected
            uv run python - <<'PY'
          from pathlib import Path
          from meizel.checkout import lanes_at

          static_set = lanes_at(Path(".").resolve()).static
          selected = [
              line.strip()
              for line in Path("tmp/selected/tests.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() in static_set
          ]
          Path("tmp/selected/static-tests.txt").write_text(
              "".join(f"{path}\n" for path in selected), encoding="utf-8"
          )
          print(f"static-selected: {len(selected)} static test file(s) from selected subset")
          PY
            mapfile -t static_targets < tmp/selected/static-tests.txt
            if [[ "${#static_targets[@]}" -eq 0 ]]; then
              echo "No static tests in selected subset; writing empty JUnit report."
              printf '<testsuites><testsuite name="pytest" tests="0" errors="0" failures="0" skipped="0"/></testsuites>\n' > "$junit_out"
              exit 0
            fi
            uv run pytest "${base_args[@]}" "${static_targets[@]}"
          else
            uv run pytest "${base_args[@]}" \
              --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration \
              --cov=agent --cov=meiva --cov=cli --cov=gateway --cov=base --cov=ui \
              --cov=ops --cov=services --cov=meiva_builtins
          fi

      - name: Report executed test counts
        if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && !(github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED') }}
        run: >
          python3 scripts/ci/shard_counts.py shard --group static-${{ matrix.group }}
          --junit tmp/junit-backend-static-${{ matrix.group }}.xml
          --out tmp/shard-counts-static-${{ matrix.group }}.json
          --summary "$GITHUB_STEP_SUMMARY" --min-tests 1

      - name: Upload executed test counts
        if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && !(github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-counts-static-${{ matrix.group }}
          path: tmp/shard-counts-static-${{ matrix.group }}.json
          if-no-files-found: ignore

      - name: Validate static test results
        if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-static.outcome }}
          junit-patterns: '["tmp/junit-backend-static-${{ matrix.group }}.xml"]'
          min-tests: ${{ (github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED') && '0' || '1' }}

      - name: Upload static test reports
        if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-backend-static-${{ matrix.group }}
          path: tmp/junit-backend-static-${{ matrix.group }}.xml
          if-no-files-found: warn

      - name: Upload coverage data
        id: coverage-upload
        if: ${{ needs.classify.outputs.backend == 'true' && !(github.event_name == 'pull_request' && needs.classify.outputs.decision == 'SELECTED') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-static-${{ matrix.group }}
          path: coverage-data-static-${{ matrix.group }}

      - name: Retry coverage data upload
        id: coverage-upload-retry
        if: ${{ steps.coverage-upload.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-static-${{ matrix.group }}
          path: coverage-data-static-${{ matrix.group }}
          overwrite: true

      - name: Note coverage upload outcome
        if: ${{ always() && steps.coverage-upload.outcome == 'failure' }}
        run: |
          if [ "${{ steps.coverage-upload-retry.outcome }}" = "success" ]; then
            echo "::warning title=coverage upload retried::first attempt to publish coverage-data-static-${{ matrix.group }} failed; the retry succeeded"
          else
            echo "::warning title=coverage upload failed::coverage-data-static-${{ matrix.group }} could not be published after a retry — artifact-service failure, not a test failure; the coverage gate scores the data that arrived"
          fi

  backend-structure:
    name: backend structure (pre-commit lint + codegen freshness)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [classify]
    if: ${{ needs.classify.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Fetch base revision for structure guard
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=2 origin "$(git rev-parse HEAD)"
          base=""
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            base="$(git rev-parse --verify --quiet 'HEAD^1^{commit}' || true)"
          fi
          if [ -z "$base" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          git fetch --depth=1 origin "$base"
          echo "LINT_STRUCTURE_BASELINE_BASE=$(git rev-parse FETCH_HEAD^{commit})" >> "$GITHUB_ENV"

      - name: Fetch comparison ancestry for manual structure guard
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --unshallow origin "$(git rev-parse HEAD)" \
            refs/heads/main:refs/remotes/origin/main
          base="$(git merge-base -- HEAD refs/remotes/origin/main)"
          echo "LINT_STRUCTURE_BASELINE_BASE=$base" >> "$GITHUB_ENV"

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"
          cache: true
          cache_dependency_path: ui/web/pnpm-lock.yaml

      - name: Install frontend deps (source parser and codegen)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Check source notes and changed-file migration
        run: bash scripts/content_lint/code_comments/check.sh changed "${LINT_STRUCTURE_BASELINE_BASE:?missing comparison base}"

      - name: Check every source note link in the repository
        if: github.event_name != 'pull_request'
        run: bash scripts/content_lint/code_comments/check.sh validate

      - name: Test TypeScript comment parser
        run: node --test scripts/content_lint/code_comments/tests/typescript.test.mjs scripts/codegen/tests/typescript-types.test.mjs

      - name: Restore pre-commit environments
        id: precommit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version', 'uv.lock') }}

      - name: Run pre-commit structural gates (--all-files)
        if: github.event_name != 'pull_request'
        env:
          SKIP: check-code-comments,ruff,ruff-format,pyright,meizel-check-changed,lint-migrations,lint-clock-lattice,frontend-tsc,frontend-eslint,frontend-vitest,lint-core-content-manifests,check-git-hooks-install,types-codegen-fresh,constants-codegen-fresh,events-registry-fresh,config-lite-table-fresh
        run: env -u VIRTUAL_ENV uv run pre-commit run --all-files

      - name: Run pre-commit structural gates (incremental PR)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SKIP: check-code-comments,ruff,ruff-format,pyright,meizel-check-changed,lint-migrations,lint-clock-lattice,frontend-tsc,frontend-eslint,frontend-vitest,lint-core-content-manifests,check-git-hooks-install,types-codegen-fresh,constants-codegen-fresh,events-registry-fresh,config-lite-table-fresh
        run: |
          path_file="$(mktemp)"
          trap 'rm -f "$path_file"' EXIT
          git diff --name-only --no-renames -z "${LINT_STRUCTURE_BASELINE_BASE:?missing comparison base}" HEAD > "$path_file"
          widen=false
          files=()
          while IFS= read -r -d '' path; do
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              widen=true
              continue
            fi
            case "$path" in
              -*|.pre-commit-config.yaml|scripts/lint/*|scripts/structure/*|scripts/content_lint/*|meizel/owners/*)
                widen=true
                ;;
            esac
            files+=("$path")
          done < "$path_file"

          if [[ "$widen" == true ]]; then
            echo "Structural tooling or file deletion detected; widening pre-commit to --all-files."
            env -u VIRTUAL_ENV uv run pre-commit run --all-files
          elif [[ "${#files[@]}" -gt 0 ]]; then
            env -u VIRTUAL_ENV uv run pre-commit run --files "${files[@]}"
          else
            echo "No changed files in PR diff; skipping pre-commit structural hooks."
          fi

      - name: Locality gate (meizel check)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "MEIZEL_FULL_CHECK=true" >> "$GITHUB_ENV"
            env -u VIRTUAL_ENV uv run python -m meizel check
            exit 0
          fi
          path_file="$(mktemp)"
          trap 'rm -f "$path_file"' EXIT
          git diff --name-only --no-renames -z "${LINT_STRUCTURE_BASELINE_BASE:?missing comparison base}" HEAD > "$path_file"
          full=false
          changed=()
          while IFS= read -r -d '' path; do
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              full=true
              continue
            fi
            case "$path" in
              meizel.toml|*/meizel.toml|meizel.policy.toml|meizel/*)
                full=true
                ;;
              *.py|*.sh|*.toml|*.yaml|*.yml)
                changed+=("./$path")
                ;;
            esac
          done < "$path_file"

          if [[ "$full" == true ]]; then
            echo "Manifest, policy, meizel source, or file deletion detected; running full meizel check."
            echo "MEIZEL_FULL_CHECK=true" >> "$GITHUB_ENV"
            env -u VIRTUAL_ENV uv run python -m meizel check
          elif [[ "${#changed[@]}" -gt 0 ]]; then
            echo "MEIZEL_FULL_CHECK=false" >> "$GITHUB_ENV"
            env -u VIRTUAL_ENV uv run python -m meizel check --changed "${changed[@]}"
          else
            echo "MEIZEL_FULL_CHECK=false" >> "$GITHUB_ENV"
            echo "No Python, manifest, or role-list input changed; skipping meizel."
          fi

      - name: Allowance policy removals need a declaration
        if: ${{ env.LINT_STRUCTURE_BASELINE_BASE != '' && env.MEIZEL_FULL_CHECK == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env -u VIRTUAL_ENV uv run python scripts/lint/policy_removal.py \
            --against "$LINT_STRUCTURE_BASELINE_BASE" --on-removal=fail \
            --event "${GITHUB_EVENT_PATH:-}" --summary "$GITHUB_STEP_SUMMARY" \
            --record-out "$RUNNER_TEMP/pull-request-record.md"

      - name: Detection surface against the base (listed, never required)
        if: ${{ env.LINT_STRUCTURE_BASELINE_BASE != '' && env.MEIZEL_FULL_CHECK == 'true' }}
        run: |
          env -u VIRTUAL_ENV uv run python -m meizel policy surface \
            --against "$LINT_STRUCTURE_BASELINE_BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Recorded locality debt against the base (fails on growth)
        if: ${{ env.LINT_STRUCTURE_BASELINE_BASE != '' && env.MEIZEL_FULL_CHECK == 'true' }}
        run: |
          set -o pipefail
          moves="$RUNNER_TEMP/pull-request-record.md"
          args=()
          if [ -f "$moves" ]; then args=(--symbol-moves-file "$moves"); fi
          env -u VIRTUAL_ENV uv run python -m meizel debt diff \
            --against "$LINT_STRUCTURE_BASELINE_BASE" --on-growth=fail \
            --waive-if-changed ':(glob)meizel/**/*.py' 'meizel.policy.toml' ':(exclude,glob)meizel/**/tests/**' ':(exclude)meizel/state/**' ':(exclude)meizel/language/path_imports.py' ':(exclude)meizel/language/no_script_sibling_imports.py' ':(exclude)meizel/allowances.py' \
            ${args[@]+"${args[@]}"} | tee "$RUNNER_TEMP/debt-diff.log"
          status=$?
          grep '^base import rewritten:' "$RUNNER_TEMP/debt-diff.log" >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Save pre-commit environments
        if: success() && steps.precommit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.precommit-cache.outputs.cache-primary-key }}

      - name: Select codegen freshness from changed files
        id: codegen
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          env -u VIRTUAL_ENV uv run python - <<'PY'
          try:
              import os
              import re
              import subprocess
              from pathlib import Path

              # Publish RUN first; only a successful no-match may override it.
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                  output.write("run=true\n")

              import yaml

              codegen_ids = (
                  "types-codegen-fresh",
                  "constants-codegen-fresh",
                  "events-registry-fresh",
                  "config-lite-table-fresh",
              )
              run_codegen = True
              if os.environ["EVENT_NAME"] == "pull_request":
                  changed = subprocess.check_output([
                      "git", "diff", "--name-only", "--no-renames", "-z",
                      os.environ["LINT_STRUCTURE_BASELINE_BASE"], "HEAD",
                  ])
                  # The hook regexes own the union (including base/events/,
                  # ui/web/openapi.json and base/config/; not db/schema.sql).
                  config = yaml.safe_load(Path(".pre-commit-config.yaml").read_text())
                  hooks = {hook["id"]: hook for repo in config["repos"] for hook in repo["hooks"]}
                  patterns = [re.compile(hooks[hook_id]["files"]) for hook_id in codegen_ids]
                  run_codegen = any(
                      pattern.search(os.fsdecode(path))
                      for path in changed.split(b"\0") if path
                      for pattern in patterns
                  )
              if not run_codegen:
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
                      output.write("run=false\n")
                  print("STEP SKIPPED: codegen freshness — no codegen inputs changed in this PR; "
                        "manual dispatch always runs it; the merge queue re-runs the combined tree.")
          except Exception as error:
              # A failed outcome overrides even a partially published skip.
              print(f"::warning::Codegen selector failed ({type(error).__name__}); "
                    "running all freshness hooks")
              raise SystemExit(1)
          PY

      - name: Run codegen freshness hooks (--all-files)
        if: steps.codegen.outcome != 'success' || steps.codegen.outputs.run != 'false'
        run: |
          env -u VIRTUAL_ENV uv run pre-commit run types-codegen-fresh --all-files
          env -u VIRTUAL_ENV uv run pre-commit run constants-codegen-fresh --all-files
          env -u VIRTUAL_ENV uv run pre-commit run events-registry-fresh --all-files
          env -u VIRTUAL_ENV uv run pre-commit run config-lite-table-fresh --all-files

  backend-shard:
    name: backend shard (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.backend == 'true' && (needs.classify.outputs.mode != 'enforce' || needs.classify.outputs.decision != 'SELECTED') }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
      MEIVA_REDIS_URL: redis://127.0.0.1:1/0
      COVERAGE_FILE: coverage-data-${{ matrix.group }}
    steps:
      # A gate, not a note: a container whose PID 1 is not an init reparents orphans onto a
      # process that never waits, and 30 process/data-plane tests then fail as psutil timeouts.
      - name: Container PID 1 reaps orphans
        run: |
          comm=$(cat /proc/1/comm)
          ps -o pid,ppid,stat,comm -p 1
          case "$comm" in
            docker-init|tini) echo "PID 1 is $comm, which reaps orphans" ;;
            *) echo "::error::container PID 1 is '$comm', not an init that reaps orphans - container.options lost --init; the process and data-plane suites will time out"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.classify.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install Python deps
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps (TypeScript source parser)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Run pytest shard
        id: pytest-shard
        shell: bash
        run: |
          set -e
          set -o pipefail
          mkdir -p tmp/file-shards
          timeout --kill-after=15s 4m uv run python -u -m scripts.ci.pull_requests.plan_file_shards \
            --count 8 --plan tmp/file-shards/plan.json --stacks tmp/file-shards/plan-stacks.log \
            2>&1 | tee tmp/file-shards/plan-collection.log
          set +e
          uv run pytest -c pyproject.toml --rootdir=. -q --omit-static-tests --ignore=tests/e2e -m "not flaky" -n 4 --dist=loadfile \
            -p scripts.ci.file_shard_shadow --file-shard-execute \
            --file-shard-check=tmp/file-shards/plan.json --file-shard-group=${{ matrix.group }} \
            --file-shard-report=tmp/file-shards/collection-a1.json \
            --file-shard-runtime-report=tmp/file-shards/runtime-a1.json \
            --cov=agent --cov=meiva --cov=cli --cov=gateway --cov=base --cov=ui \
            --cov=ops --cov=services --cov=meiva_builtins \
            --junit-xml=tmp/junit-backend-shard-${{ matrix.group }}-a1.xml -o junit_family=xunit1 \
            -o faulthandler_timeout=300 \
            2>&1 | tee tmp/flake-attempt1-shard-${{ matrix.group }}.log
          status=$?
          # Invalid configuration, collection and worker validation fail closed.
          case "$status" in 2|3|4) exit "$status" ;; esac
          if [ '${{ matrix.group }}' = 8 ]; then
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning title=backend shard ${{ matrix.group }} attempt-1 failure::pytest exit $status, retried once"
            echo "FLAKE-RETRY group=${{ matrix.group }} attempt=1 exit=$status"
            echo "retried=true" >> "$GITHUB_OUTPUT"
            rm -f "$COVERAGE_FILE"
            uv run pytest -c pyproject.toml --rootdir=. -q --omit-static-tests --ignore=tests/e2e -m "not flaky" -n 4 --dist=loadfile \
              -p scripts.ci.file_shard_shadow --file-shard-execute \
              --file-shard-check=tmp/file-shards/plan.json --file-shard-group=${{ matrix.group }} \
              --file-shard-report=tmp/file-shards/collection-a2.json \
              --file-shard-runtime-report=tmp/file-shards/runtime-a2.json \
              --cov=agent --cov=meiva --cov=cli --cov=gateway --cov=base --cov=ui \
              --cov=ops --cov=services --cov=meiva_builtins \
              --junit-xml=tmp/junit-backend-shard-${{ matrix.group }}-a2.xml -o junit_family=xunit1 \
              -o faulthandler_timeout=300
            status=$?
          fi
          exit "$status"

      - name: Report executed test counts
        if: ${{ !cancelled() }}
        run: >
          python3 scripts/ci/shard_counts.py shard --group ${{ matrix.group }}
          --junit 'tmp/junit-backend-shard-${{ matrix.group }}-a*.xml'
          --out tmp/shard-counts-${{ matrix.group }}.json
          --summary "$GITHUB_STEP_SUMMARY" --min-tests 1

      - name: Upload executed test counts
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-counts-${{ matrix.group }}
          path: tmp/shard-counts-${{ matrix.group }}.json
          if-no-files-found: ignore

      - name: Validate native test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-shard.outcome }}
          junit-patterns: '["tmp/junit-backend-shard-${{ matrix.group }}-a*.xml"]'
          latest-report: 'true'

      - name: Upload native test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-backend-shard-${{ matrix.group }}
          path: |
            tmp/junit-backend-shard-${{ matrix.group }}-a*.xml
            tmp/file-shards/
          if-no-files-found: warn

      - name: Upload flake telemetry (attempt-1 failure)
        if: ${{ always() && (steps.pytest-shard.outputs.retried == 'true' || matrix.group == 8) }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-attempt1-shard-${{ matrix.group }}
          path: tmp/flake-attempt1-shard-${{ matrix.group }}.log
          if-no-files-found: error

      - name: Upload coverage data
        id: coverage-upload
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage-data-${{ matrix.group }}

      - name: Retry coverage data upload
        id: coverage-upload-retry
        if: ${{ steps.coverage-upload.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.group }}
          path: coverage-data-${{ matrix.group }}
          overwrite: true

      - name: Note coverage upload outcome
        if: ${{ always() && steps.coverage-upload.outcome == 'failure' }}
        run: |
          if [ "${{ steps.coverage-upload-retry.outcome }}" = "success" ]; then
            echo "::warning title=coverage upload retried::first attempt to publish coverage-data-${{ matrix.group }} failed; the retry succeeded"
          else
            echo "::warning title=coverage upload failed::coverage-data-${{ matrix.group }} could not be published after a retry — artifact-service failure, not a test failure; the coverage gate scores the data that arrived"
          fi

      - name: Upload pg fixture logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-fixture-logs-shard-${{ matrix.group }}
          if-no-files-found: ignore
          path: tmp/pg-fixture-logs/

