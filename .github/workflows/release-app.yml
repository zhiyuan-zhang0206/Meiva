# Build the Meiva App (`ui/app`) for macOS. The release train receives signed
# updater artifacts, and manual dispatches build artifacts for inspection.
# An app-v* push publishes a standalone milestone without moving GitHub Latest.
#
# Tag releases require Apple Developer ID signing and notarization. Release
# train builds retain the existing ad-hoc signing path when Apple secrets are
# absent. A validation-only dispatch may omit all signing secrets.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]  updater signatures
#   APPLE_CERTIFICATE[_PASSWORD], APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID    Developer ID + notarization

name: Release App

on:
  push:
    tags:
      - 'app-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    outputs:
      version:
        description: 'Version in the uploaded build artifacts'
        value: ${{ jobs.prepare.outputs.version }}
    inputs:
      target_sha:
        description: 'Certified commit SHA to build'
        required: true
        type: string
      require_signing:
        description: 'Require signing credentials for release artifacts'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional commit SHA to build (defaults to workflow ref HEAD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Exact pin: generated Android templates and release outputs are CLI inputs.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  prepare:
    name: Resolve app version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Resolve and validate version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys, tomllib

          cargo = tomllib.loads(pathlib.Path("ui/app/src-tauri/Cargo.toml").read_text())
          cargo_version = cargo["package"]["version"]
          if os.environ["EVENT_NAME"] == "push":
              match = re.fullmatch(r"app-v(\d+\.\d+\.\d+)", os.environ["REF_NAME"])
              if match is None:
                  raise SystemExit(f"invalid app release tag: {os.environ['REF_NAME']}")
              version = match.group(1)
              # The tag and Cargo.toml are both version sources; a release tag
              # that lags the crate version would ship a downgraded package, so
              # they must agree exactly.
              if version != cargo_version:
                  raise SystemExit(
                      f"tag version {version} != Cargo.toml version {cargo_version}; "
                      "bump ui/app/src-tauri/Cargo.toml to match the tag before releasing"
                  )
          else:
              version = subprocess.check_output(
                  [
                      sys.executable,
                      "scripts/codegen/build_app_update_manifest.py",
                      "version-name",
                      "--cargo-version",
                      cargo_version,
                      "--run-number",
                      os.environ["RUN_NUMBER"],
                  ],
                  text=True,
              ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal dmg)
            runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EVENT_NAME: ${{ github.event_name }}
      REQUIRE_SIGNING: ${{ github.event_name == 'push' || inputs.require_signing == true }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ui/app/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
        shell: bash

      - name: Validate optional signing secret groups
        shell: bash
        run: |
          require_group() {
            local label="$1"
            shift
            local present=0 missing=0
            for value in "$@"; do
              if [ -n "$value" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
            done
            if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
              echo "$label secrets are only partially configured" >&2
              exit 1
            fi
          }
          require_group "Apple code-signing" \
            "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY"
          require_group "Apple notarization" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing password is configured without a private key" >&2
            exit 1
          fi
          if [ "$REQUIRE_SIGNING" = true ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Published macOS releases require updater signing" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || \
               [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || \
               [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "Release tags require Apple signing and notarization" >&2
              exit 1
            fi
          fi

      # Without the certificate the app is built ad-hoc signed, which still
      # runs locally (Gatekeeper prompts on first open).
      - name: Import the Apple Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build
        working-directory: ui/app
        shell: bash
        run: |
          EXTRA=(--config "{\"version\":\"$APP_VERSION\"}")
          # With a configured public key Tauri otherwise fails when the private
          # key is absent. --no-sign is the explicit unsigned-build path.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA+=(--no-sign)
          fi
          # An unconfigured secret still exports an empty variable, and an empty
          # APPLE_CERTIFICATE reads to the bundler as a certificate to import:
          # `security import` then fails on an empty keychain item and the unsigned
          # build dies after it has compiled. Clear the group it is not part of, and
          # the updater key with it — an empty key is the same shape, and `--no-sign`
          # above is the only thing hiding it.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" "${EXTRA[@]}"

      - name: Verify macOS bundle transport security
        shell: bash
        run: |
          plist="ui/app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Meiva.app/Contents/Info.plist"
          web_content=$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoadsInWebContent raw -expect bool -o - "$plist")
          test "$web_content" = true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          bundle="ui/app/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg="Meiva_${APP_VERSION}_universal.dmg"
          cp "$bundle/dmg/$dmg" "dist/$dmg"
          archive="Meiva_${APP_VERSION}.app.tar.gz"
          if [ -f "$bundle/macos/Meiva.app.tar.gz" ]; then
            cp "$bundle/macos/Meiva.app.tar.gz" "dist/$archive"
            cp "$bundle/macos/Meiva.app.tar.gz.sig" "dist/$archive.sig"
          fi
          if [ "$REQUIRE_SIGNING" = true ]; then
            test -s "dist/$archive"
            test -s "dist/$archive.sig"
          fi
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish-tag:
    name: Publish the standalone tag release
    needs: [prepare, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          merge-multiple: true
          path: artifacts

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Install locked release dependencies
        run: uv sync --frozen --no-dev

      - name: Publish the macOS tag release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          .venv/bin/python scripts/codegen/build_app_update_manifest.py manifest \
            --tag "$REF_NAME" --version "$APP_VERSION" --commit "$TARGET_SHA" \
            --artifacts artifacts --repo "$GITHUB_REPOSITORY" --out artifacts/latest.json
          gh release create "$REF_NAME" artifacts/* --verify-tag --latest=false \
            --title "Meiva App $REF_NAME" --generate-notes
