# Build the Meiva App (`ui/app`) for macOS and publish via a version tag,
# a publishing reusable call, or a dispatch with dry_run=false.
#
# App versions move independently of the cluster, so the app has its own tag
# namespace and its own release.
#
# Every publication requires a Tauri updater signature. An app-v* tag push
# also requires Apple Developer ID signing and notarization. Reusable calls and
# manual dispatches can publish ad-hoc signed macOS builds when Apple secrets
# are absent. A validation-only dispatch may omit all signing secrets.
#
# The gating secrets are lifted into job-level `env` because a step's `if` is
# evaluated against the job's environment, not the step's own.
#
# Secrets, all optional:
#   TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]  updater signatures + latest.json
#   APPLE_CERTIFICATE[_PASSWORD], APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID    Developer ID + notarization
# #
# `uses:` is pinned to a commit SHA with the version in a trailing comment, for
# the same supply-chain reason as ci.yml.

name: Release App

on:
  push:
    tags:
      - 'app-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    outputs:
      version:
        description: 'Version published to the updater feed'
        value: ${{ jobs.publish.outputs.version }}
    inputs:
      release_tag:
        description: 'Certified cluster release tag (vYYYY.MM.DD.HHMMSS[-hfN])'
        required: false
        type: string
        default: ''
      target_sha:
        description: 'Commit SHA to build and publish'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish to the mutable app-latest updater channel'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; set to false to publish to the app-latest channel'
        type: boolean
        default: true
      release_tag:
        description: 'Optional certified release tag (vYYYY.MM.DD.HHMMSS[-hfN])'
        required: false
        default: ''
      target_sha:
        description: 'Optional commit SHA to build (defaults to workflow ref HEAD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Exact pin: generated Android templates and release outputs are CLI inputs.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  prepare:
    name: Resolve app version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish == true || (github.event_name == 'workflow_dispatch' && toJSON(inputs.dry_run) == 'false') }}
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Resolve and validate version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys, tomllib

          cargo = tomllib.loads(pathlib.Path("ui/app/src-tauri/Cargo.toml").read_text())
          cargo_version = cargo["package"]["version"]
          if os.environ["EVENT_NAME"] == "push":
              match = re.fullmatch(r"app-v(\d+\.\d+\.\d+)", os.environ["REF_NAME"])
              if match is None:
                  raise SystemExit(f"invalid app release tag: {os.environ['REF_NAME']}")
              version = match.group(1)
              # The tag and Cargo.toml are both version sources; a release tag
              # that lags the crate version would ship a downgraded package, so
              # they must agree exactly.
              if version != cargo_version:
                  raise SystemExit(
                      f"tag version {version} != Cargo.toml version {cargo_version}; "
                      "bump ui/app/src-tauri/Cargo.toml to match the tag before releasing"
                  )
          else:
              version = subprocess.check_output(
                  [
                      sys.executable,
                      "scripts/codegen/build_app_update_manifest.py",
                      "version-name",
                      "--cargo-version",
                      cargo_version,
                      "--run-number",
                      os.environ["RUN_NUMBER"],
                  ],
                  text=True,
              ).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"release_tag={os.environ.get('RELEASE_TAG', '')}\n")
          PY
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.label }}
    needs: prepare
    outputs:
      built_at: ${{ steps.collect.outputs.built_at }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal dmg)
            runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EVENT_NAME: ${{ github.event_name }}
      PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ui/app/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
        shell: bash

      - name: Validate optional signing secret groups
        shell: bash
        run: |
          require_group() {
            local label="$1"
            shift
            local present=0 missing=0
            for value in "$@"; do
              if [ -n "$value" ]; then present=$((present + 1)); else missing=$((missing + 1)); fi
            done
            if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
              echo "$label secrets are only partially configured" >&2
              exit 1
            fi
          }
          require_group "Apple code-signing" \
            "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY"
          require_group "Apple notarization" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing password is configured without a private key" >&2
            exit 1
          fi
          if [ "$PUBLISH_RELEASE" = true ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Published macOS releases require updater signing" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || \
               [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || \
               [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "Release tags require Apple signing and notarization" >&2
              exit 1
            fi
          fi

      # Without the certificate the app is built ad-hoc signed, which still
      # runs locally (Gatekeeper prompts on first open).
      - name: Import the Apple Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build
        working-directory: ui/app
        shell: bash
        run: |
          EXTRA=(--config "{\"version\":\"$APP_VERSION\"}")
          # With a configured public key Tauri otherwise fails when the private
          # key is absent. --no-sign is the explicit unsigned-build path.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA+=(--no-sign)
          fi
          # An unconfigured secret still exports an empty variable, and an empty
          # APPLE_CERTIFICATE reads to the bundler as a certificate to import:
          # `security import` then fails on an empty keychain item and the unsigned
          # build dies after it has compiled. Clear the group it is not part of, and
          # the updater key with it — an empty key is the same shape, and `--no-sign`
          # above is the only thing hiding it.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" "${EXTRA[@]}"

      - name: Verify macOS bundle transport security
        shell: bash
        run: |
          plist="ui/app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Meiva.app/Contents/Info.plist"
          web_content=$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoadsInWebContent raw -expect bool -o - "$plist")
          test "$web_content" = true

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          find ui/app/src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist/ \;
          ls -l dist
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    if: needs.prepare.outputs.publish == 'true'
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: artifacts
          merge-multiple: true

      - name: Build the app-latest manifest
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          mkdir release-assets
          cp "artifacts/Meiva_${APP_VERSION}_universal.dmg" release-assets/
          archive="release-assets/Meiva_${APP_VERSION}.app.tar.gz"
          cp artifacts/Meiva.app.tar.gz "$archive"
          cp artifacts/Meiva.app.tar.gz.sig "$archive.sig"
          test -s "$archive.sig"
          python3 scripts/codegen/build_app_update_manifest.py \
            --tag app-latest \
            --version "$APP_VERSION" \
            --commit "$TARGET_SHA" \
            --artifacts release-assets \
            --repo "$GITHUB_REPOSITORY" \
            --out release-assets/latest.json
          cat release-assets/latest.json

      - name: Publish the macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          BUILT_AT: ${{ needs.desktop.outputs.built_at }}
          # Two retries give GitHub time to recover while bounding the replacement window.
          MANIFEST_UPLOAD_ATTEMPTS: 3
        run: |
          archive="release-assets/Meiva_${APP_VERSION}.app.tar.gz"
          binaries=("release-assets/Meiva_${APP_VERSION}_universal.dmg" "$archive" "$archive.sig")
          manifest=release-assets/latest.json
          jq -e '.platforms | length == 2' "$manifest" >/dev/null
          notes="$(printf 'Version: %s\n\nCommit: `%s`\n\nBuilt at: %s\n' "$APP_VERSION" "$TARGET_SHA" "$BUILT_AT")"

          python3 -m scripts.host_ops.release.publish_feed --tag app-latest \
            --version "$APP_VERSION" --target "$TARGET_SHA" \
            --manifest-attempts "$MANIFEST_UPLOAD_ATTEMPTS" \
            --title "Meiva Desktop Updater Feed ($APP_VERSION)" --notes "$notes" \
            "${binaries[@]}" "$manifest"
          if [ "$EVENT_NAME" = "push" ]; then
            mkdir -p "$RUNNER_TEMP/tag-release"
            tag_manifest="$RUNNER_TEMP/tag-release/latest.json"
            python3 scripts/codegen/build_app_update_manifest.py \
              --tag "$REF_NAME" --version "$APP_VERSION" --commit "$TARGET_SHA" \
              --artifacts release-assets --repo "$GITHUB_REPOSITORY" --out "$tag_manifest"
            if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release create "$REF_NAME" --verify-tag --latest=false \
                --title "Meiva App $REF_NAME" --generate-notes
            fi
            gh release upload "$REF_NAME" "${binaries[@]}" --clobber
            gh release upload "$REF_NAME" "$tag_manifest" --clobber
          fi
