# Post-merge Release Train and on-demand release certification gate.
#
# Scheduled runs certify `main` HEAD when new commits have landed since `channel/latest`, skipping
# runner-hours when `channel/latest` already points at `main` HEAD. Manual `workflow_dispatch` runs
# certify `main`, a release candidate ref, or a hotfix branch (`hotfix_of` -> `-hf<N>`).
#
# Products on success (all Git-native, zero reverse pull requests to `main`):
#   - immutable annotated tag `vYYYY.MM.DD.HHMMSS` (or `vYYYY.MM.DD.HHMMSS-hf<N>`) carrying a
#     `meiva-release/v1` JSON certificate bound to the peeled commit SHA;
#   - moving annotated tag `channel/latest` carrying a `meiva-channel/v1` JSON pointer when
#     certifying `refs/heads/main` (non-hotfix);
#   - a corresponding GitHub Release (`--latest=false`; `promote-release.yml` promotes to
#     `channel/stable` and `--latest`).

name: Release gate

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to certify (default main)
        required: false
        default: 'main'
      version:
        description: Explicit CalVer tag vYYYY.MM.DD.HHMMSS[-hfN] (leave empty to mint UTC timestamp)
        required: false
        default: ''
      hotfix_of:
        description: Certified base tag vYYYY.MM.DD.HHMMSS when certifying a post-release hotfix (-hfN)
        required: false
        default: ''
      reason:
        description: Operator note recorded in the release certificate
        required: false
        default: ''

permissions:
  contents: write
  actions: read

env:
  UV_FROZEN: "1"
  MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
  MEIVA_REDIS_URL: redis://127.0.0.1:1/0

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  precheck:
    name: Precheck (release train & base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      source_ref: ${{ steps.target.outputs.source_ref }}
      skip_train: ${{ steps.target.outputs.skip_train }}
      version: ${{ steps.target.outputs.version }}
      hotfix_of: ${{ steps.target.outputs.hotfix_of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch release and channel tags
        run: git fetch --tags --force origin

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Resolve target and check idle train
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref || 'main' }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          HOTFIX_OF: ${{ inputs.hotfix_of }}
        run: >
          python3 scripts/host_ops/release/certify.py precheck
          --repo .
          --event-name "$EVENT_NAME"
          --target-ref "$TARGET_REF"
          --version "$EXPLICIT_VERSION"
          --hotfix-of "$HOTFIX_OF"
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse a tree without a certified base
        if: steps.target.outputs.skip_train != 'true'
        run: >
          python3 scripts/host_ops/release/base.py
          --repo .
          --target "${{ steps.target.outputs.sha }}"
          --bootstrap-when-empty

      - name: Refuse a commit whose nightly full suite was red
        if: steps.target.outputs.skip_train != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.target.outputs.sha }}"
          conclusion="$(gh run list --workflow=refresh-test-durations.yml --commit "$sha" \
            --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          case "$conclusion" in
            failure) echo "::error::$sha failed the nightly full suite; a red night blocks the release gate"; exit 1 ;;
            "") echo "no nightly run for $sha - the gate's own matrix is the full-suite evidence" ;;
            *) echo "nightly full suite for $sha: $conclusion" ;;
          esac

  backend:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Backend full suite (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Vendored Postgres runtime (production's server build)
        uses: ./.github/actions/vendor-pg-runtime

      - name: Run the backend suite
        run: >
          uv run pytest -c pyproject.toml --rootdir=. -q --omit-static-tests
          --ignore=tests/e2e -m "not flaky" -n 4 --dist=loadfile
          --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration

  e2e:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: e2e full matrix (${{ matrix.group }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install Postgres 17 + Redis (server binaries on PATH)
        uses: ./.github/actions/install-pg-redis

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Vendored Postgres runtime (production's server build)
        uses: ./.github/actions/vendor-pg-runtime

      - name: Install frontend deps
        working-directory: ui/web
        run: npm ci

      - name: Install Playwright chromium
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium

      - name: Install Playwright system deps
        uses: ./.github/actions/install-playwright-deps
        timeout-minutes: 15

      - name: Run the e2e suite
        run: >
          uv run pytest tests/e2e/ -v -n 2
          --splits 4 --group ${{ matrix.group }} --splitting-algorithm least_duration

  platform-smoke:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Platform smoke (vendored runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Install locked Python environment
        uses: ./.github/actions/uv-sync

      - name: Vendored PG + injected pgvector (CREATE EXTENSION + query)
        run: uv run python scripts/ci/pgvector_runtime_smoke.py

  certify:
    needs: [precheck, backend, e2e, platform-smoke]
    if: success() && needs.precheck.outputs.skip_train != 'true'
    name: Certify and publish channel/latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}
          fetch-depth: 0

      - name: Fetch release and channel tags
        run: git fetch --tags --force origin

      - name: Mint annotated release certificate
        id: mint
        env:
          SHA: ${{ needs.precheck.outputs.sha }}
          SOURCE_REF: ${{ needs.precheck.outputs.source_ref }}
          EXPLICIT_VERSION: ${{ needs.precheck.outputs.version }}
          HOTFIX_OF: ${{ needs.precheck.outputs.hotfix_of }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ inputs.reason }}
        run: >
          python3 scripts/host_ops/release/certify.py mint
          --repo .
          --sha "$SHA"
          --source-ref "$SOURCE_REF"
          --certified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --gate-run-id "$RUN_ID"
          --gate-run-url "$RUN_URL"
          --version "$EXPLICIT_VERSION"
          --hotfix-of "$HOTFIX_OF"
          --reason "$REASON"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish release tag, channel/latest, and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mint.outputs.version }}
          SHA: ${{ steps.mint.outputs.sha }}
          TAG_ACTION: ${{ steps.mint.outputs.tag_action }}
          ADVANCE_LATEST: ${{ steps.mint.outputs.advance_latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TAG_ACTION" = "create" ]; then
            git push origin "refs/tags/$VERSION"
          fi
          if [ "$ADVANCE_LATEST" = "true" ]; then
            git push --force origin refs/tags/channel/latest:refs/tags/channel/latest
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --verify-tag \
              --latest=false \
              --title "$VERSION" \
              --notes "Certified commit \`$SHA\` via Release gate ($RUN_URL)."
          fi
