# Post-merge Release Train and on-demand release certification gate.
#
# Scheduled runs certify `main` HEAD when new commits have landed since `channel/latest`, skipping
# runner-hours when `channel/latest` already points at `main` HEAD. Manual `workflow_dispatch` runs
# certify `main`, a release candidate ref, or a hotfix branch (`hotfix_of` -> `-hf<N>`).
#
# Products on success (all Git-native, zero reverse pull requests to `main`):
#   - immutable annotated tag `vYYYY.MM.DD.HHMMSS` (or `vYYYY.MM.DD.HHMMSS-hf<N>`) carrying a
#     `meiva-release/v1` JSON certificate bound to the peeled commit SHA;
#   - moving annotated tag `channel/latest` carrying a `meiva-channel/v1` JSON pointer when
#     certifying `refs/heads/main` (non-hotfix);
#   - a corresponding GitHub Release (`--latest=false`; `promote-release.yml` promotes to
#     `channel/stable` and `--latest`).

name: Release gate

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to certify (default main)
        required: false
        default: 'main'
      version:
        description: Explicit CalVer tag vYYYY.MM.DD.HHMMSS[-hfN] (leave empty to mint UTC timestamp)
        required: false
        default: ''
      hotfix_of:
        description: Certified base tag vYYYY.MM.DD.HHMMSS when certifying a post-release hotfix (-hfN)
        required: false
        default: ''
      reason:
        description: Operator note recorded in the release certificate
        required: false
        default: ''

permissions:
  contents: write
  actions: read

env:
  UV_FROZEN: "1"
  MEIVA_DB_URL: postgresql://unused@127.0.0.1:1/unused
  MEIVA_REDIS_URL: redis://127.0.0.1:1/0

concurrency:
  group: release-gate
  cancel-in-progress: false

jobs:
  precheck:
    name: Precheck (release train & base)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      source_ref: ${{ steps.target.outputs.source_ref }}
      skip_train: ${{ steps.target.outputs.skip_train }}
      version: ${{ steps.target.outputs.version }}
      hotfix_of: ${{ steps.target.outputs.hotfix_of }}
      durations_key: ${{ steps.durations.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch release and channel tags
        run: git fetch --tags --force origin

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Resolve target and check idle train
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ inputs.target_ref || 'main' }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          HOTFIX_OF: ${{ inputs.hotfix_of }}
        run: >
          python3 scripts/host_ops/release/certify.py precheck
          --repo .
          --event-name "$EVENT_NAME"
          --target-ref "$TARGET_REF"
          --version "$EXPLICIT_VERSION"
          --hotfix-of "$HOTFIX_OF"
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse a tree without a certified base
        if: steps.target.outputs.skip_train != 'true'
        run: >
          python3 scripts/host_ops/release/base.py
          --repo .
          --target "${{ steps.target.outputs.sha }}"
          --bootstrap-when-empty

      - name: Refuse a commit whose nightly full suite was red
        if: steps.target.outputs.skip_train != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.target.outputs.sha }}"
          conclusion="$(gh run list --workflow=refresh-test-durations.yml --commit "$sha" \
            --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          case "$conclusion" in
            failure) echo "::error::$sha failed the nightly full suite; a red night blocks the release gate"; exit 1 ;;
            "") echo "no nightly run for $sha - the gate's own matrix is the full-suite evidence" ;;
            *) echo "nightly full suite for $sha: $conclusion" ;;
          esac

      - name: Resolve the test durations
        id: durations
        if: steps.target.outputs.skip_train != 'true'
        uses: ./.github/actions/resolve-test-durations

  static-and-structure:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Static, structure & locality full gate
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}
          fetch-depth: 0

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install locked Python environment
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps (TypeScript parser and codegen)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Check repository language, locks, and core-content manifests
        run: |
          python3 scripts/content_lint/lint_no_cjk.py
          python3 scripts/content_lint/lint_no_tailnet.py
          python3 scripts/lint/meiva_root_scope.py
          python3 scripts/lint/locks/python_lock.py
          python3 scripts/lint/locks/package_lock.py
          uv lock --check
          uv run python scripts/content_lint/lint_core_content_manifests.py

      - name: Run full ruff, migrations, and clock lattice checks
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run python scripts/content_lint/lint_migrations.py
          uv run python -m meizel.owners.clock_lattice_cli

      - name: Apply migrations to fresh DB + trigger smoke
        run: |
          mkdir -p "$HOME/.meiva"
          ln -sfn "$CI_VENDORED_RUNTIME_ROOT" "$HOME/.meiva/runtime"
          uv run python scripts/ci/migration_smoke.py

      - name: Run full basedpyright
        run: time uv run basedpyright --threads 2

      - name: Validate source notes, structural hooks, codegen freshness, and locality
        env:
          SKIP: check-code-comments,ruff,ruff-format,pyright,meizel-check-changed,lint-migrations,lint-clock-lattice,frontend-tsc,frontend-eslint,frontend-vitest,lint-core-content-manifests,check-git-hooks-install
        run: |
          bash scripts/content_lint/code_comments/check.sh validate
          env -u VIRTUAL_ENV uv run pre-commit run --all-files
          env -u VIRTUAL_ENV uv run python -m meizel check

  backend-static:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Backend static contracts (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.precheck.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install locked Python environment
        uses: ./.github/actions/uv-sync

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps (TypeScript source parser)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Run static pytest contracts
        id: pytest-static
        run: |
          mkdir -p tmp
          uv run pytest --test-environment=static -q -n 4 --dist=loadfile \
            --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration \
            -W error::pytest.PytestUnhandledThreadExceptionWarning \
            --junit-xml=tmp/junit-release-static-${{ matrix.group }}.xml -o junit_family=xunit1

      - name: Validate static test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.pytest-static.outcome }}
          junit-patterns: '["tmp/junit-release-static-${{ matrix.group }}.xml"]'

  frontend:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Frontend full suite (typecheck, build, lint, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"
          cache: true
          cache_dependency_path: ui/web/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types (typedRoutes)
        working-directory: ui/web
        run: pnpm exec next typegen

      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: ui/web
        run: pnpm exec tsc --noEmit

      - name: Production build
        working-directory: ui/web
        run: pnpm run build

      - name: Production bundle integrity (minifier side-effect tripwires)
        working-directory: ui/web
        run: pnpm run check:bundle-integrity

      - name: ESLint
        working-directory: ui/web
        run: pnpm run lint

      - name: Unit tests (vitest run)
        id: vitest
        working-directory: ui/web
        run: pnpm exec vitest run --config tests/vitest.config.mts --coverage

      - name: Frontend coverage gate
        working-directory: ui/web
        env:
          FRONTEND_COVERAGE_THRESHOLD: "81"
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("coverage/coverage-summary.json").read_text())
          coverage = float(summary["total"]["lines"]["pct"])
          threshold = float(os.environ.get("FRONTEND_COVERAGE_THRESHOLD", "81"))
          print(f"Frontend line coverage: {coverage}% (threshold: {threshold}%)")
          if coverage < threshold:
              raise SystemExit(
                  f"Frontend coverage {coverage}% is below threshold {threshold}%"
              )
          EOF

      - name: Flaky unit tests (vitest run, serial)
        id: vitest-flaky
        if: ${{ !cancelled() }}
        working-directory: ui/web
        run: pnpm exec vitest run --config tests/vitest.flaky.config.mts

      - name: Validate native test results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.vitest.outcome }}
          junit-patterns: '["ui/web/junit.xml"]'

      - name: Validate flaky frontend results
        if: ${{ !cancelled() }}
        uses: ./.github/actions/require-test-gate
        with:
          test-outcome: ${{ steps.vitest-flaky.outcome }}
          junit-patterns: '["ui/web/junit-flaky.xml"]'
          min-tests: '0'

  backend:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Backend full suite (${{ matrix.group }}/8)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.precheck.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps (TypeScript source parser)
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Run the backend suite
        run: >
          uv run pytest -c pyproject.toml --rootdir=. -q --omit-static-tests
          --ignore=tests/e2e -m "not flaky" -n 4 --dist=loadfile
          --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration

      - name: Run flaky backend bucket serially (shard 1)
        if: ${{ matrix.group == 1 }}
        run: |
          set +e
          uv run pytest -m flaky --omit-static-tests --ignore=tests/e2e -q
          status=$?
          if [ "$status" = 5 ]; then exit 0; fi
          exit "$status"

  e2e:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: e2e full matrix (${{ matrix.group }}/4)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - name: Restore the test durations
        uses: ./.github/actions/restore-test-durations
        with:
          key: ${{ needs.precheck.outputs.durations_key }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Cache frontend node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui/web/node_modules
          key: ui-web-node-modules-${{ runner.os }}-${{ hashFiles('ui/web/pnpm-lock.yaml') }}

      - name: Install frontend deps
        working-directory: ui/web
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright chromium cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: timeout 300 uv run playwright install chromium

      - name: Save Playwright chromium cache
        if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Run the e2e suite
        id: pytest-e2e
        shell: bash
        run: |
          uv run pytest tests/e2e/ -v -n 2 \
            --splits 4 --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --junit-xml=tmp/junit-e2e-shard-${{ matrix.group }}.xml -o junit_family=xunit1

      - name: Upload native test reports
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e-shard-${{ matrix.group }}
          path: tmp/junit-e2e-shard-*.xml
          if-no-files-found: warn

      - name: Upload e2e logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-matrix-${{ matrix.group }}
          path: tmp/e2e-logs/

  platform-smoke:
    needs: precheck
    if: needs.precheck.outputs.skip_train != 'true'
    name: Platform smoke (vendored runtime)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zhiyuan-zhang0206/meiva-ci-runner@sha256:a17652b71203a57be18bd343938fc20d8227ccb40010aba8067a08b0e74b3029
      options: --init --shm-size=2g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}

      - name: Cache uv wheels
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-container-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-container-${{ runner.os }}-

      - name: Install locked Python environment
        uses: ./.github/actions/uv-sync

      - name: Vendored PG + injected pgvector (CREATE EXTENSION + query)
        run: uv run python scripts/ci/pgvector_runtime_smoke.py

  certify:
    needs: [precheck, static-and-structure, backend-static, frontend, backend, e2e, platform-smoke]
    if: success() && needs.precheck.outputs.skip_train != 'true'
    name: Certify and publish channel/latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.sha }}
          fetch-depth: 0

      - name: Fetch release and channel tags
        run: git fetch --tags --force origin

      - name: Mint annotated release certificate
        id: mint
        env:
          SHA: ${{ needs.precheck.outputs.sha }}
          SOURCE_REF: ${{ needs.precheck.outputs.source_ref }}
          EXPLICIT_VERSION: ${{ needs.precheck.outputs.version }}
          HOTFIX_OF: ${{ needs.precheck.outputs.hotfix_of }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ inputs.reason }}
        run: >
          python3 scripts/host_ops/release/certify.py mint
          --repo .
          --sha "$SHA"
          --source-ref "$SOURCE_REF"
          --certified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --gate-run-id "$RUN_ID"
          --gate-run-url "$RUN_URL"
          --version "$EXPLICIT_VERSION"
          --hotfix-of "$HOTFIX_OF"
          --reason "$REASON"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish release tag, channel/latest, and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.mint.outputs.version }}
          SHA: ${{ steps.mint.outputs.sha }}
          TAG_ACTION: ${{ steps.mint.outputs.tag_action }}
          ADVANCE_LATEST: ${{ steps.mint.outputs.advance_latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TAG_ACTION" = "create" ]; then
            git push origin "refs/tags/$VERSION"
          fi
          if [ "$ADVANCE_LATEST" = "true" ]; then
            git push --force origin refs/tags/channel/latest:refs/tags/channel/latest
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --verify-tag \
              --latest=false \
              --title "$VERSION" \
              --notes "Certified commit \`$SHA\` via Release gate ($RUN_URL)."
          fi
