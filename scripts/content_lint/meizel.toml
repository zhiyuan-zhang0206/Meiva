exports = ["check_doc_references.py", "lint_meiva_okf.py", "lint_no_cjk.py", "lint_no_tailnet.py"]

[uses]
"tests" = ["check_cross_branch_migrations.py", "check_doc_references.py", "lint_audit_record.py", "lint_meiva_okf.py", "lint_core_content_manifests.py", "lint_doc_anchors.py", "lint_doc_roster.py", "lint_doc_symbols.py", "lint_migrations.py", "lint_no_cjk.py", "lint_no_tailnet.py", "lint_skill_descriptions.py", "lint_skill_md_size.py"]

[roots]
"check_cross_branch_migrations.py" = { kinds = ["environ", "platform"], why = "CLI entry of the single-branch premise check: its __main__ block builds the host of this process with Host.system(), handing it the process environment" }
"lint_core_content_manifests.py" = { kinds = ["environ", "home", "argv"], why = "CLI entry of the core-content manifest gate (CI job and pre-commit hook): main() expands the `~` an operator writes in each --audit-dir before the parser checks that the path exists, and hands the process environment to the one `git log` that derives the host version the manifests are checked against — nothing below main() reads either again; it also reads its command line (argv) once, as the process entry" }
"lint_doc_roster.py" = { kinds = ["home"], why = "CLI entry of the roster lint: main() resolves the scratch home the entry just entered and builds the service roster the documents are compared against from it" }
"lint_meiva_okf.py" = { kinds = ["cwd"], why = "CLI OKF linter defaults to the current checkout directory when invoked from the command line" }

[debt.ambient-read]
"check_doc_references.py#cwd pathlib.Path.absolute" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"lint_audit_record.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"lint_migrations.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"lint_no_cjk.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
