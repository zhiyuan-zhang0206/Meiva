exports = ["check_doc_references.py", "lint_meiva_okf.py", "lint_no_cjk.py", "lint_no_tailnet.py"]

[uses]
"tests" = ["check_cross_branch_migrations.py", "check_doc_references.py", "lint_audit_record.py", "lint_meiva_okf.py", "lint_core_content_manifests.py", "lint_doc_anchors.py", "lint_doc_roster.py", "lint_doc_symbols.py", "lint_migrations.py", "lint_no_cjk.py", "lint_no_tailnet.py", "lint_skill_descriptions.py", "lint_skill_md_size.py"]

[roots]
"check_cross_branch_migrations.py" = { kinds = ["environ", "platform"], why = "CLI entry of the single-branch premise check: its __main__ block builds the host of this process with Host.system(), handing it the process environment" }
"lint_audit_record.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"lint_core_content_manifests.py" = { kinds = ["environ", "home", "argv"], why = "CLI entry of the core-content manifest gate (CI job and pre-commit hook): the __main__ guard reads argv[1:] and the operator's home (Path.home()) once and hands both to main(), which expands the `~` an operator writes in each --audit-dir with that home before the parser checks that the path exists, and hands the process environment to the one `git log` that derives the host version the manifests are checked against — nothing below main() reads any of them again" }
"lint_doc_roster.py" = { kinds = ["home"], why = "CLI entry of the roster lint: main() resolves the scratch home the entry just entered and builds the service roster the documents are compared against from it" }
"lint_meiva_okf.py" = { kinds = ["cwd", "argv"], why = "CLI OKF linter defaults to the current checkout directory when invoked from the command line; the __main__ guard reads argv[1:] once and hands it to main" }
"lint_migrations.py" = { kinds = ["argv"], why = "Lint script entry: its __main__ block takes the process command line (sys.argv[1:])" }
"lint_no_cjk.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"lint_no_tailnet.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }

[debt.ambient-read]
"check_doc_references.py#cwd pathlib.Path.absolute" = { count = 1, owner = "#8237", until = "waits for `main` to require an absolute `repo` and absolute docs: `.absolute()` anchors a relative path at the working directory" }
