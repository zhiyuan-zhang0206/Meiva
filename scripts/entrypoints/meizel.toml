[uses]
"agent.py" = ["spawn_request.py"]
"tests" = ["spawn_request.py"]

[roots]
"agent.py" = { kinds = ["random", "settings"], why = "CLI bootstrap entrypoint: main() composes the gateway access from settings once and draws the fresh UUID4 idempotency key the spawn request carries" }

[purity]
"." = "strict"
"agent.py" = { mode = "none", why = "the command line shell: it puts the checkout on sys.path, reads the gateway access from settings, posts the request the pure module builds, and prints the id the gateway answers with; the route, headers and id parsing are in spawn_request.py" }
"gateway.py" = { mode = "none", why = "the launch wrapper: it puts the checkout on sys.path and calls gateway.app.main(); it decides nothing of its own" }
"spawn_request.py" = "strict"
