exports = ["check_model_updates.py", "check_plugin_price_drift.py", "update_model_pricing.py"]

[uses]
"check_model_updates.py" = ["json_guards.py"]
"check_plugin_price_drift.py" = ["plugin_price_sync.py"]
"plugin_price_source.py" = ["plugin_price_rates.py"]
"plugin_price_sync.py" = ["plugin_price_rates.py", "plugin_price_source.py"]
"tests" = [
    "check_model_updates.py",
    "check_plugin_price_drift.py",
    "plugin_price_rates.py",
    "plugin_price_source.py",
    "plugin_price_sync.py",
    "update_model_pricing.py",
]
"update_model_pricing.py" = ["plugin_price_sync.py"]

[roots]
"check_model_updates.py" = { kinds = ["environ", "home", "argv"], why = "tracker selects provider API-key aliases dynamically and must prefer the live process env before its `.env` fallback; main() resolves the home once for the tracker state directory and the model catalog; the __main__ guard reads argv[1:] once and hands it to main" }
"check_plugin_price_drift.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"update_model_pricing.py" = { kinds = ["clock", "argv"], why = "CLI entrypoint stamps provisional pricing updates and selects the active archive period against current UTC time; the __main__ guard reads argv[1:] once and hands it to main" }

[debt.restricted-python]
"plugin_price_rates.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
