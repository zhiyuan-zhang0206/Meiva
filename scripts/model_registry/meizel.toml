exports = ["check_model_updates.py", "update_model_pricing.py"]

[uses]
"plugin_price_source.py" = ["plugin_price_rates.py"]
"plugin_price_sync.py" = ["plugin_price_rates.py", "plugin_price_source.py"]
"tests" = [
    "check_model_updates.py",
    "plugin_price_source.py",
    "plugin_price_sync.py",
    "update_model_pricing.py",
]
"update_model_pricing.py" = ["plugin_price_sync.py"]

[roots]
"check_model_updates.py" = { kinds = ["environ", "home"], why = "tracker selects provider API-key aliases dynamically and must prefer the live process env before its `.env` fallback; main() resolves the home once for the tracker state directory and the model catalog" }
"update_model_pricing.py" = { kinds = ["clock"], why = "CLI entrypoint stamps provisional pricing updates and selects the active archive period against current UTC time" }

[debt.ambient-read]
