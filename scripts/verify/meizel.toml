exports = ["scripted_reply.py", "understanding_replay.py"]

[uses]
"container.py" = ["boundary.py"]
"observe.py" = ["scripted_reply.py"]
"tart_golden.py" = ["boundary.py", "tart_vm.py"]
"tart_run.py" = ["boundary.py", "tart_vm.py"]
"tart_vm.py" = ["boundary.py"]
"tests" = ["boundary.py", "container.py", "observe.py", "tart_golden.py", "tart_run.py", "tart_vm.py"]

[roots]
"clean_host_deps.py" = { kinds = ["random", "argv", "environ"], why = "Verification recipe CLI generates a unique container name per run; it also reads its command line (argv) once, as the process entry, finds a program on PATH, and creates scratch space under the temporary directory (TMPDIR)" }
"container.py" = { kinds = ["clock", "home", "random", "argv", "environ"], why = "Container verification CLI entry: main() resolves the host home boundary, generates a unique container name and takes the run's one start-time stamp, then hands each value down to run(); it also reads its command line (argv) once, as the process entry, and creates scratch space under the temporary directory (TMPDIR)" }
"host_dependency_refusal.py" = { kinds = ["random", "argv", "environ"], why = "Verification recipe CLI generates a unique container name per run; it also reads its command line (argv) once, as the process entry, finds a program on PATH, and creates scratch space under the temporary directory (TMPDIR)" }
"observe.py" = { kinds = ["clock", "home", "platform", "random", "argv", "pid"], why = "In-boundary observer CLI records the guest platform, timestamp, home directory and idempotency key; it also reads its command line (argv) once, as the process entry, and names its own interpreter (sys.executable) for the command it builds" }
"tart_golden.py" = { kinds = ["clock", "home", "argv", "environ"], why = "Golden VM builder CLI entry: main() resolves the default Tart binary and host home boundary and takes the run's one start-time stamp, then hands each value down to build_golden(); it also reads its command line (argv) once, as the process entry, finds a program on PATH, and creates scratch space under the temporary directory (TMPDIR)" }
"tart_run.py" = { kinds = ["clock", "home", "random", "argv", "environ"], why = "Tart verification CLI entry: main() resolves the host home boundary, generates a unique run VM name and takes the run's one start-time stamp, then hands each value down to run(); it also reads its command line (argv) once, as the process entry, finds a program on PATH, and creates scratch space under the temporary directory (TMPDIR)" }
"understanding_replay.py" = { kinds = ["clock", "db", "home", "settings", "argv"], why = "Tool entry composes its process resources from the launch configuration, resolves the home the model catalog discovers plugins under, and builds the process clock its replay passes stamp with; the __main__ guard reads argv[1:] once and hands it to main" }

[debt.ambient-read]
"tart_golden.py#pid builtins.input" = { count = 1, owner = "#8237", until = "waits for `await_grant` to take the operator's confirmation as a value from the entry: it asks with `input()` itself" }
