exports = ["affected_tests.py", "tests"]

[uses]
"affected_tests.py" = []
"meizel_run.py" = []
"tests" = ["affected_tests.py", "meizel_run.py"]

[roots]
"meizel_run.py" = { kinds = ["cwd", "environ", "pid"], why = "push entry binds the checkout directory and sanitized environment for the full Meizel check" }
"affected_tests.py" = { kinds = ["environ", "argv", "pid", "random"], why = "local entry reads the launcher's environment, argv and interpreter once in the __main__ block and hands every child the CI contract (that environment minus MEIVA_*); it starts pytest in its own process group so a timeout can stop the whole group, and it writes the selector's changed-file list to a scratch file" }
