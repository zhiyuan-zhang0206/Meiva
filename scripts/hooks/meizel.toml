exports = ["diff_checks.py", "diff_checks_pytest.py", "tests"]

[uses]
"diff_checks.py" = ["diff_checks_cache.py", "diff_checks_fields.py", "diff_checks_plan.py", "diff_checks_pytest.py"]
"diff_checks_fields.py" = ["diff_checks_pytest.py"]
"diff_checks_plan.py" = ["diff_checks_cache.py", "diff_checks_fields.py"]
"diff_checks_pytest.py" = []
"tests" = ["diff_checks.py", "diff_checks_cache.py"]

[roots]
"diff_checks.py" = { kinds = ["environ", "pid", "argv", "random"], why = "receipt entry point composes what each judged child inherits: it reads the launcher's environment once in main() and hands every child the CI contract (that environment minus MEIVA_*), because a child that inherits the operator's shell reports the shell's state as if it were the change's (#5907); it also names its own interpreter (sys.executable) for the command it builds; the __main__ guard reads argv[1:] once and hands it to main; it also names its report directory and its file listing at random under the temporary directory" }

[debt.ambient-read]
"diff_checks_plan.py#environ shutil.which()" = { count = 2, owner = "#8237", until = "waits for the module's top level to take the program path, or the search path, from its caller: it asks PATH for the program itself" }
"diff_checks_plan.py#pid sys.executable" = { count = 7, owner = "#8237", until = "waits for the module's top level, `_meizel_runs`, `_full_meizel_runs`, `_debt_runs`, `_docs_runs` and `_refusal_runs` to take the interpreter path from its caller: it reads `sys.executable` itself" }
"diff_checks_pytest.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for `pytest_argv` to take the interpreter path from its caller: it reads `sys.executable` itself" }
