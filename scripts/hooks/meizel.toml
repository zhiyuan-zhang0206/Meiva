[roots]
"diff_checks.py" = { kinds = ["environ", "pid"], why = "receipt entry point composes what each judged child inherits: it reads the launcher's environment once in main() and hands every child the CI contract (that environment minus MEIVA_*), because a child that inherits the operator's shell reports the shell's state as if it were the change's (#5907); it also names its own interpreter (sys.executable) for the command it builds" }

