exports = ["no_meiva_in_hooks_cli.py", "no_plugin_wrap.py"]

[uses]
"no_plugin_wrap_cli.py" = ["no_plugin_wrap.py"]
"no_meiva_in_hooks_cli.py" = ["no_meiva_in_hooks.py"]
"tests" = ["no_meiva_in_hooks.py", "no_meiva_in_hooks_cli.py", "no_plugin_wrap.py", "no_plugin_wrap_cli.py"]

[roots]
"no_meiva_in_hooks_cli.py" = { kinds = ["argv"], why = "pre-commit process entry: reads argv[1:] once and hands it to the rule's main" }
"no_plugin_wrap_cli.py" = { kinds = ["argv"], why = "pre-commit process entry: reads argv[1:] once and hands it to the rule's main" }

[purity]
"." = "strict"
"no_meiva_in_hooks.py" = "strict"
"no_meiva_in_hooks_cli.py" = { mode = "none", why = "the command-line entry of the plugin-hook rule: it reads the roles the root manifest declares once and hands the scan directories to the rule, which decides what counts as a hook module and what the finding says" }
"no_plugin_wrap.py" = "strict"
"no_plugin_wrap_cli.py" = { mode = "none", why = "the command-line entry of the plugin-wrap rule: it reads the argument vector once and hands it to the rule, which decides what counts as a bare wrap and what the finding says" }
