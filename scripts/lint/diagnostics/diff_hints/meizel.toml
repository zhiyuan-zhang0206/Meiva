exports = ["hints.py"]

[purity]
"." = { mode = "none", why = "hints.py is the shell: it runs git, reads the revision's files and prints what the pure modules listed here return; each of those is strict on its own line" }
"acks.py" = "strict"
"ambient.py" = "strict"
"branches.py" = "strict"
"catalog.py" = "strict"
"diff.py" = "strict"
"engine.py" = "strict"
"model.py" = "strict"
"names.py" = "strict"
"promotion.py" = "strict"
"removed.py" = "strict"
"render.py" = "strict"
"scope.py" = "strict"
"seams.py" = "strict"
"shapes.py" = "strict"
"signatures.py" = "strict"
"stats.py" = "strict"
"walk.py" = "strict"

[uses]
"acks.py" = ["model.py"]
"ambient.py" = ["model.py", "scope.py"]
"branches.py" = ["model.py", "names.py", "walk.py"]
"catalog.py" = ["model.py"]
"diff.py" = ["model.py"]
"engine.py" = ["ambient.py", "branches.py", "model.py", "removed.py", "scope.py", "seams.py", "shapes.py", "signatures.py"]
"hints.py" = ["acks.py", "diff.py", "engine.py", "model.py", "promotion.py", "render.py", "scope.py", "stats.py"]
"promotion.py" = ["model.py", "scope.py"]
"removed.py" = ["model.py", "scope.py"]
"render.py" = ["acks.py", "catalog.py", "model.py"]
"scope.py" = ["model.py", "names.py"]
"seams.py" = ["model.py", "names.py", "walk.py"]
"shapes.py" = ["model.py", "names.py"]
"signatures.py" = ["model.py", "names.py", "walk.py"]
"stats.py" = ["model.py", "names.py", "scope.py", "signatures.py", "walk.py"]
"tests" = ["acks.py", "catalog.py", "diff.py", "engine.py", "hints.py", "model.py", "promotion.py", "removed.py", "render.py", "scope.py", "stats.py"]
"walk.py" = ["model.py"]

[debt.ambient-read]
"hints.py#environ shutil.which()" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
