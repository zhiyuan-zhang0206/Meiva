exports = ["admission_floor.py", "check_worktree_remove.py", "onboarding"]

[uses]
"admission_run.py" = ["admission_floor.py", "admission_ledger.py"]
"tests" = ["admission_floor.py", "admission_run.py", "guard_editable_venv.py", "host_memory_sample.py", "update_schedule_script.py"]

[external]
"update_schedule_script.py" = "compiles a user-written schedule script before replacing the stored copy"

[roots]
"admission_run.py" = { kinds = ["clock", "home", "pid", "platform"], why = "host admission wrapper CLI samples live host resources, stamps reservations with current PID/boot/time, and logs under ~/.meiva/admission" }
"check_worktree_remove.py" = { kinds = ["home", "pid"], why = "Entry point of the pre-removal guard: it names itself by its pid and process group for the process scan and resolves the home whose pty-sessions socket it asks" }
"guard_editable_venv.py" = { kinds = ["cwd", "environ", "home"], why = "dependency-free pre-uv preflight must inspect inherited VIRTUAL_ENV and default checkout cwd before a project environment can be trusted or Settings can import, and it expands a `~` in the paths the operator names with no owner function to route through" }
"host_memory_sample.py" = { kinds = ["clock", "home", "pid"], why = "host memory sampler CLI reads the current user slice by UID, timestamps the sample, and appends to ~/.meiva/logs/host-memory.jsonl" }
"update_schedule_script.py" = { kinds = ["db", "environ", "home", "pid"], why = "Operator maintenance CLI entry: it reads its own process environment and home to admit the installed runtime, opens the target home's database pool after verifying the agent host is stopped, and names itself by its pid in the lifecycle lock" }
