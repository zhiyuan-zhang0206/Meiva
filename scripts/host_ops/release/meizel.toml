exports = ["base.py", "bisect_train.py", "certify.py", "git_tags.py", "nightly.py", "promote.py", "tag.py"]

[uses]
"base.py" = ["git_tags.py"]
"bisect_train.py" = ["git_tags.py"]
"certify.py" = ["git_tags.py", "tag.py"]
"promote.py" = ["git_tags.py"]
"tag.py" = ["git_tags.py"]
"tests" = ["base.py", "bisect_train.py", "certify.py", "git_tags.py", "nightly.py", "promote.py", "tag.py"]

[roots]
"base.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"bisect_train.py" = { kinds = ["argv", "pid"], why = "the __main__ guard reads argv[1:] once and hands it to main, and names the interpreter it runs on (sys.executable) for the `git bisect run` child it starts and for the pytest-python fallback when the repository has no virtualenv" }
"certify.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"nightly.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"promote.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"tag.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }

[debt.ambient-read]
"bisect_train.py#environ tempfile.TemporaryDirectory()" = { count = 2, owner = "#5816", until = "permanently: both sites need a directory outside the repository — `_run_probe` gives the test run a throwaway `MEIVA_HOME` that the commit under test must not find this checkout's state in, and `_execute_bisect` checks out the `git worktree` it bisects in there; the only path either caller holds is `repository`, which is the one location both must stay out of" }
"bisect_train.py#random tempfile.TemporaryDirectory()" = { count = 2, owner = "#5816", until = "permanently: both names are minted by the OS because a bisect runs the probe many times in one process and every worktree has to be its own; `main` hands over the plan, the repository and the interpreter, and nothing that could stand in for a name" }
