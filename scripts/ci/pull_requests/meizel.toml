exports = ["accounting.py", "classify_paths.py", "commands.py", "export_process.py", "pr_flow_export.py", "runs_api.py", "runs_export.py", "status.py"]

[uses]
"commands.py" = ["accounting.py", "diagnose.py", "monitor.py", "owner_operations.py", "status.py"]
"diagnose.py" = ["job_rerun.py", "trunk_api.py"]
"monitor.py" = ["status.py"]
"owner_operations.py" = ["job_rerun.py", "monitor.py", "status.py", "trunk_api.py"]
"pr_flow_export.py" = ["export_process.py", "trunk_api.py"]
"runs_api.py" = ["export_process.py"]
"runs_export.py" = ["export_process.py", "runs_api.py"]
"tests" = ["accounting.py", "commands.py", "diagnose.py", "export_process.py", "job_rerun.py", "monitor.py", "owner_operations.py", "runs_api.py", "runs_export.py", "status.py", "trunk_api.py"]
"watch_pr.py" = ["status.py"]

[roots]
"commands.py" = { kinds = ["environ"], why = "TRUNK_API_TOKEN optionally adds read-only queue evidence to diagnosis; it is not deployment configuration" }

"export_process.py" = { kinds = ["settings"], why = "Tool entry composes its process resources from the launch configuration" }

[debt.ambient-read]
"accounting.py#clock datetime.datetime.now" = 1
"classify_paths.py#cwd pathlib.Path.cwd" = 1
"export_process.py#db base.db.Database.from_settings" = 1
"pr_flow_export.py#clock datetime.datetime.now" = 1
"pr_flow_export.py#home pathlib.Path.home" = 1
"runs_export.py#clock datetime.datetime.now" = 1
