exports = ["accounting.py", "classify_paths.py", "commands.py", "export_process.py", "gh_process.py", "pr_flow_export.py", "runs_api.py", "runs_export.py", "status.py"]

[uses]
"commands.py" = ["accounting.py", "diagnose.py", "monitor.py", "owner_operations.py", "status.py"]
"diagnose.py" = ["job_rerun.py", "trunk_api.py"]
"monitor.py" = ["status.py"]
"owner_operations.py" = ["job_rerun.py", "monitor.py", "status.py", "trunk_api.py"]
"pr_flow_export.py" = ["export_process.py", "gh_process.py", "trunk_api.py"]
"runs_api.py" = ["gh_process.py"]
"runs_export.py" = ["export_process.py", "gh_process.py", "runs_api.py"]
"tests" = ["accounting.py", "commands.py", "diagnose.py", "export_process.py", "gh_process.py", "job_rerun.py", "monitor.py", "owner_operations.py", "runs_api.py", "runs_export.py", "status.py", "trunk_api.py"]
"watch_pr.py" = ["status.py"]

[roots]
"accounting.py" = { kinds = ["clock", "platform"], why = "CLI entrypoint resolves the current UTC timestamp for --report rollups; builds the host of this process with Host.system()" }
"classify_paths.py" = { kinds = ["cwd"], why = "CI classify entrypoint resolves the checked-out repository root from cwd" }
"commands.py" = { kinds = ["environ"], why = "TRUNK_API_TOKEN optionally adds read-only queue evidence to diagnosis; it is not deployment configuration" }
"export_process.py" = { kinds = ["db", "settings"], why = "Tool entry composes its process resources from the launch configuration" }
"pr_flow_export.py" = { kinds = ["clock", "home"], why = "CLI entrypoint resolves the current UTC timestamp and ~/.trunk/api-token" }
"runs_export.py" = { kinds = ["clock"], why = "CLI entrypoint resolves the current UTC timestamp for trailing-window sampling" }
"watch_pr.py" = { kinds = ["clock", "home", "platform"], why = "watcher template resolves the home once to place the verdict file in the launching agent's workspace; builds the process clock from SYSTEM_TIMERS; builds the host of this process with Host.system()" }

[debt.ambient-read]
"export_process.py#home base.paths.meiva_home" = 1
"runs_export.py#home base.paths.meiva_home" = 1
"trunk_api.py#environ base.host.git.gitenv.git_env" = 1
