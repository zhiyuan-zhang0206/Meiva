exports = ["cli.py", "pull_requests", "refresh_test_durations.py", "shard_counts.py", "test_impact.py", "test_selector.py", "tests"]

[uses]
"cli.py" = ["pull_requests"]
"file_shard_runtime.py" = ["file_shard_shadow.py"]
"pull_requests" = ["collection_tracebacks.py", "test_selector.py"]
"test_selector.py" = ["shard_counts.py", "test_impact.py"]
"tests" = ["cli.py", "collection_tracebacks.py", "coverage_gates.py", "dependency_audit.py", "e2e_scope.py", "file_shard_runtime.py", "file_shard_shadow.py", "host_marks_census.py", "pull_requests", "refresh_test_durations.py", "test_impact.py", "test_selector.py"]

[roots]
"cli.py" = { kinds = ["clock", "environ", "platform", "argv"], why = "pull-request tools entry: its __main__ block builds the process clock from SYSTEM_TIMERS and the host of this process with Host.system(), handing it the process environment, once before calling main(); the __main__ guard reads argv[1:] once and hands it to main" }
"coverage_gates.py" = { kinds = ["environ", "argv"], why = "BACKEND_COVERAGE_THRESHOLD is a ci.yml workflow knob for the pre-merge gate, not runtime config — Settings models the deployed runtime, and importing base.config would drag the settings singleton into a pure CI report parser; it also reads its command line (argv): the `__main__` guard reads argv[1:] once and hands it to main" }
"dependency_audit.py" = { kinds = ["argv"], why = "CI script entry: its __main__ block exits with main(sys.argv[1:]) and hands it the real subprocess runner and URL opener" }
"e2e_scope.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"file_shard_runtime.py" = { kinds = ["argv"], why = "CI script entry: main() parses the process command line (`parse_args()` without an argument list)" }
"host_marks_census.py" = { kinds = ["platform", "pid", "argv"], why = "CLI census entrypoint records the host OS it ran on in the artifact; it also names its own interpreter (sys.executable) for the command it builds; the __main__ guard reads argv[1:] once and hands it to main" }
"migration_smoke.py" = { kinds = ["clock", "environ", "home", "settings"], why = "builds a psql subprocess env (PGHOST/PGPORT/... from a throwaway native Postgres); PG* are libpq plumbing, not Meiva runtime config; Tool entry composes its process resources from the launch configuration, resolves the Meiva home its throwaway cluster vendors under, and names the system timers its throwaway cluster's readiness wait runs on" }
"pgvector_runtime_smoke.py" = { kinds = ["clock", "home", "platform", "settings"], why = "Tool entry checks supported host OS/arch, resolves the Meiva home the vendored runtime is built under, composes its process resources from the launch configuration and names the system timers its throwaway cluster's readiness wait runs on" }
"refresh_test_durations.py" = { kinds = ["argv"], why = "CI script entry: its __main__ block raises SystemExit with main(sys.argv[1:]) and hands it the real process runner" }
"shard_counts.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"vendor_pg_runtime.py" = { kinds = ["home", "platform", "argv"], why = "CI tool entry resolves the stable Meiva home (MEIVA_HOME) the vendored Postgres runtime is built under before exporting its root, and reads the host platform once with Platform.current() to hand ensure_pg_binaries/ensure_pgvector the (system, machine) they download for; this file has no second read of that kind; it also reads its command line (argv) once, as the process entry" }

[debt.ambient-read]
"refresh_test_durations.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `_refresh_all` puts the two shard measurements in a directory of its own and merges them into `.test_durations`; the one path its caller holds is that file inside the checkout, and measurements written beside it would leave files in the repository the refresh is about to commit to" }
"refresh_test_durations.py#pid sys.executable" = { count = 1, owner = "#5816", until = "waits for `run_suite` to take the interpreter path from its caller: it reads `sys.executable` itself" }
"refresh_test_durations.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: the directory's name is minted by the OS inside the `durations-` prefix so two refreshes in one process cannot collide; `main` hands `_refresh_all` the target path and the suite runner, and never a directory to measure in" }
