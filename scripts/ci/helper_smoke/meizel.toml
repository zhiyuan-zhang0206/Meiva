[uses]
"__init__.py" = ["cli.py", "f12.py", "support.py"]
"__main__.py" = ["cli.py"]
"cli.py" = ["f12.py", "support.py"]
"f12.py" = ["support.py"]
"tests" = ["__init__.py", "signing_smoke.py"]

[roots]
"cli.py" = { kinds = ["clock", "home", "pid", "argv"], why = "CLI entrypoint for the macOS permissions-helper smoke test; it also reads its command line (argv) once, as the process entry" }
"signing_smoke.py" = { kinds = ["clock", "environ", "home", "platform", "random", "settings", "argv"], why = "process entry of the signing smoke run: reads the home it works in, the helper port and artifact directory from the process settings, and builds the one world the build and install share (the account home, the host's platform, process environment and command runner, the clock and the operating system's random generator the signing keychain password is drawn from); it also reads its command line (argv) once, as the process entry" }

[debt.ambient-read]
"f12.py#clock datetime.datetime.astimezone" = { count = 1, owner = "#5816", until = "waits for `f12_parse_window` to take the time zone as a value: `.astimezone()` with no argument converts to the host's zone" }
