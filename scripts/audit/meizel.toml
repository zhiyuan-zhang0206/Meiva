exports = ["branch_protection.py", "module_moves.py"]

[uses]
"tests" = ["branch_protection.py", "impact_census.py", "module_moves.py", "schema_drift.py", "sdk_usage.py", "where_used.py", "where_used_scan.py"]
"where_used.py" = ["module_moves.py", "where_used_scan.py"]

[purity]
"." = "strict-to-be"
"module_moves.py" = "strict"
"sdk_usage.py" = "strict"
"where_used.py" = "strict"

[external]
"module_moves.py" = "imports the old and new module names the operator passes on the command line"

[roots]
"schema_drift.py" = { kinds = ["settings"], why = "CLI schema drift audit falls back to the deployment database URL from settings when --dsn is omitted" }

[debt.impure-call]
"branch_protection.py#import subprocess" = 1
"schema_drift.py#import psycopg" = 1

[debt.impure-edge]
"impact_census.py#scripts/ci/test_impact.py" = 1
"impact_census.py#scripts/ci/test_selector.py" = 1
"schema_drift.py#base/config/__init__.py" = 1
