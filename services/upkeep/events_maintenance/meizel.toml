exports = ["daemon.py", "resolution.py", "rollup.py", "token_totals.py"]

[uses]
"alert_reconciler.py" = ["config.py"]
"daemon.py" = ["alert_reconciler.py", "blob_vacuum.py", "config.py", "health_components.py", "loop_roster.py", "passes.py", "registry_gauge.py", "resolution.py", "rollup.py", "telemetry_replay.py", "token_totals.py"]
"passes.py" = ["pass_policy.py"]
"resolution.py" = ["config.py"]
"rollup.py" = ["config.py", "token_totals.py"]
"tests" = ["alert_reconciler.py", "blob_vacuum.py", "config.py", "daemon.py", "health_components.py", "loop_roster.py", "pass_policy.py", "passes.py", "registry_gauge.py", "resolution.py", "rollup.py", "telemetry_replay.py", "token_totals.py"]
"token_totals.py" = ["config.py"]

[purity]
"__init__.py" = "strict"
"health_components.py" = "strict"
"loop_roster.py" = "strict"
"pass_policy.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "platform", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and the host name and builds the random generator its event bus draws retry jitter from before composing its resources; builds the process clock from SYSTEM_TIMERS" }
"rollup.py" = { kinds = ["clock", "settings"], why = "Service or operator process entry boots configuration before composing its resources; builds the process clock from SYSTEM_TIMERS" }

[debt.ambient-read]
"alert_reconciler.py#clock base.clock.Clock" = 1
"alert_reconciler.py#clock base.clock.SYSTEM_TIMERS" = 1
"daemon.py#home base.paths.meiva_home" = 1
