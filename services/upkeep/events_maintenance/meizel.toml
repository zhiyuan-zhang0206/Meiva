exports = ["daemon.py", "ledger_repricing.py"]

[uses]
"daemon.py" = ["audit_identity.py", "blob_vacuum.py", "config.py", "health_components.py", "ledger_repricing.py", "loop_roster.py", "passes.py", "registry_gauge.py"]
"ledger_repricing.py" = ["ledger_repricing_plan.py"]
"passes.py" = ["pass_policy.py"]
"tests" = ["audit_identity.py", "blob_vacuum.py", "config.py", "daemon.py", "health_components.py", "ledger_repricing.py", "ledger_repricing_plan.py", "loop_roster.py", "pass_policy.py", "passes.py", "registry_gauge.py"]

[purity]
"__init__.py" = "strict"
"health_components.py" = "strict"
"loop_roster.py" = "strict"
"pass_policy.py" = "strict"
"ledger_repricing_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and builds the random generator its event bus draws retry jitter from before composing its resources; builds the process clock from SYSTEM_TIMERS; it reads its own pid once to claim its pidfile" }
