exports = ["daemon.py", "shells.py"]

[uses]
"daemon.py" = ["config.py", "remote.py", "shells.py", "sweep.py"]
"remote.py" = ["config.py", "shells.py"]
"shell_plan.py" = ["owner_text.py"]
"shells.py" = ["config.py", "owner_notice.py", "shell_plan.py"]
"sweep.py" = ["cadence.py", "config.py", "owner_notice.py", "owner_text.py"]
"tests" = ["cadence.py", "config.py", "daemon.py", "owner_text.py", "shell_plan.py", "shells.py", "sweep.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"
"owner_text.py" = "strict"
"shell_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["home", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and builds the random generator its event bus draws retry jitter from" }

[debt.ambient-read]
"shells.py#settings ops.cluster.rpc.dispatch_to_machine" = 1
