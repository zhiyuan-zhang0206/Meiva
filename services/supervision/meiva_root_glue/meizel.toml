exports = ["diagnostic_probes.py", "manifests.py"]

[uses]
"diagnostic_probes.py" = ["diagnostics.py"]
"drill.py" = ["glue.py"]
"glue.py" = ["diagnostic_probes.py", "diagnostics.py"]
"tests" = ["diagnostic_probes.py", "diagnostics.py", "drill.py", "glue.py", "manifests.py"]

[purity]
"__init__.py" = "strict"

[roots]
"diagnostic_probes.py" = { kinds = ["settings"], why = "Host diagnostic probes read configured endpoints and ports" }
"glue.py" = { kinds = ["settings"], why = "Root supervisor startup composes process-owned handles and configuration" }

[debt.ambient-read]
"diagnostic_probes.py#environ base.native_process.child_env.inherited_process_env" = 1
"diagnostic_probes.py#home base.paths.meiva_home" = 2
"diagnostics.py#home base.paths.meiva_home" = 1
"glue.py#home base.paths.meiva_home" = 1
"glue.py#platform base.native_process.os_platform.Platform.current" = 1
