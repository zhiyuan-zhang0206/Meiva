exports = ["diagnostic_probes.py", "manifests.py"]

[uses]
"diagnostic_probes.py" = ["diagnostics.py"]
"drill.py" = ["glue.py"]
"glue.py" = ["diagnostic_probes.py", "diagnostics.py"]
"tests" = ["diagnostic_probes.py", "diagnostics.py", "drill.py", "glue.py", "manifests.py"]

[purity]
"__init__.py" = "strict"

[roots]
"glue.py" = { kinds = ["settings", "cwd", "home", "platform", "environ"], why = "Root supervisor startup composes process-owned handles and configuration, and checks that the root runs from the loaded runtime's cwd" }
