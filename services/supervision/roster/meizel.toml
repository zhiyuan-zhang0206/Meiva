exports = ["__main__.py", "composition.py", "healthz.py", "plugin_services.py", "service_spec.py", "spec.py"]

[uses]
"__init__.py" = ["healthz.py", "service_spec.py"]
"composition.py" = ["healthz.py", "plugin_services.py", "service_spec.py"]
"__main__.py" = ["composition.py"]
"healthz.py" = ["service_spec.py"]
"plugin_services.py" = ["service_spec.py"]
"spec.py" = ["composition.py", "gate_plan.py", "plugin_services.py", "service_spec.py"]
"tests" = ["__init__.py", "composition.py", "gate_plan.py", "healthz.py", "service_spec.py", "spec.py"]

[external]
"plugin_services.py" = "loads discovered plugins, built-in or user-installed; core does not depend on them"

[purity]
"gate_plan.py" = "strict"

[roots]
"composition.py" = { kinds = ["settings"], why = "assembles the roster at use time: reads the machine host, the database and Redis urls and the gateway settings that the service specs take" }
"healthz.py" = { kinds = ["endpoints"], why = "builds ServiceEndpoints from the settings to name a daemon's health url and pidfile" }
"spec.py" = { kinds = ["settings"], why = "reads the enablement settings (browser, helper, heartbeat and others) that gate each roster entry when its spec is asked" }

[debt.ambient-read]
"composition.py#home base.paths.meiva_home" = 1
"spec.py#environ base.host.env.registry.process_environment" = 1
"spec.py#home base.paths.meiva_home" = 3
