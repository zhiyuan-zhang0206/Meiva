exports = ["__main__.py", "failure_state.py", "health.py", "inputs.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "supervisor.py", "wiring.py"]

[uses]
"__init__.py" = ["health.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "supervisor.py", "wiring.py"]
"__main__.py" = ["daemon.py"]
"daemon.py" = ["helper_chain_plan.py", "manifest.py", "server.py", "supervisor.py", "wiring.py"]
"failure_state.py" = ["intent_store.py"]
"health.py" = ["failure_state.py", "manifest.py", "probes.py", "stopping.py"]
"left_behind.py" = ["stopping.py", "unit_ledger.py", "unit_records.py"]
"manifest.py" = ["inputs.py"]
"stopping.py" = ["unit_records.py"]
"supervisor.py" = ["failure_state.py", "intent_store.py", "left_behind.py", "manifest.py", "stopping.py", "unit_ledger.py", "unit_records.py"]
"tests" = ["__init__.py", "__main__.py", "daemon.py", "failure_state.py", "health.py", "helper_chain_plan.py", "inputs.py", "intent_store.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "stopping.py", "supervisor.py", "unit_ledger.py", "unit_records.py", "wiring.py"]
"unit_records.py" = ["intent_store.py", "manifest.py"]
"wiring.py" = ["manifest.py", "supervisor.py"]

[loads]
"probes.py" = ["services/supervision/healthchecks"]

[external]
"probes.py" = "resolves the healthcheck module an operator-installed plugin names"
"wiring.py" = "resolves the --wiring module:attr the operator passes to the daemon"

[dynamic-attrs]
"wiring.py" = "resolves the factory attribute named by the operator's wiring reference ('module:attribute')"

[purity]
"helper_chain_plan.py" = "strict"

[roots]
"__main__.py" = { kinds = ["argv"], why = "the __main__ guard reads argv[1:] once and hands it to main" }
"daemon.py" = { kinds = ["clock", "environ", "pid"], why = "process entry of the root supervisor: reads its own pid and, once, the base environment the supervisor starts every child from (before any pre-start --wiring repairs and per-unit manifest overrides); the helper-chain watch is given the same process environment to read the marker of the process that spawned it (it re-reads it each round, since its question is whether that parent is still there); builds the process clock from SYSTEM_TIMERS" }

[debt.restricted-python]
"inputs.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
"stopping.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
