exports = ["__main__.py", "failure_state.py", "health.py", "inputs.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "supervisor.py", "wiring.py"]

[uses]
"__init__.py" = ["health.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "supervisor.py", "wiring.py"]
"__main__.py" = ["daemon.py"]
"daemon.py" = ["helper_chain_plan.py", "manifest.py", "server.py", "supervisor.py", "wiring.py"]
"failure_state.py" = ["intent_store.py"]
"health.py" = ["failure_state.py", "manifest.py", "probes.py", "stopping.py"]
"left_behind.py" = ["stopping.py", "unit_ledger.py", "unit_records.py"]
"manifest.py" = ["inputs.py"]
"stopping.py" = ["unit_records.py"]
"supervisor.py" = ["failure_state.py", "intent_store.py", "left_behind.py", "manifest.py", "stopping.py", "unit_ledger.py", "unit_records.py"]
"tests" = ["__init__.py", "__main__.py", "daemon.py", "failure_state.py", "health.py", "helper_chain_plan.py", "inputs.py", "intent_store.py", "manifest.py", "probes.py", "selfcheck.py", "server.py", "stopping.py", "supervisor.py", "unit_ledger.py", "unit_records.py", "wiring.py"]
"unit_records.py" = ["intent_store.py", "manifest.py"]
"wiring.py" = ["manifest.py", "supervisor.py"]

[loads]
"probes.py" = ["services/supervision/healthchecks"]

[external]
"probes.py" = "resolves the healthcheck module an operator-installed plugin names"
"wiring.py" = "resolves the --wiring module:attr the operator passes to the daemon"

[purity]
"helper_chain_plan.py" = "strict"

[debt.ambient-read]
"daemon.py#pid os.getpid" = 1
"health.py#clock time.time" = 1
"intent_store.py#clock time.time" = 1
"left_behind.py#clock time.monotonic" = 2
"left_behind.py#clock time.time" = 1
"supervisor.py#clock time.time" = 5
"supervisor.py#pid os.getpid" = 1

[debt.type-cast]
"inputs.py#cast InputSeal.from_mapping" = 2
"inputs.py#cast parse_inputs" = 1
"intent_store.py#cast _decode" = 1
"intent_store.py#cast _decode_caller" = 6
"intent_store.py#cast _decode_failure" = 1
"intent_store.py#cast caller_facts" = 6
"manifest.py#cast _parse_environment" = 2
"manifest.py#cast _parse_exec" = 1
"manifest.py#cast load_manifests" = 3
"probes.py#cast resolve_ref" = 1
"selfcheck.py#cast TreeSelfCheck._walk" = 1
"selfcheck.py#cast TreeSelfCheck.run_once" = 2
"unit_ledger.py#cast read" = 1
"wiring.py#cast load_wiring" = 1
