exports = ["launchd_job.py", "lifecycle.py", "onboarding.py", "signing_identity.py", "tests"]

[uses]
"__init__.py" = ["lifecycle.py"]
"lifecycle.py" = ["activation_plan.py", "build_state.py", "hardened_runtime.py", "launchd_job.py", "signing_identity.py"]
"signing_identity.py" = ["hardened_runtime.py"]
"tests" = ["__init__.py", "activation_plan.py", "launchd_job.py", "lifecycle.py", "onboarding.py", "signing_identity.py"]

[purity]
"activation_plan.py" = "strict"
"hardened_runtime.py" = "strict"

[roots]
"launchd_job.py" = { kinds = ["home", "pid", "platform"], why = "helper LaunchAgent plumbing: falls back to Path.home() for the agents directory, reads the uid and pid of the process and branches on sys.platform" }
"lifecycle.py" = { kinds = ["clock", "settings"], why = "reads the process settings and stamps the signing time with datetime.now when it builds and installs the helper" }
"onboarding.py" = { kinds = ["home", "platform"], why = "describes the local host from Path.home() and sys.platform for the permission onboarding" }
"signing_identity.py" = { kinds = ["random"], why = "draws the password of the helper's signing keychain with secrets" }

[debt.ambient-read]
"lifecycle.py#home base.paths.logs_dir" = 1
"lifecycle.py#home base.paths.meiva_home" = 3
"lifecycle.py#home base.paths.permissions_helper_app_dir" = 2
"lifecycle.py#home services.desktop.permissions_helper.launchd_job.helper_job_agents_dir" = 1
"lifecycle.py#home services.desktop.permissions_helper.launchd_job.helper_job_label" = 1
"lifecycle.py#pid services.desktop.permissions_helper.launchd_job.helper_job_domain" = 1
"onboarding.py#environ base.host.env.registry.process_environment" = 1
"signing_identity.py#home base.paths.permissions_helper_app_dir" = 1
