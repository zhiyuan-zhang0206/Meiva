exports = ["config.py", "execute.py", "input.py", "mcp_daemon.py", "mcp_wrapper.py", "protocol.py", "tests"]

[uses]
"ax_act.py" = ["ax_ids.py", "ax_tools.py", "errors.py", "screen.py"]
"ax_gap.py" = ["ocr", "screen.py"]
"ax_ids.py" = ["errors.py"]
"ax_tools.py" = ["ax_gap.py", "ax_ids.py", "errors.py", "screen.py", "targets.py"]
"execute.py" = ["ax_act.py", "ax_ids.py", "ax_tools.py", "errors.py", "input.py", "ocr", "ocr_text.py", "screen.py", "targets.py"]
"input.py" = ["errors.py", "targets.py"]
"mcp_daemon.py" = ["ax_ids.py", "config.py", "execute.py", "protocol.py", "session.py", "task_sessions.py"]
"ocr_text.py" = ["errors.py", "ocr", "screen.py"]
"screen.py" = ["errors.py", "targets.py"]
"targets.py" = ["errors.py"]
"tests" = ["ax_act.py", "ax_gap.py", "ax_ids.py", "ax_tools.py", "config.py", "errors.py", "mcp_daemon.py", "mcp_wrapper.py", "ocr", "ocr_text.py", "protocol.py", "screen.py", "session.py", "targets.py", "task_sessions.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"
"errors.py" = "strict"
"protocol.py" = "strict"
"targets.py" = "strict"

[roots]
"mcp_daemon.py" = ["settings", "db"]
"mcp_wrapper.py" = { kinds = ["environ", "settings"], why = "_agent_id() reads the ambient MEIVA_AGENT_ID to stamp computer-mcp requests; same identity channel, not Settings-managed; Service or operator process entry boots configuration before composing its resources" }

[debt.ambient-read]
"screen.py#clock datetime.datetime.now" = 1
"task_sessions.py#clock time.time" = 1

[debt.any-collaborator]
"mcp_wrapper.py#any _serve._call_tool._ctx" = 1
"mcp_wrapper.py#any _serve._list_tools._ctx" = 1
"mcp_wrapper.py#any _serve._list_tools._params" = 1
"protocol.py#any OkResponse.result" = 1
"targets.py#any AppTarget.parse.value" = 1
"targets.py#any CaptureFrame.global_point.x" = 1
"targets.py#any CaptureFrame.global_point.y" = 1
"targets.py#any CaptureFrame.parse.value" = 1
"targets.py#any CaptureRegion.parse.value" = 1
"targets.py#any WindowTarget.parse.value" = 1
"targets.py#any _integer.value" = 1
"targets.py#any _number.value" = 1
"targets.py#any _object.value" = 1

[debt.type-cast]
"ax_tools.py#cast _args" = 1
"targets.py#cast AppTarget.parse" = 1
"targets.py#cast CaptureFrame.parse" = 1
"targets.py#cast _object" = 2
