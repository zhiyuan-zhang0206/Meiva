exports = ["chunk_consumer.py", "group_consumer.py", "rebuild.py", "tests"]

[uses]
"chunk_consumer.py" = ["group_consumer.py", "rebuild.py"]
"rebuild.py" = ["group_consumer.py"]
"tests" = ["chunk_consumer.py", "group_consumer.py", "rebuild.py"]

[purity]
