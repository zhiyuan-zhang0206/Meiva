exports = ["daemon.py", "resources.py"]

[uses]
"daemon.py" = ["config.py", "dead_pages.py", "degradation.py", "occupant_plan.py", "page_plan.py", "resources.py"]
"dead_pages.py" = ["config.py"]
"degradation.py" = ["page_plan.py"]
"occupant_plan.py" = ["page_plan.py"]
"tests" = ["config.py", "daemon.py", "dead_pages.py", "occupant_plan.py", "page_plan.py", "resources.py", "server.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"
"occupant_plan.py" = "strict"
"page_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["bus", "clock", "environ", "home", "pid", "random", "settings"], why = "reads the home it runs under; spawns the page-server child with a per-launch PAGE_SERVER_TOKEN overlaid on the inherited env \u2014 the token is a fresh secrets.token_hex(16) per spawn, a dynamic child-env handoff Settings (boot-time static) cannot model, same class as base/sessions/env_forwarding; builds the process clock from SYSTEM_TIMERS; it reads its own pid once to claim its pidfile" }
"server.py" = { kinds = ["environ"], why = "reads the per-launch PAGE_SERVER_TOKEN its daemon parent set in the child env — the token is minted per spawn by the daemon, Settings (boot-time static) cannot model it" }
