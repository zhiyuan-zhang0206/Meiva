exports = ["cleanup_failures.py", "configuration.py", "graceful_exit.py", "instance.py", "lease_controls.py", "shells.py", "shutdown.py"]

[uses]
"shells.py" = ["cleanup_failures.py"]

[purity]
"__init__.py" = "strict"
"cleanup_failures.py" = "strict"
"lease_controls.py" = "strict"

[roots]
"configuration.py" = { kinds = ["settings"], why = "Agent host process bootstrap constructs configuration and process home" }

[debt.ambient-read]
"configuration.py#environ meiva.boot.process_disable_entries" = 1
"configuration.py#home base.paths.home.resolve_meiva_home" = 1
