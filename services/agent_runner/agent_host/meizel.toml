exports = ["daemon.py", "held_settle.py", "host.py", "host_beat.py", "invocation", "lifecycle", "runtime.py", "settlement.py", "tests"]

[uses]
"daemon.py" = ["dispatcher.py", "exec_memory_guard.py", "health_routes.py", "host.py", "host_beat.py", "lifecycle", "pooled_checkpoint.py", "pools.py", "stdout_log.py"]
"dispatcher.py" = ["scheduling", "stall_guard.py"]
"health_routes.py" = ["dispatcher.py", "host.py"]
"held_settle.py" = ["runtime.py"]
"host.py" = ["held_settle.py", "invocation", "lifecycle", "runtime.py", "scheduling", "settlement.py", "stall_guard.py"]
"host_beat.py" = ["dispatcher.py", "host.py"]
"invocation" = ["__init__.py", "db_recovery.py", "lifecycle"]
"lifecycle" = ["pools.py", "runtime.py"]
"recovery" = ["host.py", "settlement.py", "tests"]
"runtime.py" = ["__init__.py", "scheduling"]
"settlement.py" = ["db_recovery.py", "runtime.py", "stall_guard.py"]
"stall_guard.py" = ["runtime.py"]
"tests" = ["daemon.py", "dispatcher.py", "exec_memory_guard.py", "health_routes.py", "held_settle.py", "host.py", "host_beat.py", "invocation", "lifecycle", "pooled_checkpoint.py", "pools.py", "runtime.py", "scheduling", "settlement.py", "stall_guard.py", "stdout_log.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "cwd", "environ", "home", "pid", "random"], why = "the agent host process entry: it reads the parent environment, working directory and account home once at boot to build the exec children's ParentFacts (read_parent_facts), draws every host identity and credential from one secure generator, and holds the process pid; it reads the account home and the process timers once and hands them to the contexts and the event bus the host builds" }
