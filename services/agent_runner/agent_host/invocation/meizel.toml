exports = ["checkpoints.py", "completion_decisions.py", "driver.py", "failure_shapes.py"]

[uses]
"__init__.py" = ["checkpoints.py", "completion_decisions.py"]
"driver.py" = ["failure_shapes.py"]

[purity]
"." = "strict"
"__init__.py" = { mode = "none", why = "the shell that runs the plans in completion_decisions.py against the database and the graph: it flushes the checkpoint, attaches the trace, settles the handoff and applies the lifecycle command inside the database phase, and decides nothing the plan did not name" }
"checkpoints.py" = "strict"
"completion_decisions.py" = "strict"
"driver.py" = { mode = "none", why = "the shell that runs one hosted invocation under a task group around its event publisher; which failure leaves it is decided by failure_shapes.py" }
"failure_shapes.py" = "strict"
