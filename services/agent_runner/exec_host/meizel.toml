exports = ["daemon.py", "service.py", "shutdown_budget.py"]

[uses]
"daemon.py" = ["memory_guard.py", "service.py", "shutdown_budget.py"]
"tests" = ["daemon.py", "memory_guard.py", "service.py"]

[purity]
"__init__.py" = "strict"
"shutdown_budget.py" = "strict"

[roots]
"daemon.py" = { kinds = ["cwd", "pid", "settings"], why = "The exec-host process entry boots configuration before composing its service resources" }

[debt.ambient-read]
"daemon.py#environ base.native_process.child_env.inherited_process_env" = 1
"daemon.py#home base.paths.meiva_home" = 1
