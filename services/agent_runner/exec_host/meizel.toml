exports = ["daemon.py", "service.py", "shutdown_budget.py"]

[uses]
"daemon.py" = ["memory_guard.py", "service.py", "shutdown_budget.py"]
"tests" = ["daemon.py", "memory_guard.py", "service.py"]

[purity]
"__init__.py" = "strict"
"shutdown_budget.py" = "strict"

[roots]
"daemon.py" = { kinds = ["settings"], why = "The exec-host process entry boots configuration before composing its service resources" }

[debt.ambient-read]
"daemon.py#cwd pathlib.Path.cwd" = 1
"daemon.py#pid os.getuid" = 1
"memory_guard.py#pid os.getpid" = 1
"service.py#clock time.monotonic" = 5
"service.py#pid os.getpid" = 1

[debt.type-cast]
"service.py#cast _validate_env_overlay" = 1
"service.py#cast _validate_optional_map_json" = 1
