exports = ["daemon.py", "service.py", "shutdown_budget.py"]

[uses]
"daemon.py" = ["memory_guard.py", "service.py", "shutdown_budget.py"]
"tests" = ["daemon.py", "memory_guard.py", "service.py"]

[purity]
"__init__.py" = "strict"
"shutdown_budget.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "cwd", "home", "pid", "settings"], why = "The exec-host process entry boots configuration and reads the home it runs under before composing its service resources; it builds the process timers every exec deadline is measured with" }

[debt.ambient-read]
"daemon.py#environ base.native_process.child_env.inherited_process_env" = 1
