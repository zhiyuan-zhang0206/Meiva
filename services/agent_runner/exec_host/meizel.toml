exports = ["daemon.py", "service.py", "shutdown_budget.py"]

[uses]
"daemon.py" = ["memory_guard.py", "service.py", "shutdown_budget.py"]
"tests" = ["daemon.py", "memory_guard.py", "service.py"]

[purity]
"__init__.py" = "strict"
"shutdown_budget.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "cwd", "environ", "home", "pid", "settings"], why = "The exec-host process entry boots configuration and reads the home it runs under before composing its service resources; it builds the process timers every exec run and kill deadline is measured with, and reads the parent environment it was started with once, as the base every child it spawns is given" }
