exports = ["daemon.py", "ledger.py", "shutdown_budget.py"]

[uses]
"daemon.py" = ["ledger.py", "service.py", "shutdown_budget.py"]
"service.py" = ["ledger.py", "session.py"]
"tests" = ["daemon.py", "ledger.py", "service.py", "session.py"]

[purity]
"__init__.py" = "strict"
"shutdown_budget.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "environ", "home", "pid", "random"], why = "The pty-sessions process entry composes its service with the system clock, process identity, host generation and the home it runs under, and reads its own environment once as the base every shell it starts is given" }
