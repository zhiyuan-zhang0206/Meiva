exports = ["boot.py", "daemon.py", "dispatch_sync.py", "in_flight.py", "tests"]

[uses]
"daemon.py" = ["boot.py", "dispatch_sync.py", "health.py", "idempotency_plan.py", "in_flight.py", "ops_plan.py", "to_user_resource.py", "to_user_watch.py"]
"dispatch_sync.py" = ["ops_plan.py"]
"tests" = ["boot.py", "daemon.py", "health.py", "idempotency_plan.py", "in_flight.py", "ops_plan.py", "to_user_resource.py", "to_user_watch.py"]
"to_user_resource.py" = ["in_flight.py"]

[purity]
"__init__.py" = "strict"
"idempotency_plan.py" = "strict"
"ops_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["random", "settings"], why = "Service or operator process entry boots configuration and builds the random generator its event bus draws retry jitter from" }

[debt.ambient-read]
"boot.py#settings base.cluster.machine.ambient.gateway_access_from_settings" = 1
"daemon.py#home base.paths.meiva_home" = 4
"daemon.py#home base.paths.workspaces_root" = 1
