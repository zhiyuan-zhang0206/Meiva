exports = ["boot.py", "daemon.py", "dispatch_sync.py", "in_flight.py", "tests", "upload_object.py", "workspace_export.py"]

[uses]
"daemon.py" = ["boot.py", "dispatch_sync.py", "health.py", "idempotency_plan.py", "in_flight.py", "ops_plan.py", "to_user_resource.py", "to_user_watch.py", "upload_object.py", "workspace_export.py"]
"dispatch_sync.py" = ["ops_plan.py"]
"tests" = ["boot.py", "daemon.py", "health.py", "idempotency_plan.py", "in_flight.py", "ops_plan.py", "to_user_resource.py", "to_user_watch.py"]
"to_user_resource.py" = ["in_flight.py"]
"upload_object.py" = ["in_flight.py"]
"workspace_export.py" = ["in_flight.py"]

[purity]
"__init__.py" = "strict"
"idempotency_plan.py" = "strict"
"ops_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "platform", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and the OS user's home (the upload receiver's Downloads directory) and builds the random generator its event bus draws retry jitter from; builds the process clock from SYSTEM_TIMERS; builds the host of this process with Host.system(); it reads its own pid once to claim its pidfile" }
