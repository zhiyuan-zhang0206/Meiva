exports = ["run_plan.py", "weixin.py", "weixin_login.py"]

[uses]
"weixin_login.py" = ["weixin.py"]

[purity]
"__init__.py" = "strict"
"run_plan.py" = "strict"

[roots]
"weixin_login.py" = { kinds = ["clock", "home", "argv"], why = "Operator script entry of the Weixin QR login resolves the home whose state directory receives the credentials; builds the process clock from SYSTEM_TIMERS; the __main__ guard reads argv[1:] once and hands it to main" }
