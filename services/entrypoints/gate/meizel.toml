exports = ["daemon.py", "tests"]

[uses]
"daemon.py" = ["launch_plan.py"]
"tests" = ["daemon.py", "launch_plan.py"]

[purity]
"launch_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "settings", "argv"], why = "Service process entry boots configuration and reads its pid and the home it runs under before composing its resources; builds the process clock from SYSTEM_TIMERS for the event stream it composes; it also reads its command line (argv) once, as the process entry" }
