exports = ["daemon.py", "settings.py", "worker.py"]

[uses]
"daemon.py" = ["operation", "recovery_drill.py", "settings.py", "worker.py"]
"tests" = ["commit_plan.py", "daemon.py", "operation", "recovery_drill.py", "settings.py", "worker.py"]
"worker.py" = ["commit_plan.py", "operation", "settings.py"]

[purity]
"__init__.py" = "strict"
"commit_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "settings"], why = "Service process entry boots configuration and reads the home it runs under before composing its resources" }
"worker.py" = { kinds = ["home", "settings"], why = "Worker process entry boots configuration and reads the home it runs under before composing its resources" }

[debt.ambient-read]
"daemon.py#environ base.native_process.child_env.inherited_process_env" = 1
