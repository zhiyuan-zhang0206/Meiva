exports = ["daemon.py", "settings.py", "worker.py"]

[uses]
"daemon.py" = ["operation", "recovery_drill.py", "settings.py", "worker.py"]
"tests" = ["commit_plan.py", "daemon.py", "operation", "recovery_drill.py", "settings.py", "worker.py"]
"worker.py" = ["commit_plan.py", "operation", "settings.py"]

[purity]
"__init__.py" = "strict"
"commit_plan.py" = "strict"

[roots]
"daemon.py" = { kinds = ["settings"], why = "Service or operator process entry boots configuration before composing its resources" }
"worker.py" = { kinds = ["settings"], why = "Service or operator process entry boots configuration before composing its resources" }

[debt.ambient-read]
"daemon.py#clock datetime.datetime.now" = 2
"daemon.py#clock time.time" = 1
"daemon.py#pid os.getpid" = 1
