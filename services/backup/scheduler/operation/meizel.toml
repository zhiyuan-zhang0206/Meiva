exports = ["cleanup_plan.py", "staging.py", "worker_process.py"]

[uses]
"staging.py" = ["cleanup_plan.py"]
"worker_process.py" = ["staging.py", "worker_bootstrap.py"]

[loads]
"worker_bootstrap.py" = ["services/backup/scheduler"]

[purity]
"__init__.py" = "strict"
"cleanup_plan.py" = "strict"
"worker_bootstrap.py" = "strict"

[debt.ambient-read]
"worker_process.py#clock time.monotonic" = 1

[debt.type-cast]
"worker_process.py#cast _result_object" = 1
"worker_process.py#cast worker_request" = 1
