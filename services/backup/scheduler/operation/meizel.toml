exports = ["cleanup_plan.py", "staging.py", "worker_bootstrap.py", "worker_process.py"]

[uses]
"staging.py" = ["cleanup_plan.py"]
"worker_process.py" = ["staging.py", "worker_bootstrap.py"]

[loads]
"worker_bootstrap.py" = ["services/backup/scheduler"]

[purity]
"__init__.py" = "strict"
"cleanup_plan.py" = "strict"
"worker_bootstrap.py" = { mode = "none", why = "the worker process entry: it confirms that the worker module and the packages it imports resolve inside the code root it was started with, then runs the module; it imports nothing first-party before that check, so the check cannot live in a module it would have to import" }
