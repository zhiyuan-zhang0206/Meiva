exports = ["cleanup_plan.py", "staging.py", "worker_bootstrap.py", "worker_process.py"]

[uses]
"staging.py" = ["cleanup_plan.py"]
"worker_process.py" = ["staging.py", "worker_bootstrap.py"]

[loads]
"worker_bootstrap.py" = ["services/backup/scheduler"]

[purity]
"__init__.py" = "strict"
"cleanup_plan.py" = "strict"
"worker_bootstrap.py" = { mode = "none", why = "the worker process entry: it confirms that the worker module and the packages it imports resolve inside the code root it was started with, then runs the module; it imports nothing first-party before that check, so the check cannot live in a module it would have to import" }

[debt.ambient-read]
"worker_bootstrap.py#argv sys.argv" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
"worker_process.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
