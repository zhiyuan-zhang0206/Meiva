exports = ["artifact", "dump.py", "layout.py", "restore_drill.py", "scheduler", "walg"]

[uses]
"dump.py" = ["artifact", "dump_lines.py", "dump_plan.py", "layout.py"]
"dump_plan.py" = ["artifact"]
"restore_drill.py" = ["dump.py", "dump_lines.py", "layout.py"]
"scheduler" = ["artifact", "dump.py", "layout.py", "restore_drill.py", "schedule.py", "tests"]
"tests" = ["artifact", "dump.py", "dump_lines.py", "dump_plan.py", "layout.py", "restore_drill.py", "schedule.py"]
"walg" = ["artifact", "restore_drill.py"]

[purity]
"dump_lines.py" = "strict"
"dump_plan.py" = "strict"
"layout.py" = "strict"
"schedule.py" = "strict"

[roots]
"dump.py" = { kinds = ["settings"], why = "Service or operator process entry boots configuration before composing its resources" }
"restore_drill.py" = { kinds = ["settings"], why = "Service or operator process entry boots configuration before composing its resources" }

[debt.type-cast]
"dump.py#cast run_locked_backup" = 1
