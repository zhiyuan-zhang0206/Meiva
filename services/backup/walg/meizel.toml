exports = ["archive.py", "check.py", "config.py", "probe.py", "restore.py", "startup.py", "state.py", "tests", "tick.py"]

[uses]
"archive.py" = ["archive_plan.py", "config.py"]
"backups.py" = ["runner.py"]
"check.py" = ["archive.py", "config.py", "probe.py", "runner.py"]
"drill.py" = ["backups.py", "config.py", "pg_target.py", "probe.py", "restore.py", "runner.py", "state.py"]
"probe.py" = ["archive.py", "archive_plan.py", "config.py", "pg_target.py", "state.py"]
"restore.py" = ["archive.py", "runner.py"]
"retention.py" = ["backups.py", "runner.py"]
"runner.py" = ["config.py"]
"startup.py" = ["archive.py", "archive_plan.py"]
"tests" = ["archive.py", "archive_plan.py", "backups.py", "check.py", "config.py", "drill.py", "gaps.py", "pg_target.py", "probe.py", "restore.py", "retention.py", "runner.py", "startup.py", "state.py", "tick.py", "verify.py"]
"tick.py" = ["backups.py", "config.py", "drill.py", "pg_target.py", "retention.py", "runner.py", "state.py", "verify.py"]
"verify.py" = ["backups.py", "gaps.py", "runner.py"]

[purity]
"archive_plan.py" = "strict"

[roots]
"drill.py" = { kinds = ["clock"], why = "Stamps the recovery drill state record with the wall-clock completion instant" }
"pg_target.py" = { kinds = ["settings"], why = "Operator and tick entrypoint resolver reads data-plane settings to locate this home's Postgres" }
"probe.py" = { kinds = ["clock"], why = "Cluster health probe entrypoint reads current UTC time to evaluate WAL-G tick and drill freshness" }
"restore.py" = { kinds = ["clock"], why = "Operator restore command bounds recovery wait and narrates elapsed phase duration" }
"tick.py" = { kinds = ["clock"], why = "Daily WAL-G tick entrypoint stamps step records with current UTC time" }

[debt.ambient-read]
"config.py#home base.paths.meiva_home" = 1
"restore.py#environ base.native_process.child_env.daemon_process_env" = 1
"restore.py#home base.paths.meiva_home" = 1
"runner.py#environ base.native_process.child_env.daemon_process_env" = 1
"state.py#home base.paths.meiva_home" = 1
