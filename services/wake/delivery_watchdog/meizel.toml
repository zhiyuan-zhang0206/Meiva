exports = ["daemon.py", "dead_letter.py", "stranded_wake.py"]

[uses]
"daemon.py" = ["dead_letter.py", "stranded_wake.py"]
"tests" = ["daemon.py", "dead_letter.py", "stranded_wake.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["bus", "clock", "home", "pid", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and builds the random generator its event bus draws retry jitter from; builds the process clock from SYSTEM_TIMERS; it reads its own pid once to claim its pidfile" }
