exports = ["daemon.py", "declarative.py", "engine.py", "manager.py", "requests.py", "revisions.py", "run_custody.py", "runner.py", "tests"]

[uses]
"daemon.py" = ["manager.py", "requests.py"]
"engine.py" = []
"declarative.py" = ["run_custody.py"]
"manager.py" = ["declarative.py", "revisions.py", "run_custody.py"]
"requests.py" = ["manager.py"]
"revisions.py" = []
"runner.py" = ["engine.py", "run_custody.py"]
"tests" = ["declarative.py", "engine.py", "manager.py", "revisions.py", "run_custody.py", "runner.py"]

[external]
"engine.py" = "runs schedule scripts (the one materialized from the database under $MEIVA_HOME/schedules, and the built-in templates in schedules/); run content, not a dependency"

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "random", "settings"], why = "Service process entry boots configuration and reads the home it runs under before composing its resources; builds the process clock from SYSTEM_TIMERS; it reads its own pid once to claim its pidfile; builds the random generator its event pipeline mints the process's `service.instance.id` from" }
"runner.py" = { kinds = ["clock", "cwd", "environ", "home", "pid", "settings", "argv"], why = "Service or operator process entry boots configuration before composing its resources; the declarative single-round arm captures its fixed schedule workspace and inherited launch environment once before spawning run.py; it captures process identity, clock, configuration and payload argv once; it also reads its command line (argv) once, as the process entry" }

[debt.ambient-read]
"engine.py#argv sys.argv" = { count = 3, owner = "#5816", until = "waits for a subprocess-only payload entry: runpy shares process argv so the payload boundary supplies direct-script arguments and restores the runner arguments in finally" }
