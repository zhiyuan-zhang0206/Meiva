exports = ["daemon.py", "station_probe.py"]

[uses]
"daemon.py" = ["__init__.py", "completion_digest.py", "liveness.py", "loops.py"]
"loops.py" = ["liveness.py"]
"tests" = ["__init__.py", "completion_digest.py", "daemon.py", "liveness.py", "loops.py", "station_probe.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["bus", "settings"], why = "Service or operator process entry boots configuration before composing its resources" }
"station_probe.py" = { kinds = ["db", "settings"], why = "Service or operator process entry boots configuration before composing its resources" }

[debt.ambient-read]
"completion_digest.py#clock datetime.datetime.now" = 1
"daemon.py#pid os.getpid" = 1
