exports = ["daemon.py", "selection.py", "station_probe.py"]

[uses]
"daemon.py" = ["__init__.py", "completion_digest.py", "liveness.py", "loops.py", "selection.py"]
"loops.py" = ["liveness.py"]
"selection.py" = ["__init__.py"]
"tests" = ["__init__.py", "completion_digest.py", "daemon.py", "liveness.py", "loops.py", "selection.py", "station_probe.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["bus", "home", "random", "settings"], why = "Service or operator process entry boots configuration, reads the home it runs under and builds the random generator its event bus draws retry jitter from; builds the process clock from the settings" }
"station_probe.py" = { kinds = ["home", "settings"], why = "Service or operator process entry boots configuration and reads the home it runs under before composing its resources" }
