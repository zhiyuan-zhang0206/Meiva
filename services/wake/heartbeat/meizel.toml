exports = ["daemon.py", "selection.py", "station_probe.py"]

[uses]
"daemon.py" = ["__init__.py", "completion_digest.py", "liveness.py", "loops.py", "selection.py"]
"loops.py" = ["liveness.py"]
"selection.py" = ["__init__.py"]
"tests" = ["__init__.py", "completion_digest.py", "daemon.py", "liveness.py", "loops.py", "selection.py", "station_probe.py"]

[purity]
"__init__.py" = "strict"

[roots]
"daemon.py" = { kinds = ["bus", "random", "settings"], why = "Service or operator process entry boots configuration and builds the random generator its event bus draws retry jitter from" }
"station_probe.py" = { kinds = ["settings"], why = "Service or operator process entry boots configuration before composing its resources" }

[debt.ambient-read]
"daemon.py#home base.paths.meiva_home" = 1
"station_probe.py#home base.paths.meiva_home" = 1
