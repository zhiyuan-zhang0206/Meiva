exports = ["app.py", "daemon.py"]

[uses]
"app.py" = ["store.py"]
"daemon.py" = ["app.py", "config.py", "store.py"]
"tests" = ["app.py", "config.py", "daemon.py", "store.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"

[roots]
"daemon.py" = { kinds = ["settings"], why = "process entry point of the memory-search daemon: builds ConfigBoot from the process environment" }

[debt.ambient-read]
"daemon.py#home base.paths.meiva_home" = 1
