exports = ["app.py", "daemon.py"]

[uses]
"app.py" = ["store.py"]
"daemon.py" = ["app.py", "config.py", "store.py"]
"tests" = ["app.py", "config.py", "daemon.py", "store.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "random", "settings"], why = "process entry point of the memory-search daemon: builds ConfigBoot from the process environment and reads the home it runs under; builds the process clock from SYSTEM_TIMERS for the event stream it composes; it reads its own pid once to claim its pidfile; builds the random generator its event pipeline mints the process's `service.instance.id` from" }
