exports = ["derive.py", "jobs.py", "model.py", "reader.py", "source.py"]

[purity]
"derive.py" = "strict"
"jobs.py" = "strict"
"model.py" = "strict"
"nodes.py" = "strict"
"source.py" = "strict"
"store.py" = "strict"

[uses]
"backfill.py" = ["jobs.py"]
"derive.py" = ["model.py"]
"jobs.py" = ["derive.py", "source.py", "store.py"]
"nodes.py" = ["model.py"]
"reader.py" = ["derive.py", "jobs.py", "model.py", "nodes.py", "source.py", "store.py"]
"source.py" = ["model.py"]
"store.py" = ["model.py"]

[roots]
"backfill.py" = { kinds = ["clock", "settings"], why = "Service or operator process entry boots configuration before composing its resources; builds the process clock from SYSTEM_TIMERS" }

[debt.fake-entropy]
"reader.py#id in an f-string" = 1
"reader.py#itertools.count in an f-string" = 1

[debt.impure-call]
"reader.py#import fastapi" = 1

[debt.impure-edge]
"backfill.py#base/agents/history/checkpoint_segment.py" = 1
"backfill.py#base/config/__init__.py" = 1
"backfill.py#base/db/__init__.py" = 1
"backfill.py#base/db/code_version_gate.py" = 1
"backfill.py#base/native_process/code_version.py" = 1
"backfill.py#base/native_process/loaded_commit.py" = 1
