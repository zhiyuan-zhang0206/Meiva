exports = ["derive.py", "jobs.py", "model.py", "reader.py", "source.py"]

[purity]
"backfill.py" = { mode = "none", why = "the operator command that prepares the projection of the named agents: it boots the configuration, opens the database and drains index_next for each agent; what it accepts is decided by request_rules.py" }
"derive.py" = "strict"
"jobs.py" = "strict"
"model.py" = "strict"
"nodes.py" = "strict"
"source.py" = "strict"
"store.py" = "strict"

[uses]
"backfill.py" = ["jobs.py"]
"derive.py" = ["model.py"]
"jobs.py" = ["derive.py", "source.py", "store.py"]
"nodes.py" = ["model.py"]
"reader.py" = ["derive.py", "jobs.py", "model.py", "nodes.py", "source.py", "store.py"]
"source.py" = ["model.py"]
"store.py" = ["model.py"]

[roots]
"backfill.py" = { kinds = ["clock", "settings", "argv"], why = "Service or operator process entry boots configuration before composing its resources; builds the process clock from SYSTEM_TIMERS; it also reads its command line (argv) once, as the process entry" }

[debt.restricted-python]
"nodes.py#dynamic attribute name" = { count = 1, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
