exports = ["projection", "router.py", "schemas.py", "tests"]

[uses]
"context.py" = ["history.py", "projection", "schemas.py"]
"links.py" = ["schemas.py"]
"messages.py" = ["history.py", "projection", "schemas.py", "tokens.py"]
"projection" = ["history.py", "schemas.py", "tokens.py"]
"router.py" = ["context.py", "links.py", "messages.py", "projection", "schemas.py"]
"tests" = ["context.py", "history.py", "links.py", "messages.py", "projection", "router.py", "schemas.py", "tokens.py"]
"tokens.py" = ["history.py", "schemas.py"]

[purity]
"." = "strict-to-be"
"__init__.py" = "strict"
"history.py" = "strict"
"schemas.py" = "strict"
"tokens.py" = "strict"

[debt.impure-call]
"context.py#import fastapi" = 1
"links.py#import fastapi" = 1
"messages.py#import fastapi" = 1
"router.py#import fastapi" = 1
