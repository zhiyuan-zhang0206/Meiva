exports = ["app.py", "config.py", "daemon.py", "run_timeline"]

[uses]
"app.py" = ["config.py", "run_timeline"]
"daemon.py" = ["app.py", "config.py"]
"run_timeline" = ["config.py"]
"tests" = ["app.py", "config.py", "daemon.py", "run_timeline"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"

[roots]
"daemon.py" = { kinds = ["home", "pid", "settings"], why = "process entry point of the insights daemon: builds ConfigBoot, reads its pid and the home it runs under" }
