exports = ["app.py", "config.py", "daemon.py", "run_timeline"]

[uses]
"app.py" = ["config.py", "run_timeline"]
"daemon.py" = ["app.py", "config.py"]
"run_timeline" = ["config.py"]
"tests" = ["app.py", "config.py", "daemon.py", "run_timeline"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"

[roots]
"daemon.py" = { kinds = ["pid", "random", "settings"], why = "process entry point of the insights daemon: builds ConfigBoot, reads its pid and builds the random generator the timeline reader mints snapshot identities from" }

[debt.ambient-read]
"daemon.py#home base.paths.meiva_home" = 2
