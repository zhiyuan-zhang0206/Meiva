exports = ["backends", "chunking.py", "config.py", "daemon.py", "embeddings", "memory_search_reconcile.py", "patrol_status.py", "recall_regression.py", "rerank.py", "tests"]

[uses]
"chunking.py" = ["backends"]
"config.py" = ["embeddings", "patrol_plan.py"]
"daemon.py" = ["backends", "chunking.py", "config.py", "embeddings", "patrol_plan.py", "patrol_status.py"]
"memory_search_reconcile.py" = ["backends", "config.py", "embeddings", "reconcile_plan.py"]
"rerank.py" = ["backends", "chunking.py", "rerank_plan.py"]
"tests" = ["backends", "chunking.py", "config.py", "daemon.py", "patrol_plan.py", "recall_regression.py", "reconcile_plan.py", "rerank.py", "rerank_plan.py"]

[purity]
"__init__.py" = "strict"
"patrol_plan.py" = "strict"
"reconcile_plan.py" = "strict"
"rerank_plan.py" = "strict"

[roots]
"recall_regression.py" = { kinds = ["settings"], why = "The operator script entry boots configuration and injects it into the recall regression command" }
"daemon.py" = { kinds = ["clock", "home", "settings"], why = "Service process entry boots configuration and reads the home it runs under before composing its resources; builds the process clock from SYSTEM_TIMERS" }
"memory_search_reconcile.py" = { kinds = ["home", "settings"], why = "Operator script entry boots configuration and reads the home whose memory pool it samples before composing its resources" }
