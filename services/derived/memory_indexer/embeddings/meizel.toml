exports = ["base.py", "embeddinggemma.py", "factory.py", "gemini.py", "tests"]

[uses]
"embeddinggemma.py" = ["base.py", "sync_call.py"]
"factory.py" = ["base.py", "embeddinggemma.py", "gemini.py"]
"gemini.py" = ["base.py", "sync_call.py"]
"tests" = ["base.py", "embeddinggemma.py", "factory.py", "gemini.py"]

[purity]
"__init__.py" = "strict"

[roots]
"gemini.py" = { kinds = ["home"], why = "composes the host-local usage receipt delivery for a Gemini provider when its catalog supplies a ledger; the receipt worker takes that directory explicitly" }
