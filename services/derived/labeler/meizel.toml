exports = ["daemon.py", "labeler.py", "tests"]

[uses]
"daemon.py" = ["config.py", "label_rules.py", "labeler.py"]
"labeler.py" = ["config.py", "label_rules.py"]
"tests" = ["config.py", "daemon.py", "label_rules.py", "labeler.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"
"label_rules.py" = "strict"

[roots]
"daemon.py" = { kinds = ["clock", "home", "pid", "random", "settings"], why = "process entry point of the labeler daemon: builds ConfigBoot from the process environment, reads the home it runs under, builds the random generator its event bus draws retry jitter from and hands the bus the process timers its ACL-transition retry measures its window on; it reads its own pid once to claim its pidfile" }
