exports = ["daemon.py", "labeler.py", "tests"]

[uses]
"daemon.py" = ["config.py", "label_rules.py", "labeler.py"]
"labeler.py" = ["config.py", "label_rules.py"]
"tests" = ["config.py", "daemon.py", "label_rules.py", "labeler.py"]

[purity]
"__init__.py" = "strict"
"config.py" = "strict"
"label_rules.py" = "strict"

[roots]
"daemon.py" = { kinds = ["home", "random", "settings"], why = "process entry point of the labeler daemon: builds ConfigBoot from the process environment, reads the home it runs under and builds the random generator its event bus draws retry jitter from" }
