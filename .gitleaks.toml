title = "Meiva secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Development and test fixture values that are not deployable credentials"
regexes = [
    '''\b[a-z]{3}_dev_only\b''',
    '''\bmeiva_dev_only\b''',
    '''\bpw123\b''',
    '''\bs3cr3t\b''',
    '''\bnew-db\b''',
    '''\bnew-runner-db\b''',
]

# These legacy findings are test, example, demo, or planning content. Scope
# each exception to the historical commit that introduced it: a future copy is
# still a scan failure.
commits = [
    "e0270b05d28524401b6caf5b0a300ab91a4d1c6a",
    "14e008cd0f9ab4b791330f16d098d8155726d392",
    "c15f00344d4805b82ed2e0cda824a7527cc0b943",
]

# The empty bot-token placeholder is immediately followed by the owner-id
# setting. Limit the exception to the environment template and exact match.
[[allowlists]]
description = "Empty Telegram bot-token placeholder in the environment template"
condition = "AND"
paths = [
    '''^\.env\.example$''',
]
regexTarget = "match"
regexes = [
    '''(?s)[A-Z]{3,5}_TELEGRAM_BOT_TOKEN=\n[A-Z]{3,5}_TELEGRAM_OWNER_ID=0''',
]

# This demo's fixed localStorage key is not an API key. Keep its exception
# limited to this exact value in the weekly-planner demo.
[[allowlists]]
description = "Weekly planner demo localStorage key"
condition = "AND"
paths = [
    '''^demos/goal-mode/weekly-planner/store\.js$''',
]
regexTarget = "match"
regexes = [
    "STORAGE_KEY = 'weekly-planner\\.v1'",
]

# Chrome Manifest V3 public RSA SubjectPublicKeyInfo (`key` field) used only to
# derive a fixed unpacked extension id (`cplinpgkjgnbfbdljojalofeigddlmgo`).
# Keep the exception limited to this exact public key in the tab-groups manifest.
[[allowlists]]
description = "Chrome Manifest V3 public key for fixed Meiva Tab Groups extension ID"
condition = "AND"
paths = [
    '''^services/desktop/browser/tab_groups/extension/manifest\.json$''',
]
regexTarget = "line"
regexes = [
    '''^\s*"key": "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAm5LCtfMl0qNO8m7HLqZdf1lD7Yfa\+LS9FWI8uytYcja\+mH8\+lq6gzGXDQIK8bdCabt9AJiIKSvDB/7/fnk613ahJCJanaO0XQJYg\+jcY8tCM2ww3UCzWSn2u8y2mvI8G/b8IlUrP0OfrJQNI49X1o9py9rGhdr7tMwCwIPW1zBTpv4/HDWwsy\+V/lMRUxuQceepNdDnWjaX2MUIx0keSg7UMSHJMHMaO89DL70X7Hfa0Ds2Nqh5OQE8hERQQeeaIXgE68AbVTy195g2CYPGp/1ilKVK8KxL/G3\+ZjCuljsGuA1VUt6UYip5xQBrofiVQ6vVMdt/zf6ClPv\+z/jE6CQIDAQAB",\s*$''',
]
