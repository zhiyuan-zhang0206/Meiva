exports = ["external_skills.py", "materialize.py", "memory.py", "parsers", "plugins.py", "skill.py", "skills_sync.py"]

[uses]
"external_skills.py" = ["external_skill_host"]
"mcp.py" = ["_manifest_gate.py", "_pkg_source.py", "plans"]
"memory.py" = ["_plugin_scaffold.py", "plans"]
"packages" = ["_pkg_source.py", "skill_package.py", "skills_sync.py"]
"parsers" = ["mcp.py", "memory.py", "packages", "plugins.py", "plugins_inspect.py", "skill.py", "skills_sync.py"]
"plugins.py" = ["_claude_code_plugin.py", "_manifest_gate.py", "_pkg_source.py", "plans", "skill_package.py", "skills_sync.py"]
"skill.py" = ["_manifest_gate.py", "_pkg_source.py", "plans", "skill_package.py", "skills_sync.py"]
"skills_sync.py" = ["plans", "skill_package.py"]
"tests" = ["_pkg_source.py", "external_skill_host", "external_skills.py", "materialize.py", "mcp.py", "packages", "plans", "plugins.py", "plugins_inspect.py", "skill.py", "skill_package.py", "skills_sync.py"]

[external]
"_plugin_scaffold.py" = "loads discovered plugins, built-in or user-installed; core does not depend on them"

[purity]
"__init__.py" = "strict"

[roots]
"external_skills.py" = { kinds = ["random"], why = "Mints fresh skill installation and staging generation UUIDs" }

[debt.ambient-read]
"_pkg_source.py#environ tempfile.mkdtemp()" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
