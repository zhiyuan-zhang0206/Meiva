exports = ["grafana_render.py", "inputs.py", "lgtm.py", "lgtm_native.py", "logs.py", "otel_collector.py", "plans", "trace.py", "tests"]

[purity]
"__init__.py" = "strict"

[uses]
"_lgtm_provisioning.py" = ["plans"]
"grafana_render.py" = ["_lgtm_provisioning.py", "plans"]
"inputs.py" = ["plans"]
"lgtm.py" = ["_lgtm_provisioning.py"]
"lgtm_native.py" = ["_lgtm_assets.py", "_lgtm_provisioning.py", "inputs.py", "plans", "url_split.py"]
"otel_collector.py" = ["inputs.py", "plans", "url_split.py"]
"tests" = ["_lgtm_provisioning.py", "grafana_render.py", "inputs.py", "lgtm_native.py", "otel_collector.py", "plans", "trace.py", "url_split.py"]
"trace.py" = ["inputs.py", "plans", "url_split.py"]
"url_split.py" = ["plans"]

[debt.ambient-read]
"lgtm_native.py#environ tempfile.TemporaryDirectory()" = { count = 3, owner = "#8237", until = "waits for `_extract_member`, `_extract_tree` and `download_and_verify` to take the parent of its scratch directory from its caller: it creates it where TMPDIR points" }
"lgtm_native.py#random tempfile.TemporaryDirectory()" = { count = 3, owner = "#8237", until = "waits for `_extract_member`, `_extract_tree` and `download_and_verify` to take the parent of its scratch directory from its caller: it creates it under a random name wherever TMPDIR points" }
