exports = ["grafana_render.py", "inputs.py", "lgtm.py", "lgtm_native.py", "logs.py", "otel_collector.py", "plans", "trace.py", "tests"]

[purity]
"__init__.py" = "strict"

[uses]
"_lgtm_provisioning.py" = ["plans"]
"grafana_render.py" = ["_lgtm_provisioning.py", "plans"]
"inputs.py" = ["plans"]
"lgtm.py" = ["_lgtm_provisioning.py"]
"lgtm_native.py" = ["_lgtm_assets.py", "_lgtm_provisioning.py", "inputs.py", "plans", "url_split.py"]
"otel_collector.py" = ["inputs.py", "plans", "url_split.py"]
"tests" = ["_lgtm_provisioning.py", "grafana_render.py", "inputs.py", "lgtm_native.py", "otel_collector.py", "plans", "trace.py", "url_split.py"]
"trace.py" = ["inputs.py", "plans", "url_split.py"]
"url_split.py" = ["plans"]

[debt.ambient-read]
"lgtm_native.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: the two extraction helpers this entry counted now stage inside the `destination.parent` their caller hands them, which leaves the release archive `download_and_verify` fetches — it is read in place by `_extract_tree` and `_extract_member` and never moved into `native_dir`, so the one directory that call's caller holds is the install target, not a workspace for a download that can run to hundreds of megabytes" }
"lgtm_native.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: what is left is the archive's own name, minted by the OS inside that one-shot directory so two concurrent installs cannot overwrite one another; the archive is opened, hashed and discarded, and no caller reads the name — `render_configs` and the marker files take `native_dir` only" }
