exports = ["control.py", "cron.py", "health.py", "home.py", "ops.py", "plans", "tests", "unit_join.py"]

[uses]
"_provider_guard.py" = ["plans"]
"control.py" = ["plans", "unit_join.py"]
"health.py" = ["_provider_guard.py", "health_readings.py", "plans"]
"health_readings.py" = ["_provider_guard.py", "plans"]
"home.py" = ["plans"]
"tests" = ["_provider_guard.py", "control.py", "cron.py", "health.py", "health_readings.py", "home.py", "ops.py", "plans", "unit_join.py"]
"unit_join.py" = ["plans"]

[purity]
"__init__.py" = "strict"

[debt.ambient-read]
"control.py#clock datetime.datetime.astimezone" = { count = 1, owner = "#5816", until = "waits for `cmd_db_authority_issue_unit` to take the time zone as a value: `.astimezone()` with no argument converts to the host's zone" }
"control.py#clock datetime.datetime.fromtimestamp()" = { count = 1, owner = "#5816", until = "waits for `cmd_db_authority_issue_unit` to take the time zone as a value: `fromtimestamp` without a zone converts to the host's zone" }
