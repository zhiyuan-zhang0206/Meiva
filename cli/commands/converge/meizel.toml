exports = ["brew_pin.py", "firewall.py", "firewall_command.py", "frontend_env.py", "harness_clis.py", "health_preflight.py", "incomplete.py", "os_jobs.py", "ownership_preflight.py", "plans", "redis_bridge.py", "rendered_file.py", "runner.py", "spec.py", "steps.py", "telemetry_token.py", "tests", "walg.py"]

[uses]
"brew_pin.py" = ["spec.py"]
"runner.py" = ["incomplete.py", "plans", "spec.py"]
"firewall.py" = ["plans", "spec.py"]
"firewall_command.py" = ["firewall.py", "plans"]
"frontend_env.py" = ["spec.py"]
"harness_clis.py" = ["spec.py"]
"health_preflight.py" = ["spec.py"]
"os_jobs.py" = ["spec.py"]
"ownership_preflight.py" = ["plans", "spec.py"]
"redis_bridge.py" = ["plans", "spec.py"]
"steps.py" = ["plans", "spec.py"]
"telemetry_token.py" = ["spec.py"]
"tests" = ["harness_clis.py", "health_preflight.py", "os_jobs.py", "plans", "redis_bridge.py", "spec.py", "steps.py", "telemetry_token.py"]
"walg.py" = ["plans", "spec.py"]

[purity]
"__init__.py" = "strict"

[debt.ambient-read]
"ownership_preflight.py#pid grp.getgrgid" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `_account` spells the repair command's group for the gid it just read from the account database, and falls back to the numeric gid when the group has no entry; a caller that already knew the name would have read the same database, and one that guessed would print a chown to a group nobody owns" }
"ownership_preflight.py#pid pwd.getpwuid" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `_account` resolves the uid `collect_ownership_warnings` takes from `ConvergeCtx.host` into the user name chown accepts, so the uid already arrives through the port that built this process's host and only the account database can say what that uid is called" }
