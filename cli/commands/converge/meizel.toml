exports = ["brew_pin.py", "firewall.py", "firewall_command.py", "frontend_env.py", "health_preflight.py", "incomplete.py", "os_jobs.py", "ownership_preflight.py", "plans", "redis_bridge.py", "rendered_file.py", "spec.py", "steps.py", "telemetry_token.py", "tests", "walg.py"]

[uses]
"brew_pin.py" = ["spec.py"]
"firewall.py" = ["plans", "spec.py"]
"firewall_command.py" = ["firewall.py", "plans"]
"frontend_env.py" = ["spec.py"]
"health_preflight.py" = ["spec.py"]
"os_jobs.py" = ["spec.py"]
"ownership_preflight.py" = ["plans", "spec.py"]
"redis_bridge.py" = ["plans", "spec.py"]
"steps.py" = ["plans", "spec.py"]
"telemetry_token.py" = ["spec.py"]
"tests" = ["health_preflight.py", "os_jobs.py", "plans", "redis_bridge.py", "spec.py", "steps.py", "telemetry_token.py"]
"walg.py" = ["plans", "spec.py"]

[purity]
"__init__.py" = "strict"

[debt.ambient-read]
"firewall.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for `serving_binaries` to take the interpreter path from its caller: it reads `sys.executable` itself" }
"ownership_preflight.py#pid grp.getgrgid" = { count = 1, owner = "#8237", until = "unreviewed: recorded by #8237 on 2026-11-03" }
"ownership_preflight.py#pid pwd.getpwuid" = { count = 1, owner = "#8237", until = "unreviewed: recorded by #8237 on 2026-11-03" }
"steps.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for `ensure_local_git_hooks` to take the interpreter path from its caller: it reads `sys.executable` itself" }
