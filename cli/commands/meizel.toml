exports = ["agents", "cluster", "converge", "data_plane", "duration.py", "extensions", "harness.py", "lifecycle", "management", "observability", "permissions.py", "probe.py", "tests"]

[uses]
"_repo.py" = ["_setup.py"]
"agents" = ["cluster"]
"probe.py" = ["probe_report.py"]
"cluster" = ["_repo.py", "converge", "data_plane", "observability", "probe.py"]
"converge" = ["_repo.py"]
"data_plane" = ["converge"]
"extensions" = ["_repo.py", "converge", "duration.py"]
"lifecycle" = ["_repo.py", "_setup.py", "cluster", "converge", "data_plane", "extensions", "observability", "probe.py"]
"management" = ["cluster"]
"observability" = ["converge"]
"tests" = ["_repo.py", "_setup.py", "cluster", "converge", "data_plane", "extensions", "lifecycle", "observability", "permissions.py", "probe.py", "probe_report.py"]

[external]
"harness.py" = "runs the Python file or stdin the operator names, inside a harness attachment: the operator-authored program is run content, not a dependency of this repository"

[purity]
"__init__.py" = "strict"
"duration.py" = "strict"
"probe_report.py" = "strict"

[debt.ambient-read]
"harness.py#pid sys.stdin" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
