exports = ["config.py", "fleet_gateway.py", "fleet_leases.py", "schedules.py", "schedules_verify.py", "schedules_verify_read_rows.py"]

[uses]
"schedule_verify_checks.py" = []
"schedule_verify_child.py" = ["schedule_verify_checks.py"]
"schedules_verify.py" = ["child_verdict.py", "schedule_verify_child.py", "sweep_outcome.py"]
"schedules_verify_read_rows.py" = ["schedules_verify.py"]
"tests" = ["child_verdict.py", "config.py", "schedule_verify_checks.py", "schedules.py", "schedules_verify.py", "sweep_outcome.py"]

[external]
"schedule_verify_child.py" = "dry-runs the imports of a user-written schedule script and checks its syntax"

[dynamic-attrs]
"schedule_verify_checks.py" = "resolves the callee chains a user-written schedule script names against the live SDK namespace; the names are the script author's"

[roots]
"fleet_leases.py" = { kinds = ["home"], why = "Standalone program the window pipes to a host, where it runs under that host's older checkout (see `cli/fleet_update/plan/host_commands.py` and `fleet_pre_verify.sh`): the installed `CommandRuntime.create` takes the resolved home only from the version that added the parameter, so on an older one the program resolves the home itself and passes it nowhere. Delete the probe and this declaration together once the oldest installation these programs reach resolves the home itself" }
"schedules_verify_read_rows.py" = { kinds = ["home", "argv"], why = "Standalone program the window pipes to a host, where it runs under that host's older checkout (see `cli/fleet_update/plan/host_commands.py` and `fleet_pre_verify.sh`): the installed `CommandRuntime.create` takes the resolved home only from the version that added the parameter, so on an older one the program resolves the home itself and passes it nowhere. Delete the probe and this declaration together once the oldest installation these programs reach resolves the home itself; it also reads its command line (argv) once, as the process entry" }
"schedule_verify_child.py" = { kinds = ["cwd", "pid"], why = "Schedule verification process entry captures its repository working directory and passes it to call-site analysis; it also reads its standard input" }
"fleet_gateway.py" = { kinds = ["settings", "argv"], why = "CLI command composition root boots configuration before querying the gateway roster; it also reads its command line (argv) once, as the process entry" }
"schedules.py" = { kinds = ["home", "pid"], why = "CLI schedules command entry: resolves Meiva home for plugin schedule provisioning when not passed explicitly; it also reads its standard input" }
[purity]
"__init__.py" = "strict"
"child_verdict.py" = "strict"
"schedule_verify_checks.py" = "strict"
"schedule_verify_child.py" = { mode = "none", why = "the schedule-verification process entry: it reads the script from stdin, reads this checkout's root, asks the filesystem where a callee is defined and normalizes that path, then prints one verdict line. Every check it reports, including which files count as repository code, is decided by the strict `schedule_verify_checks.py` over the parsed source and the names the script's own imports bound (`is_repo_source` there holds the root, virtualenv and SDK-package rules); this file only starts the process, handles what the filesystem raises, and prints what a missing module, an exception and a red result print" }
"sweep_outcome.py" = "strict"

[debt.ambient-read]
"config.py#environ getpass.getuser" = { count = 1, owner = "#5816", until = "waits for `_edit_local_config` to take the operator's user name from its caller: it asks getpass for it" }
"config.py#pid getpass.getuser" = { count = 1, owner = "#5816", until = "waits for `_edit_local_config` to take the operator's user name from its caller: it asks getpass for it" }
"schedules_verify.py#pid sys.executable" = { count = 1, owner = "#5816", until = "waits for `check_script` to take the interpreter path from its caller: it reads `sys.executable` itself" }
