exports = ["__init__.py", "inputs.py", "scheduled_worker.py", "down.py", "session.py", "scheduling", "choices.py", "fleet_alert_silence.py", "fleet_gate.py", "fleet_verify.py", "oneshot.py", "plan", "prestage.py", "programs.py", "probes", "timers.py"]

[uses]
"__init__.py" = ["choices.py", "down.py", "fleet_gate.py", "inputs.py", "plan", "scheduling", "session.py", "up.py"]
"choices.py" = ["plan", "untyped.py"]
"down.py" = ["choices.py", "fleet_gate.py", "oneshot.py", "plan", "prestage.py", "probes", "programs.py", "session.py"]
"fleet_gate.py" = ["plan", "session.py", "untyped.py"]
"fleet_verify.py" = ["choices.py", "plan", "probes", "session.py"]
"probes" = ["choices.py", "plan", "session.py", "untyped.py"]
"oneshot.py" = ["plan"]
"plan" = ["untyped.py"]
"prestage.py" = ["plan"]
"programs.py" = ["plan", "session.py"]
"session.py" = ["plan"]
"up.py" = ["choices.py", "fleet_verify.py", "oneshot.py", "plan", "programs.py", "session.py"]

"inputs.py" = ["session.py"]
"scheduling" = ["choices.py", "down.py", "inputs.py", "plan", "session.py"]
"scheduled_worker.py" = ["__init__.py", "choices.py", "plan", "scheduling", "session.py", "timers.py"]

[purity]
"oneshot.py" = "strict"
"prestage.py" = "strict"
"untyped.py" = "strict"

[roots]
"fleet_alert_silence.py" = { kinds = ["clock", "settings", "home", "argv"], why = "Standalone SSH entrypoint shipped to the gateway over stdin reads its own clock and settings, and resolves the home whose ops directory carries the window marker the host sentinel reads; it also reads its command line (argv) once, as the process entry" }
"scheduled_worker.py" = { kinds = ["environ", "clock", "argv"], why = "OS-owned one-shot entry reads its environment, deadline and record argument outside Meiva's process tree." }
