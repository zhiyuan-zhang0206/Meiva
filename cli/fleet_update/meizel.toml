exports = ["__init__.py", "__main__.py", "choices.py", "fleet_gate.py", "fleet_verify.py", "oneshot.py", "plan", "programs.py", "schedules_verify_check_rows.py", "session.py", "timers.py"]

[uses]
"__init__.py" = ["choices.py", "down.py", "fleet_gate.py", "plan", "session.py", "up.py"]
"__main__.py" = ["__init__.py", "session.py", "timers.py"]
"choices.py" = ["plan", "untyped.py"]
"down.py" = ["choices.py", "fleet_gate.py", "oneshot.py", "plan", "programs.py", "session.py"]
"fleet_gate.py" = ["plan", "session.py", "untyped.py"]
"fleet_verify.py" = ["choices.py", "plan", "session.py"]
"oneshot.py" = ["plan"]
"plan" = ["untyped.py"]
"programs.py" = ["plan", "session.py"]
"session.py" = ["plan"]
"up.py" = ["choices.py", "fleet_verify.py", "oneshot.py", "plan", "programs.py", "session.py"]

[purity]
"oneshot.py" = "strict"
"untyped.py" = "strict"

[roots]
"__main__.py" = { kinds = ["clock", "environ", "pid", "platform", "random", "argv"], why = "The executable composition root reads the caller environment and invocation timestamp once and passes them explicitly to main and the command shells; it also mints this window's identity there — the uid it falls back to when the login name is unreadable, the host it runs on, and a fresh random operation id — so that every host command below carries one identity decided in one place before any host is contacted; it also reads its command line (argv) once, as the process entry" }
"schedules_verify_check_rows.py" = { kinds = ["argv", "pid"], why = "Child-process script of the schedule-rows check: its __main__ block takes the rows from sys.argv[1] and names the interpreter it runs on (sys.executable) in the command it starts" }

[debt.ambient-read]
"choices.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `_service_problems` to take the parent of its scratch directory from its caller: it creates it where TMPDIR points" }
"choices.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for `_service_problems` to take the interpreter path from its caller: it reads `sys.executable` itself" }
"choices.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#8237", until = "waits for `_service_problems` to take the parent of its scratch directory from its caller: it creates it under a random name wherever TMPDIR points" }
