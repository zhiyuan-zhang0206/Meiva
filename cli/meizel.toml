exports = ["__main__.py", "commands", "database", "fleet_update", "main.py", "parsers", "start_identity.py", "tests"]

[uses]
"__main__.py" = ["main.py"]
"commands" = ["database", "start_identity.py", "start_runtime.py", "startup"]
"conftest.py" = ["commands", "tests"]
"fleet_update" = ["main.py"]
"init_intent.py" = ["commands", "start_identity.py", "start_runtime.py", "startup"]
"main.py" = ["database", "parsers", "preflight.py", "start_identity.py", "start_runtime.py", "startup"]
"parsers" = ["commands", "database", "init_intent.py", "start_intent.py", "start_runtime.py"]
"python_install.py" = ["_python_index.py"]
"start_identity.py" = ["startup"]
"start_intent.py" = ["commands", "database", "start_identity.py", "start_runtime.py", "startup"]
"tests" = ["__init__.py", "__main__.py", "_python_index.py", "commands", "database", "fleet_alert_silence.py", "fleet_update", "init_intent.py", "main.py", "parsers", "preflight.py", "python_install.py", "start_identity.py", "start_intent.py", "start_runtime.py", "startup"]

[purity]
"__init__.py" = "strict"

[roots]
"fleet_alert_silence.py" = { kinds = ["clock", "settings", "argv"], why = "Standalone SSH entrypoint shipped to the gateway over stdin reads its own clock and settings; it also reads its command line (argv) once, as the process entry" }
"main.py" = { kinds = ["clock", "environ", "home", "pid", "platform", "random", "argv"], why = "CLI bootstrap sets config/profile/log routing before importing Settings or command modules, resolves the home once for the checkout gate, the lite-config opt-in and the runtime, reads the operator's own home for the `~` a typed `--config-file` names, hands the start timing recorder this process's pid and start time, and reads the instant, host names and fresh secrets `meiva init` is handed; `entry()` reads its command line (argv[1:]) once, as the process entry, and hands it to the required `argv` of `main`" }
"python_install.py" = { kinds = ["cwd", "environ", "home", "platform", "argv", "random"], why = "Pre-venv stdlib bootstrap inspects working directory, environment, user home and platform before launching uv; it also reads its command line (argv) once, as the process entry, and names the scratch directory that holds its lock at random under the temporary directory" }
"start_intent.py" = { kinds = ["environ"], why = "Identity bootstrap precedes Settings: read the birth inputs and pin the resolved home before config imports." }

[debt.ambient-read]
"start_runtime.py#cwd pathlib.Path.absolute" = { count = 1, owner = "#8237", until = "unreviewed: recorded by #8237 on 2026-11-03" }
"start_runtime.py#pid sys.executable" = { count = 1, owner = "#8237", until = "unreviewed: recorded by #8237 on 2026-11-03" }

[debt.restricted-python]
"init_intent.py#dynamic attribute name" = { count = 3, owner = "#8266", until = "waits for the follow-up that repays field-name reflection: the names are a fixed set of fields or flags written in the source, so they can be read by explicit access" }
