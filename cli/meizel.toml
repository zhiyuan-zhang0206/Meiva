exports = ["__main__.py", "commands", "database", "fleet_update", "main.py", "parsers", "start_identity.py", "tests"]

[uses]
"__main__.py" = ["main.py"]
"commands" = ["boundary", "database", "start_identity.py", "start_runtime.py", "startup"]
"conftest.py" = ["commands", "tests"]
"init_intent.py" = ["commands", "start_identity.py", "start_runtime.py", "startup"]
"main.py" = ["database", "fleet_update", "parsers", "preflight.py", "start_identity.py", "start_runtime.py", "startup"]
"parsers" = ["commands", "database", "fleet_update", "init_intent.py", "start_intent.py", "start_runtime.py", "startup"]
"python_install.py" = ["_python_index.py"]
"schedules_verify_check_rows.py" = ["main.py"]
"start_identity.py" = ["boundary", "startup"]
"start_intent.py" = ["commands", "database", "start_identity.py", "start_runtime.py", "startup"]
"tests" = ["__init__.py", "__main__.py", "_python_index.py", "commands", "database", "fleet_update", "init_intent.py", "main.py", "parsers", "preflight.py", "python_install.py", "schedules_verify_check_rows.py", "start_identity.py", "start_intent.py", "start_runtime.py", "startup"]

[purity]
"__init__.py" = "strict"

[roots]
"main.py" = { kinds = ["clock", "environ", "home", "pid", "platform", "random", "argv"], why = "CLI bootstrap sets config/profile/log routing before importing Settings or command modules, resolves the home once for the checkout gate, the lite-config opt-in and the runtime, reads the operator's own home for the `~` a typed `--config-file` names, hands the start timing recorder this process's pid and start time, and reads the instant, host names, fresh secrets and update-window identity `meiva init` and `meiva update` are handed; `entry()` reads its command line (argv[1:]) once, as the process entry, and hands it to the required `argv` of `main`" }
"python_install.py" = { kinds = ["cwd", "environ", "home", "platform", "argv", "random"], why = "Pre-venv stdlib bootstrap inspects working directory, environment, user home and platform before launching uv; it also reads its command line (argv) once, as the process entry, and names the scratch directory that holds its lock at random under the temporary directory" }
"schedules_verify_check_rows.py" = { kinds = ["argv", "pid"], why = "Child-process script of the schedule-rows check: its __main__ block takes the rows from sys.argv[1] and names the interpreter it runs on (sys.executable) in the command it starts" }
"start_intent.py" = { kinds = ["environ"], why = "Identity bootstrap precedes Settings: read the birth inputs and pin the resolved home before config imports." }

[debt.ambient-read]
"start_runtime.py#cwd pathlib.Path.absolute" = { count = 1, owner = "#5816", until = "permanently: `admit` absolutizes only the interpreter path it reads from this process, and only a relative `sys.executable` makes `Path.absolute` consult the working directory at all — `admit`'s caller hands in a checkout, never a directory to resolve against, so the one that could be consulted is where this process was launched" }
"start_runtime.py#pid sys.executable" = { count = 1, owner = "#5816", until = "permanently: `admit` fixes the interpreter that will re-exec the runtime for this start, and every caller of it — the observability parser, the restart path and start intent — already runs inside that interpreter; handing the path in would move the same read one frame up, where it is still this process's own executable" }
