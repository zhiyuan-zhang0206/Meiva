exports = ["__main__.py", "commands", "database", "fleet_update", "parsers", "start_identity.py", "tests"]

[uses]
"__main__.py" = ["main.py"]
"commands" = ["database", "start_identity.py", "start_runtime.py"]
"conftest.py" = ["commands", "tests"]
"fleet_update" = ["main.py"]
"init_intent.py" = ["commands", "start_identity.py", "start_runtime.py", "startup"]
"main.py" = ["database", "parsers", "preflight.py", "start_identity.py", "start_runtime.py", "startup"]
"parsers" = ["commands", "database", "init_intent.py", "start_intent.py", "start_runtime.py"]
"python_install.py" = ["_python_index.py"]
"start_intent.py" = ["commands", "database", "start_identity.py", "start_runtime.py", "startup"]
"tests" = ["__init__.py", "__main__.py", "_python_index.py", "commands", "database", "fleet_alert_silence.py", "fleet_update", "init_intent.py", "main.py", "parsers", "preflight.py", "python_install.py", "start_identity.py", "start_intent.py", "start_runtime.py", "startup"]

[purity]
"__init__.py" = "strict"

[roots]
"_python_index.py" = { kinds = ["home", "platform"], why = "Pre-venv stdlib bootstrap resolves host platform and user home before third-party libraries exist" }
"fleet_alert_silence.py" = { kinds = ["clock", "settings"], why = "Standalone SSH entrypoint shipped to the gateway over stdin reads its own clock and settings" }
"init_intent.py" = { kinds = ["platform"], why = "Init wizard captures the local host name as the default machine identity" }
"main.py" = { kinds = ["environ"], why = "CLI bootstrap sets config/profile/log routing before importing Settings or command modules." }
"python_install.py" = { kinds = ["cwd", "environ"], why = "Pre-venv stdlib bootstrap inspects working directory and environment before launching uv" }
"start_identity.py" = { kinds = ["clock", "random"], why = "First-boot identity provisioning mints fresh cluster/api secrets and records initial timestamps" }
"start_intent.py" = { kinds = ["environ"], why = "Identity bootstrap precedes Settings: read the birth inputs and pin the resolved home before config imports." }
