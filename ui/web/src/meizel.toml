exports = ["proxy.ts"]

[uses]
"app" = ["components", "lib", "test-support"]
"components" = ["i18n", "lib", "test-support"]
"i18n" = ["lib"]
"proxy.ts" = ["lib"]
"test-support" = ["lib"]

[purity]
"proxy.ts" = "strict-to-be"

[roots]
"proxy.ts" = { kinds = ["environ", "random"], why = "the Next middleware entry: Next invokes it once per page request and it is the only code that runs when a request enters, so both the environment read and the nonce draw happen here. It reads the deployment NEXT_PUBLIC_* settings and draws the CSP nonce with crypto.randomUUID, then hands both to the pure policy builder in lib/auth/content-security-policy.ts. The same fact is why the recorded impure-call for that draw has no other home: middleware is called with the request alone, so there is no parameter to inject a nonce through and no second place that runs at request entry. Falsified if a legal path to produce the nonce outside the request entry ever appears - then this why is false and both the root and the impure-call record should go, not be kept." }

[debt.impure-call]
"proxy.ts#proxy#crypto.randomUUID" = { count = 1, until = "waits for a Next middleware entry that accepts anything besides the request; proxy(request) is the entire exported surface, checked against this Next version, so there is no injection point to move the draw to - not a missing precedent" }
