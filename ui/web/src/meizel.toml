exports = ["proxy.ts"]

[uses]
"app" = ["components", "lib", "test-support"]
"components" = ["i18n", "lib", "test-support"]
"i18n" = ["lib"]
"proxy.ts" = ["lib"]
"test-support" = ["lib"]

[purity]
"proxy.ts" = "strict"

[roots]
"proxy.ts" = { kinds = ["environ", "random"], why = "the Next middleware entry: Next invokes it once per page request and it is the only code that runs when a request enters, so both the environment read and the nonce draw happen here. It reads the deployment NEXT_PUBLIC_* settings and draws the CSP nonce with crypto.randomUUID, then hands both to the pure policy builder in lib/auth/content-security-policy.ts. Middleware is called with the request alone — `proxy(request)` is the whole exported surface — so there is no parameter to inject a nonce through, and a CSP nonce must be fresh per request at the entry. Falsified if Next gives middleware an injection point for a second argument, or a legal path to produce the nonce outside the request entry appears - then this why is false and the root should go, not be kept." }
