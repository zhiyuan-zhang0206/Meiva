exports = ["api-base.ts", "api.ts", "gateway-origin.ts", "operation-key.ts", "sse-lifecycle.ts", "stream", "system-transport.ts", "tests", "transport-context.tsx", "useEventStream.tsx"]

[uses]
"api-base.ts" = ["gateway-origin.ts"]
"api.ts" = ["api-base.ts", "gateway", "system-transport.ts"]
"gateway" = ["transport.ts"]
"operation-key.ts" = ["gateway", "system-transport.ts"]
"sse-frames.test.ts" = ["sse-frames.ts"]
"sse-lifecycle.ts" = ["stream", "transport.ts"]
"stream" = ["transport.ts"]
"system-transport.test.ts" = ["gateway", "operation-key.ts", "system-transport.ts"]
"system-transport.ts" = ["transport.ts"]
"tests" = ["gateway", "gateway-origin.ts", "stream", "system-transport.ts", "transport-context.tsx", "useEventStream.tsx"]
"transport-context.tsx" = ["gateway", "stream"]
"useEventStream.test.ts" = ["sse-lifecycle.ts", "stream", "tests", "transport-context.tsx", "useEventStream.tsx"]
"useEventStream.tsx" = ["api-base.ts", "sse-frames.ts", "sse-lifecycle.ts", "stream", "transport-context.tsx", "transport.ts"]

[purity]
"gateway-origin.ts" = "strict"
"sse-frames.ts" = "strict"
"transport.ts" = "strict"

[roots]
"api-base.ts" = { kinds = ["environ"], why = "reads Next.js NEXT_PUBLIC_* compile-time environment variables for gateway origin and telemetry flags" }
"system-transport.ts" = { kinds = ["clock", "random"], why = "browser system-transport composition root supplying wall clock, monotonic clock, and Web Crypto / random tab IDs" }
