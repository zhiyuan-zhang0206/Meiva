"fold.test.ts" = ["agents.ts", "graph.ts", "index.ts", "notices.ts", "tasks.ts"]
"graph.ts" = ["types.ts"]
"index.ts" = ["agents.ts", "graph.ts", "item-id.ts", "notices.ts", "tasks.ts", "types.ts"]
"notices.ts" = ["types.ts"]
"owner.ts" = ["index.ts", "repair.ts"]
"repair.test.ts" = ["repair.ts"]
