# Materialize a real hoisted node_modules via CoW clones (clonefile on macOS APFS,
# hardlinks/copies on Linux) with zero symlinks pointing outside ui/web, keeping
# Next.js/Turbopack, TypeScript AST tooling, and meizel symlink-free across worktrees.
nodeLinker: hoisted
packageImportMethod: clone-or-copy

# Keep CI (`ensure_frontend_deps` sets CI=true) and non-CI (`pnpm run build` /
# `pnpm run start` inside the frontend service session) on the same workspace
# state, and disable pnpm 11's default `verifyDepsBeforeRun: install` so
# `pnpm run` / `pnpm exec` never spawn an unfrozen `pnpm install` (which took
# ~3s before `next build`, dirtied `node_modules` timestamps, and broke
# scratch-worktree lint hooks that symlink `node_modules`). `ensure_frontend_deps`,
# `setup-worktree.sh`, and CI own locked installs explicitly.
enableGlobalVirtualStore: false
verifyDepsBeforeRun: false

# eslint-plugin-jsx-a11y has not yet published an ESLint 10 peer range.
strictPeerDependencies: false

# Both packages ship prebuilt platform binaries via optionalDependencies; deny
# fallback postinstall/node-gyp scripts during locked installs.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
