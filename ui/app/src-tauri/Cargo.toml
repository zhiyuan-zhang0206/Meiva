[package]
name = "meiva-app"
version = "1.0.0"
description = "Meiva desktop and mobile app"
authors = ["Meiva"]
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false

[lib]
name = "meiva_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
tauri-plugin-notification = "2"

# macOS notifications go through UNUserNotificationCenter directly: replace and retract need a
# stable request identifier, which the notification plugin cannot express. The objc2 family is
# already what tao and wry link, so this adds no new runtime to the app.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
