# ---------------------------------------------------------------------------------------------
# Lint-rule allowances. A rule lets a file, a site or a name through only where it is listed
# here, with the reason beside it. Each table is read by one rule (meizel/allowances.py owns the
# format); `python -m meizel policy diff` reports every change to any of them.
# ---------------------------------------------------------------------------------------------

# ambient (meizel/contracts/ambient_read.py): the names through which the state a repository
# keeps itself is reached. A module declares under [state] in its meizel.toml that it holds state
# of a kind; the names below, resolved against those modules, are the points where a file acquires
# it. A bare name acquires when imported or read as an attribute, `name()` only when called.
[ambient]
settings = [
    "settings",
    "get_field()",
    "set_field()",
    "ensure_eager()",
    "ConfigBoot()",
]
db = [
    "connect()",
    "pool()",
    "async_pool()",
    "Database.from_settings()",
]
endpoints = [
    "ServiceEndpoints.from_settings()",
]
bus = [
    "EventBus.from_settings()",
]

# ambient-readers (meizel/contracts/ambient_read.py): repository functions and objects that read the
# world on their caller's behalf, by kind. A call to one (or, without parentheses, an import or
# attribute read of one) is an acquisition of that kind at the use, so a wrapper around `os.environ`,
# `Path.home()` or the process settings does not hide the read behind a root that may make it. Each
# name is fully qualified, in the module that defines it (`pkg.module.name()`,
# `pkg.module.Class.method()`, `pkg.module.NAME`), with the reason it reads the world; a module that
# re-exports it is followed. An entry whose function reads the world only when it is not handed the
# value says which parameter carries it:
#   "pkg.module.name()" = { why = "reads the world when no value is passed", unless = "parameter" }
# A call that passes that parameter a value is not an acquisition - the caller supplied what the
# world would have answered - while an explicit `None` and a call that leaves it out both are. A name that is only imported where it is listed, or is gone, fails as
# stale. What belongs here, and what is not followed:
# meizel/docs/checker/ambient-readers.meiva.okf.md. Changing the list is a rule change.
[ambient-readers.environ]
"base.host.env.registry.process_environment()" = "returns the live os.environ"
"base.host.git.gitenv.git_env()" = { why = "copies the live os.environ when no mapping is passed", unless = "environ" }
"base.native_process.child_env.daemon_process_env()" = "filters the live os.environ"
"base.native_process.child_env.inherited_process_env()" = "copies the live os.environ"
"base.native_process.os_platform.launchd_job_label()" = "reads XPC_SERVICE_NAME from os.environ"
"meiva.boot.is_launched_process()" = "judges the launch facts from the live os.environ"
"meiva.boot.process_disable_entries()" = "reads the SDK disable entries from the live os.environ"

[ambient-readers.home]
"base.paths.home.resolve_meiva_home()" = "reads MEIVA_HOME from os.environ and falls back to Path.home()"
"base.paths.home.user_home()" = "returns Path.home()"
"base.paths.meiva_home()" = "resolve_meiva_home() plus creating the directory"
"meiva.files.workspace_base()" = "the agent's workspace directory, or the home when no agent is bound"

[ambient-readers.platform]
"base.host.system.hostport.Host.system()" = "builds the host of this process: its platform, uid and system commands"
"base.native_process.os_platform.Platform.current()" = "reads sys.platform and platform.machine()"

[ambient-readers.pid]
"base.native_process.os_platform.resolve_pid()" = "returns os.getpid() when no pid is passed"
"base.native_process.root_control.client.current_uid()" = "returns os.getuid()"
"base.paths.private_dir.is_foreign_owned()" = "compares with os.geteuid() when no euid is passed"

[ambient-readers.clock]
"base.clock.Clock()" = "builds the clock a root hands down; its Timers decide what time it is"
"base.clock.SYSTEM_TIMERS" = "the real interval clock, sleep and wall-clock source of the process"
"ops.cluster_status.cluster_now()" = "returns the current time"

[ambient-readers.random]
"base.host.net.auth.random_bytes()" = "draws secrets.token_bytes"
"base.host.net.resilience.jittered()" = "draws random jitter"

[ambient-readers.settings]
"base.clock.Clock.from_settings()" = "reads the clock configuration from the process settings; the clock it builds runs on the system timers"
"base.cluster.machine.ambient.gateway_access_from_settings()" = "reads the gateway credentials from the process settings"
