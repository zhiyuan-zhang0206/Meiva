# clock-lattice (meizel/owners/clock_lattice): where lattice vocabulary may be defined, and the
# constants that use it without being part of the lattice (`path::NAME`).
[clock-lattice]
family-modules = [
    "base/deploy/timing.py",
    "base/deploy/progress_timeout.py",
    "base/native_process/stop_timing.py",
    "base/deploy/schedule_timing.py",
]

[clock-lattice.independent-clocks]
"meiva_builtins/plugins/lm_anthropic/provider.py::_CLAUDE_EXTENDED_THINKING_DEFAULT_BUDGET" = "LLM thinking-token budget, not a wall-clock constant"
"meiva_builtins/skills/platform/meiva-guide/external-agents/scripts/watch_work.py::STALL_SECONDS" = "example script (skill reference), not cluster runtime — its own stall judgment, no lattice neighbour"
"base/daemon/schedules/watcher.py::AT_SESSION_TTL_GRACE_SECONDS" = "independent: the at-watcher session's post-fire reclamation window (wake delivery + exit-notice latency); the TTL reaper's poll cadence only delays the kill beyond it — no lattice neighbour and no ordering safety depends on this value"
"base/events/contract.py::DELIVERY_STALLED_KEYS" = "SQL key set for the delivery_stalled view, not a clock"
"base/events/live/redis_listener.py::_CONSUME_ABANDON_GRACE" = "independent: pubsub consume-abandon window, no lattice neighbour"
"base/host/proc.py::_REAP_TIMEOUT_S" = "independent: single wait_procs bound when reaping a process tree, no lattice neighbour"
"base/host/proc.py::_TERMINATE_GRACE_S" = "independent: TERM->KILL ladder wait in the terminate step, no lattice neighbour"
"base/lm/registry.py::claude_thinking_budget_tokens" = "token/character budget, not a time value"
"base/native_process/exec_domain.py::KILL_GRACE_S" = "independent: SIGINT/SIGTERM -> SIGKILL grace ladder for the exec child, no lattice neighbour"
"services/backup/scheduler/operation/staging.py::TERMINATE_GRACE_S" = "independent: bounded TERM grace for a scheduled worker to unwind private cleanup; no family-disappearance proof or lattice neighbour"
"services/desktop/computer/config.py::_MIN_STALL_S" = "not a clock: a sanity floor on the operator-configured loop-stall window (settings.daemon.computer_use_loop_stall_s) — it only keeps a below-floor misconfiguration from restart-looping a healthy daemon, no lattice neighbour"
"services/upkeep/ttl_reaper/shells.py::STALE_ROW_GRACE" = "independent: the stale sweep's exemption window for a young tracking row — the host's session listing can lag the row's creation, so a younger row is never judged; not a deadline and no lattice neighbour or ordering depends on it"

