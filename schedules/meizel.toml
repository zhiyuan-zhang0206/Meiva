# meiva:note
# The first two entries predate 2026-10-26; the third was approved that day.
#
# `log-cred-mask-monthly-schedule.py` starts the credential scanner as a `python <path>` subprocess,
# and the scanner is a five-machine operator tool that by design never ships in this repository.
# meizel's `python-commands` rule accepts only `-m <module>` or a literal repository file after the
# interpreter, and neither `[external]` nor `[loads]` exempts this shape (checked 2026-10-26:
# `[external]` reports `stale-external` and the violation stands), so a recorded debt is the only
# mechanism that can express it.
#
# Exit condition: if meizel grows a declarative "runs an external command" surface the way `roots`
# declares clock/environ reads, this entry goes to zero and is deleted.
#
# The directory is frozen at two: a schedule that needs to run an out-of-repository file comes to
# the maintainer first and does not take this route again. There is no spare slot to absorb one.

[debt.restricted-python]
"log-cred-mask-monthly-schedule.py#python subprocess that runs something other than a literal repository file" = { count = 1, owner = "#6018", until = "waits for meizel to have a declarative surface for running an external command (the way [roots] declares clock and environ reads): [external] and [loads] do not exempt this shape (checked 2026-10-26, and the python-commands rule names no allowance), and the scanner at $MEIVA_HOME/log-cred-mask/monthly_sweep.py is an operator tool that by design never ships in this repository, so no repository path exists to name" }
"self-evolution-daily-schedule.py#python subprocess that runs something other than a literal repository file" = { count = 1, owner = "#6018", until = "waits for meizel to have a declarative surface for running an external command: the same exit as the credential sweep. The target is the installed copy of the self-evolution skill script under $MEIVA_HOME/skills/meiva-self-evolution/reference/daily_scan.py, because the host that fires the schedule has the installed skill, not this checkout" }
