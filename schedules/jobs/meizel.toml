exports = ["adversarial_batch.py", "adversarial_scenario.py", "adversarial_workers.py", "agent_directory.py", "c9_report.py", "catchup.py", "debt_sweep.py", "dry_import_child.py", "entry.py", "loop.py", "memory_maintenance.py", "model_tracker.py", "self_evolution_scan.py", "self_evolution_weekly.py", "telemetry_event.py", "watch", "harness"]

[loads]
"dry_import_child.py" = ["schedules"]

[uses]
"watch" = ["agent_directory.py", "entry.py", "loop.py", "telemetry_event.py"]
"harness" = ["entry.py", "loop.py", "telemetry_event.py"]
"adversarial_batch.py" = ["adversarial_scenario.py", "adversarial_workers.py", "agent_directory.py"]
"adversarial_workers.py" = ["agent_directory.py"]
"c9_report.py" = ["agent_directory.py", "telemetry_event.py"]
"debt_sweep.py" = ["agent_directory.py", "telemetry_event.py"]
"loop.py" = ["catchup.py"]
"memory_maintenance.py" = ["agent_directory.py"]
"model_tracker.py" = ["agent_directory.py"]
"self_evolution_scan.py" = ["agent_directory.py"]
"self_evolution_weekly.py" = ["agent_directory.py", "loop.py"]

[roots]
"dry_import_child.py" = { kinds = ["pid"], why = "Dry-import child entry: main() reads the schedule source from standard input (sys.stdin), the one channel its parent writes to" }
"entry.py" = { kinds = ["clock", "home", "random", "settings"], why = "Schedule process entry boots configuration before assembling its runtime; it resolves the account home and builds the random generator once, for the SDK context it binds; builds the process clock from SYSTEM_TIMERS; reads the cluster timezone every schedule fires in" }

[debt.ambient-read]
"adversarial_batch.py#random uuid.uuid4" = { count = 3, owner = "#5816", until = "waits for nothing that can arrive: the batch mints a per-case canary token and one idempotency key per spawn, and both must be fresh for that call — a key handed in from outside would let two different runs claim the same spawn, and the canary is only worth something unguessable; this shell is where the decision to make the call is taken" }
"agent_directory.py#random uuid.uuid4" = { count = 1, owner = "#5816", until = "waits for nothing that can arrive: `ensure_agent` mints the key of the spawn it is about to make, after reading the roster that told it a worker was missing; a caller frames above would have to predict whether a spawn happens at all, and two callers racing the same missing worker must not mint the same key" }
