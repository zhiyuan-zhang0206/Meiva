exports = ["adversarial_batch.py", "adversarial_scenario.py", "adversarial_workers.py", "agent_directory.py", "c9_report.py", "catchup.py", "ci_metrics.py", "debt_sweep.py", "dry_import_child.py", "entry.py", "loop.py", "memory_maintenance.py", "model_tracker.py", "qa_keepalive.py", "self_evolution_scan.py", "self_evolution_weekly.py", "stall_watch.py", "telemetry_event.py"]

[loads]
"dry_import_child.py" = ["schedules"]

[uses]
"adversarial_batch.py" = ["adversarial_scenario.py", "adversarial_workers.py", "agent_directory.py"]
"adversarial_workers.py" = ["agent_directory.py"]
"c9_report.py" = ["agent_directory.py", "telemetry_event.py"]
"ci_metrics.py" = ["agent_directory.py"]
"debt_sweep.py" = ["agent_directory.py", "telemetry_event.py"]
"loop.py" = ["catchup.py"]
"memory_maintenance.py" = ["agent_directory.py"]
"model_tracker.py" = ["agent_directory.py"]
"self_evolution_scan.py" = ["agent_directory.py"]
"self_evolution_weekly.py" = ["agent_directory.py", "loop.py"]

[roots]
"adversarial_batch.py" = { kinds = ["random"], why = "Adversarial batch shell generates per-case canary tokens and spawn idempotency keys" }
"adversarial_workers.py" = { kinds = ["clock"], why = "Worker polling shell measures batch wait deadline against UTC wall clock" }
"agent_directory.py" = { kinds = ["random"], why = "Agent directory shell generates a fresh UUID idempotency key when spawning a missing schedule worker" }
"entry.py" = { kinds = ["clock", "home", "random", "settings"], why = "Schedule process entry boots configuration before assembling its runtime; it resolves the account home and builds the random generator once, for the SDK context it binds; builds the process clock from SYSTEM_TIMERS" }
"loop.py" = { kinds = ["clock"], why = "Schedule runner loop polls current UTC time on each iteration" }

[debt.ambient-read]
"catchup.py#settings base.clock.Clock.from_settings" = 1
