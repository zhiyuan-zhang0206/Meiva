exports = ["harness_cli_update.py", "harness-cli-update-schedule.py"]

[uses]
"harness-cli-update-schedule.py" = ["harness_cli_update.py"]

[roots]
"harness-cli-update-schedule.py" = { kinds = ["clock", "environ", "home", "argv"], why = "The harness CLI update entry is the composition root of its own loop: it reads the home it runs under, its scheduler identity and the start instant before the first round; it also reads its command line (argv) once, as the process entry" }
