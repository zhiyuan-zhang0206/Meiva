exports = ["background.py", "background_plan.py", "completion_recovery.py", "log_ring.py", "session_env.py", "sessions.py", "tests", "ttl_store.py"]

[uses]
"background_plan.py" = ["completion_plan.py"]
"completion_recovery.py" = ["completion_plan.py"]
"__init__.py" = ["background.py", "background_plan.py", "handle.py", "log_ring.py", "sessions.py"]
"background.py" = ["background_plan.py", "handle.py", "log_ring.py", "session_env.py", "sessions.py"]
"sessions.py" = ["handle.py", "session_env.py", "session_plan.py", "ttl_store.py"]
"tests" = ["completion_plan.py", "completion_recovery.py", "background.py", "background_plan.py", "handle.py", "log_ring.py", "session_env.py", "session_plan.py", "sessions.py", "ttl_store.py"]

[purity]
"completion_plan.py" = "strict"
"background_plan.py" = "strict"
"handle.py" = "strict"
"log_ring.py" = "strict"
"session_env.py" = "strict"
"session_plan.py" = "strict"

[roots]
"__init__.py" = { kinds = ["home"], why = "run() reads Path.home() as the documented pre-bootstrap cwd fallback when no agent identity is bound" }

[debt.ambient-read]
"background.py#pid sys.executable" = { count = 1, owner = "#5816", until = "waits for `cli_path` to take the interpreter path from its caller: it reads `sys.executable` itself" }
