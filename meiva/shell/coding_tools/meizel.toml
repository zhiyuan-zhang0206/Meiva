exports = ["antigravity.py", "claude.py", "codex.py", "plans"]

[uses]
"__init__.py" = ["_common.py", "plans"]
"_claude_checks.py" = ["_common.py", "plans"]
"_common.py" = ["plans"]
"_first_run.py" = ["plans"]
"antigravity.py" = ["_common.py", "plans"]
"claude.py" = ["_claude_checks.py", "_common.py", "_first_run.py", "plans"]
"codex.py" = ["_common.py", "plans"]
"tests" = ["__init__.py", "_claude_checks.py", "_common.py", "_first_run.py", "antigravity.py", "claude.py", "codex.py", "plans"]

[debt.ambient-read]
"claude.py#environ tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "permanently: `launch()` opens one scratch directory for the failure marker a supervised Claude Code launch leaves when the CLI never answers, and the plan it hands `run_supervised_launch` owns that path for as long as the launch runs; the site carries the home, the cluster and the clock, and a marker directory is none of the three" }
"claude.py#random tempfile.TemporaryDirectory()" = { count = 1, owner = "#5816", until = "permanently: the marker directory's name is minted by the OS so two launches in one process cannot share a marker; the plan prints the session id, never where the marker sits" }
"codex.py#pid sys.executable" = { count = 1, owner = "#5816", until = "waits for `supervisor_command` to take the interpreter path from its caller: it reads `sys.executable` itself" }
