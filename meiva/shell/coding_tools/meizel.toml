exports = ["antigravity.py", "claude.py", "codex.py", "plans"]

[uses]
"__init__.py" = ["_common.py", "plans"]
"_claude_checks.py" = ["_common.py", "plans"]
"_common.py" = ["plans"]
"_first_run.py" = ["plans"]
"antigravity.py" = ["_common.py", "plans"]
"claude.py" = ["_claude_checks.py", "_common.py", "_first_run.py", "plans"]
"codex.py" = ["_common.py", "plans"]
"tests" = ["__init__.py", "_claude_checks.py", "_common.py", "_first_run.py", "antigravity.py", "claude.py", "codex.py", "plans"]

[roots]
"_common.py" = { kinds = ["home", "clock"], why = "launch_site() resolves the operator's Path.home() for Claude and Codex user-level config files, and reads the process clock once for the site: the timers every launch wait spends (`LaunchSite.timers`) and the instant a first-run preset is stamped with (`LaunchSite.now`)" }
"claude.py" = { kinds = ["random", "environ"], why = "launch() mints a fresh UUID for a new Claude Code session when --resume is not given; it also creates scratch space under the temporary directory (TMPDIR)" }

[debt.ambient-read]
"codex.py#pid sys.executable" = { count = 1, owner = "#8237", until = "waits for the value from the process entry: this read takes argv, the interpreter path, a program lookup or a scratch directory from the entry that owns it (tracked in #8237, review by 2026-11-20)" }
