exports = ["attachment.py", "registration.py", "store.py"]

[uses]
"__init__.py" = ["attachment.py", "registration.py", "store.py"]
"admission.py" = ["registration.py"]
"attachment.py" = ["admission.py", "registration.py", "store.py"]
"registration.py" = []
"store.py" = ["registration.py"]
"tests" = ["admission.py", "attachment.py", "registration.py", "store.py"]

[purity]
"admission.py" = "strict"
"registration.py" = "strict"

[roots]
"__init__.py" = { kinds = ["environ"], why = "the same one-shot MEIVA_HARNESS_HANDLE handoff read by the public entry, before any Settings exists: `meiva.attach()` is what a bare harness child calls first, and the handle is per-launch IPC, not cluster configuration" }

"attachment.py" = { kinds = ["settings"], why = "External controller attachment owns process bootstrap when no SDK context is bound" }

[debt.ambient-read]
"attachment.py#pid os.getpid" = 1

[debt.any-collaborator]
"__init__.py#any __getattr__.return" = 1
"__init__.py#any attach.return" = 1
"attachment.py#any HarnessAttachment._resolve_config.birth" = 1
"attachment.py#any HarnessAttachment._resolve_config.overlay" = 1
"attachment.py#any HarnessAttachment._set_state.state" = 1
"attachment.py#any HarnessAttachment._state_update.return" = 1
"attachment.py#any _RegistrationCodec.apply_plugin_delta.delta" = 1
"attachment.py#any _RegistrationCodec.apply_plugin_delta.state" = 1
"attachment.py#any _RegistrationCodec.decode_plugin_delta.return" = 1
"attachment.py#any _RegistrationCodec.encode_plugin_delta.update" = 1
"attachment.py#any _RegistrationCodec.load_snapshot.return" = 1
"attachment.py#any _RegistrationCodec.plugin_state_schema.return" = 1
"attachment.py#any _RegistrationCodec.plugin_state_schema.state" = 1
"attachment.py#any _RegistrationIdentity.require.return" = 1
"attachment.py#any _codec_module.return" = 1

[debt.type-cast]
"attachment.py#cast _RegistrationCodec.encode_plugin_delta" = 1
"registration.py#cast decode_registration" = 1
