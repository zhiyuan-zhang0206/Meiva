exports = ["launch_plan.py", "plans.py", "spawn.py", "wiring.py"]

[uses]
"__init__.py" = ["plans.py", "spawn.py", "wiring.py"]
"plans.py" = ["launch_plan.py"]
"spawn.py" = ["files.py", "launch_plan.py"]
"wiring.py" = ["files.py", "spawn.py"]

[purity]
"launch_plan.py" = "strict"

[roots]
"wiring.py" = { kinds = ["home"], why = "The SDK watcher wiring builds a watcher session's inputs for this process on every launch, cron and at call: the launcher's runner projection is computed from the environment the bound context carries (not read here), while the unit home and the OS user's home are read here and the session directories are derived from the same home" }
