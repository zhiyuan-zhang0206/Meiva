[roots]
"boot_external.py" = { kinds = ["clock", "environ", "home", "random"], why = "An external process's boot reads the account home, the environment it was launched with (a shell session or a watcher it starts inherits it) and the system generator once, and builds the clock over SYSTEM_TIMERS, for the attachment context it then binds; the takeover and the harness must not differ in how that process around them is built" }
"boot.py" = { kinds = ["clock", "environ", "home", "random", "settings"], why = "SDK process bootstrap: reads the launch environment (MEIVA_AGENT_ID is the only channel by which a child process, such as a shell session or a watcher, discovers its parent agent), reads the account's home and the Meiva home once for the contexts it builds, builds the process's random generator that the sampling owner draws from, and constructs and binds the process-owned configuration owner and context; builds the process clock from SYSTEM_TIMERS" }
"files.py" = { kinds = ["home", "random"], why = "workspace_base() reads Path.home() as the documented pre-bootstrap fallback for relative paths when no agent identity is bound, and _new_file_mode() generates a random UUID suffix for its temporary umask probe file" }
"__init__.py" = { kinds = ["environ"], why = "The package import is the SDK process's own entry boundary: a bare `python x.py` inside an agent shell has no bootstrap to hook, so whether this process is an agent-launched child can only be decided while `meiva` imports, before the caller's first attribute access — deferring it would leave the plugin wrappers of that first access unloaded. The read is one shot, through `boot.is_launched_process`. The help entry reads settings too, inside the call: it is the only module above both the bound context and the settings producer, since `settings.py` already reaches `process_context.py` and a sibling reading both would close a cycle, so importing `meiva` stays free of settings" }

