exports = ["config.py", "tests"]

[uses]
"__init__.py" = ["_clients.py", "_tools.py", "config.py"]
"_clients.py" = ["_remote.py", "config.py"]
"_daemon.py" = ["_browser.py", "_computer.py", "_guards.py", "_oauth.py", "_plan.py", "_policy.py", "_startup.py", "_wire.py", "config.py"]
"_guards.py" = ["_startup.py"]
"_remote.py" = ["config.py"]
"_tools.py" = ["_clients.py", "config.py"]
"tests" = ["__init__.py", "_browser.py", "_clients.py", "_computer.py", "_daemon.py", "_guards.py", "_oauth.py", "_plan.py", "_policy.py", "_remote.py", "_startup.py", "_tools.py", "_wire.py", "config.py"]

[purity]
"_plan.py" = "strict"
"_policy.py" = "strict"
"_startup.py" = "strict"
"_wire.py" = "strict"

[roots]
"_daemon.py" = { kinds = ["environ", "home", "pid", "platform", "settings"], why = "daemon_config_from_process() is the MCP daemon process entry point composition root, reading settings, the Meiva home and process PID once at startup; builds the host of this process with Host.system(), handing it the process environment" }

[debt.third-party-patch]
"_oauth.py#assignment mcp.client.auth.oauth2.OAuthContext.prepare_token_auth" = { count = 1, until = "waits for mcp's OAuthContext.prepare_token_auth to drop the form body's client_id under client_secret_basic (RFC 6749 section 2.3.1): the method strips only client_secret, OAuthClientProvider builds its own OAuthContext and takes no context factory, so no parameter reaches it - Notion's token endpoint rejects the duplicate body field with HTTP 400. Falsified the day that method stops sending it, or the provider accepts a context." }
"_oauth.py#assignment mcp.client.auth.oauth2.validate_metadata_issuer" = { count = 1, until = "waits for mcp's issuer comparison to tolerate a root issuer's trailing slash on the protected-resource path: the flow calls the module-level validate_metadata_issuer it binds at import, and the SDK's own issuers_match tolerance runs only when context.auth_server_url is None, which Google's advertised authorization_servers makes false - Google advertises https://accounts.google.com and its metadata declares https://accounts.google.com/. Falsified the day the strict compare is reached with tolerance on that path, or the provider accepts a validator." }
"_oauth.py#assignment mcp.client.auth.utils.validate_metadata_issuer" = { count = 1, until = "the same seam as the oauth2 entry: mcp.client.auth.oauth2 binds this function by name at import, so replacing it in the defining module alone leaves the flow's copy strict. Both assignments go together, the day either seam disappears." }
