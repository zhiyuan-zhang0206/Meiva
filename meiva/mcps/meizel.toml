exports = ["config.py", "tests"]

[uses]
"__init__.py" = ["_browser.py", "_clients.py", "_tools.py", "config.py"]
"_clients.py" = ["_remote.py", "config.py"]
"_daemon.py" = ["_browser.py", "_computer.py", "_guards.py", "_oauth.py", "_plan.py", "_policy.py", "_startup.py", "_wire.py", "config.py"]
"_guards.py" = ["_startup.py"]
"_remote.py" = ["config.py"]
"_tools.py" = ["_clients.py", "config.py"]
"tests" = ["__init__.py", "_browser.py", "_clients.py", "_computer.py", "_daemon.py", "_guards.py", "_oauth.py", "_plan.py", "_policy.py", "_remote.py", "_startup.py", "_tools.py", "_wire.py", "config.py"]

[purity]
"_plan.py" = "strict"
"_policy.py" = "strict"
"_startup.py" = "strict"
"_wire.py" = "strict"

[debt.third-party-patch]
"_oauth.py#assignment mcp.client.auth.oauth2.OAuthContext.prepare_token_auth" = 1
"_oauth.py#assignment mcp.client.auth.oauth2.validate_metadata_issuer" = 1
"_oauth.py#assignment mcp.client.auth.utils.validate_metadata_issuer" = 1
