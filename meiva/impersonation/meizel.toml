exports = ["admission.py", "attachment.py"]

[uses]
"__init__.py" = ["attachment.py"]
"attachment.py" = ["admission.py"]
"tests" = ["admission.py"]

[purity]
"__init__.py" = { mode = "none", why = "the SDK entry `meiva.impersonation.attach`: it defers the attachment import to call time and returns the context manager the composition root `attachment.py` opens; the protocol the returned attachment satisfies, and every admission and lease decision, are in `attachment.py` and `admission.py`" }
"admission.py" = "strict"

[roots]
"attachment.py" = { kinds = ["pid", "random", "settings"], why = "External controller attachment owns process bootstrap, its own pid and session UUID generation when no SDK context is bound" }
