exports = ["answer.py", "calls.py", "errors.py", "outputs.py", "plans.py", "wiring.py"]

[uses]
"__init__.py" = ["answer.py", "errors.py", "plans.py", "wiring.py"]
"answer.py" = ["calls.py", "errors.py", "outputs.py", "plans.py"]
"calls.py" = ["errors.py"]
"wiring.py" = ["answer.py"]

[purity]
"calls.py" = "strict"
"errors.py" = "strict"
"outputs.py" = "strict"
"plans.py" = "strict"

[roots]
"answer.py" = { kinds = ["clock"], why = "_save_result stamps each saved .exec_output/ file with the current wall-clock timestamp in the site's timezone when writing batch results" }
