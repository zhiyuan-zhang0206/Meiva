exports = ["configs.py", "deepseek_wire.py", "deps.py", "errors.py", "failures.py", "pacing.py", "plans.py", "runner.py", "wire.py", "wiring.py"]

[uses]
"__init__.py" = ["errors.py", "plans.py", "runner.py", "wiring.py"]
"brave.py" = ["deps.py", "errors.py", "transport.py", "wire.py"]
"deepseek.py" = ["deepseek_wire.py", "deps.py", "errors.py", "transport.py", "wire.py"]
"deepseek_wire.py" = ["configs.py", "errors.py", "wire.py"]
"deps.py" = ["configs.py"]
"reader.py" = ["deepseek.py", "deps.py", "errors.py", "transport.py", "wire.py"]
"runner.py" = ["brave.py", "deepseek.py", "deps.py", "plans.py", "reader.py", "transport.py", "wire.py"]
"transport.py" = ["errors.py", "failures.py", "pacing.py", "policy.py", "wire.py"]
"wire.py" = ["configs.py", "errors.py"]
"wiring.py" = ["configs.py", "deps.py", "errors.py"]

[purity]
"configs.py" = "strict"
"deepseek_wire.py" = "strict"
"errors.py" = "strict"
"failures.py" = "strict"
"pacing.py" = "strict"
"plans.py" = "strict"
"wire.py" = "strict"

[debt.ambient-read]
"transport.py#clock time.monotonic" = 1

[debt.type-cast]
"deepseek_wire.py#cast deepseek_page" = 2
"deepseek_wire.py#cast deepseek_search_hits" = 1
"failures.py#cast _provider_message" = 2
"wire.py#cast brave_hits" = 1
"wire.py#cast jina_page" = 1
